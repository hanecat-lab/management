<!DOCTYPE html>
<html lang="ja">
<head>
<!-- ============================================================
  イベント進行管理（event-flow.html）
  app-template.html を雛形に作成。単一HTML・外部依存なし。
  ルール:
    - 実データ(エクスポートJSON)はリポジトリにコミットしない
      （バックアップは非公開リポジトリ care-data-backup へ）
    - APP_VERSION は auto-version.yml が自動更新するので手で変更しない
============================================================ -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0f16">
<meta name="description" content="撮影イベントの進行をオフラインで回す現場向けツール">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<title>イベント進行 — Event Flow</title>
<style>
/* Event Flow — dark mist glass */
:root{
  --canvas:#0b0f16;--canvas2:#111a27;
  --ink:#e9eef6;--ink-strong:#f8fbff;--soft:#95a4bb;--faint:#6d7d94;
  --blue:#5b8cff;--blue-deep:#7ba4ff;--violet:#a17dff;--mint:#3ed3a8;--amber:#f5b544;--rose:#ff7d95;
  --line:rgba(150,178,230,.14);--line-strong:rgba(150,178,230,.26);
  --surface:rgba(255,255,255,.055);--surface-strong:rgba(255,255,255,.10);
  --shadow:0 18px 42px rgba(0,0,0,.46),0 2px 7px rgba(0,0,0,.30);
  --shadow-hover:0 24px 52px rgba(0,0,0,.55),0 5px 12px rgba(0,0,0,.34);
  --r-xl:30px;--r-lg:22px;--r-md:16px;--r-sm:12px
}
*{box-sizing:border-box}
html{background:var(--canvas)}
body{margin:0;min-height:100vh;color:var(--ink);letter-spacing:.01em;overflow-x:hidden;
  font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  background:radial-gradient(circle at 4% 0%,rgba(70,110,220,.30),transparent 26rem),
             radial-gradient(circle at 96% 6%,rgba(140,95,235,.24),transparent 28rem),
             radial-gradient(circle at 58% 100%,rgba(48,175,150,.16),transparent 32rem),
             linear-gradient(148deg,#0c1220 0%,var(--canvas) 52%,#0f1018 100%)}
body:before{content:"";position:fixed;z-index:-1;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(150,178,230,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(150,178,230,.035) 1px,transparent 1px);
  background-size:34px 34px;mask-image:linear-gradient(to bottom,black,transparent 64%);-webkit-mask-image:linear-gradient(to bottom,black,transparent 64%)}
button,input,textarea,select{font:inherit}button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid rgba(91,140,255,.42);outline-offset:2px}
.glass{background:linear-gradient(145deg,rgba(255,255,255,.085),rgba(255,255,255,.028));
  backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%);
  border:1px solid rgba(255,255,255,.11);box-shadow:var(--shadow)}

.shell{width:min(1480px,calc(100% - 40px));margin:20px auto;display:grid;grid-template-columns:264px minmax(0,1fr);gap:24px;min-height:calc(100vh - 40px)}
.sidebar{position:sticky;top:20px;height:calc(100vh - 40px);border-radius:var(--r-xl);padding:24px 15px 18px;display:flex;flex-direction:column;overflow:hidden}
.sidebar:before{content:"";position:absolute;top:-110px;right:-105px;width:250px;height:250px;border-radius:50%;background:radial-gradient(circle,rgba(141,128,244,.26),transparent 67%);pointer-events:none}
.sidebar>*{position:relative}
.brand{display:flex;gap:12px;align-items:center;padding:4px 10px 28px}
.mark{width:42px;height:42px;border-radius:15px;background:linear-gradient(142deg,#5b8cff,#7d77e8 52%,#c07cdb);box-shadow:inset 0 1px 1px rgba(255,255,255,.35),0 10px 21px rgba(60,70,190,.34);display:grid;place-items:center;color:#fff;font-weight:900;font-size:15px}
.brand strong{display:block;font-size:17px;letter-spacing:-.04em;color:var(--ink-strong)}
.brand small{display:block;color:var(--faint);font-size:9px;letter-spacing:.15em;font-weight:850;margin-top:4px}
.nav-label{font-size:9px;color:var(--faint);font-weight:900;letter-spacing:.17em;padding:0 12px 9px}
.nav{display:grid;gap:5px}
.nav button{position:relative;border:0;background:transparent;color:var(--soft);display:flex;align-items:center;gap:11px;border-radius:14px;padding:12px;text-align:left;font-size:12.5px;font-weight:780;transition:background .18s,color .18s,transform .18s}
.nav button:hover{background:rgba(255,255,255,.07);color:var(--ink);transform:translateX(2px)}
.nav button.active{color:var(--blue-deep);background:linear-gradient(90deg,rgba(91,140,255,.20),rgba(161,125,255,.06))}
.nav button.active:before{content:"";position:absolute;left:0;width:3px;height:19px;border-radius:99px;background:linear-gradient(var(--blue),var(--violet))}
.nav .nicon{width:21px;text-align:center;font-size:17px;line-height:1}
.side-foot{margin-top:auto;padding:16px 12px 4px;border-top:1px solid var(--line);color:var(--soft);font-size:11px;line-height:1.65}
.side-foot strong{display:block;color:var(--ink);font-size:11px;margin-bottom:4px}
.side-foot .appver{color:var(--faint);font-size:10px;margin-top:6px}

main{min-width:0;padding:20px 4px 48px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:0 6px 24px}
.crumb{font-size:10px;color:var(--faint);font-weight:900;letter-spacing:.14em}
.title{margin:7px 0 0;font-size:clamp(28px,3.1vw,40px);font-weight:850;letter-spacing:-.07em;line-height:1.03;color:var(--ink-strong)}
.title em{font-style:normal;background:linear-gradient(103deg,var(--blue-deep),var(--violet) 62%,#e07dc0);-webkit-background-clip:text;background-clip:text;color:transparent}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid rgba(255,255,255,.13);border-radius:13px;padding:11px 14px;font-size:11.5px;font-weight:820;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--soft);background:rgba(255,255,255,.055);transition:transform .18s,background .18s,box-shadow .18s,color .18s,border-color .18s}
.btn:hover{transform:translateY(-2px);background:var(--surface-strong);color:var(--ink);box-shadow:0 9px 20px rgba(0,0,0,.34)}
.btn.primary{color:#fff;border-color:transparent;background:linear-gradient(127deg,#5b8cff,#7a72e9 50%,#ae79db);box-shadow:0 10px 22px rgba(66,80,210,.32)}
.btn.primary:hover{color:#fff;box-shadow:0 14px 28px rgba(66,80,210,.42)}
.btn.mint{color:#0a1a16;border-color:transparent;background:linear-gradient(127deg,#48dfb0,#35b9a6);box-shadow:0 9px 20px rgba(40,180,150,.26)}
.btn.mint:hover{color:#0a1a16}
.btn.danger{color:#ff9aad;background:rgba(255,125,149,.10);border-color:rgba(255,125,149,.24)}
.btn.small{padding:8px 10px;font-size:10.5px;border-radius:11px}
.btn.on{color:var(--blue-deep);background:rgba(91,140,255,.18);border-color:rgba(91,140,255,.32)}
.view{display:none}.view.active{display:block;animation:rise .28s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.panel{border-radius:var(--r-lg);padding:22px}
.kicker{font-size:9px;letter-spacing:.15em;font-weight:900;color:var(--faint)}
h2{font-size:17px;margin:5px 0 0;letter-spacing:-.03em;color:var(--ink-strong)}
h3{margin:0;font-size:13px;letter-spacing:-.02em;color:var(--ink-strong)}
.muted{color:var(--soft);font-size:12px;line-height:1.7}
.empty{border-radius:var(--r-lg);padding:48px 18px;text-align:center;color:var(--soft);background:rgba(255,255,255,.03);border:1px dashed var(--line-strong)}
.empty strong{display:block;color:var(--ink);font-size:16px;margin:10px 0 5px}
.empty-icon{font-size:30px}

/* ---- 現場モード ---- */
.field-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,.75fr);gap:18px}
.now-card{position:relative;isolation:isolate;overflow:hidden;border-radius:var(--r-xl);padding:26px;background:linear-gradient(140deg,rgba(255,255,255,.10),rgba(255,255,255,.03))}
.now-card:before{content:"";position:absolute;z-index:-1;width:330px;height:330px;right:-120px;bottom:-190px;border-radius:50%;background:radial-gradient(circle,rgba(91,140,255,.30),transparent 68%)}
.now-card:after{content:"";position:absolute;z-index:-1;width:190px;height:190px;right:52px;top:-126px;border-radius:50%;background:radial-gradient(circle,rgba(161,125,255,.22),transparent 68%)}
.now-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.cue-order{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:12px;background:rgba(91,140,255,.18);color:var(--blue-deep);font-size:14px;font-weight:900}
.cue-title{margin:16px 0 0;font-size:clamp(24px,3.4vw,34px);font-weight:850;letter-spacing:-.05em;line-height:1.12;color:var(--ink-strong);word-break:break-word}
.cue-when{display:flex;align-items:baseline;gap:10px;margin-top:10px;color:var(--soft);font-size:13px;font-weight:760}
.cue-when b{color:var(--ink);font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.remain{margin:22px 0 4px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.remain-num{font-size:clamp(52px,9vw,86px);font-weight:900;line-height:.92;letter-spacing:-.06em;font-variant-numeric:tabular-nums;color:var(--mint)}
.remain.warn .remain-num{color:var(--amber)}
.remain.over .remain-num{color:var(--rose)}
.remain-unit{font-size:13px;font-weight:850;color:var(--soft);letter-spacing:.06em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chip{border:1px solid transparent;border-radius:999px;background:rgba(91,140,255,.15);color:var(--blue-deep);padding:6px 11px;font-size:11px;font-weight:830;line-height:1.25}
.chip.ok{background:rgba(62,211,168,.14);color:#5fe0bb}
.chip.no{background:rgba(255,125,149,.15);color:#ff9aad}
.chip.warm{background:rgba(245,181,68,.16);color:#f8c977}
.chip.cast{background:rgba(161,125,255,.16);color:#c3a8ff}
.chip.plain{background:rgba(255,255,255,.07);color:var(--soft)}
.cue-note{margin-top:14px;border-radius:var(--r-md);padding:13px 14px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:12.5px;line-height:1.7;color:var(--ink);white-space:pre-wrap}
.now-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;position:relative;z-index:1}
.now-actions .btn{flex:1;min-width:104px;padding:15px 12px;font-size:13px}
.side-stack{display:grid;gap:18px;align-content:start}
.cover-card{border-radius:var(--r-lg);padding:20px;text-align:center}
.ring{margin:6px auto 0;width:132px;height:132px;position:relative}
.ring svg{transform:rotate(-90deg);display:block}
.ring-txt{position:absolute;inset:0;display:grid;place-items:center;gap:2px}
.ring-txt b{font-size:30px;font-weight:900;letter-spacing:-.05em;color:var(--ink-strong);font-variant-numeric:tabular-nums}
.ring-txt span{font-size:10px;font-weight:850;color:var(--faint);letter-spacing:.1em}
.cover-legend{display:flex;justify-content:center;gap:12px;margin-top:14px;font-size:10.5px;font-weight:820;color:var(--soft)}
.cover-legend i{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:5px;vertical-align:1px}
.up-list{display:grid;gap:8px;margin-top:14px}
.up-row{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.035)}
.up-row b{font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink);min-width:44px}
.up-row span{min-width:0;flex:1;font-size:12px;color:var(--soft);font-weight:730;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up-row em{font-style:normal;font-size:10px;font-weight:850;color:var(--faint)}
.adjust{border-radius:var(--r-lg);padding:20px}
.adjust-row{display:flex;gap:6px;margin-top:12px}
.adjust-row .btn{flex:1;padding:12px 6px;font-variant-numeric:tabular-nums}
.alert-banner{display:none;align-items:center;gap:12px;margin-bottom:16px;padding:14px 16px;border-radius:var(--r-md);border:1px solid rgba(245,181,68,.38);background:linear-gradient(120deg,rgba(245,181,68,.20),rgba(245,181,68,.07));color:#ffdca0;box-shadow:0 12px 30px rgba(120,80,10,.28)}
.alert-banner.show{display:flex;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 12px 30px rgba(120,80,10,.28)}50%{box-shadow:0 12px 38px rgba(245,181,68,.42)}}
.alert-banner .ab-copy{min-width:0;flex:1}
.alert-banner b{display:block;font-size:13.5px}
.alert-banner small{display:block;margin-top:3px;font-size:11px;color:rgba(255,220,160,.72)}

/* ---- リスト・テーブル ---- */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 16px;padding:8px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.search{flex:1;min-width:200px;border:1px solid var(--line-strong);border-radius:12px;padding:11px 13px;background:rgba(255,255,255,.05);color:var(--ink);font-size:12.5px}
.search::placeholder{color:var(--faint)}
.search:focus{border-color:rgba(91,140,255,.42);background:rgba(255,255,255,.08)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:15px}
.ev-card{position:relative;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.028));border:1px solid rgba(255,255,255,.10);transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s,background .2s}
.ev-card:hover{transform:translateY(-4px);background:rgba(255,255,255,.10);box-shadow:var(--shadow-hover)}
.ev-card.current{border-color:rgba(91,140,255,.45);box-shadow:0 0 0 1px rgba(91,140,255,.25),var(--shadow)}
.ev-card strong{font-size:15px;letter-spacing:-.02em;color:var(--ink-strong);word-break:break-word}
.ev-meta{display:flex;flex-wrap:wrap;gap:8px;font-size:11px;color:var(--soft);font-weight:760}
.bar{height:7px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--mint),#5b8cff)}
.ev-card .card-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.ev-card .card-actions .btn{flex:1;min-width:62px}
.badge{border-radius:999px;padding:4px 9px;font-size:9.5px;font-weight:900;letter-spacing:.04em}
.badge.active{background:rgba(62,211,168,.16);color:#5fe0bb}
.badge.done{background:rgba(255,255,255,.08);color:var(--soft)}
.badge.archived{background:rgba(255,255,255,.06);color:var(--faint)}

.rows{display:grid;gap:8px}
.cue-row{display:grid;grid-template-columns:56px minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,rgba(255,255,255,.06),rgba(255,255,255,.025));transition:.18s}
.cue-row:hover{background:rgba(255,255,255,.085)}
.cue-row.is-next{border-color:rgba(91,140,255,.42);box-shadow:0 0 0 1px rgba(91,140,255,.2)}
.cue-row.is-done{opacity:.62}
.cue-time{font-variant-numeric:tabular-nums;font-size:15px;font-weight:850;color:var(--ink);letter-spacing:-.02em}
.cue-time small{display:block;color:var(--faint);font-size:9.5px;font-weight:850;margin-top:2px}
.cue-main{min-width:0}
.cue-main b{display:block;font-size:13px;color:var(--ink-strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cue-main .chips{margin-top:6px;gap:5px}
.cue-main .chip{padding:3px 8px;font-size:9.5px}
.cov-pick{display:inline-flex;gap:3px;padding:3px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.cov-pick button{border:0;border-radius:9px;background:transparent;padding:7px 9px;color:var(--faint);font-size:10px;font-weight:880;transition:.18s}
.cov-pick button:hover{color:var(--ink);background:rgba(255,255,255,.08)}
.cov-pick button.on{background:rgba(255,255,255,.12);color:var(--ink-strong)}
.cov-pick button.on[data-cov="done"]{background:rgba(62,211,168,.22);color:#68e6c1}
.cov-pick button.on[data-cov="partial"]{background:rgba(245,181,68,.22);color:#f9cf85}
.row-tools{display:flex;gap:5px}
.icon-btn{border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.04);color:var(--soft);width:32px;height:32px;font-size:14px;display:grid;place-items:center;transition:.18s}
.icon-btn:hover{background:rgba(255,255,255,.10);color:var(--ink)}

.cast-row{display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,rgba(255,255,255,.06),rgba(255,255,255,.025))}
.avatar{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:900;background:linear-gradient(142deg,#8d7dff,#5b7de9);box-shadow:inset 0 1px rgba(255,255,255,.28)}
.avatar.c1{background:linear-gradient(142deg,#ff9b8f,#e8688f)}.avatar.c2{background:linear-gradient(142deg,#5ed7bd,#3a9fbe)}
.avatar.c3{background:linear-gradient(142deg,#7fb6ff,#5f7ee2)}.avatar.c4{background:linear-gradient(142deg,#f8cd7d,#e08c5f)}
.cast-main{min-width:0}.cast-main b{display:block;font-size:13.5px;color:var(--ink-strong)}
.cast-main p{margin:4px 0 0;font-size:11.5px;color:var(--soft);line-height:1.6;white-space:pre-wrap}

/* ---- モーダル・トースト ---- */
.modal-backdrop{position:fixed;inset:0;z-index:40;padding:16px;display:none;align-items:center;justify-content:center;background:rgba(4,7,14,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.modal-backdrop.show{display:flex}
.modal{width:min(660px,100%);max-height:calc(100vh - 32px);overflow:auto;border-radius:25px;padding:23px;background:linear-gradient(145deg,rgba(28,38,56,.98),rgba(18,26,40,.97));border:1px solid rgba(255,255,255,.13);box-shadow:0 30px 90px rgba(0,0,0,.62)}
.modal-head{display:flex;justify-content:space-between;gap:14px;margin-bottom:17px}
.modal-head h2{font-size:20px}.modal-head p{margin:6px 0 0;color:var(--soft);font-size:12px;line-height:1.6}
.close{border:0;width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.07);color:var(--soft);font-size:18px;flex:0 0 auto}
.close:hover{background:rgba(255,255,255,.13);color:var(--ink)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.field{display:grid;gap:6px}.field.full{grid-column:1/-1}
.field label{font-size:10.5px;color:var(--soft);font-weight:850}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line-strong);border-radius:12px;background:rgba(255,255,255,.055);padding:11px;color:var(--ink);font-size:13px}
.field input:focus,.field textarea:focus,.field select:focus{background:rgba(255,255,255,.09);border-color:rgba(91,140,255,.42)}
.field textarea{min-height:76px;resize:vertical;line-height:1.6}
.picker{grid-column:1/-1;border:1px solid var(--line);border-radius:15px;padding:13px;background:rgba(255,255,255,.035)}
.picker h4{font-size:11.5px;margin:0 0 9px;color:var(--soft)}
.pick-opts{display:flex;flex-wrap:wrap;gap:5px}
.pick-opts button{border:1px solid var(--line-strong);background:rgba(255,255,255,.05);color:var(--soft);border-radius:999px;padding:7px 10px;font-size:10.5px;font-weight:800;transition:.18s}
.pick-opts button:hover{color:var(--ink);border-color:rgba(91,140,255,.34)}
.pick-opts button.on{color:var(--blue-deep);background:rgba(91,140,255,.18);border-color:rgba(91,140,255,.34)}
.hint{font-size:11px;color:var(--faint);line-height:1.6}
.mfoot{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:19px}
.mfoot.spread{justify-content:space-between}
.toast{position:fixed;z-index:60;left:50%;bottom:24px;transform:translate(-50%,18px);opacity:0;pointer-events:none;background:rgba(240,246,255,.95);backdrop-filter:blur(16px);color:#0d1420;padding:12px 17px;border-radius:999px;font-size:12px;font-weight:800;box-shadow:0 12px 34px rgba(0,0,0,.42);transition:.24s;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

<body>

<div class="shell">
  <aside class="sidebar glass">
    <div class="brand"><div class="mark">EF</div><div><strong>Event Flow</strong><small>SHOOT RUNDOWN</small></div></div>
    <div class="nav-label">MENU</div>
    <nav class="nav" id="navMain">
      <button data-view="field" class="active"><span class="nicon">🎯</span>現場モード</button>
      <button data-view="cues"><span class="nicon">🗒️</span>進行表</button>
      <button data-view="cast"><span class="nicon">👥</span>出演者</button>
      <button data-view="events"><span class="nicon">📅</span>イベント</button>
      <button data-view="data"><span class="nicon">💾</span>バックアップ</button>
    </nav>
    <div class="side-foot">
      <strong id="sideEventName">イベント未選択</strong>
      <span id="sideEventMeta">「イベント」から作成してください</span>
      <div class="appver">ver <span id="app-ver"></span></div>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <div>
        <div class="crumb" id="crumb">FIELD MODE</div>
        <h1 class="title" id="viewTitle">現場<em>モード</em></h1>
      </div>
      <div class="actions" id="topActions"></div>
    </div>

    <section class="view active" id="view-field"></section>
    <section class="view" id="view-cues"></section>
    <section class="view" id="view-cast"></section>
    <section class="view" id="view-events"></section>
    <section class="view" id="view-data"></section>
  </main>
</div>

<nav class="bottom" id="navBottom">
  <button data-view="field" class="active"><b>🎯</b>現場</button>
  <button data-view="cues"><b>🗒️</b>進行表</button>
  <button data-view="cast"><b>👥</b>出演者</button>
  <button data-view="events"><b>📅</b>イベント</button>
  <button data-view="data"><b>💾</b>保存</button>
</nav>

<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<div class="undo-bar" id="undoBar" aria-live="polite"></div>

<script>
// ===== 基本設定 =====
const APP_NAME = 'イベント進行';
const APP_KEY  = 'event_flow_v1';
const VER_FILE = 'event-flow-ver.txt';

// ===== AUTO UPDATE（kakeibo.html / hyoka.html と同パターン） =====
// auto-version.yml が push 時に APP_VERSION と VER_FILE を自動で書き換える。
// 手動でこの数字を変更しないこと。
const APP_VERSION = 1;
(function checkUpdate() {
  fetch(VER_FILE + '?t=' + Date.now(), { cache: 'no-store' })
    .then(function(r) { return r.ok ? r.text() : null; })
    .then(function(t) {
      var n = parseInt(t);
      if (n && n > APP_VERSION && sessionStorage.getItem(APP_KEY + '_vreload') !== String(n)) {
        sessionStorage.setItem(APP_KEY + '_vreload', String(n));
        location.replace(location.pathname + '?v=' + n);
      }
    })
    .catch(function() {});
})();
document.getElementById('app-ver').textContent = APP_VERSION;

// ===== 小道具 =====
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const uid = () => (crypto.randomUUID ? crypto.randomUUID()
  : 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function toast(msg) {
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(window._tt); window._tt = setTimeout(() => el.classList.remove('show'), 3000);
}
function modal(html) { $('#modal').innerHTML = html; $('#modalBackdrop').classList.add('show'); }
function closeModal() { $('#modalBackdrop').classList.remove('show'); $('#modal').innerHTML = ''; }
$('#modalBackdrop').addEventListener('click', e => { if (e.target.id === 'modalBackdrop') closeModal(); });

// ===== localStorage 保存・読込 =====
function loadState() {
  try { return JSON.parse(localStorage.getItem(APP_KEY)) || {}; }
  catch (e) { return {}; }
}
function saveState(state) {
  localStorage.setItem(APP_KEY, JSON.stringify(state));
}

let state = normalize(loadState());
function normalize(s) {
  s = s && typeof s === 'object' ? s : {};
  s.schema = 1;
  s.events = Array.isArray(s.events) ? s.events : [];
  s.ui = s.ui && typeof s.ui === 'object' ? s.ui : {};
  s.ui.view = s.ui.view || 'field';
  s.events.forEach(ev => {
    ev.id = ev.id || uid();
    ev.state = ev.state || 'active';
    ev.alerts = ev.alerts || { leadMin: 5, sound: true };
    ev.cast = Array.isArray(ev.cast) ? ev.cast : [];
    ev.cues = Array.isArray(ev.cues) ? ev.cues : [];
    ev.cues.forEach((c, i) => {
      c.id = c.id || uid();
      if (typeof c.order !== 'number') c.order = i + 1;
      c.constraints = c.constraints || {};
      c.castIds = Array.isArray(c.castIds) ? c.castIds : [];
      c.coverage = c.coverage || 'none';
    });
  });
  return s;
}
function save() { saveState(state); }

// ===== 時刻ヘルパー（'HH:MM' と 当日分を行き来する） =====
function hm2min(hm) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(hm || '').trim());
  if (!m) return null;
  return (+m[1]) * 60 + (+m[2]);
}
function min2hm(min) {
  const m = ((Math.round(min) % 1440) + 1440) % 1440;
  return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
}
function nowMin() { const d = new Date(); return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60; }
// キューの予定時刻までの残り分（正=まだ先 / 負=超過）。当日内で判定する。
function remainMin(cue) {
  const t = hm2min(cue.plannedAt);
  if (t === null) return null;
  return t - nowMin();
}

// ===== イベント選択 =====
function currentEvent() {
  const ev = state.events.find(e => e.id === state.ui.currentEventId);
  if (ev) return ev;
  return state.events.find(e => e.state === 'active') || null;
}
function sortedCues(ev) { return ev.cues.slice().sort((a, b) => a.order - b.order); }
function pendingCues(ev) { return sortedCues(ev).filter(c => c.coverage !== 'done'); }
function nextCue(ev) { return pendingCues(ev)[0] || null; }
function coverage(ev) {
  const total = ev.cues.length;
  const done = ev.cues.filter(c => c.coverage === 'done').length;
  const partial = ev.cues.filter(c => c.coverage === 'partial').length;
  return { total, done, partial, pct: total ? Math.round(done / total * 100) : 0 };
}

// ===== 取り消し（1手分のスナップショット） =====
let undoSnap = null;
function snapshot(label) {
  undoSnap = { json: JSON.stringify(state.events), label };
  const bar = $('#undoBar');
  bar.innerHTML = '<span>' + esc(label) + '</span><button id="undoBtn">元に戻す</button>';
  bar.classList.add('show');
  $('#undoBtn').onclick = () => {
    if (!undoSnap) return;
    state.events = JSON.parse(undoSnap.json);
    undoSnap = null; bar.classList.remove('show');
    save(); render(); toast('元に戻しました');
  };
  clearTimeout(window._ut); window._ut = setTimeout(() => bar.classList.remove('show'), 9000);
}

// ===== 通知音（Web Audio。ユーザー操作でunlockが必要） =====
let ac = null;
function unlockAudio() {
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
  } catch (e) { ac = null; }
  return !!ac;
}
function beep(times) {
  if (!ac || ac.state !== 'running') return;
  const n = times || 2;
  for (let i = 0; i < n; i++) {
    const t0 = ac.currentTime + i * 0.26;
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(i % 2 ? 1320 : 880, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.28, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.20);
    osc.connect(g); g.connect(ac.destination);
    osc.start(t0); osc.stop(t0 + 0.22);
  }
}
// バイブは初回タップ前に呼ぶとブラウザに拒否されるので、操作があってから使う
let gestured = false;
document.addEventListener('pointerdown', function once() {
  gestured = true;
  unlockAudio();
  document.removeEventListener('pointerdown', once);
}, { once: true });
function buzz(pattern) { if (gestured && navigator.vibrate) navigator.vibrate(pattern); }

// ===== ビュー切替 =====
const VIEWS = {
  field:  { crumb: 'FIELD MODE',      title: '現場<em>モード</em>' },
  cues:   { crumb: 'RUNDOWN',         title: '進行<em>表</em>' },
  cast:   { crumb: 'CAST',            title: '出演<em>者</em>' },
  events: { crumb: 'EVENTS',          title: 'イベント<em>管理</em>' },
  data:   { crumb: 'BACKUP',          title: 'バック<em>アップ</em>' }
};
function setView(v) {
  if (!VIEWS[v]) v = 'field';
  state.ui.view = v; save(); render();
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-view]');
  if (t) { setView(t.dataset.view); }
});

// ===== 描画 =====
function render() {
  const v = state.ui.view;
  $$('.nav button, .bottom button').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  $$('.view').forEach(s => s.classList.toggle('active', s.id === 'view-' + v));
  $('#crumb').textContent = VIEWS[v].crumb;
  $('#viewTitle').innerHTML = VIEWS[v].title;

  const ev = currentEvent();
  $('#sideEventName').textContent = ev ? ev.name : 'イベント未選択';
  $('#sideEventMeta').textContent = ev
    ? [ev.date || '日付未設定', ev.venue || '会場未設定'].join(' / ')
    : '「イベント」から作成してください';

  renderTopActions(v, ev);
  if (v === 'field') renderField(ev);
  if (v === 'cues') renderCues(ev);
  if (v === 'cast') renderCast(ev);
  if (v === 'events') renderEvents();
  if (v === 'data') renderData();
}

function renderTopActions(v, ev) {
  const box = $('#topActions');
  let h = '';
  if (!ac || ac.state !== 'running') h += '<button class="btn" onclick="enableSound()">🔔 音を有効化</button>';
  if (v === 'field' && ev) h += '<button class="btn" onclick="openAlertSettings()">⚙️ アラート</button>';
  if (v === 'cues' && ev) h += '<button class="btn primary" onclick="openCueForm()">＋ キュー追加</button>';
  if (v === 'cast' && ev) h += '<button class="btn primary" onclick="openCastForm()">＋ 出演者追加</button>';
  if (v === 'events') h += '<button class="btn primary" onclick="openEventForm()">＋ イベント作成</button>';
  box.innerHTML = h;
}
function enableSound() {
  if (unlockAudio()) { beep(1); toast('通知音を有効にしました'); render(); }
  else toast('この端末では通知音を使えません');
}

/* ---------- 現場モード ---------- */
function renderField(ev) {
  const box = $('#view-field');
  if (!ev) { box.innerHTML = emptyBlock('🎬', 'イベントがありません', '「イベント」タブから撮影イベントを作成してください。'); return; }
  const cue = nextCue(ev), cov = coverage(ev), ups = pendingCues(ev).slice(1, 4);

  box.innerHTML =
    '<div class="alert-banner" id="alertBanner"></div>' +
    '<div class="field-grid">' +
      '<div class="now-card glass">' + (cue ? nowCardBody(ev, cue) : allDoneBody(ev)) + '</div>' +
      '<div class="side-stack">' +
        '<div class="cover-card glass">' +
          '<div class="kicker">COVERAGE</div>' + ringSvg(cov) +
          '<div class="cover-legend">' +
            '<span><i style="background:#3ed3a8"></i>完了 ' + cov.done + '</span>' +
            '<span><i style="background:#f5b544"></i>一部 ' + cov.partial + '</span>' +
            '<span><i style="background:rgba(255,255,255,.22)"></i>未 ' + (cov.total - cov.done - cov.partial) + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="adjust glass">' +
          '<div class="kicker">RESCHEDULE</div><h2>進行の再調整</h2>' +
          '<p class="muted" style="margin:8px 0 0">未完了のキューだけをまとめて動かします。</p>' +
          '<div class="adjust-row">' +
            '<button class="btn" onclick="shiftPending(-5)">−5分</button>' +
            '<button class="btn" onclick="shiftPending(-1)">−1分</button>' +
            '<button class="btn" onclick="shiftPending(1)">+1分</button>' +
            '<button class="btn" onclick="shiftPending(5)">+5分</button>' +
          '</div>' +
          '<div class="adjust-row"><button class="btn mint" onclick="syncToNow()">⏱ 現在時刻に同期</button></div>' +
        '</div>' +
        '<div class="panel glass">' +
          '<div class="kicker">UP NEXT</div><h2>この後の予定</h2>' +
          (ups.length ? '<div class="up-list">' + ups.map(c =>
            '<div class="up-row"><b>' + esc(c.plannedAt || '--:--') + '</b><span>' + esc(c.title) + '</span>' +
            '<em>' + (c.durationMin ? c.durationMin + '分' : '') + '</em></div>').join('') + '</div>'
            : '<p class="muted" style="margin-top:10px">後続のキューはありません。</p>') +
        '</div>' +
      '</div>' +
    '</div>';
  tick();
}
function nowCardBody(ev, cue) {
  const names = cue.castIds.map(id => (ev.cast.find(p => p.id === id) || {}).name).filter(Boolean);
  const k = cue.constraints || {};
  let chips = '';
  if (k.flash === 'ok') chips += '<span class="chip ok">⚡ フラッシュ可</span>';
  if (k.flash === 'no') chips += '<span class="chip no">🚫 フラッシュ禁止</span>';
  if (k.tripod === 'ok') chips += '<span class="chip ok">🦿 三脚可</span>';
  if (k.tripod === 'no') chips += '<span class="chip no">🚫 三脚禁止</span>';
  if (k.area) chips += '<span class="chip warm">📍 ' + esc(k.area) + '</span>';
  names.forEach(n => { chips += '<span class="chip cast">' + esc(n) + '</span>'; });
  if (!chips) chips = '<span class="chip plain">撮影制約なし</span>';

  return '<div class="now-head">' +
      '<div><div class="kicker">NEXT CUE</div><div class="cue-title">' + esc(cue.title) + '</div></div>' +
      '<div class="cue-order">' + cue.order + '</div>' +
    '</div>' +
    '<div class="cue-when">予定 <b>' + esc(cue.plannedAt || '--:--') + '</b>' +
      (cue.durationMin ? '<span>／ 所要 ' + cue.durationMin + '分</span>' : '') + '</div>' +
    '<div class="remain" id="remainBox"><div class="remain-num" id="remainNum">--</div>' +
      '<div class="remain-unit" id="remainUnit">残り</div></div>' +
    '<div class="chips">' + chips + '</div>' +
    (cue.constraints.note ? '<div class="cue-note">' + esc(cue.constraints.note) + '</div>' : '') +
    '<div class="now-actions">' +
      '<button class="btn mint" onclick="setCoverage(\'' + cue.id + '\',\'done\')">✓ 撮影完了</button>' +
      '<button class="btn" onclick="setCoverage(\'' + cue.id + '\',\'partial\')">△ 一部</button>' +
      '<button class="btn" onclick="openCueForm(\'' + cue.id + '\')">✎ 編集</button>' +
    '</div>';
}
function allDoneBody(ev) {
  return '<div class="kicker">ALL DONE</div>' +
    '<div class="cue-title">' + (ev.cues.length ? '全キュー撮影済み' : 'キューがありません') + '</div>' +
    '<p class="muted" style="margin-top:14px">' +
    (ev.cues.length ? 'このイベントの撮影キューはすべて完了しています。' : '「進行表」タブからキューを追加してください。') +
    '</p><div class="now-actions"><button class="btn primary" data-view="cues">進行表を開く</button></div>';
}
function ringSvg(cov) {
  const r = 56, c = 2 * Math.PI * r, off = c * (1 - cov.pct / 100);
  return '<div class="ring"><svg width="132" height="132" viewBox="0 0 132 132">' +
    '<circle cx="66" cy="66" r="' + r + '" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="11"/>' +
    '<circle cx="66" cy="66" r="' + r + '" fill="none" stroke="url(#g1)" stroke-width="11" stroke-linecap="round" ' +
      'stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"/>' +
    '<defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0%" stop-color="#3ed3a8"/><stop offset="100%" stop-color="#5b8cff"/></linearGradient></defs>' +
    '</svg><div class="ring-txt"><b>' + cov.done + '/' + cov.total + '</b><span>' + cov.pct + '%</span></div></div>';
}
function emptyBlock(icon, title, body) {
  return '<div class="empty"><div class="empty-icon">' + icon + '</div><strong>' + esc(title) + '</strong>' +
    '<p class="muted">' + esc(body) + '</p></div>';
}

// 1秒ごとの更新（残り時間の表示とアラート判定のみ。DOMは作り直さない）
const fired = new Set();
function tick() {
  const ev = currentEvent();
  if (!ev) return;
  const cue = nextCue(ev);
  const numEl = $('#remainNum');
  if (cue && numEl) {
    const rem = remainMin(cue), box = $('#remainBox'), unit = $('#remainUnit');
    box.classList.remove('warn', 'over');
    if (rem === null) { numEl.textContent = '--:--'; unit.textContent = '時刻未設定'; }
    else if (rem < 0) {
      box.classList.add('over');
      numEl.textContent = '+' + fmtSpan(-rem); unit.textContent = '超過';
    } else {
      if (rem <= (ev.alerts.leadMin || 5)) box.classList.add('warn');
      numEl.textContent = fmtSpan(rem); unit.textContent = '残り';
    }
  }
  checkAlert(ev, cue);
}
function fmtSpan(min) {
  const total = Math.floor(min * 60);
  if (min < 60) return String(Math.floor(total / 60)).padStart(2, '0') + ':' + String(total % 60).padStart(2, '0');
  return Math.floor(min / 60) + '時間' + Math.floor(min % 60) + '分';
}
function checkAlert(ev, cue) {
  const banner = $('#alertBanner');
  if (!cue || !banner) return;
  const rem = remainMin(cue);
  if (rem === null) { banner.classList.remove('show'); return; }
  const lead = ev.alerts.leadMin || 5;
  const key = ev.id + ':' + cue.id + ':' + cue.plannedAt;
  if (rem <= lead) {
    banner.innerHTML = '<div style="font-size:20px">🔔</div><div class="ab-copy">' +
      '<b>' + esc(cue.title) + '</b>' +
      '<small>予定 ' + esc(cue.plannedAt) + '　' + (rem < 0 ? Math.ceil(-rem) + '分 超過' : 'あと ' + Math.ceil(rem) + '分') + '</small>' +

function saveAlerts() {
  const ev = currentEvent(); if (!ev) return;
  const lead = parseInt($('#a-lead').value, 10);
  ev.alerts.leadMin = isNaN(lead) ? 5 : Math.max(0, Math.min(60, lead));
  ev.alerts.sound = $('#a-sound').value === '1';
  fired.clear();
  save(); closeModal(); render(); toast('保存しました');
}

/* ---------- バックアップ ---------- */
function renderData() {
  const cues = state.events.reduce((n, e) => n + e.cues.length, 0);
  $('#view-data').innerHTML =
    '<div class="panel glass"><div class="kicker">BACKUP</div><h2>データの持ち出しと復元</h2>' +
      '<p class="muted" style="margin:10px 0 0">この端末のブラウザ内（localStorage）にのみ保存されています。' +
      '端末を変える前・アプリを消す前にJSONを書き出してください。<br>' +
      '書き出したJSONは非公開リポジトリ care-data-backup に置き、公開リポジトリにはコミットしないでください。</p>' +
      '<div class="ev-meta" style="margin-top:16px"><span>イベント ' + state.events.length + '件</span>' +
        '<span>キュー 合計 ' + cues + '件</span></div>' +
      '<div class="adjust-row" style="flex-wrap:wrap">' +
        '<button class="btn primary" onclick="exportData()">📤 バックアップ</button>' +
        '<button class="btn" onclick="document.getElementById(\'import-file\').click()">📥 復元</button>' +
        '<button class="btn danger" onclick="wipeAll()">全データ削除</button>' +
      '</div>' +
      '<input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">' +
    '</div>';
}
// エクスポートしたJSONは非公開リポジトリ care-data-backup に保存する。
// このリポジトリにはコミットしないこと。
function exportData() {
  const env = {
    format: 'event-flow', version: 1, exportedAt: new Date().toISOString(),
    summary: { events: state.events.length, cues: state.events.reduce((n, e) => n + e.cues.length, 0) },
    data: state
  };
  const blob = new Blob([JSON.stringify(env, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = APP_NAME + '_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('バックアップを書き出しました');
}
function importData(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function () {
    try {
      const raw = JSON.parse(reader.result);
      const data = (raw && raw.format === 'event-flow' && raw.data) ? raw.data : raw;
      if (!data || !Array.isArray(data.events)) throw new Error('このアプリのバックアップではありません');
      if (!confirm('現在のデータを取り込んだ内容で上書きします。よろしいですか？')) return;
      saveState(normalize(data));
      location.reload();
    } catch (e) { alert('読み込みに失敗しました: ' + e.message); }
  };
  reader.readAsText(file);
  ev.target.value = '';
}
function wipeAll() {
  if (!confirm('この端末に保存された全データを削除します。取り消せません。よろしいですか？')) return;
  localStorage.removeItem(APP_KEY);
  location.reload();
}

render();
</script>
