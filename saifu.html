<!DOCTYPE html>
<html lang="ja">
<head>
<!-- ============================================================
  にゃんこ財布（saifu.html） app-template.html から作成
  - 支払った金額をその場でメモし、家計簿(kakeibo.html)へJSONで渡す
  - 書き出しJSON: { app:"saifu", version:1, exportedAt, exps:[{id,date:"M/D",name,amount,catId,type:"cash",tags:["大阪遠征"],catName:"食費"}] }
    kakeibo.html の「読み込み」で選ぶと今月の出費へ追記される（saifuId で二重取り込みを防止）
    家計簿にない catId は catName で同じ名前のジャンルへ。なければ家計簿にジャンルを追加する
  ルール:
    - 実データ(エクスポートJSON/CSV)はリポジトリにコミットしない
      （バックアップは非公開リポジトリ care-data-backup へ）
  確認用URLパラメータ:
    ?t=1.5   直近の記録（なければ見本）の演出を t 秒の瞬間で止めて表示
    ?debug=1 fps・粒子数・t を表示
    ?v=fountain|rain|spiral  チーンの後にお金が舞う演出の種類を固定（省略時は記録ごとに決まる）
    ?g=yawn|ear|wash|groom|glance|pet|angry|fury&gt=0.8  待機中のしぐさ・なでた反応・怒り顔（fury=すごく怒る）を gt 秒の瞬間で止めて表示
    ?day=25  締め日（25日）まわりの様子を確かめるため、今日の「日」を固定（省略時は端末の日付）
             20〜24日: レジをチラ見・しっぽパタパタ / 25日: 怒る / 締め日までの分が残ったまま過ぎた: すごく怒る
    ?hour=20.5  部屋の明るさを決める時刻を固定（省略時は端末の時刻）
    ?cat=yellow 猫の種類を固定（hachi=ハチワレ / yellow=きいろ。省略時は設定どおり）
============================================================ -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="にゃんこ財布">
<link rel="apple-touch-icon" href="saifu-icon.png">
<link rel="icon" type="image/png" href="saifu-favicon.png">
<title>にゃんこ財布</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fbf3e6;
    --bg2: #fffaf0;
    --text: #4a2f22;
    --text2: #8a6a52;
    --accent: #d9574b;
    --line: #4a2f22;
    --ink: #4a2f22;      /* ふちどり・影 */
    --gold: #dca844;
    --lcd-bg: #1d3326;
    --lcd: #9cf27a;
    --paper: #fffdf6;
    --f-ui: "Zen Maru Gothic", -apple-system, "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
    --f-dot: "DotGothic16", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: var(--f-ui);
    background-color: var(--bg); color: var(--text);
    background-image: linear-gradient(rgba(74,47,34,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(74,47,34,.06) 1px, transparent 1px);
    background-size: 18px 18px;
    min-height: 100vh; padding: 16px;
    padding-top: calc(16px + env(safe-area-inset-top));
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 1.35rem; font-weight: 900; letter-spacing: .04em; margin-bottom: 14px; display: flex; align-items: center; gap: 6px;
    color: var(--accent); text-shadow: 2px 2px 0 var(--gold); }
  button {
    background: var(--bg2); color: var(--text); font-family: inherit; font-weight: 700;
    border: 2px solid var(--ink); border-radius: 12px; box-shadow: 0 3px 0 var(--ink);
    padding: 10px 14px; font-size: .9rem; cursor: pointer; transition: transform .05s, box-shadow .05s;
  }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  .footer { text-align: center; font-size: .75rem; color: var(--text2); margin-top: 24px; font-family: var(--f-dot); }

  /* 舞台 */
  #stage { position: relative; height: 42vh; min-height: 240px; max-height: 380px;
    border-radius: 18px; overflow: hidden; background: #f6e7cf; border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); }
  #cv { width: 100%; height: 100%; display: block; }
  #stage .hint { position: absolute; right: 10px; top: 8px; font-size: .68rem; color: #a08a6e;
    background: rgba(255,255,255,.7); padding: 2px 8px; border-radius: 10px; display: none; }
  #stage.playing .hint { display: block; }
  #stage .loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--text2); font-size: .85rem; }
  #receipt { position: absolute; left: 3%; bottom: 3%; width: 40%; background: #fffdf8; color: #333;
    font: 11px/1.45 var(--f-dot); padding: 8px 10px 10px; border-radius: 3px;
    box-shadow: 0 3px 10px rgba(0,0,0,.18); display: none; transform-origin: bottom center; }
  #receipt .shop { text-align: center; font-weight: 700; letter-spacing: .1em; }
  #receipt .sep { border-top: 1px dashed #bbb; margin: 4px 0; }
  #receipt .ln { display: flex; justify-content: space-between; gap: 6px; }
  #receipt .ln span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #receipt .tot { font-weight: 700; font-size: 12px; }
  #stage .heart { position: absolute; font-size: 22px; pointer-events: none; animation: heartUp 1.3s ease-out forwards; }
  @keyframes heartUp { 0% { transform: translate(-50%, 0) scale(.5); opacity: 0; } 20% { transform: translate(-50%, -12px) scale(1.1); opacity: 1; }
    100% { transform: translate(-50%, -70px) scale(.9); opacity: 0; } }
  #dbg { position: absolute; left: 6px; top: 6px; font: 10px ui-monospace, monospace; color: #fff;
    background: rgba(0,0,0,.55); padding: 3px 6px; border-radius: 4px; display: none; white-space: pre; }
  /* three.js が使えないときの簡易表示 */
  #stage .fb { position: absolute; inset: 0; display: none; align-items: flex-end; justify-content: center;
    font-size: 64px; padding-bottom: 18%; }
  #stage.fallback #cv { display: none; }
  #stage.fallback .fb { display: flex; }
  #stage.fallback .loading { display: none; }
  .fb-coin { position: absolute; top: -40px; font-size: 26px; animation: fbfall 1.1s ease-in forwards; }
  @keyframes fbfall { to { transform: translateY(var(--dy)) rotate(540deg); opacity: .2; } }

  /* 入力 */
  .card { background: var(--bg2); border: 2.5px solid var(--ink); border-radius: 16px; padding: 14px; margin-top: 14px; box-shadow: 4px 4px 0 var(--ink); }
  .row2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 8px; }
  label.f { display: block; font-size: .72rem; color: var(--text2); font-weight: 700; margin-bottom: 4px; }
  input.in { width: 100%; padding: 11px 12px; border: 2px solid var(--ink); border-radius: 11px;
    font-size: 16px; background: #fffdf7; color: var(--text); font-family: inherit; }
  #close-day { flex: 1; padding: 8px 10px; border: 2px solid var(--ink); border-radius: 11px; font-size: 16px; background: #fffdf7; color: var(--text); font-family: inherit; font-weight: 700; }
  input.in:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(217,87,75,.18); }
  input.amt { font-size: 22px; font-family: var(--f-dot); text-align: right; }
  #cats { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  /* ハッシュタグ（家計簿と同じ tags）。選択中・候補・入力欄を1行に並べ、多いときは横スクロール */
  #tags { display: flex; align-items: center; gap: 8px; margin: -4px -4px 12px; padding: 2px 4px 4px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  #tags::-webkit-scrollbar { display: none; }
  /* ジャンル（暖色・立体）と見分けるため、タグは家計簿と同じ紺系で平らに小さく */
  #tags button { flex: none; white-space: nowrap; padding: 4px 10px; border-radius: 999px; font-size: .78rem; background: #EAF1FC; color: #1C3561;
    border: 1.5px solid #A8C0EC; box-shadow: none; }
  #tags button.on { background: #1C3561; color: #fff; border-color: #1C3561; }
  #tags input { flex: none; width: 6em; padding: 4px 10px; border: 2px dashed #1C3561; border-radius: 999px; font-size: 16px;
    background: #fffdf7; color: #1C3561; font-family: inherit; }
  #tags input:focus { outline: none; border-style: solid; }
  /* 右にはみ出しているときだけ右端をぼかす（横にスクロールできる合図） */
  #tags.more { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); }
  /* よく使う記録の札（横にスクロール） */
  #favs { display: none; align-items: center; gap: 8px; margin: 0 -4px 10px; padding: 2px 4px 4px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  #favs::-webkit-scrollbar { display: none; }
  #favs .lb { flex: none; font-size: .72rem; font-weight: 700; color: var(--ink); opacity: .7; }
  #favs button { flex: none; white-space: nowrap; padding: 6px 12px; border-radius: 999px; font-size: .85rem; background: #fff3dc; box-shadow: 0 2px 0 var(--ink);
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  #favs button:active { transform: translateY(1px); box-shadow: 0 1px 0 var(--ink); }
  .in.filled { animation: filled .6s; }
  /* 支払い方法（現金 / クレジット）。記録のたびに現金へ戻す */
  /* 現金｜クレカ の2つ並び。選んでいる方を塗る */
  .pay { flex: none; display: flex; border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; box-shadow: 0 2px 0 var(--ink); }
  .pay button { padding: 7px 12px; font-size: .85rem; font-weight: 700; border: none; border-radius: 0; box-shadow: none; background: #fff; color: var(--text2); }
  .pay button + button { border-left: 2px solid var(--ink); }
  .pay button:active { transform: none; box-shadow: none; }
  .pay button.sel[data-p="cash"] { background: #3A5CA8; color: #fff; }
  .pay button.sel[data-p="credit"] { background: #A03060; color: #fff; }
  .ent .cr { font-size: .62rem; color: #fff; background: #A03060; border-radius: 6px; padding: 0 5px; font-weight: 700; }
  /* 記録の直後に出す「取り消す」の帯 */
  #undo { position: fixed; left: 8px; right: 8px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 59; display: none;
    align-items: center; gap: 10px; padding: 10px 12px; background: var(--ink); color: #fff; border-radius: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.25); font-size: .9rem; }
  #undo .msg { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #undo button { flex: none; padding: 6px 12px; border-radius: 8px; font-weight: 900; background: #fff3dc; color: var(--ink); border: 2px solid #fff3dc; }
  /* 修正中の表示 */
  #editbar { display: none; align-items: center; gap: 8px; margin-bottom: 10px; padding: 8px 10px; border: 2px dashed var(--accent); border-radius: 10px; font-size: .88rem; font-weight: 700; }
  #editbar .msg { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.35; }
  #editbar .msg .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #editbar .msg .a { font-family: var(--f-dot); }
  #editbar button { flex: none; padding: 4px 10px; border-radius: 8px; font-size: .8rem; box-shadow: 0 2px 0 var(--ink); }
  #editbar #edit-del { color: var(--accent); }
  .ent:not(.done) .nm { cursor: pointer; }
  @keyframes filled { 0% { background: #ffe08a; } 100% { background: #fff; } }
  /* 切符のような丸い札 */
  #cats button { padding: 6px 13px; border-radius: 999px; font-size: .85rem; background: #fff3dc; box-shadow: 0 2px 0 var(--ink); }
  #cats button { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  #cats button.act { background: transparent; border-style: dashed; box-shadow: none; }
  #cats button.sel, #cat-sel button.sel, #stage-sel button.sel, .toggles button.on { background: var(--accent); color: #fff; transform: translateY(1px); box-shadow: 0 1px 0 var(--ink); }
  .daterow { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .daterow input { width: auto; flex: 1; padding: 8px 10px; font-size: 15px; }
  .go { width: 100%; padding: 15px; font-size: 1.08rem; font-weight: 900; letter-spacing: .06em; color: #fff;
    border: 2.5px solid var(--ink); background: linear-gradient(180deg, #ee7a6c, #d9574b); border-radius: 14px; box-shadow: 0 4px 0 var(--ink); }
  .go:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  /* 入力中だけキーボードのすぐ上に出す帯 */
  #kbbar { position: fixed; left: 0; top: 0; width: 100%; z-index: 60; display: none; padding: 6px 8px; box-sizing: border-box; will-change: transform; }
  #kbbar button { width: 100%; padding: 10px 12px; font-size: 1rem; font-weight: 900; color: #fff; border: 2.5px solid var(--ink);
    background: linear-gradient(180deg, #ee7a6c, #d9574b); border-radius: 12px; box-shadow: 0 3px 0 var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #kbbar button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  #kbdbg { position: fixed; left: 0; top: 0; z-index: 61; display: none; font: 11px ui-monospace, monospace; color: #fff;
    background: rgba(0,0,0,.7); padding: 4px 6px; white-space: pre; pointer-events: none; }
  /* レジ入力（設定でON）: 金額欄の入力中だけ帯のすぐ上に出すテンキー */
  #regpad { position: fixed; left: 0; top: 0; width: 100%; z-index: 60; display: none; padding: 8px 8px 0; box-sizing: border-box;
    background: var(--bg); border-top: 2.5px solid var(--ink); will-change: transform; }
  #regpad .disp { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 6px 10px; margin-bottom: 6px;
    background: var(--lcd-bg); color: var(--lcd); border-radius: 10px; font-family: var(--f-dot); }
  #regpad .expr { font-size: .9rem; opacity: .8; white-space: nowrap; overflow: hidden; min-width: 0; }
  #regpad .tot { font-size: 1.3rem; white-space: nowrap; }
  #regpad .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  #regpad .keys button { height: 52px; font-size: 1.3rem; font-weight: 900; color: var(--ink); background: var(--paper);
    border: 2.5px solid var(--ink); border-radius: 11px; box-shadow: 0 3px 0 var(--ink); touch-action: manipulation; }
  #regpad .keys button.op { background: #f6dfb0; }
  #regpad .keys button.sub { font-size: .95rem; }
  #regpad .keys button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  .shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  /* 締め日（25日）に未書き出しがあるときの注意 */
  #warn25 { display: none; align-items: center; gap: 8px; margin-top: 14px; padding: 9px 10px; background: #ffe1d6; color: var(--ink);
    border: 2.5px solid var(--ink); border-radius: 14px; box-shadow: 3px 3px 0 var(--ink); font-size: .85rem; font-weight: 700; }
  #warn25 .m { flex: 1; min-width: 0; }
  #warn25 button { flex-shrink: 0; padding: 7px 10px; font-weight: 900; color: #fff; background: #d9574b; border: 2.5px solid var(--ink); border-radius: 10px; }

  /* 合計・履歴 */
  /* 合計: レジの表示窓のような液晶パネル */
  .sums { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .sum { background: #f3dcc4; border: 2.5px solid var(--ink); border-radius: 14px; padding: 7px 8px 8px; box-shadow: 3px 3px 0 var(--ink); min-width: 0; }
  .sum .l { font-size: .7rem; color: var(--ink); font-weight: 700; margin: 0 3px 4px; }
  .sum .v { display: flex; justify-content: flex-end; align-items: baseline; gap: .35em; overflow: hidden; white-space: nowrap;
    background: var(--lcd-bg); color: var(--lcd); font-family: var(--f-dot); font-size: 1.2rem; border-radius: 8px; padding: 6px 9px;
    text-shadow: 0 0 6px rgba(156,242,122,.55); box-shadow: inset 0 2px 0 rgba(0,0,0,.35); }
  /* ドラム回転の数字 */
  .roll { display: inline-flex; font-family: var(--f-dot); line-height: 1.15em; }
  .roll .ch, .roll .dg { display: inline-block; height: 1.15em; }
  .roll .dg { width: .62em; overflow: hidden; text-align: center; }
  .roll .strip { display: flex; flex-direction: column; transition: transform .9s cubic-bezier(.2, .9, .25, 1.12); }
  .roll .strip span { height: 1.15em; }
  .roll.still .strip { transition: none; }
  /* 履歴: 1枚のレシート */
  #list { position: relative; margin: 26px 0 12px; padding: 8px 14px 12px; background: var(--paper);
    border-left: 2.5px solid var(--ink); border-right: 2.5px solid var(--ink); }
  #list::before, #list::after { content: ''; position: absolute; left: -2.5px; right: -2.5px; height: 10px;
    background: linear-gradient(135deg, var(--paper) 50%, transparent 50%) 0 0 / 14px 10px repeat-x,
                linear-gradient(225deg, var(--paper) 50%, transparent 50%) 0 0 / 14px 10px repeat-x; }
  #list::before { top: -10px; transform: scaleY(-1); }
  #list::after { bottom: -10px; }
  .day { font-size: .78rem; margin: 12px 0 6px; display: flex; justify-content: space-between; align-items: center; }
  .day span:first-child { display: inline-block; color: var(--accent); border: 2px solid var(--accent); border-radius: 6px; padding: 1px 8px;
    font-weight: 900; transform: rotate(-4deg); background: rgba(217,87,75,.06); }
  .day span:last-child { font-family: var(--f-dot); color: var(--text2); font-size: .9rem; }
  .day.fold { cursor: pointer; -webkit-user-select: none; user-select: none; }
  .day .dn { font-family: var(--f-ui); font-size: .72rem; margin-right: .4em; }
  .day .ar { margin-left: .4em; font-size: .7rem; }
  .ent { display: flex; align-items: center; gap: 8px; background: transparent; border-bottom: 1.5px dashed rgba(74,47,34,.35);
    padding: 9px 2px; font-family: var(--f-dot); transition: opacity .4s; }
  /* 1段目に品目、2段目にジャンル・CR・タグ。切らずに折り返して全部見せる */
  .ent .nm { flex: 1; min-width: 0; font-size: .9rem; font-family: var(--f-ui); font-weight: 700; }
  .ent .nm .t { overflow-wrap: anywhere; }
  .ent .nm .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 2px; }
  .ent .tg { font-size: .66rem; color: var(--ink); opacity: .75; font-weight: 700; overflow-wrap: anywhere; }
  .ent .ct { font-size: .66rem; color: var(--ink); background: #f6e3c4; border: 1.5px solid var(--ink); border-radius: 8px; padding: 0 6px; font-weight: 700; }
  .ent .am { font-size: 1.05rem; display: inline-flex; flex: none; }
  .ent .am.pop { animation: pop .35s; }
  @keyframes pop { 40% { transform: scale(1.3); } }
  /* 履歴へ飛ぶ硬貨 */
  .fly-coin { position: fixed; left: 0; top: 0; margin: -12px 0 0 -12px; font-size: 22px; line-height: 24px;
    pointer-events: none; z-index: 50; will-change: transform; }
  .ent .ex { font-size: .65rem; color: #3f7a4a; }
  .ent .go-ed { flex: none; color: var(--text2); opacity: .6; font-size: 1.1rem; font-family: var(--f-ui); }
  .ent.done { opacity: .55; }
  .ent.pending { opacity: 0; }
  .ent.flash { animation: flash 1s; }
  @keyframes flash { 0% { background: #ffe9a8; } 100% { background: transparent; } }
  .empty { text-align: center; color: var(--text2); font-size: .85rem; padding: 18px 0; }

  /* 道具 */
  .tools { display: grid; gap: 8px; }
  .tools button { text-align: left; }
  .tools .main { background: #e6f0e0; color: var(--lcd-bg); border-color: var(--lcd-bg); box-shadow: 0 3px 0 var(--lcd-bg); font-weight: 900; }
  .toggles { display: flex; gap: 8px; }
  .toggles button { flex: 1; text-align: center; }
  .note { font-size: .72rem; color: var(--text2); line-height: 1.5; }
  .tools button.danger { color: var(--accent); border-color: var(--accent); box-shadow: 0 3px 0 var(--accent); }
  /* 設定（折りたたみ） */
  .settings summary { list-style: none; cursor: pointer; font-weight: 700; font-size: .9rem; padding: 10px 14px;
    background: var(--bg2); border: 2px solid var(--ink); border-radius: 12px; box-shadow: 0 3px 0 var(--ink); }
  .settings summary::-webkit-details-marker { display: none; }
  .settings summary::after { content: '▸'; float: right; }
  .settings[open] summary::after { content: '▾'; }
  .settings > .tools { margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">

<h1>🐾 にゃんこ財布</h1>

<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>

<script>
// ===== 基本設定 =====
const APP_NAME = 'saifu';               // エクスポートファイル名などに使用
const APP_KEY  = 'saifu_v1';            // localStorage のキー
const VER_FILE = 'saifu-ver.txt';       // 自動更新用のバージョンファイル名

// ===== AUTO UPDATE（kakeibo.html / hyoka.html と同パターン） =====
// auto-version.yml が push 時に APP_VERSION と VER_FILE を自動で書き換える。
// 手動でこの数字を変更しないこと。
const APP_VERSION = 30;
(function checkUpdate() {
  fetch(VER_FILE + '?t=' + Date.now(), { cache: 'no-store' })
    .then(function(r) { return r.ok ? r.text() : null; })
    .then(function(t) {
      var n = parseInt(t);
      if (n && n > APP_VERSION && sessionStorage.getItem(APP_KEY + '_vreload') !== String(n)) {
        sessionStorage.setItem(APP_KEY + '_vreload', String(n));
        location.replace(location.pathname + '?v=' + n);
      }
    })
    .catch(function() {});
})();
document.getElementById('app-ver').textContent = APP_VERSION;

// ===== localStorage 保存・読込 =====
function loadState() {
  try { return JSON.parse(localStorage.getItem(APP_KEY)) || {}; }
  catch (e) { return {}; }
}
function saveState(state) {
  localStorage.setItem(APP_KEY, JSON.stringify(state));
}

// ===== バックアップ（エクスポート／インポート） =====
// エクスポートしたJSONは非公開リポジトリ care-data-backup に保存する。
// このリポジトリにはコミットしないこと。
function exportData() {
  var blob = new Blob([JSON.stringify(loadState(), null, 1)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = APP_NAME + '_backup_' + todayIso() + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
}
function importData(ev) {
  var file = ev.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function() {
    try {
      var data = JSON.parse(reader.result);
      if (!data || !Array.isArray(data.entries)) {
        alert(data && data.app === 'saifu'
          ? 'これは家計簿へ渡す書き出しファイルです。家計簿の「読み込み」で使ってください。'
          : '財布のバックアップファイルではないようです。');
        return;
      }
      if (!confirm('現在のデータを取り込んだ内容で上書きします。よろしいですか？')) return;
      saveState(data);
      location.reload();
    } catch (e) { alert('読み込みに失敗しました: ' + e.message); }
  };
  reader.readAsText(file);
  ev.target.value = '';
}

// ===== 財布本体 =====
// 家計簿(kakeibo.html)の初期ジャンル。バックアップから読み込むと置き換わる
const DEFAULT_CATS = [
  { id: 1, name: '食費' }, { id: 2, name: '日用品' }, { id: 3, name: '交通費' },
  { id: 4, name: 'その他' }, { id: 5, name: 'ガソリン' },
];
const WDAY = ['日', '月', '火', '水', '木', '金', '土'];
const reduceMotion = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };

function normalize(s) {
  return {
    entries: Array.isArray(s.entries) ? s.entries : [],
    cats: Array.isArray(s.cats) && s.cats.length ? s.cats : DEFAULT_CATS.slice(),
    catsFrom: s.catsFrom || 'default',
    lastCat: s.lastCat,
    sound: s.sound !== false,
    // アニメはONなら端末の「視差効果を減らす」に関係なく動かす。旧形式（animFree なし）は今の動き方を引き継ぐ
    anim: s.animFree ? s.anim !== false : (s.anim !== false && (!reduceMotion.matches || s.animForce === true)),
    animFree: true,
    catStyle: s.catStyle === 'yellow' ? 'yellow' : 'hachi',   // 舞台の猫（ハチワレ / きいろ）
    stage: s.stage === 'car' ? 'car' : 'reg',   // 舞台（レジ / ガソリンスタンド）
    closeDay: Number.isInteger(s.closeDay) && s.closeDay >= 1 && s.closeDay <= 31 ? s.closeDay : 25,   // 締め日（31は末日）
    kbTags: s.kbTags && typeof s.kbTags === 'object' ? s.kbTags : {},   // 家計簿のバックアップから読んだタグの使用回数
    // よく使う記録の回数（記録は消せるので別に覚える）。初めてのときは残っている記録から作る
    freq: s.freq && typeof s.freq === 'object' ? s.freq : seedFreq(Array.isArray(s.entries) ? s.entries : []),
    // 月ごとの合計（書き出し済みの記録を消しても減らない）。初めてのときは残っている記録から作る
    monthTotals: s.monthTotals && typeof s.monthTotals === 'object' ? s.monthTotals : seedMonths(Array.isArray(s.entries) ? s.entries : []),
  };
}
function seedMonths(entries) {
  const m = {};
  for (const e of entries) if (e.iso) m[e.iso.slice(0, 7)] = (m[e.iso.slice(0, 7)] || 0) + (e.amount || 0);
  return m;
}
// 今月の合計へ足し引きする（記録・修正・取り消し・削除のとき）
function addMonth(iso, amount) {
  const k = iso.slice(0, 7);
  state.monthTotals[k] = (state.monthTotals[k] || 0) + amount;
}
// ===== よく使う記録（品目・金額・ジャンルが同じものを数える）=====
const FAV_MIN = 2, FAV_MAX = 8, FAV_DAYS = 90;
// 現金のキーは支払い方法を入れる前と同じ形のまま（今までの回数をそのまま使う）
const favKey = (name, amount, catId, type) => JSON.stringify(type === 'credit' ? [name, amount, catId, 'credit'] : [name, amount, catId]);
function countFreq(freq, name, amount, catId, at, type) {
  const k = favKey(name, amount, catId, type);
  const f = freq[k] || (freq[k] = { name, amount, catId, type: type === 'credit' ? 'credit' : 'cash', n: 0, last: 0 });
  f.n++; f.last = Math.max(f.last, at);
}
function uncountFreq(freq, name, amount, catId, type) {
  const k = favKey(name, amount, catId, type), f = freq[k];
  if (f && --f.n <= 0) delete freq[k];
}
function seedFreq(entries) {
  const freq = {};
  for (const e of entries) countFreq(freq, e.name, e.amount, e.catId, new Date(e.iso + 'T12:00:00').getTime() || 0, e.type);
  return freq;
}
let state = normalize(loadState());
function save() {
  try { saveState(state); }
  catch (e) { alert('保存できませんでした（端末の保存領域を確認してください）: ' + e.message); }
}

function pad2(n) { return String(n).padStart(2, '0'); }
function todayIso() { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function isoToMD(iso) { const p = iso.split('-'); return (+p[1]) + '/' + (+p[2]); }
function yen(n) { return '¥' + Math.round(n).toLocaleString('ja-JP'); }
function newId() { return 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function toHalf(s) { return String(s).replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)); }
function catName(id) { const c = state.cats.find(c => c.id === id); return c ? c.name : '(不明)'; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

const $ = id => document.getElementById(id);
const nameIn = $('f-name'), amtIn = $('f-amount'), dateIn = $('f-date');
dateIn.value = todayIso();

let payType = 'cash';   // 支払い方法。覚えておかず、開いたとき・記録したあとは現金
function setPay(t) {
  payType = t === 'credit' ? 'credit' : 'cash';
  $('pay').querySelectorAll('button').forEach(b => b.classList.toggle('sel', b.dataset.p === payType));
  if (window.kbBarReady) updateKbBar();
}
$('pay').addEventListener('pointerdown', e => { if (kbTyping()) e.preventDefault(); });   // 入力中に押してもキーボードを閉じない
$('pay').addEventListener('click', () => setPay(payType === 'cash' ? 'credit' : 'cash'));
setPay('cash');
let undoId = null, undoTimer = null;   // 取り消せる直前の記録
let editId = null, editPrevDate = null;   // 修正中の記録
let pendingReveal = null;   // 演出が終わるまで履歴で隠しておく記録
let flashId = null;

// ジャンルは2行目まで。2行目の最後の「＋」で全部を広げ、広げたときは末尾に「＋ジャンル」「たたむ」
// 2行に収まるときは「＋」がそのまま「ジャンルを追加」になる
let catsOpen = false;
function renderCats() {
  if (!state.cats.some(c => c.id === state.lastCat)) state.lastCat = state.cats[0].id;
  const box = $('cats');
  const btns = state.cats.map(c =>
    `<button type="button" data-id="${esc(c.id)}" class="${c.id === state.lastCat ? 'sel' : ''}">${esc(c.name)}</button>`).join('');
  if (catsOpen) {
    box.innerHTML = btns + '<button type="button" class="act" data-act="add">＋ジャンル</button><button type="button" class="act" data-act="fold">たたむ</button>';
  } else {
    box.innerHTML = btns + '<button type="button" class="act" data-act="add">＋</button>';
    const plus = box.lastElementChild;
    const rowTops = [...new Set([...box.children].map(el => el.offsetTop))].sort((a, b) => a - b);
    if (rowTops.length > 2) {
      // 3行目にはみ出すので、選んでいるジャンル以外を後ろから隠して「＋」を2行目に収める
      plus.dataset.act = 'open';
      const row2 = rowTops[1];
      const hideable = [...box.querySelectorAll('button[data-id]')].filter(b => !b.classList.contains('sel')).reverse();
      for (const b of hideable) { if (plus.offsetTop <= row2) break; b.style.display = 'none'; }
    }
  }
  $('cats-note').textContent = state.catsFrom === 'kakeibo'
    ? `家計簿のバックアップ(.json)から読み込みます。ジャンルは家計簿のバックアップから読み込んだ ${state.cats.length}件です。`
    : '家計簿のバックアップ(.json)から読み込みます。ジャンルは家計簿の初期設定です。家計簿でジャンルを編集している場合は読み込んでください。';
  if (window.kbBarReady) updateKbBar();   // 帯の準備ができる前（起動直後）は呼ばない
}
function addCat() {
  const name = (prompt('新しいジャンルの名前') || '').trim().replace(/\s+/g, ' ');
  if (!name) return;
  let c = state.cats.find(c => c.name === name);
  if (!c) { c = { id: 'saifu_' + Date.now().toString(36), name, added: true }; state.cats.push(c); }   // added: 財布で足したジャンル
  state.lastCat = c.id; save(); renderCats();
}
// 長押しでジャンルを消す（記録で使っているものと、最後の1つは消さない）
let catPress = null, catLong = false;
function catCancel() { if (catPress) { clearTimeout(catPress.t); catPress = null; } }
$('cats').addEventListener('pointerdown', e => {
  const b = e.target.closest('button[data-id]'); if (!b) return;
  catCancel(); catLong = false;
  catPress = { x: e.clientX, y: e.clientY, t: setTimeout(() => {
    catPress = null; catLong = true;
    const c = state.cats.find(c => String(c.id) === b.dataset.id); if (!c) return;
    if (state.entries.some(x => x.catId === c.id)) { alert(`「${c.name}」は記録で使っているので消せません。`); return; }
    if (state.cats.length <= 1) { alert('ジャンルは1つ以上必要です。'); return; }
    if (!confirm(`ジャンル「${c.name}」を消しますか？`)) return;
    state.cats = state.cats.filter(x => x !== c);
    save(); renderCats();
  }, 600) };
});
$('cats').addEventListener('pointermove', e => {
  if (catPress && Math.hypot(e.clientX - catPress.x, e.clientY - catPress.y) > 10) catCancel();
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => $('cats').addEventListener(t, catCancel));
$('cats').addEventListener('contextmenu', e => e.preventDefault());
$('cats').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (catLong) { catLong = false; return; }
  const act = b.dataset.act;
  if (act === 'add') { addCat(); return; }
  if (act === 'open' || act === 'fold') { catsOpen = act === 'open'; renderCats(); return; }
  const c = state.cats.find(c => String(c.id) === b.dataset.id); if (!c) return;
  state.lastCat = c.id; save(); renderCats();
});
// 画面の幅や文字の読み込みで1行に入る数が変わるので、そのたびに数え直す
let catsW = window.innerWidth;
window.addEventListener('resize', () => { if (window.innerWidth !== catsW) { catsW = window.innerWidth; renderCats(); } });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { renderCats(); tagsEdge(); });

// ===== ハッシュタグ（家計簿の tags と同じ。# は付けずに持つ）=====
let formTags = [];   // フォームで選んでいるタグ
const tagIn = $('tag-in');
function normTag(s) { return String(s).trim().replace(/^#+/, '').replace(/\s+/g, ' '); }   // 家計簿の normalizeTag と同じ
// 候補: 家計簿のタグ＋この財布で使ったタグを合わせて、よく使う順に12個
function recentTags(limit = 12) {
  const freq = Object.assign({}, state.kbTags);
  state.entries.forEach(e => (e.tags || []).forEach(t => { freq[t] = (freq[t] || 0) + 1; }));
  return Object.keys(freq).sort((a, b) => freq[b] - freq[a]).slice(0, limit);
}
function renderTags() {
  const q = normTag(tagIn.value).toLowerCase();
  const cands = recentTags().filter(t => !formTags.includes(t) && t.toLowerCase().startsWith(q));
  $('tags-btns').innerHTML =
    formTags.map(t => `<button type="button" class="on" data-t="${esc(t)}">#${esc(t)} ×</button>`).join('') +
    cands.map(t => `<button type="button" data-t="${esc(t)}">#${esc(t)}</button>`).join('');
  $('tag-add').style.display = q ? '' : 'none';
  tagsEdge();
}
function tagsEdge() {
  const el = $('tags');
  el.classList.toggle('more', el.scrollLeft + el.clientWidth < el.scrollWidth - 2);
}
$('tags').addEventListener('scroll', tagsEdge, { passive: true });
window.addEventListener('resize', tagsEdge);
function addTag(raw) {
  const t = normTag(raw);
  if (t && !formTags.includes(t)) formTags.push(t);
  tagIn.value = ''; renderTags();
}
function setFormTags(list) { formTags = (list || []).slice(); tagIn.value = ''; renderTags(); }
// 押してもタグの入力欄からフォーカスを外さない（外れると打ちかけの文字がタグになってしまう）
['pointerdown', 'mousedown'].forEach(t => {
  $('tags-btns').addEventListener(t, e => { if (document.activeElement === tagIn) e.preventDefault(); });
  $('tag-add').addEventListener(t, e => e.preventDefault());
});
$('tags-btns').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const t = b.dataset.t;
  formTags = b.classList.contains('on') ? formTags.filter(x => x !== t) : [...formTags, t];
  tagIn.value = ''; renderTags();
});
$('tag-add').addEventListener('click', () => addTag(tagIn.value));
tagIn.addEventListener('input', renderTags);
// Enter で追加（記録はしない）。日本語の変換確定の Enter は無視する
tagIn.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); addTag(tagIn.value); }
});
tagIn.addEventListener('change', () => { if (tagIn.value.trim()) addTag(tagIn.value); });   // 打ったまま別の所を押したとき

// ===== ドラム回転の数字（変わった桁だけが縦に回って止まる）=====
const ROLL_STRIP = '<span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span>';
// from を渡すと、その文字列から回す（'' なら全部の桁が 0 から回る）
function rollNumber(el, text, animate, from) {
  const prev = from != null ? from : el._roll;
  if (from == null && prev === text && el.firstChild) return;
  if (prev == null) animate = false;   // 最初の表示は回さない
  el._roll = text;
  const n = text.length, old = String(prev || '').slice(-n).padStart(n, ' ');
  let html = '';
  for (let i = 0; i < n; i++) {
    const ch = text[i];
    if (ch >= '0' && ch <= '9') {
      const o = old[i] >= '0' && old[i] <= '9' ? +old[i] : 0;
      html += `<span class="dg"><span class="strip" data-to="${ch}" style="transform:translateY(${-o * 10}%)">${ROLL_STRIP}</span></span>`;
    } else html += `<span class="ch">${esc(ch)}</span>`;
  }
  el.classList.add('roll'); el.classList.toggle('still', !animate);
  el.setAttribute('aria-label', text);
  el.innerHTML = html;
  const strips = el.querySelectorAll('.strip');

// ===== 締め日（設定で変更・初期25日）の注意: 家計簿を締める日に未書き出しがあれば知らせる =====
const SOON_DAYS = 5;
const DAY_FORCE = parseInt(new URLSearchParams(location.search).get('day'), 10) || null;
function isoOf(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
// lv 0: なし / 1: 締め日の5日前〜前日 / 2: 締め日 / 3: 締め日を過ぎたのに、締め日までの日付の未書き出しが残っている
// 月ごとの締め日（その月に無い日なら末日）。m は 0 始まり、範囲外も可
const closeOf = (y, m) => new Date(y, m, Math.min(state.closeDay, new Date(y, m + 1, 0).getDate()));
const closeDayLabel = () => state.closeDay === 31 ? '末日' : state.closeDay + '日';
function closeInfo() {
  const un = state.entries.filter(e => !e.exported);
  if (!un.length) return { lv: 0, list: un };
  const d = new Date(); if (DAY_FORCE) d.setDate(DAY_FORCE);
  d.setHours(0, 0, 0, 0);
  const y = d.getFullYear(), m = d.getMonth(), cur = closeOf(y, m);
  const lastIso = isoOf(d > cur ? cur : closeOf(y, m - 1));   // 今日より前の直近の締め日
  const over = un.filter(e => e.iso <= lastIso);
  if (over.length) return { lv: 3, list: over };
  const next = d <= cur ? cur : closeOf(y, m + 1);
  const left = Math.round((next - d) / 86400000);   // 次の締め日まで何日か（月をまたいでも数える）
  if (left === 0) return { lv: 2, list: un };
  if (left <= SOON_DAYS) return { lv: 1, list: un };
  return { lv: 0, list: un };
}
const closeLevel = () => closeInfo().lv;
function renderWarn() {
  const el = $('warn25'), { lv, list } = closeInfo();
  const st = window.saifuStage;
  if (st && st.ok && st.setMood) st.setMood(lv);
  if (lv < 2) { el.style.display = 'none'; return; }
  const sum = `${list.length}件（${yen(list.reduce((s, e) => s + e.amount, 0))}）`;
  el.querySelector('.m').textContent = lv === 3
    ? `😾 締め日（${closeDayLabel()}）までの未書き出しが ${sum}残っています`
    : `😾 今日は家計簿を締める日です。未書き出しが ${sum}あります`;
  el.style.display = 'flex';
}

function reveal(id) {
  if (pendingReveal !== id) return;
  showUndo(id);   // 演出が終わって行が出たときに「取り消す」を出す
  const fly = motionOn();
  pendingReveal = null; flashId = fly ? null : id; renderList(); flashId = null;
  if (!fly) { renderSums(); return; }
  const row = [...document.querySelectorAll('#list .ent')].find(el => el.dataset.id === id);
  const am = row && row.querySelector('.am');
  if (am) rollNumber(am, am.textContent, true, '');   // 新しい行の金額だけ 0 から回す
  // 合計はスクロールが止まってから 0.3 秒置いて回す
  const later = () => setTimeout(renderSums, 300);
  if (flyToEntry(id)) afterScrollStops(later); else later();
}

// スクロールが 150ms 止まったら cb を呼ぶ（最長 1.5 秒で打ち切り）
function afterScrollStops(cb) {
  let t = 0, done = false;
  const end = () => { if (done) return; done = true; clearTimeout(t); clearTimeout(cap); window.removeEventListener('scroll', on); cb(); };
  const on = () => { clearTimeout(t); t = setTimeout(end, 150); };
  const cap = setTimeout(end, 1500);
  window.addEventListener('scroll', on, { passive: true });
  on();
}

// 舞台から履歴の行へ硬貨・お札が飛んで入る
function flyToEntry(id) {
  const ent = state.entries.find(e => e.id === id);
  const row = [...document.querySelectorAll('#list .ent')].find(el => el.dataset.id === id);
  if (!ent || !row || !row.animate) return false;
  const r0 = row.getBoundingClientRect();
  const off = r0.bottom > window.innerHeight - 8 || r0.top < 0;
  if (off) row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  setTimeout(() => {
    if (!row.isConnected) return;
    const am = row.querySelector('.am');
    const s = $('stage').getBoundingClientRect(), t = am.getBoundingClientRect();
    const x0 = s.left + s.width / 2, y0 = Math.max(-20, s.bottom - 30);
    const tx = t.left + t.width / 2, ty = t.top + t.height / 2;
    const a = ent.amount, n = a >= 10000 ? 6 : a >= 1000 ? 5 : a >= 100 ? 4 : 3;
    let done = 0;
    const land = () => {
      if (++done < n || !row.isConnected) return;
      row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash');
      am.classList.remove('pop'); void am.offsetWidth; am.classList.add('pop');
    };
    for (let i = 0; i < n; i++) {
      const el = document.createElement('span');
      el.className = 'fly-coin';
      el.textContent = (a >= 1000 && i % 2 === 0) ? '💴' : '🪙';
      document.body.appendChild(el);
      const side = (i % 2 ? 1 : -1) * (20 + Math.random() * 40);
      const ex = tx + (Math.random() - 0.5) * 16, ey = ty + (Math.random() - 0.5) * 8;
      const mx = (x0 + ex) / 2 + side, my = Math.min(y0, ey) - 70 - Math.random() * 40;
      const delay = i * 80;
      const anim = el.animate([
        { transform: `translate(${x0}px,${y0}px) scale(.6) rotate(0deg)`, opacity: 0, easing: 'ease-out' },
        { transform: `translate(${mx}px,${my}px) scale(1.2) rotate(200deg)`, opacity: 1, offset: 0.45, easing: 'ease-in' },
        { transform: `translate(${ex}px,${ey}px) scale(.5) rotate(400deg)`, opacity: 0.4 },
      ], { duration: 650, delay, fill: 'both' });
      let fin = false;
      const finish = () => {
        if (fin) return; fin = true; el.remove();
        if (state.sound) sfx.clink(0);
        land();
      };
      anim.onfinish = finish;
      setTimeout(finish, 650 + delay + 500);   // アニメーションが止まる環境でも必ず片付ける
    }
  }, off ? 350 : 0);
  return off;
}

// ===== 効果音（Web Audio で合成。音源ファイルは使わない） =====
const sfx = (() => {
  let ac = null;
  function ctx() {
    if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }
    if (ac && ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(at, f, dur, vol, type) {
    const a = ctx(); if (!a) return;
    const t0 = a.currentTime + Math.max(0, at);
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.05);
  }
  function noise(at, dur, vol, freq, q) {
    const a = ctx(); if (!a) return;
    const t0 = a.currentTime + Math.max(0, at);
    const len = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q || 1; g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(a.destination); s.start(t0);
  }
  return {
    unlock: ctx,
    clink(at) { const f = 2300 + Math.random() * 700; tone(at, f, 0.18, 0.10); tone(at, f * 1.62, 0.09, 0.05); },
    swish(at) { noise(at, 0.12, 0.25, 2200, 0.8); },
    thunk(at) { noise(at, 0.09, 0.6, 320, 1.2); },
    chin(at) { tone(at, 1318.5, 1.4, 0.20); tone(at, 2637, 0.9, 0.07); tone(at, 3956, 0.5, 0.03); },
    // ゴロゴロ: 低いのこぎり波を低域だけ通し、25Hz で強弱をつける
    purr(at, dur) {
      const a = ctx(); if (!a) return;
      const t0 = a.currentTime + Math.max(0, at), t1 = t0 + dur;
      const o = a.createOscillator(), f = a.createBiquadFilter(), tg = a.createGain(), g = a.createGain();
      const lfo = a.createOscillator(), lg = a.createGain();
      o.type = 'sawtooth'; o.frequency.value = 55;
      f.type = 'lowpass'; f.frequency.value = 280;
      tg.gain.value = 0.5; lfo.frequency.value = 25; lg.gain.value = 0.5;
      g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(0.12, t0 + 0.15);
      g.gain.setValueAtTime(0.12, t1 - 0.3); g.gain.linearRampToValueAtTime(0.0001, t1);
      lfo.connect(lg); lg.connect(tg.gain);
      o.connect(f); f.connect(tg); tg.connect(g); g.connect(a.destination);
      o.start(t0); lfo.start(t0); o.stop(t1 + 0.05); lfo.stop(t1 + 0.05);
    },
    // シャーッ: 高めの帯域のノイズ
    hiss(at) { noise(at, 0.9, 0.35, 3800, 0.6); },
    // ピピッ: カード端末の読み取りOK / ブブッ: 読み取りエラー
    beep(at) { tone(at, 2600, 0.08, 0.12); tone(at + 0.12, 2600, 0.08, 0.12); },
    buzz(at) { tone(at, 170, 0.35, 0.12, 'square'); tone(at + 0.03, 176, 0.32, 0.08, 'sawtooth'); },
    // 給油: ザーッという一定のノイズ（dur 秒）
    fuel(at, dur) {
      const a = ctx(); if (!a || dur <= 0.2) return;
      const t0 = a.currentTime + Math.max(0, at), len = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
      s.buffer = buf; f.type = 'bandpass'; f.frequency.value = 520; f.Q.value = 0.8;
      g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(0.09, t0 + 0.12);
      g.gain.setValueAtTime(0.09, t0 + dur - 0.15); g.gain.linearRampToValueAtTime(0.0001, t0 + dur);
      s.connect(f); f.connect(g); g.connect(a.destination); s.start(t0);
    },
    // ブルン: 低いのこぎり波を一瞬ふかす
    vroom(at) {
      const a = ctx(); if (!a) return;
      const t0 = a.currentTime + Math.max(0, at), o = a.createOscillator(), f = a.createBiquadFilter(), g = a.createGain();
      o.type = 'sawtooth'; o.frequency.setValueAtTime(55, t0); o.frequency.linearRampToValueAtTime(95, t0 + 0.18); o.frequency.exponentialRampToValueAtTime(48, t0 + 0.8);
      f.type = 'lowpass'; f.frequency.value = 420;
      g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(0.18, t0 + 0.05); g.gain.setValueAtTime(0.18, t0 + 0.3); g.gain.linearRampToValueAtTime(0.0001, t0 + 0.85);
      o.connect(f); f.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + 0.9);
    },
    // ぽちゃ: 高い音から下がる短い音（金魚が跳ねたとき）
    plop(at) {
      const a = ctx(); if (!a) return;
      const t0 = a.currentTime + Math.max(0, at);
      const o = a.createOscillator(), g = a.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(900, t0); o.frequency.exponentialRampToValueAtTime(250, t0 + 0.12);
      g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(0.18, t0 + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.15);
      o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + 0.2);
    },
  };
})();
window.sfx = sfx;

// ===== 記録する =====
let lastPlayAt = 0;
$('form').addEventListener('submit', e => {
  e.preventDefault();
  const amount = parseInt(toHalf(amtIn.value).replace(/[^\d]/g, ''), 10);

  // 先に保存してから演出を流す（演出の失敗で記録が消えないように）

// ===== キーボードのすぐ上に出す「レジに入れる」の帯 =====

// ===== レジ入力（設定でON）: ボタンで金額を打つ。掛け算を先に計算するレジ式 =====

// ---- 時刻表（秒）----
const T = { swipe0: 0.32, swipe1: 1.02, flight: 0.26, open: [0.18, 0.32], close: [1.3, 1.42], chin: 1.4,
  count: [1.4, 1.7], burst: 1.48, burstLen: 1.25, react: [1.45, 6.0], print: [1.6, 3.2], move: [5.6, 6.2], end: 6.4 };
// 舞う演出のスロー係数: 動きを SLOW 倍ゆっくり、出てくる間隔を DS 倍に（burstLen はスロー前の秒数）
const SLOW = 2.8, DS = 1.5;

const CARD = { appear: 0.3, reach: [0.3, 0.6], carry: [0.6, 0.9], lower: [0.9, 1.0], swipe: [1.0, 1.3], ok: 1.35,
  errBack: [1.7, 1.85], reswipe: [1.85, 2.05], lift: [1.4, 1.6], back: [1.6, 2.0], gone: [2.0, 2.2] };
const CARD_ERR_SHIFT = 0.8, CARD_SHORT = 1.32;

let P = null;   // 再生中の演出
const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3(), tmpC = new THREE.Vector3();

function buildPlay(entry, catNm, opts) {
  const R = rng(hash(entry.id + ':' + entry.amount));
  const kinds = breakdown(entry.amount);
  const n = kinds.length, k = Math.min(n, 4), d = (T.swipe1 - T.swipe0) / k;
  const slotCount = {};
  let billIdx = 0;
  const pieces = kinds.map((kind, i) => {
    const mesh = makeMoney(kind); scene.add(mesh);
    const bill = isBill(kind);
    const ang = i * 2.39996, rad = bill ? 0.01 : 0.05 + 0.07 * Math.sqrt(i / 12);
    const tray = new THREE.Vector3(TRAY.x + Math.cos(ang) * rad, TRAY.y + 0.008 + i * 0.004, TRAY.z + Math.sin(ang) * rad * 0.7);
    let slot;
    if (bill) { slot = new THREE.Vector3(-0.12 + (billIdx % 3) * 0.12, -0.04 + billIdx * 0.006, -0.17); billIdx++; }
    else {
      const sx = COIN_SLOT_X[kind]; slotCount[sx] = (slotCount[sx] || 0) + 1;
      slot = new THREE.Vector3(sx + (R() - 0.5) * 0.04, -0.044 + slotCount[sx] * 0.009, 0.19 + (R() - 0.5) * 0.06);
    }
    const g = Math.floor(i * k / n), gi = i - Math.floor(g * n / k);
    const launch = T.swipe0 + d * (g + 0.6) + gi * 0.03;
    return { kind, bill, mesh, tray, slot, launch, land: launch + T.flight, appear: 0.03 + i * 0.02, rotY: R() * Math.PI, spin: 8 + R() * 8 };
  });
  const swipes = [];
  for (let g = 0; g < k; g++) {
    const own = pieces.filter((p, i) => Math.floor(i * k / n) === g);
    const c = new THREE.Vector3(); own.forEach(p => c.add(p.tray)); c.divideScalar(own.length || 1); c.y += 0.05;
    swipes.push({ t0: T.swipe0 + d * g, d, reach: c });
  }
  // 舞う紙幣・硬貨（金額が大きいほど多く、1万円以上は紙幣吹雪）
  const a = entry.amount;
  const N = a < 500 ? 6 : a < 5000 ? 14 : a < 10000 ? 22 : 40;
  const coinKinds = kinds.filter(x => !isBill(x)); if (!coinKinds.length) coinKinds.push(100, 500);
  const billKinds = a >= 10000 ? [10000, 10000, 5000, 1000] : a >= 1000 ? [1000] : [];
  const burst = [];
  for (let i = 0; i < N; i++) {
    const useBill = billKinds.length && (a >= 10000 ? R() < 0.6 : R() < 0.3);
    const kind = useBill ? billKinds[Math.floor(R() * billKinds.length)] : coinKinds[Math.floor(R() * coinKinds.length)];
    const mesh = makeMoney(kind); mesh.visible = false; scene.add(mesh);
    burst.push({ kind, bill: isBill(kind), mesh, delay: i * 0.012,
      o: new THREE.Vector3(reg.position.x + (R() - 0.5) * 0.4, TOP + 0.66, reg.position.z - 0.05 + (R() - 0.5) * 0.1),
      v: new THREE.Vector3((R() * 2 - 1) * 1.3, 2.0 + R() * 1.2, 0.3 + R() * 1.1),
      w1: (R() * 2 - 1) * 14, w2: (R() * 2 - 1) * 10, ph: R() * 6.28 });
  }
  // クレカ: トレーのお金とネコパンチをやめてカードを出し、舞うお金を肉球ポイントにする
  // 8回に1回くらい読み取りエラー（そのぶん後ろの時刻を shift 秒ずらす）
  const credit = entry.type === 'credit';
  let card = null, err = false, shift = 0;
  if (credit) {
    pieces.forEach(p => scene.remove(p.mesh)); pieces.length = 0; swipes.length = 0;
    burst.forEach(b => { scene.remove(b.mesh); b.kind = 100; b.bill = false; b.mesh = new THREE.Mesh(COIN[100].geo, PAW_MATS); b.mesh.visible = false; scene.add(b.mesh); });
    card = new THREE.Mesh(cardGeo, CARD_MATS); card.visible = false; scene.add(card);
    err = ERR_FORCE || rng(hash(entry.id + ':card'))() < 1 / 8;
    shift = err ? CARD_ERR_SHIFT : 0;
  }
  // ゾロ目（3桁以上で全部同じ数字）: 舞うお金をすべて金色の硬貨にして、30枚以上にする（既存の乱数列は変えない）
  const lucky = /^(\d)\1{2,}$/.test(String(a));
  if (lucky) {
    const RL = rng(hash(entry.id + ':lucky'));
    const toGold = (b, i) => {
      if (b.bill) { scene.remove(b.mesh); b.kind = coinKinds[i % coinKinds.length]; b.bill = false; b.mesh = makeMoney(b.kind); b.mesh.visible = false; scene.add(b.mesh); }
      b.mesh.material = LUCKY_GOLD;
    };
    burst.forEach(toGold);
    for (let i = burst.length; i < 30; i++) {
      const src = burst[i % N], mesh = makeMoney(src.kind); mesh.visible = false; scene.add(mesh);
      const b = { kind: src.kind, bill: false, mesh, delay: i * 0.012,
        o: src.o.clone().add(new THREE.Vector3((RL() - 0.5) * 0.2, 0, (RL() - 0.5) * 0.1)),
        v: new THREE.Vector3((RL() * 2 - 1) * 1.3, 2.0 + RL() * 1.2, 0.3 + RL() * 1.1),
        w1: (RL() * 2 - 1) * 14, w2: (RL() * 2 - 1) * 10, ph: RL() * 6.28 };
      toGold(b, i); burst.push(b);
    }
  }
  // 舞い方の種類（記録ごとに決まる。既存の乱数列は変えない）
  const RV = rng(hash(entry.id + ':v'));

  const FLOOR = TOP + 0.006;
  if (variant === 'rain') {

    burst.forEach((b, i) => {

    });
  } else if (variant === 'spiral') {
    // レジのまわりをらせん状に昇る
    burst.forEach((b, i) => { b.delay = i * 0.015; b.ph = RV() * 6.28; b.rad = 0.45 + RV() * 0.15; b.o.y = TOP + 0.2 + RV() * 0.15; });
  }
  receiptEl.innerHTML = `<div class="shop">NYAN MART</div><div style="text-align:center">${esc(entry.iso)}</div><div class="sep"></div>
    <div class="ln"><span>${esc(entry.name)}</span><span>${'¥' + entry.amount.toLocaleString('ja-JP')}</span></div>
    <div class="ln" style="color:#888"><span>${esc(catNm)}</span><span></span></div><div class="sep"></div>
    <div class="ln tot"><span>合計</span><span>${'¥' + entry.amount.toLocaleString('ja-JP')}</span></div>${credit ? '<div class="ln"><span>お支払い</span><span>クレジット</span></div>' : ''}
    <div style="text-align:center;margin-top:4px">=^･ω･^= ${lucky ? 'ゾロ目！福がくるにゃ' : 'ありがとにゃ'}</div>${credit ? '<div style="text-align:right;margin-top:2px">サイン 🐾</div>' : ''}`;
  const big = a >= 10000, food = catNm.indexOf('食') >= 0;
  return { entry, pieces, swipes, burst, variant, big, food, lucky, credit, card, err, shift, startT: opts.short ? (credit ? CARD_SHORT + shift : SHORT_START) : 0, t0: performance.now(), resolve: null, sound: !!opts.sound };
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function scheduleSounds(p) {
