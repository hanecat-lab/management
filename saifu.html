<!DOCTYPE html>
<html lang="ja">
<head>
<!-- ============================================================
  にゃんこ財布（saifu.html） app-template.html から作成
  - 支払った金額をその場でメモし、家計簿(kakeibo.html)へJSONで渡す
  - 書き出しJSON: { app:"saifu", version:1, exportedAt, exps:[{id,date:"M/D",name,amount,catId,type:"cash"}] }
    kakeibo.html の「読み込み」で選ぶと今月の出費へ追記される（saifuId で二重取り込みを防止）
  ルール:
    - 実データ(エクスポートJSON/CSV)はリポジトリにコミットしない
      （バックアップは非公開リポジトリ care-data-backup へ）
  確認用URLパラメータ:
    ?t=1.5   直近の記録（なければ見本）の演出を t 秒の瞬間で止めて表示
    ?debug=1 fps・粒子数・t を表示
============================================================ -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="にゃんこ財布">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<title>にゃんこ財布</title>
<style>
  :root {
    --bg: #fbf3e6;
    --bg2: #ffffff;
    --text: #3b2f25;
    --text2: #9a8670;
    --accent: #e9645f;
    --line: #ecdcc4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; padding: 16px;
    padding-top: calc(16px + env(safe-area-inset-top));
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 1.2rem; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
  button {
    background: var(--bg2); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 14px; font-size: .9rem; cursor: pointer;
  }
  .footer { text-align: center; font-size: .7rem; color: var(--text2); margin-top: 24px; }

  /* 舞台 */
  #stage { position: relative; height: 42vh; min-height: 240px; max-height: 380px;
    border-radius: 18px; overflow: hidden; background: #f6e7cf; box-shadow: 0 2px 10px rgba(80,50,20,.12); }
  #cv { width: 100%; height: 100%; display: block; }
  #stage .hint { position: absolute; right: 10px; top: 8px; font-size: .68rem; color: #a08a6e;
    background: rgba(255,255,255,.7); padding: 2px 8px; border-radius: 10px; display: none; }
  #stage.playing .hint { display: block; }
  #stage .loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--text2); font-size: .85rem; }
  #receipt { position: absolute; left: 3%; bottom: 3%; width: 40%; background: #fffdf8; color: #333;
    font: 11px/1.45 ui-monospace, Menlo, monospace; padding: 8px 10px 10px; border-radius: 3px;
    box-shadow: 0 3px 10px rgba(0,0,0,.18); display: none; transform-origin: bottom center; }
  #receipt .shop { text-align: center; font-weight: 700; letter-spacing: .1em; }
  #receipt .sep { border-top: 1px dashed #bbb; margin: 4px 0; }
  #receipt .ln { display: flex; justify-content: space-between; gap: 6px; }
  #receipt .ln span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #receipt .tot { font-weight: 700; font-size: 12px; }
  #dbg { position: absolute; left: 6px; top: 6px; font: 10px ui-monospace, monospace; color: #fff;
    background: rgba(0,0,0,.55); padding: 3px 6px; border-radius: 4px; display: none; white-space: pre; }
  /* three.js が使えないときの簡易表示 */
  #stage .fb { position: absolute; inset: 0; display: none; align-items: flex-end; justify-content: center;
    font-size: 64px; padding-bottom: 18%; }
  #stage.fallback #cv { display: none; }
  #stage.fallback .fb { display: flex; }
  #stage.fallback .loading { display: none; }
  .fb-coin { position: absolute; top: -40px; font-size: 26px; animation: fbfall 1.1s ease-in forwards; }
  @keyframes fbfall { to { transform: translateY(var(--dy)) rotate(540deg); opacity: .2; } }

  /* 入力 */
  .card { background: var(--bg2); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-top: 12px; }
  .row2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 8px; }
  label.f { display: block; font-size: .72rem; color: var(--text2); font-weight: 700; margin-bottom: 4px; }
  input.in { width: 100%; padding: 11px 12px; border: 1.5px solid var(--line); border-radius: 11px;
    font-size: 16px; background: #fffdf9; color: var(--text); }
  input.in:focus { outline: none; border-color: var(--accent); }
  input.amt { font-size: 20px; font-weight: 700; text-align: right; }
  #cats { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  #cats button { padding: 7px 12px; border-radius: 18px; font-size: .85rem; }
  #cats button.sel { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .daterow { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .daterow input { width: auto; flex: 1; padding: 8px 10px; font-size: 15px; }
  .go { width: 100%; padding: 15px; font-size: 1.05rem; font-weight: 800; color: #fff; border: none;
    background: linear-gradient(135deg, #f07a6e, #d9504c); border-radius: 14px; box-shadow: 0 3px 0 #b03f3c; }
  .go:active { transform: translateY(2px); box-shadow: 0 1px 0 #b03f3c; }
  .shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

  /* 合計・履歴 */
  .sums { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .sum { background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
  .sum .l { font-size: .7rem; color: var(--text2); font-weight: 700; }
  .sum .v { font-size: 1.15rem; font-weight: 800; margin-top: 2px; }
  #list { margin-top: 12px; }
  .day { font-size: .75rem; color: var(--text2); font-weight: 700; margin: 12px 4px 6px; display: flex; justify-content: space-between; }
  .ent { display: flex; align-items: center; gap: 8px; background: #fffdf8; border: 1px solid var(--line);
    border-radius: 6px; padding: 9px 10px; margin-bottom: 6px; font-family: ui-monospace, Menlo, monospace;
    transition: opacity .4s; }
  .ent .nm { flex: 1; min-width: 0; font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: -apple-system, "Hiragino Sans", sans-serif; }
  .ent .ct { font-size: .68rem; color: var(--text2); background: #f6ecdc; border-radius: 8px; padding: 1px 7px; margin-left: 4px; }
  .ent .am { font-weight: 700; }
  .ent .ex { font-size: .65rem; color: #4a9a6a; font-weight: 700; }
  .ent .del { padding: 4px 8px; font-size: .75rem; border-radius: 8px; color: #c55; }
  .ent.done { opacity: .55; }
  .ent.pending { opacity: 0; }
  .ent.flash { animation: flash 1s; }
  @keyframes flash { 0% { background: #ffe9a8; } 100% { background: #fffdf8; } }
  .empty { text-align: center; color: var(--text2); font-size: .85rem; padding: 18px 0; }

  /* 道具 */
  .tools { display: grid; gap: 8px; }
  .tools button { text-align: left; }
  .tools .main { background: #eaf5ee; border-color: #b9dcc6; font-weight: 700; }
  .toggles { display: flex; gap: 8px; }
  .toggles button { flex: 1; text-align: center; }
  .note { font-size: .72rem; color: var(--text2); line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">

<h1>🐾 にゃんこ財布</h1>

<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="loading" id="stage-loading">ねこを呼んでいます…</div>
    <div class="fb" id="fb">🐈‍⬛🧾</div>
    <div id="receipt"></div>
    <div class="hint">タップでスキップ</div>
    <div id="dbg"></div>
  </div>

  <form class="card" id="form" autocomplete="off">
    <div class="row2">
      <div><label class="f" for="f-name">品目</label><input class="in" id="f-name" placeholder="コーヒーなど（空ならジャンル名）"></div>
      <div><label class="f" for="f-amount">金額（円）</label><input class="in amt" id="f-amount" inputmode="numeric" placeholder="0"></div>
    </div>
    <div id="cats"></div>
    <div class="daterow"><label class="f" for="f-date" style="margin:0">日付</label><input class="in" type="date" id="f-date"></div>
    <button type="submit" class="go">🐱 レジに入れる</button>
  </form>

  <div class="sums">
    <div class="sum"><div class="l">今日の合計</div><div class="v" id="sum-today">¥0</div></div>
    <div class="sum"><div class="l">家計簿へ未書き出し</div><div class="v" id="sum-unexp">0件 ¥0</div></div>
  </div>

  <div id="list"></div>

  <div class="card tools">
    <button class="main" id="btn-export">📒 家計簿へ書き出し（未書き出し分）</button>
    <div class="note">書き出したファイルを家計簿の「データ管理 → 読み込み」で選ぶと、今月の出費に追記されます（上書きされません）。</div>
    <button id="btn-cats">🏷️ 家計簿のバックアップからジャンルを読み込む</button>
    <input type="file" id="cats-file" accept=".json" style="display:none">
    <div class="note" id="cats-note"></div>
    <button id="btn-clear">🧹 書き出し済みの記録を消す</button>
    <div class="toggles">
      <button id="tg-sound"></button>
      <button id="tg-anim"></button>
    </div>
  </div>
</div>

<div style="display:flex; gap:8px; margin-top:16px">
  <button onclick="exportData()">📤 バックアップ</button>
  <button onclick="document.getElementById('import-file').click()">📥 復元</button>
  <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
</div>

<div class="footer">ver <span id="app-ver"></span></div>
</div>

<script>
// ===== 基本設定 =====
const APP_NAME = 'saifu';               // エクスポートファイル名などに使用
const APP_KEY  = 'saifu_v1';            // localStorage のキー
const VER_FILE = 'saifu-ver.txt';       // 自動更新用のバージョンファイル名

// ===== AUTO UPDATE（kakeibo.html / hyoka.html と同パターン） =====
// auto-version.yml が push 時に APP_VERSION と VER_FILE を自動で書き換える。
// 手動でこの数字を変更しないこと。
const APP_VERSION = 1;
(function checkUpdate() {
  fetch(VER_FILE + '?t=' + Date.now(), { cache: 'no-store' })
    .then(function(r) { return r.ok ? r.text() : null; })
    .then(function(t) {
      var n = parseInt(t);
      if (n && n > APP_VERSION && sessionStorage.getItem(APP_KEY + '_vreload') !== String(n)) {
        sessionStorage.setItem(APP_KEY + '_vreload', String(n));
        location.replace(location.pathname + '?v=' + n);
      }
    })
    .catch(function() {});
})();
document.getElementById('app-ver').textContent = APP_VERSION;

// ===== localStorage 保存・読込 =====
function loadState() {
  try { return JSON.parse(localStorage.getItem(APP_KEY)) || {}; }
  catch (e) { return {}; }
}
function saveState(state) {
  localStorage.setItem(APP_KEY, JSON.stringify(state));
}

// ===== バックアップ（エクスポート／インポート） =====
// エクスポートしたJSONは非公開リポジトリ care-data-backup に保存する。
// このリポジトリにはコミットしないこと。
function exportData() {
  var blob = new Blob([JSON.stringify(loadState(), null, 1)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = APP_NAME + '_backup_' + todayIso() + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
}
function importData(ev) {
  var file = ev.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function() {
    try {
      var data = JSON.parse(reader.result);
      if (!data || !Array.isArray(data.entries)) {
        alert(data && data.app === 'saifu'
          ? 'これは家計簿へ渡す書き出しファイルです。家計簿の「読み込み」で使ってください。'
          : '財布のバックアップファイルではないようです。');
        return;
      }
      if (!confirm('現在のデータを取り込んだ内容で上書きします。よろしいですか？')) return;
      saveState(data);
      location.reload();
    } catch (e) { alert('読み込みに失敗しました: ' + e.message); }
  };
  reader.readAsText(file);
  ev.target.value = '';
}

// ===== 財布本体 =====
// 家計簿(kakeibo.html)の初期ジャンル。バックアップから読み込むと置き換わる
const DEFAULT_CATS = [
  { id: 1, name: '食費' }, { id: 2, name: '日用品' }, { id: 3, name: '交通費' },
  { id: 4, name: 'その他' }, { id: 5, name: 'ガソリン' },
];
const WDAY = ['日', '月', '火', '水', '木', '金', '土'];
const reduceMotion = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };

function normalize(s) {
  return {
    entries: Array.isArray(s.entries) ? s.entries : [],
    cats: Array.isArray(s.cats) && s.cats.length ? s.cats : DEFAULT_CATS.slice(),
    catsFrom: s.catsFrom || 'default',
    lastCat: s.lastCat,
    sound: s.sound !== false,
    anim: s.anim !== false,
  };
}
let state = normalize(loadState());
function save() {
  try { saveState(state); }
  catch (e) { alert('保存できませんでした（端末の保存領域を確認してください）: ' + e.message); }
}

function pad2(n) { return String(n).padStart(2, '0'); }
function todayIso() { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function isoToMD(iso) { const p = iso.split('-'); return (+p[1]) + '/' + (+p[2]); }
function yen(n) { return '¥' + Math.round(n).toLocaleString('ja-JP'); }
function newId() { return 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function toHalf(s) { return String(s).replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)); }
function catName(id) { const c = state.cats.find(c => c.id === id); return c ? c.name : '(不明)'; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

const $ = id => document.getElementById(id);
const nameIn = $('f-name'), amtIn = $('f-amount'), dateIn = $('f-date');
dateIn.value = todayIso();

let pendingReveal = null;   // 演出が終わるまで履歴で隠しておく記録
let flashId = null;

function renderCats() {
  if (!state.cats.some(c => c.id === state.lastCat)) state.lastCat = state.cats[0].id;
  $('cats').innerHTML = state.cats.map(c =>
    `<button type="button" data-id="${esc(c.id)}" class="${c.id === state.lastCat ? 'sel' : ''}">${esc(c.name)}</button>`).join('');
  $('cats-note').textContent = state.catsFrom === 'kakeibo'
    ? `ジャンルは家計簿のバックアップから読み込んだ ${state.cats.length}件です。`
    : 'ジャンルは家計簿の初期設定です。家計簿でジャンルを編集している場合は読み込んでください。';
}
$('cats').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const c = state.cats.find(c => String(c.id) === b.dataset.id); if (!c) return;
  state.lastCat = c.id; save(); renderCats();
});

function renderSums() {
  const t = todayIso();
  const today = state.entries.filter(e => e.iso === t).reduce((s, e) => s + e.amount, 0);
  const un = state.entries.filter(e => !e.exported);
  $('sum-today').textContent = yen(today);
  $('sum-unexp').textContent = un.length + '件 ' + yen(un.reduce((s, e) => s + e.amount, 0));
}

function renderList() {
  const list = state.entries.slice().sort((a, b) => a.iso < b.iso ? 1 : a.iso > b.iso ? -1 : (a.id < b.id ? 1 : -1));
  if (!list.length) { $('list').innerHTML = '<div class="empty">まだ記録はありません</div>'; return; }
  let html = '', cur = null;
  for (const e of list) {
    if (e.iso !== cur) {
      cur = e.iso;
      const d = new Date(cur + 'T00:00:00');
      const tot = list.filter(x => x.iso === cur).reduce((s, x) => s + x.amount, 0);
      html += `<div class="day"><span>${isoToMD(cur)}(${WDAY[d.getDay()]})</span><span>${yen(tot)}</span></div>`;
    }
    const cls = ['ent', e.exported ? 'done' : '', e.id === pendingReveal ? 'pending' : '', e.id === flashId ? 'flash' : ''].join(' ');
    html += `<div class="${cls}" data-id="${esc(e.id)}">
      <div class="nm">${esc(e.name)}<span class="ct">${esc(catName(e.catId))}</span></div>
      ${e.exported ? '<span class="ex">✓書出済</span>' : ''}
      <span class="am">${yen(e.amount)}</span>
      <button type="button" class="del" aria-label="削除">✕</button></div>`;
  }
  $('list').innerHTML = html;
}
$('list').addEventListener('click', e => {
  if (!e.target.classList.contains('del')) return;
  const id = e.target.closest('.ent').dataset.id;
  const ent = state.entries.find(x => x.id === id); if (!ent) return;
  if (!confirm(`「${ent.name} ${yen(ent.amount)}」を削除しますか？`)) return;
  state.entries = state.entries.filter(x => x.id !== id); save(); renderAll();
});

function renderToggles() {
  $('tg-sound').textContent = '音 ' + (state.sound ? 'ON' : 'OFF');
  $('tg-anim').textContent = 'アニメ ' + (state.anim ? 'ON' : 'OFF');
}
$('tg-sound').onclick = () => { state.sound = !state.sound; save(); renderToggles(); };
$('tg-anim').onclick = () => { state.anim = !state.anim; save(); renderToggles(); };

function renderAll() { renderCats(); renderSums(); renderList(); renderToggles(); }

function reveal(id) {
  if (pendingReveal !== id) return;
  pendingReveal = null; flashId = id; renderList(); flashId = null;
}

// ===== 効果音（Web Audio で合成。音源ファイルは使わない） =====
const sfx = (() => {
  let ac = null;
  function ctx() {
    if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }
    if (ac && ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(at, f, dur, vol, type) {
    const a = ctx(); if (!a) return;
    const t0 = a.currentTime + Math.max(0, at);
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.05);
  }
  function noise(at, dur, vol, freq, q) {
    const a = ctx(); if (!a) return;
    const t0 = a.currentTime + Math.max(0, at);
    const len = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q || 1; g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(a.destination); s.start(t0);
  }
  return {
    unlock: ctx,
    clink(at) { const f = 2300 + Math.random() * 700; tone(at, f, 0.18, 0.10); tone(at, f * 1.62, 0.09, 0.05); },
    swish(at) { noise(at, 0.12, 0.25, 2200, 0.8); },
    thunk(at) { noise(at, 0.09, 0.6, 320, 1.2); },
    chin(at) { tone(at, 1318.5, 1.4, 0.20); tone(at, 2637, 0.9, 0.07); tone(at, 3956, 0.5, 0.03); },
  };
})();
window.sfx = sfx;

// ===== 記録する =====
let lastPlayAt = 0;
$('form').addEventListener('submit', e => {
  e.preventDefault();
  const amount = parseInt(toHalf(amtIn.value).replace(/[^\d]/g, ''), 10);
  if (!(amount > 0) || amount > 9999999) {
    amtIn.classList.remove('shake'); void amtIn.offsetWidth; amtIn.classList.add('shake'); amtIn.focus();
    return;
  }
  const cid = state.lastCat != null ? state.lastCat : state.cats[0].id;
  const iso = dateIn.value || todayIso();
  const entry = { id: newId(), iso, date: isoToMD(iso), name: nameIn.value.trim() || catName(cid), amount, catId: cid, exported: false };
  // 先に保存してから演出を流す（演出の失敗で記録が消えないように）
  state.entries.push(entry); save();
  nameIn.value = ''; amtIn.value = ''; amtIn.blur(); nameIn.blur();
  pendingReveal = entry.id;
  renderAll();
  play(entry);
});

function play(entry) {
  const now = Date.now(), short = now - lastPlayAt < 10000;
  lastPlayAt = now;
  const motion = state.anim && !reduceMotion.matches;

    const mesh = makeMoney(kind); scene.add(mesh);
    const bill = isBill(kind);
    const ang = i * 2.39996, rad = bill ? 0.01 : 0.05 + 0.07 * Math.sqrt(i / 12);
    const tray = new THREE.Vector3(TRAY.x + Math.cos(ang) * rad, TRAY.y + 0.008 + i * 0.004, TRAY.z + Math.sin(ang) * rad * 0.7);
    let slot;
    if (bill) { slot = new THREE.Vector3(-0.12 + (billIdx % 3) * 0.12, -0.04 + billIdx * 0.006, -0.17); billIdx++; }
    else {
      const sx = COIN_SLOT_X[kind]; slotCount[sx] = (slotCount[sx] || 0) + 1;
      slot = new THREE.Vector3(sx + (R() - 0.5) * 0.04, -0.044 + slotCount[sx] * 0.009, 0.19 + (R() - 0.5) * 0.06);
    }
    const g = Math.floor(i * k / n), gi = i - Math.floor(g * n / k);
    const launch = T.swipe0 + d * (g + 0.6) + gi * 0.03;
    return { kind, bill, mesh, tray, slot, launch, land: launch + T.flight, appear: 0.03 + i * 0.02, rotY: R() * Math.PI, spin: 8 + R() * 8 };
  });
  const swipes = [];
  for (let g = 0; g < k; g++) {
    const own = pieces.filter((p, i) => Math.floor(i * k / n) === g);
    const c = new THREE.Vector3(); own.forEach(p => c.add(p.tray)); c.divideScalar(own.length || 1); c.y += 0.05;
    swipes.push({ t0: T.swipe0 + d * g, d, reach: c });
  }
  // 舞う紙幣・硬貨（金額が大きいほど多く、1万円以上は紙幣吹雪）
  const a = entry.amount;
  const N = a < 500 ? 6 : a < 5000 ? 14 : a < 10000 ? 22 : 40;
  const coinKinds = kinds.filter(x => !isBill(x)); if (!coinKinds.length) coinKinds.push(100, 500);
  const billKinds = a >= 10000 ? [10000, 10000, 5000, 1000] : a >= 1000 ? [1000] : [];
  const burst = [];
  for (let i = 0; i < N; i++) {
    const useBill = billKinds.length && (a >= 10000 ? R() < 0.6 : R() < 0.3);
    const kind = useBill ? billKinds[Math.floor(R() * billKinds.length)] : coinKinds[Math.floor(R() * coinKinds.length)];
    const mesh = makeMoney(kind); mesh.visible = false; scene.add(mesh);
    burst.push({ kind, bill: isBill(kind), mesh, delay: i * 0.012,
      o: new THREE.Vector3(reg.position.x + (R() - 0.5) * 0.4, TOP + 0.66, reg.position.z - 0.05 + (R() - 0.5) * 0.1),
      v: new THREE.Vector3((R() * 2 - 1) * 1.3, 2.0 + R() * 1.2, 0.3 + R() * 1.1),
      w1: (R() * 2 - 1) * 14, w2: (R() * 2 - 1) * 10, ph: R() * 6.28 });
  }
  receiptEl.innerHTML = `<div class="shop">NYAN MART</div><div style="text-align:center">${esc(entry.iso)}</div><div class="sep"></div>
    <div class="ln"><span>${esc(entry.name)}</span><span>${'¥' + entry.amount.toLocaleString('ja-JP')}</span></div>
    <div class="ln" style="color:#888"><span>${esc(catNm)}</span><span></span></div><div class="sep"></div>
    <div class="ln tot"><span>合計</span><span>${'¥' + entry.amount.toLocaleString('ja-JP')}</span></div>
    <div style="text-align:center;margin-top:4px">=^･ω･^= ありがとにゃ</div>`;
  const big = a >= 10000, food = catNm.indexOf('食') >= 0;
  return { entry, pieces, swipes, burst, big, food, startT: opts.short ? SHORT_START : 0, t0: performance.now(), resolve: null, sound: !!opts.sound };
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function scheduleSounds(p) {
  if (!p.sound || !window.sfx) return;
  const s = p.startT, at = x => x - s;
  p.pieces.forEach(pc => { if (pc.land >= s) (pc.bill ? window.sfx.swish : window.sfx.clink)(at(pc.land)); });
  window.sfx.thunk(at(T.close[1] - 0.04));
  window.sfx.chin(at(T.chin));
  for (let i = 0; i < 5; i++) window.sfx.clink(at(T.burst + 0.25 + i * 0.14));
  if (navigator.vibrate) setTimeout(() => navigator.vibrate(15), at(T.chin) * 1000);
}

// ---- 1コマ分の姿を決める ----
let lastDisplayed = 0;
function update(t, idle) {
  const c = cat;
  // 待機中の動き（呼吸・まばたき・しっぽ）
  c.body.scale.y = 1 + Math.sin(idle * 2.2) * 0.012;
  const blink = (idle % 3.7) < 0.12 ? 0.1 : 1;
  c.eyes.forEach(e => e.scale.set(1, blink, 1));
  c.pupils.forEach(p => p.scale.set(0.017, 0.038, 0.012));
  c.ears.forEach((e, i) => { e.rotation.x = 0; });
  c.tongue.visible = false;
  let wag = 0.15, wagF = 1.5;
  c.body.rotation.set(0, 0, 0);
  c.head.rotation.set(0, 0, 0);

  let drawerOpen = 0;
  if (t !== null && P) {
    drawerOpen = t < T.close[0] ? ease((t - T.open[0]) / (T.open[1] - T.open[0])) : 1 - ease((t - T.close[0]) / (T.close[1] - T.close[0]));
    // ネコパンチ（トレーの上へ手を伸ばし、レジへはじく）
    let w = 0, fw = 0, sw = null, u = 0;
    for (const s of P.swipes) if (t >= s.t0 && t < s.t0 + s.d) { sw = s; u = (t - s.t0) / s.d; }
    if (sw) {
      w = u < 0.45 ? ease(u / 0.45) : u < 0.6 ? 1 : 1 - ease((u - 0.6) / 0.4);
      fw = u < 0.45 ? 0 : u < 0.6 ? ease((u - 0.45) / 0.15) : 1 - ease((u - 0.6) / 0.4);
    }
    c.body.rotation.x = 0.26 * w;
    c.body.rotation.z = 0.12 * fw;
    c.head.rotation.y = -0.5 * w; c.head.rotation.x = 0.25 * w;
    c.root.updateMatrixWorld(true);
    if (sw) {
      const rest = restTarget(), flick = flickTarget();
      if (u < 0.45) tmpA.copy(rest).lerp(sw.reach, ease(u / 0.45));
      else if (u < 0.6) tmpA.copy(sw.reach).lerp(flick, ease((u - 0.45) / 0.15));
      else tmpA.copy(flick).lerp(rest, ease((u - 0.6) / 0.4));
      aimArm(c.arms[0], tmpA);
    } else { c.arms[0].quaternion.identity(); c.arms[0].scale.y = 1; }
    // 反応
    const rw = ease((t - T.react[0]) / 0.15) * (1 - ease((t - T.react[1] + 0.2) / 0.2));
    if (P.big) {
      c.eyes.forEach(e => e.scale.set(1 + 0.3 * rw, 1 + 0.3 * rw, 1));
      c.pupils.forEach(p => p.scale.set(0.017 * (1 + 0.5 * rw), 0.038 * (1 + 0.15 * rw), 0.012));
      c.ears.forEach(e => { e.rotation.x = -0.8 * rw; });
    } else {
      if (P.food && rw > 0.3) { c.tongue.visible = true; c.tongue.position.y = -0.095 - 0.01 * Math.abs(Math.sin(t * 14)); }
      if (!P.food && rw > 0) { wag = 0.15 + 0.45 * rw; wagF = 9; }
      const sq = ease((t - 2.3) / 0.1) * (1 - ease((t - 2.65) / 0.1));
      if (sq > 0) c.eyes.forEach(e => e.scale.set(1, 1 - 0.65 * sq, 1));
    }
  } else {
    c.arms[0].quaternion.identity(); c.arms[0].scale.y = 1;
  }
  c.tails.forEach((g, i) => { g.rotation.y = Math.sin((t !== null && wagF > 2 ? t : idle) * wagF + i * 0.6) * wag * (i + 1) / 3; });
  drawer.position.z = drawerOpen * DRAWER_TRAVEL;
  scene.updateMatrixWorld(true);

  if (t !== null && P) {
    // トレーのお金 → 引き出し
    for (const p of P.pieces) {
      const m = p.mesh;
      if (t < p.appear || t > T.close[1] + 0.02) { m.visible = false; continue; }
      m.visible = true;
      if (t < p.launch) {
        m.position.copy(p.tray); m.rotation.set(0, p.rotY, 0); m.scale.setScalar(Math.max(0.001, easeOutBack((t - p.appear) / 0.15)));
      } else {
        m.scale.setScalar(1);
        tmpB.copy(p.slot); drawer.localToWorld(tmpB);
        if (t < p.land) {
          const u = (t - p.launch) / T.flight;
          tmpC.copy(p.tray).add(tmpB).multiplyScalar(0.5); tmpC.y += 0.42;
          const a = (1 - u) * (1 - u), b = 2 * u * (1 - u), cc = u * u;
          m.position.set(p.tray.x * a + tmpC.x * b + tmpB.x * cc, p.tray.y * a + tmpC.y * b + tmpB.y * cc, p.tray.z * a + tmpC.z * b + tmpB.z * cc);
          if (p.bill) m.rotation.set(0, p.rotY + u * 1.5, Math.sin(u * Math.PI) * 0.6);
          else m.rotation.set(u * p.spin, p.rotY, u * 3);
        } else {
          m.position.copy(tmpB); m.rotation.set(0, p.rotY, 0);
        }
      }
    }
    // 舞い上がり
    let live = 0;
    for (const b of P.burst) {
      const lt = t - T.burst - b.delay, m = b.mesh;
      if (lt < 0 || lt > T.burstLen) { m.visible = false; continue; }
      m.visible = true; live++;
      if (b.bill) {
        const tau = 0.3, vt = 0.55, th = 0.6, e1 = 1 - Math.exp(-lt / tau), e2 = 1 - Math.exp(-lt / th);
        m.position.set(b.o.x + b.v.x * 0.7 * th * e2 + Math.sin(lt * 5 + b.ph) * 0.12,
          b.o.y + (b.v.y + vt) * tau * e1 - vt * lt,
          b.o.z + b.v.z * th * e2);
        m.rotation.set(Math.sin(lt * 6 + b.ph) * 0.8, b.ph + lt * 1.2, Math.cos(lt * 4.3 + b.ph) * 0.7);
      } else {
        m.position.set(b.o.x + b.v.x * lt, b.o.y + b.v.y * lt - 3 * lt * lt, b.o.z + b.v.z * lt);
        m.rotation.set(b.w1 * lt, 0, b.w2 * lt);
      }
    }
    P.live = live;
    // 表示窓のカウントアップ
    if (t < T.count[0]) drawDisplay(lastDisplayed);
    else drawDisplay(P.entry.amount * ease((t - T.count[0]) / (T.count[1] - T.count[0])));
    // レシート（印字 → 履歴へ）
    if (t < T.print[0]) receiptEl.style.display = 'none';
    else {
      const pr = ease((t - T.print[0]) / (T.print[1] - T.print[0])), mv = ease((t - T.move[0]) / (T.move[1] - T.move[0]));
      receiptEl.style.display = 'block';
      receiptEl.style.clipPath = `inset(${(1 - pr) * 100}% 0 0 0)`;
      receiptEl.style.transform = `translateY(${mv * 140}px) scale(${1 - 0.35 * mv})`;
      receiptEl.style.opacity = String(1 - mv);
    }
  }
}

function clearPlay() {
  if (!P) return;
  for (const p of P.pieces) scene.remove(p.mesh);
  for (const b of P.burst) scene.remove(b.mesh);
  receiptEl.style.display = 'none';
  lastDisplayed = P.entry.amount; drawDisplay(lastDisplayed);
  stageEl.classList.remove('playing');
  const r = P.resolve; P = null;
  if (r) r();
}

// ---- 描画ループ ----
let last = performance.now(), idleAcc = 0, frames = 0, fpsT = last, fps = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!P) { idleAcc += dt; if (idleAcc < 1 / 30) return; idleAcc = 0; }   // 待機中は30fpsに抑える
  let t = null;
  if (P) {
    t = FREEZE !== null ? FREEZE : P.startT + (now - P.t0) / 1000;
    if (FREEZE === null && t >= T.end) { clearPlay(); t = null; }
  }
  update(t, FREEZE !== null ? 1 : now / 1000);
  renderer.render(scene, camera);
  frames++;
  if (DEBUG && now - fpsT > 500) {
    fps = frames * 1000 / (now - fpsT); frames = 0; fpsT = now;
    dbgEl.textContent = `fps ${fps.toFixed(0)}\nparticles ${P ? (P.live || 0) + P.pieces.length : 0}\nt ${t === null ? '-' : t.toFixed(2)}`;
  }
}

function play(entry, catNm, opts) {
  if (P) clearPlay();
  P = buildPlay(entry, catNm, opts || {});
  stageEl.classList.add('playing');
  scheduleSounds(P);
  return new Promise(r => { P.resolve = r; });
}

window.saifuStage = {
  ok: true,
  play,
  skip() { if (P && FREEZE === null) clearPlay(); },
  setDisplay(v) { lastDisplayed = v; drawDisplay(v); },
  // 確認用: requestAnimationFrame を使わずに t の瞬間を描く
  renderAt(t) { update(t, 1); renderer.render(scene, camera); return canvas.toDataURL('image/png'); },
};
document.getElementById('stage-loading').style.display = 'none';

if (FREEZE !== null) {
  const app = window.saifuApp, st = app ? app.getState() : null;
  const lastE = st && st.entries.length ? st.entries[st.entries.length - 1] : null;
  const entry = lastE || { id: 'sample', iso: '2026-11-06', name: 'ねこ缶', amount: 1280, catId: 1 };
  P = buildPlay(entry, app ? app.catName(entry.catId) : '食費', { short: false, sound: false });
  stageEl.classList.add('playing');
}
update(FREEZE, 1); renderer.render(scene, camera);
requestAnimationFrame(frame);
}
</script>
