    .modal{position:fixed;z-index:30;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:12px;background:rgba(1,6,15,.68);backdrop-filter:blur(8px);animation:fade .17s ease both}.modal-shell{position:relative;width:min(100%,600px)}.backdrop{position:fixed;inset:0;width:100%;height:100%;background:transparent}.modal-card{position:relative;max-height:calc(100vh - 24px);overflow:auto;padding:17px;border:1px solid rgba(219,241,235,.17);border-radius:24px;background:#112038;box-shadow:0 20px 70px rgba(0,0,0,.55);animation:rise .26s var(--ease) both}.modal-head{gap:10px;margin-bottom:17px}.modal-icon{display:grid;width:34px;height:34px;place-items:center;border-radius:11px;color:#1a2b18;background:var(--lime)}.modal-head>div{flex:1}.modal-head h2{margin:2px 0 0;color:#edf7ee;font-size:17px}.modal-head>button{display:grid;width:31px;height:31px;place-items:center;border-radius:50%;color:#b4c5c6;background:rgba(255,255,255,.06)}.form{display:grid;gap:12px}.form label{display:grid;gap:5px;color:#afc0c0;font-size:10px}.form input,.form select,.form textarea{width:100%;border:1px solid rgba(220,240,238,.13);border-radius:11px;outline:0;color:#e8f2ec;background:rgba(3,11,24,.48);font-size:12px}.form input,.form select{height:41px;padding:0 10px}.form textarea{resize:vertical;padding:9px 10px}.split{align-items:flex-start;gap:9px}.split label{flex:1}.submit{display:flex;align-items:center;justify-content:center;gap:7px;min-height:44px;margin-top:2px;border-radius:12px;color:#142515;background:var(--lime);font-size:12px;font-weight:700}.help{margin:-3px 0 3px;color:#9bb1b4;font-size:10px;line-height:1.65}.optional{color:#799299;font-size:8px}
    .particle-field{position:absolute;z-index:3;inset:0;pointer-events:none}.particle{position:absolute;left:var(--px);top:var(--py);width:var(--ps);height:var(--ps);border-radius:50%;background:var(--pc);box-shadow:0 0 10px var(--pc);opacity:.35;animation:drift 6s var(--pd) ease-in-out infinite alternate}.refraction{position:absolute;z-index:5;left:var(--tx);top:var(--ty);width:184px;height:184px;border:1px solid rgba(166,245,247,.22);border-radius:47% 53% 57% 43%/48% 46% 54% 52%;pointer-events:none;opacity:.22;background:conic-gradient(from 20deg,rgba(100,217,225,.02),rgba(201,255,115,.2),rgba(100,217,225,.04),rgba(182,166,255,.14),rgba(100,217,225,.02));box-shadow:0 0 0 22px rgba(100,217,225,.03),0 0 0 46px rgba(100,217,225,.015),inset 0 0 26px rgba(179,248,245,.15);transform:translate(-50%,-50%) rotate(18deg) scale(.62)}.burst{position:absolute;z-index:6;left:var(--tx);top:var(--ty);width:14px;height:14px;pointer-events:none;opacity:0;transform:translate(-50%,-50%)}.burst:before,.burst:after{content:"";position:absolute;inset:0;border:1px solid rgba(207,255,149,.72);border-radius:50%;box-shadow:0 0 17px rgba(201,255,115,.45)}.stir .refraction{opacity:1;animation:refract .95s cubic-bezier(.16,1,.3,1) both}.stir .burst{opacity:1}.stir .burst:before{animation:ripple .9s cubic-bezier(.16,1,.3,1) both}.stir .relations{animation:wobble .92s cubic-bezier(.16,1,.3,1) both}.stir .beacon{animation:jolt .84s var(--delay) cubic-bezier(.16,1,.3,1) both}.stir .self{animation:selfjolt .84s cubic-bezier(.16,1,.3,1) both}.stir .particle{animation:surge 1.02s var(--pd) cubic-bezier(.16,1,.3,1) both}
    @keyframes enter{from{opacity:0;transform:translate(-50%,-47%) scale(.95)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}@keyframes float{to{margin-top:2px}}@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes view{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes scan{50%{transform:scale(1.18) rotate(14deg);opacity:.37}}@keyframes drift{to{transform:translate(7px,-9px) scale(1.18);opacity:.52}}@keyframes refract{26%{transform:translate(-50%,-50%) rotate(62deg) rotateX(28deg) scale(1.22,.76)}54%{transform:translate(-50%,-50%) rotate(122deg) rotateX(-17deg) scale(.92,1.14)}100%{transform:translate(-50%,-50%) rotate(196deg) scale(.92);opacity:.42}}@keyframes ripple{to{transform:scale(12);opacity:0}}@keyframes wobble{34%{transform:rotate(1.55deg) scale(1.018,.984)}63%{transform:rotate(-.9deg) scale(.994,1.01)}}@keyframes jolt{23%{transform:translate(-46%,-56%) rotate(7deg) scale(1.085)}49%{transform:translate(-55%,-47%) rotate(-6deg) scale(.985)}73%{transform:translate(-48%,-52%) rotate(2deg) scale(1.025)}}@keyframes selfjolt{30%{transform:translate(-50%,-55%) scale(1.11)}60%{transform:translate(-50%,-48%) scale(.985)}}@keyframes surge{28%{transform:translate(14px,-21px) scale(2.1);opacity:1}62%{transform:translate(-7px,8px) scale(.75);opacity:.66}}
    @media(min-width:700px){.shell{padding-top:28px}.map{min-height:470px}.dock{bottom:20px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

<body>
  <div id="app"></div>
  <script>
  (() => {
    "use strict";
    const STORE="social-orbit-single-file-v1";
    const ASSET={orbital:"https://files.manuscdn.com/user_upload_by_module/session_file/310519663652899079/QnEXXKJDMXAVoGbV.jpg",thought:"https://files.manuscdn.com/user_upload_by_module/session_file/310519663652899079/RQGUjYuHBlgBUifS.jpg",event:"https://files.manuscdn.com/user_upload_by_module/session_file/310519663652899079/GkLyvIJmthzHEhGC.jpg",symbol:"https://files.manuscdn.com/user_upload_by_module/session_file/310519663652899079/ktEhSTAOrArgHgMD.png"};
    const COLORS={cyan:"#64d9e1",lime:"#c9ff73",coral:"#ff9b84",violet:"#b6a6ff",amber:"#f5c26b"};
    const COLOR_LABEL={cyan:"シアン",lime:"ライム",coral:"コーラル",violet:"ヴァイオレット",amber:"アンバー"};
    const THEMES={halo:["ハロー","静かな同心光"],signal:["シグナル","断続する観測波"],comet:["コメット","伸びる余韻"],prism:["プリズム","屈折する輪郭"]};
    const PARTICLES=[["8%","17%","3px","#9eecef","0ms"],["17%","72%","5px","#ecfaf8","120ms"],["29%","24%","2px","#e2ffb3","240ms"],["39%","87%","4px","#d0c6ff","360ms"],["58%","16%","5px","#9eecef","480ms"],["74%","56%","3px","#ffc2b1","600ms"],["89%","23%","2px","#ecfaf8","720ms"],["93%","81%","5px","#9eecef","840ms"]];
    const PATHS=["M46 53 C 55 31,64 26,76 24","M46 53 C 35 42,27 40,18 39","M46 53 C 53 64,65 70,70 70","M46 53 C 39 66,37 74,33 78"];
    const seedPeople=[
      {id:"mio",name:"美緒 佐原",handle:"@mio_s",role:"プロダクトデザイナー",initials:"MS",accent:"cyan",orbitTheme:"halo",relationship:"親しい",lastInteraction:"昨日 21:40",connection:"共通の関心：展示・プロダクト",eventTitle:"展示の感想を返す",nextEvent:"2026-08-19",x:"76%",y:"24%",signals:[['発言','最近は“手で触れたくなるUI”を考えている'],['関心','建築展、触覚、静かなカフェ'],['仮説','感想を具体的に返すと会話が続きそう']]},
      {id:"ren",name:"蓮 木島",handle:"@ren_kj",role:"編集者",initials:"RK",accent:"cyan",orbitTheme:"signal",relationship:"育てる",lastInteraction:"3日前",connection:"共通の文脈：言葉と企画",eventTitle:"新しい企画の近況を聞く",nextEvent:"2026-08-21",x:"18%",y:"39%",signals:[['発言','余白のあるローカルメディアを作りたい'],['関心','小さな出版、街の声'],['仮説','記事の参考を一つ送るのが自然']]},
      {id:"sana",name:"沙奈 大森",handle:"@sana_om",role:"コミュニティ運営",initials:"SO",accent:"coral",orbitTheme:"comet",relationship:"仕事",lastInteraction:"8月10日",connection:"接点：コミュニティイベント",eventTitle:"秋の集まりの候補日確認",nextEvent:"2026-08-18",x:"70%",y:"70%",signals:[['発言','少人数で深く話せる会を増やしたい'],['関心','場づくり、対話の設計'],['仮説','候補日を2つに絞ると進めやすい']]},
      {id:"yuto",name:"優斗 山岸",handle:"@yuto_y",role:"映像作家",initials:"YY",accent:"violet",orbitTheme:"prism",relationship:"新しい",lastInteraction:"8月6日",connection:"接点：短編映画の上映会",eventTitle:"公開された短編を見る",nextEvent:"2026-08-24",x:"33%",y:"78%",signals:[['発言','音を残した映像を試している'],['関心','環境音、夜の散歩'],['仮説','視聴後の一言は負担になりにくい']]}
    ];
    const seedEvents=[{id:"event-sana",personId:"sana",title:"候補日を確認する",date:"2026-08-18",note:"秋の小さな集まり。候補は金曜夜と日曜午後。",category:"確認"},{id:"event-mio",personId:"mio",title:"展示の感想を返す",date:"2026-08-19",note:"触覚的なUIの話に触れて、展示で印象に残った一点を送る。",category:"連絡"},{id:"event-ren",personId:"ren",title:"企画の近況を聞く",date:"2026-08-21",note:"記事の参考を一つ添えて、返信しやすい一問にする。",category:"連絡"},{id:"event-yuto",personId:"yuto",title:"短編の視聴メモを残す",date:"2026-08-24",note:"音の使い方で印象に残った箇所をひとつ伝える。",category:"確認"}];
    const stored=load();
    const state={people:stored?.people?.length?stored.people:seedPeople,events:stored?.events?.length?stored.events:seedEvents,view:"orbit",selectedId:"mio",modal:null,linkTarget:null,query:"",notice:stored?"前回の観測データを復元しました":"端末内に保存されています",touch:{x:50,y:50},returnId:null};
    function load(){try{return JSON.parse(localStorage.getItem(STORE)||"")}catch{return null}}
    function persist(){localStorage.setItem(STORE,JSON.stringify({people:state.people,events:state.events}))}
    function esc(v){return String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[c]))}
    function icon(name,cls=""){return `<i data-lucide="${name}" class="${cls}"></i>`}
    function person(id){return state.people.find(p=>p.id===id)}
    function theme(p){return THEMES[p?.orbitTheme]||THEMES.halo}
    function color(p){return COLORS[p?.accent]||COLORS.cyan}
    function initials(name){return name.trim().split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase()||"NEW"}
    function normalizeUrl(v){if(!v.trim())return"";try{const u=new URL(/^https?:\/\//i.test(v.trim())?v.trim():"https://"+v.trim());return /^https?:$/.test(u.protocol)?u.href:null}catch{return null}}
    function host(v){try{return new URL(v).hostname.replace(/^www\./,"")}catch{return"保存済みリンク"}}
    function dateLabel(v){return new Intl.DateTimeFormat("ja-JP",{month:"short",day:"numeric",weekday:"short"}).format(new Date(v+"T12:00:00"))}
    function days(v){const d=Math.ceil((new Date(v+"T12:00:00")-new Date(new Date().toDateString()))/864e5);return d<0?"期日を再確認":d===0?"今日":d===1?"明日":d+"日後"}
    function cssVars(p){return `--c:${color(p)};--x:${p.x};--y:${p.y};--delay:${state.people.indexOf(p)*75}ms`}
    function render(){
      const p=person(state.selectedId), events=[...state.events].sort((a,b)=>a.date.localeCompare(b.date)), priority=events.slice(0,3), returning=person(state.returnId);
      document.getElementById("app").innerHTML=`<main class="app"><div class="noise"></div><div class="shell">
        <header class="top"><div class="brand"><img src="${ASSET.symbol}" alt=""/><div><p class="micro">PERSONAL RELATIONSHIP FIELD</p><h1>SOCIAL ORBIT</h1></div></div><button class="round notify" data-action="notice" aria-label="通知を確認する">${icon('bell-ring')}<b class="count">${priority.length}</b></button></header>
        <section class="intro"><div><p class="micro">TODAY'S FIELD NOTE <i class="dot"></i></p><h2>近づくべき軌道が、<br><em>${priority.length}件</em>あります。</h2></div><button class="quiet" data-view="agenda">すべて見る ${icon('chevron-right')}</button></section>
        <div class="status"><i></i><span>${esc(state.notice)}</span></div>
        ${returning?returnCard(returning):""}
        ${state.view==="orbit"?orbitView(p):state.view==="agenda"?agendaView(events,priority):peopleView()}
        ${p?detailPanel(p):""}
        <nav class="dock"><button class="${state.view==='orbit'?'active':''}" data-view="orbit">${icon('orbit')}<span>軌道</span></button><button class="${state.view==='agenda'?'active':''}" data-view="agenda">${icon('calendar-days')}<span>出来事</span><b class="badge">${priority.length}</b></button><button class="add-float" data-action="open-person" aria-label="人物を追加">${icon('plus')}</button><button class="${state.view==='people'?'active':''}" data-view="people">${icon('users-round')}<span>人物</span></button><button data-action="settings">${icon('circle-dot')}<span>設定</span></button></nav>
      </div>${state.modal?modal():""}</main>`;
      if(window.lucide)window.lucide.createIcons({attrs:{"stroke-width":"1.7"}});
    }
    function returnCard(p){return `<section class="return-bridge"><div class="return-orb" style="color:${color(p)}">${esc(p.initials)}</div><div class="return-copy"><p>BACK IN ORBIT</p><strong>${esc(p.name)}さんを見たあと</strong><span>何も残さなくて大丈夫です。気づきがあれば一言だけ。</span></div><div class="return-actions"><button data-action="mark-return">見た</button><button class="capture" data-action="capture-return">記録</button></div></section>`}
    function orbitView(p){return `<section class="screen"><div class="map-head"><div><p class="kicker">${icon('orbit')} RELATIONSHIP ORBITS</p><h3>関係性の観測図</h3></div><div class="legend"><span><i class="line"></i>つながり</span><span><i class="signal"></i>次の出来事</span></div></div><div class="map" id="orbit-map" style="--tx:${state.touch.x}%;--ty:${state.touch.y}%;background-image:linear-gradient(180deg,rgba(4,11,25,.2),rgba(4,11,25,.94)),url(${ASSET.orbital})"><i class="refraction"></i><i class="burst"></i><div class="particle-field">${PARTICLES.map(a=>`<i class="particle" style="--px:${a[0]};--py:${a[1]};--ps:${a[2]};--pc:${a[3]};--pd:${a[4]}"></i>`).join("")}</div><svg class="relations" viewBox="0 0 100 100" preserveAspectRatio="none">${state.people.slice(0,4).map((x,i)=>`<path class="connection ${x.orbitTheme==='signal'?'signal-theme':x.orbitTheme==='comet'?'comet-theme':x.orbitTheme==='prism'?'prism-theme':''}" style="--line:${color(x)}" d="${PATHS[i]}"></path>`).join("")}<path d="M-8 60 C 23 18,64 15,108 35" class="sweep"></path><ellipse class="outer" cx="46" cy="53" rx="50" ry="40"></ellipse><ellipse class="inner" cx="46" cy="53" rx="29" ry="23"></ellipse></svg><div class="self"><div class="self-core">${icon('compass')}<span>私</span></div><p>MY FIELD</p></div>${state.people.map(x=>`<button class="beacon ${x.id===state.selectedId?'selected':''} ${x.orbitTheme==='signal'?'signal-theme':x.orbitTheme==='comet'?'comet-theme':x.orbitTheme==='prism'?'prism-theme':'halo'}" data-person="${esc(x.id)}" style="${cssVars(x)}" aria-label="${esc(x.name)}さんを選択"><i class="beacon-orbit"></i><i class="core">${esc(x.initials)}</i><i class="beacon-status"></i><span class="beacon-label"><strong>${esc(x.name.split(' ')[0])}</strong><small>${esc(x.relationship)}</small></span></button>`).join("")}${p?`<div class="map-signal" style="left:${p.x};top:calc(${p.y} - 46px)">${icon('sparkles')} ${esc((p.signals[1]?.[1]||"観測中").slice(0,14))}</div>`:""}</div>${p?`<button class="focus" data-person="${esc(p.id)}"><i class="avatar" style="color:${color(p)}">${esc(p.initials)}</i><span class="focus-copy"><p>FOCUS ON</p><strong>${esc(p.name)}</strong><span>${esc(p.connection)}</span></span>${icon('chevron-right')}</button>`:""}</section>`}
    function agendaView(events,priority){return `<section class="screen"><div class="heading"><div><p class="kicker">${icon('calendar-days')} UPCOMING MOMENTS</p><h3>見逃さない出来事</h3></div><button class="add-text" data-action="open-event">${icon('plus')}追加</button></div><div class="agenda-card" style="background-image:linear-gradient(90deg,rgba(6,13,28,.18),rgba(6,13,28,.72)),url(${ASSET.event})"><span>NEAREST SIGNAL</span><strong>${priority[0]?days(priority[0].date):"—"}</strong><p>${esc(priority[0]?.title||"次の出来事を追加")}</p></div><div class="list">${events.map(e=>{const p=person(e.personId);return `<button class="event" data-person="${esc(e.personId)}"><i class="date" style="color:${color(p)}"><small>${dateLabel(e.date).split('月')[0]}月</small><strong>${(dateLabel(e.date).match(/\d+/)||[''])[0]}</strong></i><span class="event-copy"><p><b class="chip chip-${esc(e.category)}">${esc(e.category)}</b> ${days(e.date)}</p><strong>${esc(e.title)}</strong><span>${esc(p?.name||"未登録の人物")} · ${esc(e.note)}</span></span>${icon('chevron-right')}</button>`}).join("")}</div></section>`}
    function peopleView(){const q=state.query.toLowerCase(),rows=state.people.filter(p=>(p.name+p.handle+p.role).toLowerCase().includes(q));return `<section class="screen"><div class="heading"><div><p class="kicker">${icon('users-round')} PEOPLE IN FIELD</p><h3>人物の観測リスト</h3></div><button class="add-text" data-action="open-person">${icon('plus')}人物</button></div><label class="search">${icon('search')}<input id="search" value="${esc(state.query)}" placeholder="名前、肩書き、IDで探す"><span>${rows.length}</span></label><div class="list">${rows.map(p=>`<button class="person-row" data-person="${esc(p.id)}"><i class="avatar" style="color:${color(p)}">${esc(p.initials)}</i><span class="person-copy"><strong>${esc(p.name)}</strong><small>${esc(p.role)} · ${esc(p.relationship)}</small><em>${icon('clock-3')} ${esc(p.lastInteraction)}</em></span><span class="row-event">${days(p.nextEvent)}${icon('chevron-right')}</span></button>`).join("")}</div></section>`}
    function detailPanel(p){const t=theme(p);return `<aside class="panel" style="--c:${color(p)}"><div class="grip"></div><div class="panel-head"><div class="detail-orb"><span>${esc(p.initials)}</span><i></i></div><div class="name"><p class="kicker">SELECTED BEACON</p><h3>${esc(p.name)}</h3><span>${esc(p.handle)} · ${esc(p.role)}</span></div><button class="round close" data-action="close-person">${icon('x')}</button></div><div class="meta"><span>${icon('heart-handshake')} ${esc(p.relationship)}</span><span>${icon('message-circle-more')} ${esc(p.lastInteraction)}</span><span>${icon('link-2')} ${esc(p.connection)}</span></div><section class="theme-box"><div class="theme-head"><div><p>ORBIT SIGNATURE</p><strong>${t[0]}<span>${t[1]}</span></strong></div><i class="theme-glyph"></i></div><div class="themes">${Object.entries(THEMES).map(([key,v])=>`<button class="theme-btn ${p.orbitTheme===key?'active':''}" data-theme="${key}" data-id="${esc(p.id)}"><i></i><b>${v[0]}</b></button>`).join("")}</div><div class="colors">${Object.keys(COLORS).map(c=>`<button class="color ${p.accent===c?'active':''}" data-color="${c}" data-id="${esc(p.id)}" style="--c:${COLORS[c]}" aria-label="${COLOR_LABEL[c]}に変更"><i></i></button>`).join("")}</div></section><div class="social-row"><div><p>SOCIAL LINK</p><strong>${p.socialUrl?esc(host(p.socialUrl)):"まだリンクはありません"}</strong></div><div class="social-actions"><button class="${p.socialUrl?'social-open':'social-add'}" data-action="social" data-id="${esc(p.id)}">${p.socialUrl?'SNSを開く '+icon('arrow-up-right'):icon('link-2')+'リンクを貼る'}</button>${p.socialUrl?`<button class="social-edit" data-action="link-edit" data-id="${esc(p.id)}">編集</button>`:""}</div></div><div class="next"><div><p>NEXT MOMENT</p><strong>${esc(p.eventTitle)}</strong><span>${icon('calendar-days')} ${dateLabel(p.nextEvent)} · ${days(p.nextEvent)}</span></div><button data-action="open-event">${icon('plus')}</button></div><div class="thought" style="background-image:linear-gradient(90deg,rgba(8,15,31,.86),rgba(8,15,31,.44)),url(${ASSET.thought})"><div class="thought-head"><span>${icon('sparkles')} THOUGHT SIGNALS</span><p>事実・興味・仮説を分けて記録</p></div><div class="signals">${p.signals.slice(-4).map(s=>`<div class="sig"><b class="${esc(s[0])}">${esc(s[0])}</b><p>${esc(s[1])}</p></div>`).join("")}</div></div><form class="note-form" data-form="note"><label>仮説・気づきを追加</label><div><input name="note" placeholder="例：次は音の話から聞いてみる"><button>${icon('send')}</button></div></form></aside>`}
    function modal(){if(state.modal==='person')return `<div class="modal"><button class="backdrop" data-action="close-modal"></button><section class="modal-shell"><div class="modal-card"><div class="modal-head"><i class="modal-icon">${icon('users-round')}</i><div><p class="kicker">NEW BEACON</p><h2>人物を軌道に置く</h2></div><button data-action="close-modal">${icon('x')}</button></div><form class="form" data-form="person"><label>名前<input name="name" required autofocus placeholder="例：山田 花子"></label><label>SNS ID または呼び名<input name="handle" placeholder="例：@hanako"></label><label>SNSリンク <small class="optional">任意</small><input name="socialUrl" inputmode="url" placeholder="https://instagram.com/…"></label><label>肩書き・接点<input name="role" placeholder="例：ライター / 読書会で知り合う"></label><div class="split"><label>色<select name="accent">${Object.entries(COLOR_LABEL).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label><label>軌道テーマ<select name="orbitTheme">${Object.entries(THEMES).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('')}</select></label></div><label>関係性<select name="relationship"><option>新しい</option><option>育てる</option><option>親しい</option><option>仕事</option></select></label><button class="submit">${icon('plus')}この人を追加する</button></form></div></section></div>`;
      if(state.modal==='event')return `<div class="modal"><button class="backdrop" data-action="close-modal"></button><section class="modal-shell"><div class="modal-card"><div class="modal-head"><i class="modal-icon">${icon('calendar-days')}</i><div><p class="kicker">NEXT MOMENT</p><h2>出来事を見逃さない</h2></div><button data-action="close-modal">${icon('x')}</button></div><form class="form" data-form="event"><label>相手<select name="personId">${state.people.map(p=>`<option value="${esc(p.id)}" ${p.id===state.selectedId?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><label>行動・出来事<input name="title" required placeholder="例：公開記事の感想を送る"></label><div class="split"><label>日付<input name="date" type="date" required value="2026-08-25"></label><label>種類<select name="category"><option>連絡</option><option>会う</option><option>確認</option></select></label></div><label>自分用メモ<textarea name="note" rows="3" placeholder="何を、どのように伝えたいか"></textarea></label><button class="submit">${icon('check')}出来事を保存する</button></form></div></section></div>`;
      const p=person(state.linkTarget);return `<div class="modal"><button class="backdrop" data-action="close-modal"></button><section class="modal-shell"><div class="modal-card"><div class="modal-head"><i class="modal-icon">${icon('link-2')}</i><div><p class="kicker">SOCIAL LINK</p><h2>SNSリンクをつなぐ</h2></div><button data-action="close-modal">${icon('x')}</button></div><form class="form" data-form="link"><p class="help">リンクはこの端末だけに保存します。開く時は別タブを使うため、Social Orbitの記録画面へ戻れます。</p><label>SNSプロフィール・投稿のURL<input name="socialUrl" inputmode="url" autofocus value="${esc(p?.socialUrl||'')}" placeholder="https://instagram.com/…"></label><button class="submit">${icon('link-2')}リンクを保存する</button></form></div></section></div>`}
    function save(){persist();render()}
    document.addEventListener('click',e=>{const el=e.target.closest('[data-action],[data-view],[data-person],[data-theme],[data-color]');if(!el)return;if(el.dataset.view){state.view=el.dataset.view;render();return}if(el.dataset.person){state.selectedId=el.dataset.person;state.view='orbit';render();return}if(el.dataset.theme){const p=person(el.dataset.id);if(p){p.orbitTheme=el.dataset.theme;state.notice=`${p.name}さんの軌道を${COLOR_LABEL[p.accent]}・${THEMES[p.orbitTheme][0]}に設定しました`;save()}return}if(el.dataset.color){const p=person(el.dataset.id);if(p){p.accent=el.dataset.color;state.notice=`${p.name}さんの軌道を${COLOR_LABEL[p.accent]}・${THEMES[p.orbitTheme][0]}に設定しました`;save()}return}const a=el.dataset.action;if(a==='notice')state.notice='期限が近い出来事を 3 件表示しています';if(a==='settings')state.notice='この端末のローカル保存のみを利用しています';if(a==='open-person')state.modal='person';if(a==='open-event')state.modal='event';if(a==='close-modal')state.modal=null;if(a==='close-person')state.selectedId=null;if(a==='link-edit'){state.linkTarget=el.dataset.id;state.modal='link'}if(a==='social'){const p=person(el.dataset.id);if(!p.socialUrl){state.linkTarget=p.id;state.modal='link'}else{sessionStorage.setItem('social-orbit-return',p.id);state.returnId=p.id;state.notice=`${p.name}さんのSNSを開きました。戻ったら観測を残せます`;window.open(p.socialUrl,'_blank','noopener,noreferrer')}}if(a==='mark-return'){const p=person(state.returnId);if(p){p.lastInteraction='今日 SNSを確認';state.notice=`${p.name}さんのSNSを確認済みにしました`;sessionStorage.removeItem('social-orbit-return');state.returnId=null;persist()}}if(a==='capture-return'){state.selectedId=state.returnId;state.view='orbit';state.notice=`${person(state.returnId)?.name||''}さんの小さな変化を記録してください`;sessionStorage.removeItem('social-orbit-return');state.returnId=null}render()});
    document.addEventListener('input',e=>{if(e.target.id==='search'){state.query=e.target.value;render()}});
    document.addEventListener('submit',e=>{const f=e.target;if(!(f instanceof HTMLFormElement))return;e.preventDefault();const d=new FormData(f);if(f.dataset.form==='note'){const p=person(state.selectedId),v=String(d.get('note')||'').trim();if(p&&v){p.signals.push(['仮説',v]);state.notice=`${p.name}さんの観測メモを保存しました`;save()}return}if(f.dataset.form==='link'){const p=person(state.linkTarget),url=normalizeUrl(String(d.get('socialUrl')||''));if(!p||url===null){state.notice='有効なSNSリンクを入力してください';render();return}p.socialUrl=url||undefined;state.notice=url?`${p.name}さんのSNSリンクを保存しました`:`${p.name}さんのSNSリンクを外しました`;state.modal=null;state.linkTarget=null;save();return}if(f.dataset.form==='person'){const name=String(d.get('name')||'').trim(),url=normalizeUrl(String(d.get('socialUrl')||''));if(!name||url===null){state.notice='名前と有効なSNSリンクを確認してください';render();return}const n=state.people.length,p={id:'p-'+Date.now(),name,handle:String(d.get('handle')||'@handle').trim()||'@handle',role:String(d.get('role')||'記録を追加してください').trim()||'記録を追加してください',initials:initials(name),accent:String(d.get('accent')||'cyan'),orbitTheme:String(d.get('orbitTheme')||'halo'),relationship:String(d.get('relationship')||'新しい'),lastInteraction:'まだ記録がありません',connection:'接点を記録してください',eventTitle:'次のきっかけを追加',nextEvent:'2026-08-31',x:`${18+(n*19)%58}%`,y:`${22+(n*23)%59}%`,socialUrl:url||undefined,signals:[['仮説','最初の観測メモを追加してください']]};state.people.push(p);state.selectedId=p.id;state.modal=null;state.notice=`${p.name}さんを軌道に追加しました`;save();return}if(f.dataset.form==='event'){const id=String(d.get('personId')||''),title=String(d.get('title')||'').trim(),date=String(d.get('date')||''),p=person(id);if(!p||!title||!date)return;state.events.push({id:'e-'+Date.now(),personId:id,title,date,category:String(d.get('category')||'連絡'),note:String(d.get('note')||'').trim()||'詳細はまだ記録されていません。'});p.nextEvent=date;p.eventTitle=title;state.modal=null;state.notice=`${p.name}さんの出来事を追加しました`;save()}});
    document.addEventListener('pointerdown',e=>{const map=e.target.closest('#orbit-map');if(!map)return;const r=map.getBoundingClientRect();state.touch={x:Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100)),y:Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100))};map.style.setProperty('--tx',state.touch.x+'%');map.style.setProperty('--ty',state.touch.y+'%');map.classList.remove('stir');requestAnimationFrame(()=>map.classList.add('stir'));setTimeout(()=>map.classList.remove('stir'),1050)});
    function restore(){const id=sessionStorage.getItem('social-orbit-return');if(id&&person(id)){state.returnId=id;render()}}window.addEventListener('focus',restore);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')restore()});
    render();restore();
    window.addEventListener('load',()=>{if(window.lucide)window.lucide.createIcons({attrs:{"stroke-width":"1.7"}})});
  })();
  </script>
</body>
</html>
