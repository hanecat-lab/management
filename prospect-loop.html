r:#4c62cd;background:rgba(83,109,243,.11)}.fields{grid-template-columns:1fr}.modal{padding:20px 18px;border-radius:22px}.footer{flex-wrap:wrap}.footer .btn{flex:1}.profile{min-height:230px}.card-actions .btn{padding:9px}.side-stack{gap:12px}}

<body>
<div class="shell">
<aside class="sidebar glass"><div class="brand"><div class="mark">PL</div><div><strong>Prospect Loop</strong><small>RELATIONSHIP LENS</small></div></div><div class="nav-label">WORKSPACE</div><nav class="nav"><button data-view="today" class="active"><span class="nicon">◌</span>今日の観察</button><button data-view="people"><span class="nicon">⌘</span>人物の棚</button><button data-view="lenses"><span class="nicon">◇</span>目的別レンズ</button><button data-view="tags"><span class="nicon">#</span>特徴タグを管理</button></nav><div class="sidebar-foot"><strong>プライバシー優先</strong>プロフィールURLと、自分で記録した観察・接点だけをこの端末に保存します。</div></aside>
<main>
<header class="topbar"><div><div class="crumb" id="crumb">WORKSPACE / TODAY</div><h1 class="title" id="title">今日、<em>理解を深める</em>人</h1></div><div class="actions"><button class="btn" id="restoreBtn">↥ 復元</button><button class="btn" id="backupBtn">⇩ 保存</button><button class="btn" id="tagManagerBtn" data-view="tags"># タグ管理</button><button class="btn primary" id="addBtn">＋ 候補を追加</button></div></header>
<section class="view active" id="todayView"><div class="grid"><div><section class="panel glass today-card" id="todayCard"></section><section class="panel glass" style="margin-top:16px"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><div><div class="kicker">UP NEXT</div><h2>このあと確認する候補</h2></div><button class="btn small" data-view="people">すべて見る</button></div><div id="upNext" style="margin-top:12px"></div></section></div><div class="side-stack"><section class="panel focus"><div class="kicker">FOCUS THIS WEEK</div><div class="number" id="weekCount">0</div><p>今週のうちに投稿を確認し、次の一手を決める候補です。</p></section><section class="panel glass quick"><div class="kicker">QUICK ACTIONS</div><h2 style="margin-bottom:7px">今すぐできること</h2><button id="quickAdd"><b>＋</b>プロフィールを追加する</button><button data-view="lenses"><b>◇</b>目的別に候補を絞る</button><button id="importBtn"><b>↥</b>LinkageのJSONを取り込む</button></section></div></div></section>
<section class="view" id="peopleView"><div class="toolbar"><input class="search" id="search" placeholder="人物名、@アカウント名、特徴、メモを検索" /><button class="filter active" data-filter="all">すべて</button><button class="filter" data-filter="due">今週見る</button><button class="filter" data-filter="unobserved">未観察</button><button class="filter" data-filter="collab">協業候補</button></div><div class="cards" id="peopleCards"></div></section>
<section class="view" id="lensesView"><div class="lens-grid" id="lensGrid"></div></section>
<section class="view" id="tagsView"><p class="muted" style="margin:0 0 14px">タグを5種類の役割に分けると、後から「今見るべき人」を組み合わせて探せます。既存のLinkageラベルは、初回インポート時に未分類ラベルとして保持されます。</p><div id="tagCategories"></div></section>
</main>
</div>
<nav class="bottom"><button class="active" data-view="today"><b>◌</b>今日</button><button data-view="people"><b>⌘</b>人物</button><button id="bottomAdd"><b>＋</b>追加</button><button data-view="lenses"><b>◇</b>レンズ</button><button data-view="tags"><b>#</b>タグ管理</button></nav>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script>
const KEY='prospect_loop_relationship_lens_v1';
const DEFAULT_TAXONOMY={activity:['イラスト','DJ','イベント','地域店','教育','BtoB'],region:['和歌山','関西','オンライン'],format:['作品紹介','イベント告知','舞台裏','ノウハウ'],purpose:['応援','学ぶ','協業','商談','紹介'],warmth:['初見','気になる','接点あり','継続観察']};
let state={profiles:[],taxonomy:structuredClone(DEFAULT_TAXONOMY),ui:{view:'today',filter:'all'}};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));
const id=()=>`p_${Date.now()}_${Math.random().toString(36).slice(2,7)}`;
const iso=()=>new Date().toISOString().slice(0,10);
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const formatDate=d=>!d?'まだ見ていません':new Date(`${d}T00:00:00`).toLocaleDateString('ja-JP',{month:'numeric',day:'numeric'});
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.profiles)){state={...state,...x,taxonomy:{...structuredClone(DEFAULT_TAXONOMY),...(x.taxonomy||{})},ui:{view:'today',filter:'all',...(x.ui||{})}}}}catch(e){}migrate()}
function migrate(){state.profiles=state.profiles.map(p=>({...p,traits:{activity:[],region:[],format:[],purpose:[],warmth:[],...(p.traits||{})},labels:p.labels||[],timeline:p.timeline||[],lastObserved:p.lastObserved||'',lastContact:p.lastContact||'',accountMemo:p.accountMemo||'',nextReview:p.nextReview||'',avatar:p.avatar||['purple','coral','mint','blue','amber'][Math.floor(Math.random()*5)]}));state.taxonomy={...structuredClone(DEFAULT_TAXONOMY),...(state.taxonomy||{})}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(window.t);window.t=setTimeout(()=>el.classList.remove('show'),3300)}
function username(value){let v=String(value||'').trim();const m=v.match(/(?:https?:\/\/)?(?:www\.)?instagram\.com\/(?:[^/]+\/)?([A-Za-z0-9._]+)/i);if(m)v=m[1];v=v.replace(/^@/,'').replace(/\?.*$/,'').replace(/\/.*$/,'');return /^[A-Za-z0-9._]{1,40}$/.test(v)&&!['p','reel','reels','stories','explore','accounts'].includes(v.toLowerCase())?v:''}
function urlFor(u){return `https://www.instagram.com/${u}/`}
function initials(p){return (p.label||p.username||'?').replace(/^@/,'').slice(0,2)}
function avatar(p,big=false){return `<div class="avatar ${esc(p.avatar||'purple')} ${big?'big':''}">${esc(initials(p))}</div>`}
function allTraits(p){return Object.entries(p.traits||{}).flatMap(([type,arr])=>(arr||[]).map(x=>({type,value:x}))).concat((p.labels||[]).map(x=>({type:'label',value:x}))) }
function traitHTML(p,max=5){return `<div class="trait-row">${allTraits(p).slice(0,max).map(t=>`<span class="chip ${t.type}">${esc(t.value)}</span>`).join('')||'<span class="chip">未分類</span>'}</div>`}
function viewMeta(v){return {today:['WORKSPACE / TODAY','<em>今日の焦点</em>'],people:['WORKSPACE / PEOPLE','見失わない、<em>人物の棚</em>'],lenses:['WORKSPACE / LENSES','目的ごとに、<em>関係を整える</em>'],tags:['WORKSPACE / TAGS','特徴を、<em>再発見できる形に</em>']}[v]}
function switchView(v){state.ui.view=v;save();$$('.view').forEach(e=>e.classList.toggle('active',e.id===`${v}View`));$$('[data-view]').forEach(e=>e.classList.toggle('active',e.dataset.view===v));const m=viewMeta(v);$('#crumb').textContent=m[0];$('#title').innerHTML=m[1];render()}
function dueProfiles(){return state.profiles.filter(p=>!p.nextReview||p.nextReview<=addDays(7)).sort((a,b)=>(a.nextReview||'0000').localeCompare(b.nextReview||'0000'))}
function profileCard(p){return `<article class="profile"><div class="profile-head">${avatar(p)}<div style="min-width:0;flex:1"><strong>${esc(p.label||p.username)}</strong><small>@${esc(p.username)}</small></div><button class="more" data-manage="${p.id}" aria-label="編集">⋯</button></div>${traitHTML(p,4)}<div class="reason"><label>アカウントメモ</label>${esc(p.accountMemo||p.reason||'メモを残すと、次に開く理由が明確になります。')}</div><div class="meta"><span>最終接点 ${formatDate(p.lastContact)}</span><span>次回 ${formatDate(p.nextReview)}</span></div><div class="card-actions"><button class="btn small" data-contact="${p.id}">接点を記録</button><button class="btn instagram small" data-open="${p.id}">Instagram ↗</button></div></article>`}
function renderToday(){const due=dueProfiles(), p=due[0]||state.profiles[0];$('#weekCount').textContent=due.length;if(!p){$('#todayCard').innerHTML=`<div class="empty"><div class="empty-icon">✦</div><strong>最初の候補を追加しましょう</strong><p>プロフィールURLまたは@アカウント名から、関係の棚を始められます。</p><button class="btn primary" id="emptyAdd">＋ 候補を追加</button></div>`;$('#upNext').innerHTML='<p class="muted">候補を追加すると、ここに次に見る人が表示されます。</p>';return}const last=p.timeline?.[0];$('#todayCard').innerHTML=`<div style="display:flex;justify-content:space-between;gap:10px"><div><div class="kicker">TODAY'S OBSERVATION</div><h2>今、Instagramで確認する理由</h2></div><button class="btn small" data-manage="${p.id}">編集</button></div><div class="person-row">${avatar(p,true)}<div><div class="person-name">${esc(p.label||p.username)}</div><div class="handle">@${esc(p.username)} · 最終観察 ${formatDate(p.lastObserved)}</div>${traitHTML(p,5)}</div></div><div class="reason"><label>なぜ今見る？</label>${esc(p.reason||'この候補を、あなたの目的に合わせて仕分けましょう。')}</div><p class="muted" style="margin:13px 2px 0"><b style="color:var(--ink)">前回との差分：</b>${esc(last?.delta||'まだ観察メモはありません。投稿を確認して、自分の言葉で一行残しましょう。')}</p><div class="card-actions"><button class="btn instagram" data-open="${p.id}">Instagramで開く ↗</button><button class="btn" data-record="${p.id}">見た後に記録</button></div>`;const rest=due.slice(1,4);$('#upNext').innerHTML=rest.length?rest.map(x=>`<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)">${avatar(x)}<div style="min-width:0;flex:1"><b style="font-size:13px">${esc(x.label||x.username)}</b><div class="muted" style="font-size:11px">${esc(x.reason||'追う目的を設定しましょう')}</div></div><button class="btn small" data-open="${x.id}">↗</button></div>`).join(''):'<p class="muted">今日の観察はここまでです。新しい候補を追加するか、次の確認日を設定しましょう。</p>'}
function filteredPeople(){let x=[...state.profiles],f=state.ui.filter||'all',q=($('#search')?.value||'').trim().toLowerCase();if(f==='due')x=x.filter(p=>!p.nextReview||p.nextReview<=addDays(7));if(f==='unobserved')x=x.filter(p=>!p.lastObserved);if(f==='collab')x=x.filter(p=>(p.traits?.purpose||[]).includes('協業'));if(q)x=x.filter(p=>[p.label,p.username,p.reason,p.accountMemo,p.lastContact,p.labels?.join(' '),...allTraits(p).map(a=>a.value)].join(' ').toLowerCase().includes(q));return x}
function renderPeople(){const ps=filteredPeople();$('#peopleCards').innerHTML=ps.length?ps.map(profileCard).join(''):`<div class="empty"><div class="empty-icon">⌕</div><strong>${state.profiles.length?'該当する候補はありません':'まだ人物がいません'}</strong><p>${state.profiles.length?'検索語やレンズを変えてください。':'最初の候補を追加すると、特徴と観察記録を育てられます。'}</p></div>`;$$('.filter').forEach(b=>b.classList.toggle('active',b.dataset.filter===state.ui.filter))}
const lensDefs=[['weekly','今週の再訪','次回確認日が今週までの候補。','今週、見るべき人'],['collab','協業の芽','特徴タグが「協業」の候補。','協業候補'],['warm','関係を育てる','「接点あり」または「継続観察」の候補。','関係構築'],['unobserved','まだ観察していない','登録後、まだ一度も観察記録を残していない候補。','未観察']];
function lensPeople(key){if(key==='weekly')return state.profiles.filter(p=>!p.nextReview||p.nextReview<=addDays(7));if(key==='collab')return state.profiles.filter(p=>(p.traits?.purpose||[]).includes('協業'));if(key==='warm')return state.profiles.filter(p=>['接点あり','継続観察'].some(v=>(p.traits?.warmth||[]).includes(v)));return state.profiles.filter(p=>!p.lastObserved)}
function renderLenses(){$('#lensGrid').innerHTML=lensDefs.map(([key,name,desc,tag])=>{const n=lensPeople(key).length;return `<article class="lens"><div class="kicker">${tag.toUpperCase()}</div><h3>${name}</h3><p>${desc}</p><div class="lens-count">${n}<span style="font-size:12px;letter-spacing:0"> 人</span></div><button class="btn primary small" data-lens="${key}">このレンズで開く</button></article>`}).join('')}
function countTag(type,tag){return state.profiles.filter(p=>(p.traits?.[type]||[]).includes(tag)).length}
function renderTags(){$('#tagCategories').innerHTML=`<section class="category" style="background:linear-gradient(135deg,rgba(90,121,244,.12),rgba(255,255,255,.70));border-color:rgba(91,121,244,.25)"><div class="category-head"><div><div class="kicker">TAG MANAGEMENT</div><h3>特徴タグを管理する</h3></div><span class="chip purpose">追加・編集・削除</span></div><p class="muted" style="margin:10px 0 0">各タグの右側にある <b style="color:var(--ink)">「編集」</b> を押すと、名前の変更または削除ができます。付与済みの人物がいる場合は人数を確認してから変更します。</p></section>`+Object.entries(state.taxonomy).map(([type,tags])=>`<section class="category"><div class="category-head"><div><div class="kicker">${({activity:'ACTIVITY',region:'REGION',format:'CONTENT FORMAT',purpose:'RELATIONSHIP PURPOSE',warmth:'WARMTH'})[type]}</div><h3>${({activity:'活動',region:'地域',format:'発信の型',purpose:'関係の目的',warmth:'温度感'})[type]}</h3></div><span class="muted">${tags.length} タグ</span></div><div class="tag-cloud">${tags.map(t=>`<span class="tag-item"><button class="tag-btn" data-show-tag-people="1" data-type="${type}" data-tag="${esc(t)}">${esc(t)}<span class="tag-count">${countTag(type,t)}</span></button><button class="tag-manage" data-manage-tag="1" data-type="${type}" data-tag="${esc(t)}" aria-label="${esc(t)}を編集・削除">編集</button></span>`).join('')}</div><div class="add-tag"><input id="new_${type}" placeholder="新しいタグ" /><button class="btn small" data-add-tag="${type}">追加</button></div></section>`).join('')}
function render(){renderToday();renderPeople();renderLenses();renderTags()}
function modal(html){$('#modal').innerHTML=html;$('#modalBackdrop').classList.add('show')};function closeModal(){$('#modalBackdrop').classList.remove('show');$('#modal').innerHTML=''}
function selectedTraitButtons(traits={}){return Object.entries(state.taxonomy).map(([type,tags])=>`<div class="trait-section"><label>${({activity:'活動',region:'地域',format:'発信の型',purpose:'関係の目的',warmth:'温度感'})[type]}</label><div class="trait-options">${tags.map(t=>`<button type="button" class="${(traits[type]||[]).includes(t)?'on':''}" data-trait="${type}" data-value="${esc(t)}">${esc(t)}</button>`).join('')}</div></div>`).join('')}
function showProfileModal(pid){const p=state.profiles.find(x=>x.id===pid);const isEdit=!!p;const x=p||{username:'',label:'',reason:'',nextReview:addDays(0),traits:{activity:[],region:[],format:[],purpose:[],warmth:[]},labels:[]};modal(`<div class="modal-head"><div><h2>${isEdit?'候補を編集':'候補を追加'}</h2><p>登録時は@アカウント名だけでも十分です。特徴と観察は後から育てられます。</p></div><button class="close" data-close>×</button></div><form id="profileForm" onsubmit="event.preventDefault();saveProfile(new FormData(this));return false;"><input type="hidden" name="id" value="${esc(p?.id||'')}"><div class="fields"><div class="field full"><label>InstagramプロフィールURL または @アカウント名 *</label><input name="account" value="${esc(x.username?'@'+x.username:'')}" placeholder="@example_brand または https://instagram.com/example_brand" required><span class="hint">保存時にInstagramプロフィールURLを自動生成します。</span></div><div class="field"><label>表示名・呼び名</label><input name="label" value="${esc(x.label||'')}" placeholder="例：株式会社サンプル"></div><div class="field"><label>次に見る日</label><input name="nextReview" type="date" value="${esc(x.nextReview||'')}"></div><div class="field full"><label>今、追う理由</label><textarea name="reason" placeholder="例：展示会前に最新の発信テーマを確認する">${esc(x.reason||'')}</textarea></div><div class="field"><label>最終接触日</label><input name="lastContact" type="date" value="${esc(x.lastContact||'')}"><span class="hint">DM・コメント・対面など、実際の接点があった日です。</span></div><div class="field full"><label>アカウントメモ</label><textarea name="accountMemo" placeholder="例：イベント出展が多い。依頼窓口はプロフィールURL。">${esc(x.accountMemo||'')}</textarea></div><div class="trait-picker"><h4>プロフィール特徴</h4>${selectedTraitButtons(x.traits)}<div class="trait-section"><label>未分類ラベル（既存のLinkageラベルなど）</label><input name="labels" value="${esc((x.labels||[]).join(', '))}" placeholder="例：コンカフェ、渋谷店"></div></div></div><div class="footer ${isEdit?'spread':''}">${isEdit?`<button type="button" class="btn danger" data-delete="${x.id}">削除</button>`:''}<div style="display:flex;gap:8px"><button type="button" class="btn" data-close>キャンセル</button><button class="btn primary" type="submit">${isEdit?'変更を保存':'候補を保存'}</button></div></div></form>${isEdit?historyHTML(x):''}`);window.__traits=structuredClone(x.traits)}
function historyHTML(p){const h=(p.timeline||[]).slice(0,5);return `<div class="history"><h3>観察タイムライン</h3>${h.length?h.map(e=>`<div class="history-item"><b>${esc(e.kind==='contact'?'接点':'観察')} · ${esc(e.date)}</b><p>${esc(e.delta||'差分なし')}</p><small>次の行動：${esc(e.action||'未設定')}</small></div>`).join(''):'<p class="muted">まだ観察記録はありません。</p>'}</div>`}
function saveProfile(fd){const u=username(fd.get('account'));if(!u)return toast('有効なInstagram URLまたは@アカウント名を入力してください。');const existing=state.profiles.find(p=>p.username.toLowerCase()===u.toLowerCase()&&p.id!==fd.get('id'));if(existing)return toast(`@${u} はすでに登録されています。`);const traits=window.__traits||{activity:[],region:[],format:[],purpose:[],warmth:[]};const labels=String(fd.get('labels')||'').split(',').map(x=>x.trim()).filter(Boolean);if(fd.get('id')){const p=state.profiles.find(x=>x.id===fd.get('id'));const prev=p.username;p.username=u;p.profileUrl=urlFor(u);p.label=fd.get('label').trim()||`@${u}`;p.reason=fd.get('reason').trim();p.lastContact=fd.get('lastContact')||'';p.accountMemo=fd.get('accountMemo').trim();p.nextReview=fd.get('nextReview');p.traits=traits;p.labels=labels;p.updatedAt=new Date().toISOString();p.timeline.unshift({id:id(),date:iso(),kind:'profile_change',delta:prev===u?'プロフィール情報を編集':`@${prev} を @${u} に変更`,action:'情報を更新',tags:[]});toast(`${p.label} を更新しました。`)}else{state.profiles.unshift({id:id(),username:u,profileUrl:urlFor(u),label:fd.get('label').trim()||`@${u}`,reason:fd.get('reason').trim(),nextReview:fd.get('nextReview')||addDays(0),traits,labels,timeline:[],lastObserved:'',lastContact:fd.get('lastContact')||'',accountMemo:fd.get('accountMemo').trim(),avatar:['purple','coral','mint','blue','amber'][state.profiles.length%5],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});toast(`@${u} を候補に追加しました。`)}save();closeModal();render()}
function showRecordModal(pid){const p=state.profiles.find(x=>x.id===pid);if(!p)return;modal(`<div class="modal-head"><div><h2>観察を残す</h2><p>${esc(p.label||p.username)}を見た後、前回との差分と次の行動を一行ずつ残します。</p></div><button class="close" data-close>×</button></div><form id="recordForm" onsubmit="event.preventDefault();saveRecord(new FormData(this));return false;"><input type="hidden" name="id" value="${p.id}"><div class="fields"><div class="field"><label>記録の種類</label><select name="kind"><option value="observation">Instagramを観察</option><option value="contact">実際に接点を持った</option></select></div><div class="field"><label>次に見る日</label><input name="nextReview" type="date" value="${addDays(14)}"></div><div class="field full"><label>前回との差分・気づき</label><textarea name="delta" placeholder="例：イベント告知が増えた。プロフィールに依頼受付の導線が追加された。" required></textarea></div><div class="field full"><label>次の行動</label><textarea name="action" placeholder="例：イベント前に再訪する。コメントを検討する。"></textarea></div></div><div class="footer"><button type="button" class="btn" data-close>キャンセル</button><button class="btn primary" type="submit">観察を保存</button></div></form>`)}
function saveRecord(fd){const p=state.profiles.find(x=>x.id===fd.get('id'));if(!p)return;const kind=fd.get('kind');const now=iso();p.timeline.unshift({id:id(),date:now,kind,delta:fd.get('delta').trim(),action:fd.get('action').trim(),tags:[]});p.lastObserved=now;if(kind==='contact')p.lastContact=now;p.nextReview=fd.get('nextReview')||'';p.updatedAt=new Date().toISOString();save();closeModal();render();toast('観察と次の行動を保存しました。')}
function showContactModal(pid){const p=state.profiles.find(x=>x.id===pid);if(!p)return;modal(`<div class="modal-head"><div><h2>接点を記録</h2><p>${esc(p.label||p.username)}との実際の接点を残します。Instagramを見ただけの日とは分けて管理します。</p></div><button class="close" data-close>×</button></div><form id="contactForm" onsubmit="event.preventDefault();saveContact(new FormData(this));return false;"><input type="hidden" name="id" value="${p.id}"><div class="fields"><div class="field"><label>接点があった日</label><input name="date" type="date" value="${iso()}" required></div><div class="field"><label>接点の種類</label><select name="kind"><option>DM</option><option>コメント</option><option>対面</option><option>オンライン通話</option><option>その他</option></select></div><div class="field full"><label>接点メモ</label><textarea name="memo" placeholder="例：イベントについてDMで会話。次回の出展時に声をかける。"></textarea></div></div><div class="footer"><button type="button" class="btn" data-close>キャンセル</button><button class="btn primary" type="submit">接点を保存</button></div></form>`)}
function saveContact(fd){const p=state.profiles.find(x=>x.id===fd.get('id'));if(!p)return;const date=fd.get('date'),memo=fd.get('memo').trim(),kind=fd.get('kind');p.lastContact=date;if(memo)p.accountMemo=p.accountMemo?`${p.accountMemo}\n${date}・${kind}：${memo}`:`${date}・${kind}：${memo}`;p.timeline.unshift({id:id(),date,kind:'contact',delta:`${kind}で接点を記録`,action:memo||'接点メモなし',tags:[]});p.updatedAt=new Date().toISOString();save();closeModal();render();toast('最終接触日と接点メモを保存しました。')}
function taggedProfiles(type,tag){return state.profiles.filter(p=>(p.traits?.[type]||[]).includes(tag))}
function showTagPeople(type,tag){window.tagPeopleContext={type,tag,selected:new Set(taggedProfiles(type,tag).map(p=>p.id))};renderTagPeople()}
function renderTagPeople(){const c=window.tagPeopleContext,people=taggedProfiles(c.type,c.tag),selected=c.selected;modal(`<div class="modal-head"><div><h2>「${esc(c.tag)}」の人物</h2><p>${people.length}人がこの特徴タグに紐付いています。選んだ人物をまとめて更新できます。</p></div><button class="close" data-close>×</button></div><div class="reason"><label>一括編集</label>接点日、アカウントメモ、次に見る日、温度感、追加タグを選択した人物へまとめて反映します。</div><div style="display:flex;justify-content:space-between;align-items:center;margin:13px 0 7px"><label style="font-size:12px;font-weight:800"><input type="checkbox" ${selected.size===people.length&&people.length?'checked':''} onchange="toggleBatchAll(this.checked)"> 全員を選択</label><span class="muted" id="batchCount">${selected.size}人選択</span></div><div style="max-height:280px;overflow:auto;border-top:1px solid var(--line)">${people.map(p=>`<label style="display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer"><input type="checkbox" ${selected.has(p.id)?'checked':''} onchange="toggleBatchPerson('${p.id}',this.checked)">${avatar(p)}<span style="min-width:0;flex:1"><b style="display:block;font-size:13px">${esc(p.label||p.username)}</b><small style="color:var(--faint)">@${esc(p.username)} · 最終接点 ${formatDate(p.lastContact)}</small></span></label>`).join('')||'<p class="muted" style="padding:14px 0">このタグを付与した人物はまだいません。</p>'}</div><div class="footer"><button class="btn" data-close>閉じる</button><button class="btn primary" data-batch-edit ${selected.size?'':'disabled'}>選択した人物を一括編集</button></div>`)}
function toggleBatchPerson(pid,checked){const c=window.tagPeopleContext;if(!c)return;checked?c.selected.add(pid):c.selected.delete(pid);renderTagPeople()}
function toggleBatchAll(checked){const c=window.tagPeopleContext;if(!c)return;c.selected=checked?new Set(taggedProfiles(c.type,c.tag).map(p=>p.id)):new Set();renderTagPeople()}
function batchTraitOptions(){return Object.entries(state.taxonomy).flatMap(([type,tags])=>tags.map(tag=>`<option value="${type}|${esc(tag)}">${({activity:'活動',region:'地域',format:'発信',purpose:'目的',warmth:'温度感'})[type]}：${esc(tag)}</option>`)).join('')}
function showBatchEdit(){const c=window.tagPeopleContext;if(!c||!c.selected.size)return toast('一括編集する人物を選択してください。');modal(`<div class="modal-head"><div><h2>${c.selected.size}人を一括編集</h2><p>入力した項目だけを選択人物に反映します。空欄または「変更しない」は現在の値を保ちます。</p></div><button class="close" data-close>×</button></div><form id="batchForm" onsubmit="event.preventDefault();applyBatch(new FormData(this));return false;"><div class="fields"><div class="field"><label>次に見る日</label><input type="date" name="nextReview"></div><div class="field"><label>最終接触日</label><input type="date" name="lastContact"></div><div class="field"><label>温度感</label><select name="warmth"><option value="">変更しない</option>${(state.taxonomy.warmth||[]).map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('')}</select></div><div class="field"><label>追加する特徴タグ</label><select name="trait"><option value="">追加しない</option>${batchTraitOptions()}</select></div><div class="field full"><label>アカウントメモへ追記</label><textarea name="memo" placeholder="例：今週中にイベント告知を確認する。"></textarea><span class="hint">既存メモは残し、日付付きで末尾へ追記します。</span></div></div><div class="footer"><button class="btn" type="button" data-back-tag-list>人物一覧へ戻る</button><button class="btn primary" type="submit">${c.selected.size}人へ反映する</button></div></form>`)}
function applyBatch(fd){const c=window.tagPeopleContext;if(!c)return;const review=fd.get('nextReview'),contact=fd.get('lastContact'),warmth=fd.get('warmth'),trait=fd.get('trait'),memo=fd.get('memo').trim();if(!review&&!contact&&!warmth&&!trait&&!memo)return toast('変更する項目を1つ以上入力してください。');const [traitType,traitName]=(trait||'|').split('|');let updated=0;state.profiles.forEach(p=>{if(!c.selected.has(p.id))return;if(review)p.nextReview=review;if(contact)p.lastContact=contact;if(warmth)p.traits.warmth=[warmth];if(traitType&&traitName&&!p.traits[traitType].includes(traitName))p.traits[traitType].push(traitName);if(memo)p.accountMemo=p.accountMemo?`${p.accountMemo}\n${iso()}：${memo}`:`${iso()}：${memo}`;p.updatedAt=new Date().toISOString();updated++});save();closeModal();render();toast(`${updated}人の情報を一括更新しました。`) }
function confirmDelete(pid){const p=state.profiles.find(x=>x.id===pid);if(!p)return;modal(`<div class="modal-head"><div><h2>候補を削除しますか？</h2><p><b>${esc(p.label||p.username)}</b>（@${esc(p.username)}）と観察記録をこの端末から外します。</p></div><button class="close" data-close>×</button></div><div class="reason"><label>ご注意</label>削除後30秒間は元に戻せます。時間を過ぎた後は保存済みバックアップから復元してください。</div><div class="footer"><button class="btn" data-close>キャンセル</button><button class="btn danger" data-confirm-delete="${p.id}">削除する</button></div>`)}
function doDelete(pid){const n=state.profiles.findIndex(p=>p.id===pid);if(n<0)return;window.deleted={p:state.profiles[n],n};state.profiles.splice(n,1);save();modal(`<div class="modal-head"><div><h2>候補を削除しました</h2><p>30秒以内なら元に戻せます。</p></div><button class="close" data-close>×</button></div><div class="footer"><button class="btn" data-close>閉じる</button><button class="btn primary" data-undo>元に戻す</button></div>`);clearTimeout(window.undoTimer);window.undoTimer=setTimeout(()=>{window.deleted=null;closeModal()},30000);render()}
function undo(){if(!window.deleted)return;state.profiles.splice(Math.min(window.deleted.n,state.profiles.length),0,window.deleted.p);window.deleted=null;clearTimeout(window.undoTimer);save();closeModal();render();toast('候補を元に戻しました。')}
function openInstagram(pid){const p=state.profiles.find(x=>x.id===pid);if(!p)return;window.location.assign(p.profileUrl||urlFor(p.username))}
function exportBackup(){const pack={format:'prospect-loop-relationship-lens',version:1,exportedAt:new Date().toISOString(),summary:{profiles:state.profiles.length},data:state};const blob=new Blob([JSON.stringify(pack,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`prospect-loop-lens_${iso()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);toast(`バックアップを保存しました（${state.profiles.length}人）。`)}
function showRestore(){modal(`<div class="modal-head"><div><h2>バックアップを復元</h2><p>Prospect Loop Relationship Lensのバックアップを選びます。現在のデータは確認後に置き換わります。</p></div><button class="close" data-close>×</button></div><div class="drop"><strong>バックアップJSONを選択</strong><p>この端末で作成したバックアップのみ対応します。ファイルは端末内で読み取り、サーバーへ送信しません。</p><label class="btn primary" for="restoreFile">バックアップを選ぶ</label><input id="restoreFile" type="file" accept="application/json,.json"></div>`);$('#restoreFile').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{const b=JSON.parse(await f.text());if(b.format!=='prospect-loop-relationship-lens'||!b.data?.profiles)throw Error();window.restorePack=b;modal(`<div class="modal-head"><div><h2>復元を確認</h2><p>作成日時：${esc(new Date(b.exportedAt).toLocaleString('ja-JP'))}<br>候補：${b.data.profiles.length}人</p></div><button class="close" data-close>×</button></div><div class="reason"><label>この内容で置き換えます</label>現在の人物・タグ・観察記録はバックアップの内容へ置き換わります。</div><div class="footer"><button class="btn" data-close>キャンセル</button><button class="btn primary" data-confirm-restore>復元する</button></div>`)}catch{toast('対応していないバックアップです。')}})}
function restore(){if(!window.restorePack)return;state=window.restorePack.data;migrate();save();closeModal();render();toast(`バックアップを復元しました（${state.profiles.length}人）。`)}
function showImport(){modal(`<div class="modal-head"><div><h2>Linkageの人物JSONを取り込む</h2><p>名前、Instagramリンク、ラベル、人物メモ、最終接触日だけを取り込みます。既存の@アカウント名は重複追加しません。</p></div><button class="close" data-close>×</button></div><div class="drop"><strong>LinkageのJSONを選択</strong><p>既存アプリのエクスポートJSONまたはデータJSONに対応します。Instagramリンクがある人物だけを候補として追加します。</p><label class="btn primary" for="linkageFile">JSONを選ぶ</label><input id="linkageFile" type="file" accept="application/json,.json"></div>`);$('#linkageFile').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{const raw=JSON.parse(await f.text()), people=raw.people||raw.data?.people;if(!Array.isArray(people))throw Error();const rows=people.map(p=>{const link=(p.links||[]).find(l=>/instagram\.com/i.test(l.url||''));const u=username(link?.url);return u?{source:p,u}:null}).filter(Boolean);window.importRows=rows;modal(`<div class="modal-head"><div><h2>取り込みを確認</h2><p>Instagramリンクを持つ${rows.length}人を検出しました。名前・Instagram URL・ラベル・人物メモ・最終接点日だけを追加します。</p></div><button class="close" data-close>×</button></div><div class="reason"><label>取り込まない情報</label>性別、アイコン、汎用メモの記録本文、バンド・カレンダー情報は取り込みません。</div><div class="footer"><button class="btn" data-close>キャンセル</button><button class="btn primary" data-confirm-import>取り込む</button></div>`)}catch{toast('人物配列を含むLinkage JSONを選択してください。')}})}
function importLinkage(){const rows=window.importRows||[];let added=0;rows.forEach(({source:p,u})=>{if(state.profiles.some(x=>x.username.toLowerCase()===u.toLowerCase()))return;state.profiles.push({id:id(),username:u,profileUrl:urlFor(u),label:p.name||`@${u}`,reason:p.memo||'',nextReview:'',traits:{activity:[],region:[],format:[],purpose:[],warmth:[]},labels:p.labels||[],timeline:[],lastObserved:'',lastContact:p.lastContactDate||'',accountMemo:p.memo||'',avatar:['purple','coral','mint','blue','amber'][state.profiles.length%5],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});added++});save();closeModal();render();toast(`${added}人をLinkageから追加しました。`)}
function addTaxonomy(type){const inp=$(`#new_${type}`),v=inp?.value.trim();if(!v)return;if(state.taxonomy[type].includes(v))return toast('すでに存在するタグです。');state.taxonomy[type].push(v);save();renderTags();toast(`「${v}」を追加しました。`)}
function showTagManage(type,tag){const used=countTag(type,tag);modal(`<div class="modal-head"><div><h2>特徴タグを編集</h2><p>「${esc(tag)}」を編集します。現在${used}人に付与されています。</p></div><button class="close" data-close>×</button></div><form id="tagEditForm" onsubmit="event.preventDefault();renameTaxonomyTag(this.type.value,this.original.value,this.name.value);return false;"><input type="hidden" name="type" value="${esc(type)}"><input type="hidden" name="original" value="${esc(tag)}"><div class="fields"><div class="field full"><label>タグ名</label><input name="name" value="${esc(tag)}" required maxlength="30"><span class="hint">名前を変えると、すでにこのタグを持つ人物の特徴も同時に更新されます。</span></div></div><div class="footer spread"><button class="btn danger" type="button" data-delete-tag="1" data-type="${esc(type)}" data-tag="${esc(tag)}">タグを削除</button><div style="display:flex;gap:8px"><button class="btn" type="button" data-close>キャンセル</button><button class="btn primary" type="submit">変更を保存</button></div></div></form>`)}
function renameTaxonomyTag(type,oldName,newName){const next=String(newName||'').trim();if(!next)return toast('タグ名を入力してください。');if(next===oldName){closeModal();return}if(state.taxonomy[type].includes(next))return toast('同じ分類に同名のタグがあります。');state.taxonomy[type]=state.taxonomy[type].map(x=>x===oldName?next:x);state.profiles.forEach(p=>{const values=p.traits?.[type]||[];p.traits[type]=[...new Set(values.map(x=>x===oldName?next:x))]});save();closeModal();render();toast(`「${oldName}」を「${next}」へ変更しました。`)}
function showDeleteTag(type,tag){const used=countTag(type,tag);modal(`<div class="modal-head"><div><h2>特徴タグを削除しますか？</h2><p>「${esc(tag)}」は現在${used}人に付与されています。</p></div><button class="close" data-close>×</button></div><div class="reason"><label>削除の影響</label>このタグは分類一覧から消え、${used}人の人物プロフィールからも外れます。人物、観察記録、他の特徴タグは削除されません。</div><div class="footer"><button class="btn" data-close>キャンセル</button><button class="btn danger" data-confirm-delete-tag="1" data-type="${esc(type)}" data-tag="${esc(tag)}">タグを削除する</button></div>`)}
function deleteTaxonomyTag(type,tag){state.taxonomy[type]=state.taxonomy[type].filter(x=>x!==tag);state.profiles.forEach(p=>{p.traits[type]=(p.traits?.[type]||[]).filter(x=>x!==tag)});save();closeModal();render();toast(`「${tag}」を削除しました。`)}
document.addEventListener('click',e=>{const t=e.target.closest('button,[data-view]');if(!t)return;if(t.dataset.view){switchView(t.dataset.view);return}if(t.id==='addBtn'||t.id==='quickAdd'||t.id==='bottomAdd'||t.id==='emptyAdd'){showProfileModal();return}if(t.id==='backupBtn'){exportBackup();return}if(t.id==='restoreBtn'){showRestore();return}if(t.id==='importBtn'){showImport();return}if(t.dataset.open){openInstagram(t.dataset.open);return}if(t.dataset.showTagPeople){showTagPeople(t.dataset.type,t.dataset.tag);return}if(t.dataset.contact){showContactModal(t.dataset.contact);return}if(t.dataset.record){showRecordModal(t.dataset.record);return}if(t.dataset.manage){showProfileModal(t.dataset.manage);return}if(t.dataset.close!==undefined||t.id==='modalBackdrop'){closeModal();return}if(t.dataset.delete){confirmDelete(t.dataset.delete);return}if(t.dataset.confirmDelete){doDelete(t.dataset.confirmDelete);return}if(t.dataset.undo!==undefined){undo();return}if(t.dataset.confirmRestore!==undefined){restore();return}if(t.dataset.confirmImport!==undefined){importLinkage();return}if(t.dataset.lens){const k=t.dataset.lens;state.ui.filter=k==='weekly'?'due':k==='collab'?'collab':k==='unobserved'?'unobserved':'all';switchView('people');return}if(t.dataset.filter){state.ui.filter=t.dataset.filter;save();renderPeople();return}if(t.dataset.trait){const a=window.__traits[t.dataset.trait]||[],v=t.dataset.value;window.__traits[t.dataset.trait]=a.includes(v)?a.filter(x=>x!==v):[...a,v];t.classList.toggle('on');return}if(t.dataset.addTag){addTaxonomy(t.dataset.addTag);return}if(t.dataset.batchEdit!==undefined){showBatchEdit();return}if(t.dataset.backTagList!==undefined){renderTagPeople();return}if(t.dataset.manageTag){showTagManage(t.dataset.type,t.dataset.tag);return}if(t.dataset.deleteTag){showDeleteTag(t.dataset.type,t.dataset.tag);return}if(t.dataset.confirmDeleteTag){deleteTaxonomyTag(t.dataset.type,t.dataset.tag);return}if(t.dataset.tagFilter){const [type,val]=t.dataset.tagFilter.split('|');state.ui.filter='all';switchView('people');setTimeout(()=>{$('#search').value=val;renderPeople()},0);return}});
document.addEventListener('submit',e=>{if(e.target.id==='profileForm'){e.preventDefault();saveProfile(new FormData(e.target))}if(e.target.id==='recordForm'){e.preventDefault();saveRecord(new FormData(e.target))}});document.addEventListener('input',e=>{if(e.target.id==='search')renderPeople()});
load();switchView(state.ui.view||'today');
</script>
</body>
</html>
