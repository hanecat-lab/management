<script>
const KEY='prospect_loop_relationship_lens_v1';const DRAFT_KEY='prospect_loop_relationship_lens_drafts_v1';

let state={profiles:[],taxonomy:structuredClone(DEFAULT_TAXONOMY),ui:{view:'today',filter:'all',weeklyLimit:3,peopleLayout:'cards'},meta:{lastBackupAt:'',lastBackupProfiles:0}},drafts={};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));

const iso=()=>new Date().toISOString().slice(0,10);
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const formatDate=d=>!d?'まだ見ていません':new Date(`${d}T00:00:00`).toLocaleDateString('ja-JP',{month:'numeric',day:'numeric'});
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.profiles)){state={...state,...x,taxonomy:{...structuredClone(DEFAULT_TAXONOMY),...(x.taxonomy||{})},ui:{view:'today',filter:'all',weeklyLimit:3,peopleLayout:'cards',...(x.ui||{})},meta:{lastBackupAt:'',lastBackupProfiles:0,...(x.meta||{})}}}}catch(e){}migrate();loadDrafts()}
function migrate(){state.ui={view:'today',filter:'all',weeklyLimit:3,peopleLayout:'cards',...(state.ui||{})};state.meta={lastBackupAt:'',lastBackupProfiles:0,...(state.meta||{})};state.profiles=state.profiles.map(p=>({...p,traits:{activity:[],region:[],format:[],purpose:[],warmth:[],...(p.traits||{})},labels:p.labels||[],timeline:(p.timeline||[]).map(e=>({...e,id:e.id||id(),kind:e.kind||'observation',date:e.date||'',delta:e.delta||'',action:e.action||'',tags:e.tags||[]})),lastObserved:p.lastObserved||'',lastContact:p.lastContact||'',accountMemo:p.accountMemo||'',nextReview:p.nextReview||'',status:['active','paused','graduated'].includes(p.status)?p.status:'active',reviewAfter:p.reviewAfter||'',statusReason:p.statusReason||'',snoozedUntil:p.snoozedUntil||'',snoozeReason:p.snoozeReason||'',aliases:[...new Set((p.aliases||[]).filter(Boolean))],avatar:p.avatar||['purple','coral','mint','blue','amber'][Math.floor(Math.random()*5)]}));state.taxonomy={...structuredClone(DEFAULT_TAXONOMY),...(state.taxonomy||{})}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}

function saveDrafts(){localStorage.setItem(DRAFT_KEY,JSON.stringify(drafts))}
function dateMonthEnd(){const d=new Date();return new Date(d.getFullYear(),d.getMonth()+1,0).toISOString().slice(0,10)}
function datePresetButtons(target){return `<div class="date-presets" aria-label="次に見る日の候補"><button type="button" data-date-preset="${target}" data-preset-days="1">明日</button><button type="button" data-date-preset="${target}" data-preset-days="7">1週間後</button><button type="button" data-date-preset="${target}" data-preset-days="14">2週間後</button><button type="button" data-date-preset="${target}" data-preset-month-end="1">月末</button><button type="button" data-date-preset="${target}" data-preset-clear="1">指定なし</button></div>`}
function applyDatePreset(target,button){const input=$('#'+target);if(!input)return;input.value=button.dataset.presetClear!==undefined?'':button.dataset.presetMonthEnd!==undefined?dateMonthEnd():addDays(Number(button.dataset.presetDays)||0);input.dispatchEvent(new Event('input',{bubbles:true}));input.dispatchEvent(new Event('change',{bubbles:true}))}

function showObservationLogActions(pid,logId){const p=state.profiles.find(x=>x.id===pid),log=p?.timeline.find(e=>e.id===logId&&e.kind==='observation');if(!p||!log)return;modal(`<div class="modal-head"><div><h2>観察ログの操作</h2><p>${esc(p.label||p.username)} · ${esc(log.date)}</p></div><button class="close" data-close>×</button></div><div class="log-action-note"><label>今回の気づき</label>${esc(log.delta)}</div><div class="tool-grid"><button class="tool-choice" data-edit-observation="${esc(pid)}" data-log="${esc(logId)}"><b>✎</b><strong>編集する</strong><span>気づき、観察日、次に見る日、次の行動を修正します。</span></button><button class="tool-choice" data-delete-observation="${esc(pid)}" data-log="${esc(logId)}"><b>×</b><strong>削除する</strong><span>この観察ログだけを削除します。30秒間は元に戻せます。</span></button></div><div class="footer"><button class="btn" data-close>閉じる</button></div>`)}
function showRecordModal(pid,logId=''){const p=state.profiles.find(x=>x.id===pid);if(!p)return;const log=logId?p.timeline.find(e=>e.id===logId&&e.kind==='observation'):null;if(logId&&!log)return toast('観察ログが見つかりません。');const previous=observationEntries(p).find(e=>e.id!==log?.id),editing=!!log,x=log||{date:iso(),delta:'',action:'',id:''};modal(`<div class="modal-head"><div><h2>${editing?'観察ログを編集':'観察ログを残す'}</h2><p>見た内容の気づきと、次にどうするかを自分の言葉で残します。</p></div><button class="close" data-close>×</button></div><div class="observation-person">${avatar(p)}<div><b>${esc(p.label||p.username)}</b><span>@${esc(p.username)} · 最終観察 ${formatDate(p.lastObserved)}</span></div></div>${previous?`<div class="previous-observation"><label>前回の観察</label><b>${esc(formatDate(previous.date))}</b>　${esc(previous.delta).slice(0,92)}${previous.delta.length>92?'…':''}</div>`:''}<form id="observationForm" onsubmit="event.preventDefault();saveObservationLog(new FormData(this));return false;"><input type="hidden" name="id" value="${esc(p.id)}"><input type="hidden" name="logId" value="${esc(x.id)}"><div class="fields"><div class="field"><label>観察日</label><input name="date" type="date" value="${esc(x.date||iso())}" required></div><div class="field"><label>次に見る日</label><input id="observationNextReview" name="nextReview" type="date" value="${esc(p.nextReview||addDays(14))}">${datePresetButtons('observationNextReview')}</div><div class="field full"><label>今回の気づき *</label><textarea name="delta" required placeholder="例：展示会の告知が始まり、プロフィールに依頼窓口が追加されていた。">${esc(x.delta)}</textarea></div><div class="field full"><label>次の行動（任意）</label><textarea name="action" placeholder="例：展示の1週間前に、告知の進み方を確認する。行動しない場合は「今は記録のみ」と残せます。">${esc(x.action)}</textarea></div></div><div class="footer ${editing?'spread':''}">${editing?`<button type="button" class="btn danger" data-delete-observation="${esc(p.id)}" data-log="${esc(x.id)}">削除</button>`:''}<div style="display:flex;gap:8px"><button class="btn" type="button" data-close>キャンセル</button><button class="btn primary" type="submit">${editing?'変更を保存':'観察を保存'}</button></div></div></form>`);wireDraft('observationForm',`observation:${pid}:${x.id||'new'}`)}
function saveObservationLog(fd){const before=structuredClone(state),p=state.profiles.find(x=>x.id===fd.get('id'));if(!p)return;const delta=fd.get('delta').trim();if(!delta)return toast('今回の気づきを入力してください。');const logId=fd.get('logId'),date=fd.get('date')||iso(),action=fd.get('action').trim(),editing=!!logId;if(editing){const log=p.timeline.find(e=>e.id===logId&&e.kind==='observation');if(!log)return toast('観察ログが見つかりません。');log.date=date;log.delta=delta;log.action=action;log.updatedAt=new Date().toISOString()}else{p.timeline.push({id:id(),date,kind:'observation',delta,action,tags:[],createdAt:new Date().toISOString()})}sortTimeline(p);refreshObservationMeta(p);p.nextReview=fd.get('nextReview')||'';p.updatedAt=new Date().toISOString();save();clearDraft(`observation:${p.id}:${logId||'new'}`);closeModal();render();toast(editing?'観察ログを更新しました。':'観察と次の行動を保存しました。');offerUndo(editing?'観察ログの変更を保存しました。':'観察ログを保存しました。',before)}
function confirmDeleteObservation(pid,logId){const p=state.profiles.find(x=>x.id===pid),log=p?.timeline.find(e=>e.id===logId&&e.kind==='observation');if(!p||!log)return;modal(`<div class="modal-head"><div><h2>観察ログを削除しますか？</h2><p>${esc(p.label||p.username)}の${esc(log.date)}の記録を削除します。</p></div><button class="close" data-close>×</button></div><div class="reason"><label>今回の気づき</label>${esc(log.delta)}</div><p class="hint" style="margin:13px 0 0">人物情報や接点記録は残ります。削除後30秒間は元に戻せます。</p><div class="footer"><button class="btn" data-close>キャンセル</button><button class="btn danger" data-confirm-delete-observation="${esc(pid)}" data-log="${esc(logId)}">削除する</button></div>`)}

function showContactModal(pid){const p=state.profiles.find(x=>x.id===pid);if(!p)return;modal(`<div class="modal-head"><div><h2>接点を記録</h2><p>${esc(p.label||p.username)}との実際の接点を残します。Instagramを見ただけの日とは分けて管理します。</p></div><button class="close" data-close>×</button></div><form id="contactForm" onsubmit="event.preventDefault();saveContact(new FormData(this));return false;"><input type="hidden" name="id" value="${p.id}"><div class="fields"><div class="field"><label>接点があった日</label><input name="date" type="date" value="${iso()}" required></div><div class="field"><label>接点の種類</label><select name="kind"><option>DM</option><option>コメント</option><option>対面</option><option>オンライン通話</option><option>その他</option></select></div><div class="field full"><label>接点メモ</label><textarea name="memo" placeholder="例：イベントについてDMで会話。次回の出展時に声をかける。"></textarea></div></div><div class="footer"><button type="button" class="btn" data-close>キャンセル</button><button class="btn primary" type="submit">接点を保存</button></div></form>`);wireDraft('contactForm',`contact:${pid}`)}
function saveContact(fd){const before=structuredClone(state);const p=state.profiles.find(x=>x.id===fd.get('id'));if(!p)return;const date=fd.get('date'),memo=fd.get('memo').trim(),kind=fd.get('kind');p.lastContact=date;if(memo)p.accountMemo=p.accountMemo?`${p.accountMemo}\n${date}・${kind}：${memo}`:`${date}・${kind}：${memo}`;p.timeline.unshift({id:id(),date,kind:'contact',delta:`${kind}で接点を記録`,action:memo||'接点メモなし',tags:[]});p.updatedAt=new Date().toISOString();save();clearDraft(`contact:${fd.get('id')}`);closeModal();render();toast('最終接触日と接点メモを保存しました。');offerUndo('接点記録を保存しました。',before)}
function taggedProfiles(type,tag){return state.profiles.filter(p=>(p.traits?.[type]||[]).includes(tag))}
function showTagPeople(type,tag){window.tagPeopleContext={type,tag,selected:new Set(taggedProfiles(type,tag).map(p=>p.id))};renderTagPeople()}
function renderTagPeople(){const c=window.tagPeopleContext,people=taggedProfiles(c.type,c.tag),selected=c.selected;modal(`<div class="modal-head"><div><h2>「${esc(c.tag)}」の人物</h2><p>${people.length}人がこの特徴タグに紐付いています。選んだ人物をまとめて更新できます。</p></div><button class="close" data-close>×</button></div><div class="reason"><label>一括編集</label>接点日、アカウントメモ、次に見る日、温度感、追加タグを選択した人物へまとめて反映します。</div><div style="display:flex;justify-content:space-between;align-items:center;margin:13px 0 7px"><label style="font-size:12px;font-weight:800"><input type="checkbox" ${selected.size===people.length&&people.length?'checked':''} onchange="toggleBatchAll(this.checked)"> 全員を選択</label><span class="muted" id="batchCount">${selected.size}人選択</span></div><div style="max-height:280px;overflow:auto;border-top:1px solid var(--line)">${people.map(p=>`<label style="display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer"><input type="checkbox" ${selected.has(p.id)?'checked':''} onchange="toggleBatchPerson('${p.id}',this.checked)">${avatar(p)}<span style="min-width:0;flex:1"><b style="display:block;font-size:13px">${esc(p.label||p.username)}</b><small style="color:var(--faint)">@${esc(p.username)} · 最終接点 ${formatDate(p.lastContact)}</small></span></label>`).join('')||'<p class="muted" style="padding:14px 0">このタグを付与した人物はまだいません。</p>'}</div><div class="footer"><button class="btn" data-close>閉じる</button><button class="btn primary" data-batch-edit ${selected.size?'':'disabled'}>選択した人物を一括編集</button></div>`)}
function toggleBatchPerson(pid,checked){const c=window.tagPeopleContext;if(!c)return;checked?c.selected.add(pid):c.selected.delete(pid);renderTagPeople()}
function toggleBatchAll(checked){const c=window.tagPeopleContext;if(!c)return;c.selected=checked?new Set(taggedProfiles(c.type,c.tag).map(p=>p.id)):new Set();renderTagPeople()}
function batchTraitOptions(){return Object.entries(state.taxonomy).flatMap(([type,tags])=>tags.map(tag=>`<option value="${type}|${esc(tag)}">${({activity:'活動',region:'地域',format:'発信',purpose:'目的',warmth:'温度感'})[type]}：${esc(tag)}</option>`)).join('')}
function showBatchEdit(){const c=window.tagPeopleContext;if(!c||!c.selected.size)return toast('一括編集する人物を選択してください。');modal(`<div class="modal-head"><div><h2>${c.selected.size}人を一括編集</h2><p>入力した項目だけを選択人物に反映します。空欄または「変更しない」は現在の値を保ちます。</p></div><button class="close" data-close>×</button></div><form id="batchForm" onsubmit="event.preventDefault();applyBatch(new FormData(this));return false;"><div class="fields"><div class="field"><label>次に見る日</label><input id="batchNextReview" type="date" name="nextReview">${datePresetButtons('batchNextReview')}</div><div class="field"><label>最終接触日</label><input type="date" name="lastContact"></div><div class="field"><label>温度感</label><select name="warmth"><option value="">変更しない</option>${(state.taxonomy.warmth||[]).map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('')}</select></div><div class="field"><label>追加する特徴タグ</label><select name="trait"><option value="">追加しない</option>${batchTraitOptions()}</select></div><div class="field full"><label>アカウントメモへ追記</label><textarea name="memo" placeholder="例：今週中にイベント告知を確認する。"></textarea><span class="hint">既存メモは残し、日付付きで末尾へ追記します。</span></div></div><div class="footer"><button class="btn" type="button" data-back-tag-list>人物一覧へ戻る</button><button class="btn primary" type="submit">${c.selected.size}人へ反映する</button></div></form>`)}
function applyBatch(fd){const before=structuredClone(state);const c=window.tagPeopleContext;if(!c)return;const review=fd.get('nextReview'),contact=fd.get('lastContact'),warmth=fd.get('warmth'),trait=fd.get('trait'),memo=fd.get('memo').trim();if(!review&&!contact&&!warmth&&!trait&&!memo)return toast('変更する項目を1つ以上入力してください。');const [traitType,traitName]=(trait||'|').split('|');let updated=0;state.profiles.forEach(p=>{if(!c.selected.has(p.id))return;if(review)p.nextReview=review;if(contact)p.lastContact=contact;if(warmth)p.traits.warmth=[warmth];if(traitType&&traitName&&!p.traits[traitType].includes(traitName))p.traits[traitType].push(traitName);if(memo)p.accountMemo=p.accountMemo?`${p.accountMemo}\n${iso()}：${memo}`:`${iso()}：${memo}`;p.updatedAt=new Date().toISOString();updated++});save();closeModal();render();toast(`${updated}人の情報を一括更新しました。`);offerUndo(`${updated}人の一括更新を保存しました。`,before) }
function confirmDelete(pid){const p=state.profiles.find(x=>x.id===pid);if(!p)return;modal(`<div class="modal-head"><div><h2>候補を削除しますか？</h2><p><b>${esc(p.label||p.username)}</b>（@${esc(p.username)}）と観察記録をこの端末から外します。</p></div><button class="close" data-close>×</button></div><div class="reason"><label>ご注意</label>削除後30秒間は元に戻せます。時間を過ぎた後は保存済みバックアップから復元してください。</div><div class="footer"><button class="btn" data-close>キャンセル</button><button class="btn danger" data-confirm-delete="${p.id}">削除する</button></div>`)}

function showWeeklySettings(){const limit=weeklyLimit(),due=dueProfiles().length;modal(`<div class="modal-head"><div><h2>今週の観察枠</h2><p>今週、無理なく確認する人数を決めます。枠を超えた候補は消えずに、今週の棚へ残ります。</p></div><button class="close" data-close>×</button></div><form id="weeklyForm" onsubmit="event.preventDefault();saveWeeklySettings(new FormData(this));return false;"><div class="fields"><div class="field full"><label>今週の観察枠</label><select name="weeklyLimit">${[1,2,3,4,5,6,7].map(n=>`<option value="${n}" ${limit===n?'selected':''}>${n}人</option>`).join('')}</select><span class="hint">現在、今週の確認候補は${due}人です。期限を守れない週があっても問題ありません。</span></div></div><div class="footer"><button class="btn" type="button" data-close>キャンセル</button><button class="btn primary" type="submit">観察枠を保存</button></div></form>`)}

function showSkipModal(pid){const p=state.profiles.find(x=>x.id===pid);if(!p)return;modal(`<div class="modal-head"><div><h2>今回は見送る</h2><p>${esc(p.label||p.username)}を一度、今日の観察から外します。人物や記録は削除されません。</p></div><button class="close" data-close>×</button></div><form id="skipForm" onsubmit="event.preventDefault();applySkip(new FormData(this));return false;"><input type="hidden" name="id" value="${p.id}"><div class="fields"><div class="field"><label>再表示する日</label><select name="days"><option value="7">1週間後</option><option value="14" selected>2週間後</option><option value="30">1か月後</option></select></div><div class="field full"><label>見送る理由（任意）</label><input name="reason" placeholder="例：展示終了後に落ち着いてから確認する"></div></div><div class="footer"><button class="btn" type="button" data-close>キャンセル</button><button class="btn primary" type="submit">見送る</button></div></form>`)}
function applySkip(fd){const before=structuredClone(state);const p=state.profiles.find(x=>x.id===fd.get('id'));if(!p)return;const days=Number(fd.get('days'))||14;p.snoozedUntil=addDays(days);p.snoozeReason=fd.get('reason').trim();p.updatedAt=new Date().toISOString();p.timeline.unshift({id:id(),date:iso(),kind:'snooze',delta:`${days}日間、観察を見送る`,action:p.snoozeReason||'見直す日まで保留',tags:[]});save();closeModal();render();toast(`${p.label||'この候補'}を${formatDate(p.snoozedUntil)}まで見送ります。`);offerUndo('見送り設定を保存しました。',before)}

function prepareMerge(fd){const targetId=fd.get('target'),sourceId=fd.get('source');if(targetId===sourceId)return toast('別の人物を選択してください。');const target=state.profiles.find(p=>p.id===targetId),source=state.profiles.find(p=>p.id===sourceId);if(!target||!source)return;window.mergeContext={targetId,sourceId};modal(`<div class="modal-head"><div><h2>統合を確認</h2><p><b>${esc(source.label||source.username)}</b> の情報を <b>${esc(target.label||target.username)}</b> にまとめます。</p></div><button class="close" data-close>×</button></div><div class="reason"><label>引き継ぐ情報</label>特徴タグ、未分類ラベル、観察・接点タイムライン、アカウントメモ、以前の@名、最終観察日・最終接点日を統合先に残します。</div><div class="warning-note" style="margin-top:12px">統合元の人物カードは通常の棚から消えます。30秒間は元に戻せます。</div><div class="footer"><button class="btn" data-close>キャンセル</button><button class="btn primary" data-confirm-merge>統合する</button></div>`)}
function maxDate(a,b){return !a?b:!b?a:(a>b?a:b)}

function mergeProfiles(){const c=window.mergeContext;if(!c)return;const source=state.profiles.find(p=>p.id===c.sourceId),target=state.profiles.find(p=>p.id===c.targetId);if(!source||!target)return;window.mergeUndo={source:structuredClone(source),target:structuredClone(target),sourceIndex:state.profiles.findIndex(p=>p.id===source.id)};Object.keys(target.traits).forEach(type=>target.traits[type]=[...new Set([...(target.traits[type]||[]),...(source.traits?.[type]||[])])]);target.labels=[...new Set([...(target.labels||[]),...(source.labels||[])])];target.aliases=[...new Set([...(target.aliases||[]),target.username,...(source.aliases||[]),source.username].filter(a=>a&&a!==target.username))];target.timeline=[...(target.timeline||[]),...(source.timeline||[])].sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));if(source.accountMemo&&!target.accountMemo.includes(source.accountMemo))target.accountMemo=target.accountMemo?`${target.accountMemo}\n\n【統合元：${source.label||'@'+source.username}】\n${source.accountMemo}`:source.accountMemo;target.lastObserved=maxDate(target.lastObserved,source.lastObserved);target.lastContact=maxDate(target.lastContact,source.lastContact);target.nextReview=minDate(target.nextReview,source.nextReview);target.updatedAt=new Date().toISOString();target.timeline.unshift({id:id(),date:iso(),kind:'merge',delta:`${source.label||'@'+source.username} を統合`,action:'人物情報を統合',tags:[]});state.profiles=state.profiles.filter(p=>p.id!==source.id);save();closeModal();render();toast('人物を統合しました。30秒以内なら元に戻せます。');clearTimeout(window.mergeUndoTimer);window.mergeUndoTimer=setTimeout(()=>window.mergeUndo=null,30000)}

function showDataTools(){const h=backupHealth(),backupText=h.at?`${new Date(h.at).toLocaleDateString('ja-JP')}に保存済み`:'まだバックアップされていません',changeText=h.at?`以降に更新した人物：${h.changed}人`:`バックアップ前の人物：${h.changed}人`;modal(`<div class="modal-head"><div><h2>データの保存・復元</h2><p>データはこのブラウザに保存されています。必要なときにバックアップをファイルとして管理できます。</p></div><button class="close" data-close>×</button></div><div class="data-summary"><b>現在の保存内容：</b>${state.profiles.length}人の人物、特徴タグ、観察・接点記録<br><b>バックアップ：</b>${backupText} · ${changeText}</div><div class="tool-grid"><button class="tool-choice" data-backup-now><b>⇩</b><strong>バックアップを保存</strong><span>現在の全データをJSONファイルとして書き出します。</span></button><button class="tool-choice" data-restore-now><b>↥</b><strong>バックアップを復元</strong><span>保存済みJSONから人物・タグ・記録を戻します。</span></button><button class="tool-choice" data-import><b>⇩</b><strong>LinkageのJSONを読み込む</strong><span>既存の人物管理データを追加で取り込みます。</span></button><button class="tool-choice" data-merge-people><b>⇄</b><strong>人物を統合</strong><span>重複した人物と記録を、確認しながら1件にまとめます。</span></button><button class="tool-choice" data-shelf-manager><b>▣</b><strong>保留・アーカイブの棚</strong><span>通常の棚から外した人物を見直します。</span></button><button class="tool-choice" data-close><b>×</b><strong>閉じる</strong><span>データは引き続きこの端末に保存されます。</span></button></div>`)}
function showOcrModal(){modal(`<div class="modal-head"><div><h2>スクショから追加</h2><p>Instagramプロフィール上部だけから、表示名と@アカウント名の候補を読み取ります。</p></div><button class="close" data-close>×</button></div><div class="ocr-drop"><div class="ocr-symbol">⌁</div><strong>保存済みスクリーンショットを選択</strong><p>@アカウント名と表示名が写っているプロフィール上部を含めてください。カメラ撮影には対応せず、PNGまたはWebPのスクリーンショットだけを選びます。</p><label class="btn primary small" for="ocrFile">スクショを選ぶ</label><input id="ocrFile" type="file" accept=".png,.webp,image/png,image/webp"></div><div class="ocr-progress" id="ocrProgress"><div class="progress-line"><span id="ocrBar"></span></div><div class="progress-text" id="ocrText">プロフィール上部を準備しています…</div></div><div class="ocr-privacy"><strong>プライバシー：</strong>画像は保存・送信しません。端末内でプロフィール上部だけを一時的に解析し、候補確認後に破棄します。</div>`);$('#ocrFile').addEventListener('change',handleOcrFile)}
function cropInstagramProfileHeader(file){return new Promise((resolve,reject)=>{const image=new Image(),objectUrl=URL.createObjectURL(file);image.onload=()=>{try{const sourceWidth=image.naturalWidth,sourceHeight=image.naturalHeight,sourceY=Math.round(sourceHeight*.045),cropHeight=Math.max(120,Math.round(sourceHeight*.085)),scale=Math.min(2.2,Math.max(1.65,1600/sourceWidth)),canvas=document.createElement('canvas');canvas.width=Math.round(sourceWidth*scale);canvas.height=Math.round(cropHeight*scale);const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,sourceY,sourceWidth,cropHeight,0,0,canvas.width,canvas.height);const pixels=ctx.getImageData(0,0,canvas.width,canvas.height);for(let i=0;i<pixels.data.length;i+=4){const gray=pixels.data[i]*.299+pixels.data[i+1]*.587+pixels.data[i+2]*.114,value=gray<205?0:255;pixels.data[i]=value;pixels.data[i+1]=value;pixels.data[i+2]=value;pixels.data[i+3]=255}ctx.putImageData(pixels,0,0);URL.revokeObjectURL(objectUrl);resolve(canvas)}catch(error){URL.revokeObjectURL(objectUrl);reject(error)}};image.onerror=()=>{URL.revokeObjectURL(objectUrl);reject(new Error('画像を読み込めませんでした。'))};image.src=objectUrl})}
function extractOcrCandidates(data){const blocked=new Set(['follow','following','message','contact','editprofile','posts','followers','instagram','meta','投稿','フォロワー','フォロー中','メッセージ','フォローする','プロフィールを編集','戻る']),words=(data.words||[]).map(word=>({text:String(word.text||'').trim(),confidence:Number(word.confidence||0),y:Number(word.bbox?.y0||0)})).filter(word=>word.text),candidates=words.map(word=>{const candidate=username(word.text.replace(/^@/,''));if(!candidate||blocked.has(candidate.toLowerCase())||/^\d+$/.test(candidate))return null;const letters=(candidate.match(/[A-Za-z]/g)||[]).length,digits=(candidate.match(/\d/g)||[]).length;if(letters<2||digits>letters)return null;return{candidate,score:word.confidence+(candidate===candidate.toLowerCase()?8:0)+(/[._]/.test(candidate)?3:0)-word.y*.01,confidence:word.confidence}}).filter(Boolean).sort((a,b)=>b.score-a.score),best=candidates.find(item=>item.confidence>=58)||null,lines=(data.lines||[]).map(line=>String(line.text||'').trim()).filter(Boolean),label=lines.find(line=>{const compact=line.replace(/\s/g,'');return compact.length>=2&&compact.length<=40&&!/^\d+[.,\d]*$/.test(compact)&&compact.toLowerCase()!==(best?.candidate||'').toLowerCase()&&/[\u3040-\u30ff\u3400-\u9fff]/.test(compact)&&!/(投稿|フォロワー|フォロー中|メッセージ|フォローする)/.test(compact)})||'';return{username:best?.candidate||'',label}}
async function handleOcrFile(event){const file=event.target.files?.[0];if(!file)return;if(!['image/png','image/webp'].includes(file.type)){event.target.value='';return toast('PNGまたはWebPのスクリーンショットを選んでください。')}const progress=$('#ocrProgress');progress.classList.add('show');const bar=$('#ocrBar'),text=$('#ocrText'),update=m=>{const pct=Math.round((m.progress||0)*100);bar.style.width=`${pct}%`;text.textContent=m.status==='recognizing text'?`プロフィール上部を読み取っています… ${pct}%`:'プロフィール上部を準備しています…'};try{if(!window.Tesseract)throw new Error('OCRライブラリを読み込めませんでした。');const headerImage=await cropInstagramProfileHeader(file);text.textContent='アカウント名と表示名の候補を読み取っています…';const result=await Tesseract.recognize(headerImage,'eng+jpn',{logger:update}),candidate=extractOcrCandidates(result.data||{});if(!candidate.username){toast('アカウント名を確実に判定できませんでした。誤った候補は入れず、@アカウント名だけ手入力してください。');showProfileModal(null,{label:candidate.label})}else{showProfileModal(null,{username:candidate.username,label:candidate.label});toast('プロフィール上部だけから候補を読み取りました。内容を確認してから保存してください。')}}catch(error){console.warn(error);toast('OCRを実行できませんでした。URLまたは@アカウント名から追加できます。');showProfileModal()}finally{event.target.value=''}}

function exportBackup(){state.meta={...(state.meta||{}),lastBackupAt:new Date().toISOString(),lastBackupProfiles:state.profiles.length};save();const pack={format:'prospect-loop-relationship-lens',version:2,exportedAt:state.meta.lastBackupAt,summary:{profiles:state.profiles.length},data:state};const blob=new Blob([JSON.stringify(pack,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`prospect-loop-lens_${iso()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);toast(`バックアップを保存しました（${state.profiles.length}人）。`);if($('#modalBackdrop').classList.contains('show'))showDataTools()}
function showRestore(){modal(`<div class="modal-head"><div><h2>バックアップを復元</h2><p>Prospect Loop Relationship Lensのバックアップを選びます。現在のデータは確認後に置き換わります。</p></div><button class="close" data-close>×</button></div><div class="drop"><strong>バックアップJSONを選択</strong><p>この端末で作成したバックアップのみ対応します。ファイルは端末内で読み取り、サーバーへ送信しません。</p><label class="btn primary" for="restoreFile">バックアップを選ぶ</label><input id="restoreFile" type="file" accept="application/json,.json"></div>`);$('#restoreFile').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{const b=JSON.parse(await f.text());if(b.format!=='prospect-loop-relationship-lens'||!b.data?.profiles)throw Error();window.restorePack=b;modal(`<div class="modal-head"><div><h2>復元を確認</h2><p>作成日時：${esc(new Date(b.exportedAt).toLocaleString('ja-JP'))}<br>候補：${b.data.profiles.length}人</p></div><button class="close" data-close>×</button></div><div class="reason"><label>この内容で置き換えます</label>現在の人物・タグ・観察記録はバックアップの内容へ置き換わります。</div><div class="footer"><button class="btn" data-close>キャンセル</button><button class="btn primary" data-confirm-restore>復元する</button></div>`)}catch{toast('対応していないバックアップです。')}})}

function showImport(){modal(`<div class="modal-head"><div><h2>Linkageの人物JSONを取り込む</h2><p>名前、Instagramリンク、ラベル、人物メモ、最終接触日だけを取り込みます。既存の@アカウント名は重複追加しません。</p></div><button class="close" data-close>×</button></div><div class="drop"><strong>LinkageのJSONを選択</strong><p>既存アプリのエクスポートJSONまたはデータJSONに対応します。Instagramリンクがある人物だけを候補として追加します。</p><label class="btn primary" for="linkageFile">JSONを選ぶ</label><input id="linkageFile" type="file" accept="application/json,.json"></div>`);$('#linkageFile').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{const raw=JSON.parse(await f.text()), people=raw.people||raw.data?.people;if(!Array.isArray(people))throw Error();const rows=people.map(p=>{const link=(p.links||[]).find(l=>/instagram\.com/i.test(l.url||''));const u=username(link?.url);return u?{source:p,u}:null}).filter(Boolean);window.importRows=rows;modal(`<div class="modal-head"><div><h2>取り込みを確認</h2><p>Instagramリンクを持つ${rows.length}人を検出しました。名前・Instagram URL・ラベル・人物メモ・最終接点日だけを追加します。</p></div><button class="close" data-close>×</button></div><div class="reason"><label>取り込まない情報</label>性別、アイコン、汎用メモの記録本文、バンド・カレンダー情報は取り込みません。</div><div class="footer"><button class="btn" data-close>キャンセル</button><button class="btn primary" data-confirm-import>取り込む</button></div>`)}catch{toast('人物配列を含むLinkage JSONを選択してください。')}})}
function importLinkage(){const rows=window.importRows||[];let added=0;rows.forEach(({source:p,u})=>{if(state.profiles.some(x=>x.username.toLowerCase()===u.toLowerCase()))return;state.profiles.push({id:id(),username:u,profileUrl:urlFor(u),label:p.name||`@${u}`,reason:p.memo||'',nextReview:'',traits:{activity:[],region:[],format:[],purpose:[],warmth:[]},labels:p.labels||[],timeline:[],lastObserved:'',lastContact:p.lastContactDate||'',accountMemo:p.memo||'',status:'active',reviewAfter:'',statusReason:'',snoozedUntil:'',snoozeReason:'',aliases:[],avatar:['purple','coral','mint','blue','amber'][state.profiles.length%5],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});added++});save();closeModal();render();toast(`${added}人をLinkageから追加しました。`)}

function renameTaxonomyTag(type,oldName,newName){const before=structuredClone(state);const next=String(newName||'').trim();if(!next)return toast('タグ名を入力してください。');if(next===oldName){closeModal();return}if(state.taxonomy[type].includes(next))return toast('同じ分類に同名のタグがあります。');state.taxonomy[type]=state.taxonomy[type].map(x=>x===oldName?next:x);state.profiles.forEach(p=>{const values=p.traits?.[type]||[];p.traits[type]=[...new Set(values.map(x=>x===oldName?next:x))]});save();closeModal();render();toast(`「${oldName}」を「${next}」へ変更しました。`);offerUndo('タグ名の変更を保存しました。',before)}

function showTagMerge(type,tag){const targets=(state.taxonomy[type]||[]).filter(t=>t!==tag);if(!targets.length)return toast('統合先になる別のタグがありません。');modal(`<div class="modal-head"><div><h2>タグを統合</h2><p>「${esc(tag)}」を別のタグへまとめます。人物や観察記録は残ります。</p></div><button class="close" data-close>×</button></div><form id="tagMergeForm" onsubmit="event.preventDefault();mergeTaxonomyTag(this.type.value,this.from.value,this.to.value);return false;"><input type="hidden" name="type" value="${esc(type)}"><input type="hidden" name="from" value="${esc(tag)}"><div class="fields"><div class="field full"><label>統合先タグ</label><select name="to">${targets.map(t=>`<option value="${esc(t)}">${esc(t)}（${countTag(type,t)}人）</option>`).join('')}</select><span class="hint">「${esc(tag)}」が付いている${countTag(type,tag)}人へ、統合先タグを付与してから元タグを外します。</span></div></div><div class="footer"><button class="btn" type="button" data-close>キャンセル</button><button class="btn primary" type="submit">タグを統合</button></div></form>`)}

function showDeleteTag(type,tag){const used=countTag(type,tag);modal(`<div class="modal-head"><div><h2>特徴タグを削除しますか？</h2><p>「${esc(tag)}」は現在${used}人に付与されています。</p></div><button class="close" data-close>×</button></div><div class="reason"><label>削除の影響</label>このタグは分類一覧から消え、${used}人の人物プロフィールからも外れます。人物、観察記録、他の特徴タグは削除されません。</div><div class="footer"><button class="btn" data-close>キャンセル</button><button class="btn danger" data-confirm-delete-tag="1" data-type="${esc(type)}" data-tag="${esc(tag)}">タグを削除する</button></div>`)}
function deleteTaxonomyTag(type,tag){const before=structuredClone(state);state.taxonomy[type]=state.taxonomy[type].filter(x=>x!==tag);state.profiles.forEach(p=>{p.traits[type]=(p.traits?.[type]||[]).filter(x=>x!==tag)});save();closeModal();render();toast(`「${tag}」を削除しました。`);offerUndo('タグを削除しました。',before)}
document.addEventListener('click',e=>{const t=e.target.closest('button,[data-view]');if(!t)return;if(t.dataset.view){switchView(t.dataset.view);return}if(t.dataset.mobileQuickRecord!==undefined){showQuickRecordSheet(t.dataset.mobileQuickRecord);return}if(t.dataset.mobileFollowup!==undefined){deferAfterInstagram(t.dataset.mobileFollowup);return}if(t.dataset.logMenu!==undefined){showObservationLogActions(t.dataset.logMenu,t.dataset.log);return}if(t.dataset.editObservation!==undefined){showRecordModal(t.dataset.editObservation,t.dataset.log);return}if(t.dataset.deleteObservation!==undefined){confirmDeleteObservation(t.dataset.deleteObservation,t.dataset.log);return}if(t.dataset.confirmDeleteObservation!==undefined){deleteObservation(t.dataset.confirmDeleteObservation,t.dataset.log);return}if(t.dataset.datePreset){applyDatePreset(t.dataset.datePreset,t);return}if(t.dataset.restoreDraft){restoreDraft(t.dataset.restoreDraft);return}if(t.dataset.discardDraft){discardDraft(t.dataset.discardDraft);return}if(t.dataset.undoLatest!==undefined){undoLatest();return}if(t.id==='addBtn'||t.id==='quickAdd'||t.id==='emptyAdd'){showProfileModal();return}if(t.id==='bottomAdd'){showAddMenu();return}if(t.id==='backupBtn'){exportBackup();return}if(t.id==='restoreBtn'){showRestore();return}if(t.id==='quickOcr'){showOcrModal();return}if(t.id==='quickImport'||t.id==='importBtn'){showImport();return}if(t.id==='dataToolsBtn'){showDataTools();return}if(t.id==='weeklySettingsBtn'){showWeeklySettings();return}if(t.id==='shelfManagerBtn'){showShelfManager();return}if(t.dataset.addManual!==undefined){showProfileModal();return}if(t.dataset.ocr!==undefined){showOcrModal();return}if(t.dataset.import!==undefined){showImport();return}if(t.dataset.dataTools!==undefined){showDataTools();return}if(t.dataset.weeklySettings!==undefined){showWeeklySettings();return}if(t.dataset.shelfManager!==undefined){showShelfManager();return}if(t.dataset.mergePeople!==undefined){showMergePicker();return}if(t.dataset.reactivate!==undefined){reactivateProfile(t.dataset.reactivate);return}if(t.dataset.skip!==undefined){showSkipModal(t.dataset.skip);return}if(t.dataset.backupNow!==undefined){exportBackup();return}if(t.dataset.restoreNow!==undefined){showRestore();return}if(t.dataset.open){openInstagram(t.dataset.open);return}if(t.dataset.showTagPeople){showTagPeople(t.dataset.type,t.dataset.tag);return}if(t.dataset.contact){showContactModal(t.dataset.contact);return}if(t.dataset.record){showRecordModal(t.dataset.record);return}if(t.dataset.manage){showProfileModal(t.dataset.manage);return}if(t.dataset.close!==undefined||t.id==='modalBackdrop'){closeModal();return}if(t.dataset.delete){confirmDelete(t.dataset.delete);return}if(t.dataset.confirmDelete){doDelete(t.dataset.confirmDelete);return}if(t.dataset.undo!==undefined){undo();return}if(t.dataset.confirmRestore!==undefined){restore();return}if(t.dataset.confirmImport!==undefined){importLinkage();return}if(t.dataset.confirmMerge!==undefined){mergeProfiles();return}if(t.dataset.undoMerge!==undefined){undoMerge();return}if(t.dataset.lens){const k=t.dataset.lens;state.ui.filter=k==='weekly'?'due':k==='collab'?'collab':k==='unobserved'?'unobserved':'all';switchView('people');return}if(t.dataset.filter){state.ui.filter=t.dataset.filter;save();renderPeople();return}if(t.dataset.peopleLayout){state.ui.peopleLayout=t.dataset.peopleLayout==='list'?'list':'cards';save();renderPeople();return}if(t.dataset.trait){const a=window.__traits[t.dataset.trait]||[],v=t.dataset.value;window.__traits[t.dataset.trait]=a.includes(v)?a.filter(x=>x!==v):[...a,v];t.classList.toggle('on');return}if(t.dataset.addTag){addTaxonomy(t.dataset.addTag);return}if(t.dataset.batchEdit!==undefined){showBatchEdit();return}if(t.dataset.backTagList!==undefined){renderTagPeople();return}if(t.dataset.manageTag){showTagManage(t.dataset.type,t.dataset.tag);return}if(t.dataset.deleteTag){showDeleteTag(t.dataset.type,t.dataset.tag);return}if(t.dataset.confirmDeleteTag){deleteTaxonomyTag(t.dataset.type,t.dataset.tag);return}if(t.dataset.mergeTag){showTagMerge(t.dataset.type,t.dataset.tag);return}if(t.dataset.tagFilter){const [type,val]=t.dataset.tagFilter.split('|');state.ui.filter='all';switchView('people');setTimeout(()=>{$('#search').value=val;renderPeople()},0);return}});
document.addEventListener('submit',e=>{if(e.target.id==='profileForm'){e.preventDefault();saveProfile(new FormData(e.target))}if(e.target.id==='recordForm'){e.preventDefault();saveRecord(new FormData(e.target))}if(e.target.id==='weeklyForm'){e.preventDefault();saveWeeklySettings(new FormData(e.target))}if(e.target.id==='skipForm'){e.preventDefault();applySkip(new FormData(e.target))}});document.addEventListener('input',e=>{if(e.target.id==='search')renderPeople()});
load();switchView(state.ui.view||'today');
</script>
