/* Modern component architecture
   ─────────────────────────────────────────────────────────────────────────
   Semantic tokens + composable component surfaces. Existing class names stay
   intact for backward compatibility; c-* classes are added after each render.
*/
:root{
  --font-sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;
  --radius-control:12px;--radius-card:20px;--radius-panel:24px;--radius-modal:26px;
  --surface-muted:rgba(246,249,255,.72);--surface-card:rgba(255,255,255,.70);--surface-elevated:rgba(255,255,255,.88);
  --border-subtle:rgba(112,139,186,.13);--border-bright:rgba(255,255,255,.88);
  --text-primary:var(--ink-strong);--text-secondary:var(--soft);--text-tertiary:var(--faint);
  --accent:var(--blue);--accent-strong:var(--blue-deep);--accent-wash:rgba(83,109,243,.10);
  --ease-standard:cubic-bezier(.2,.8,.2,1);--ease-enter:cubic-bezier(.16,1,.3,1);
  --duration-fast:160ms;--duration-base:220ms;
}

/* Component primitives */
.c-surface{border:1px solid var(--border-bright);background:linear-gradient(145deg,var(--surface-card),rgba(255,255,255,.52));box-shadow:0 8px 22px rgba(79,100,147,.065)}
.c-surface[data-surface='quiet']{background:var(--surface-muted);border-color:var(--border-subtle);box-shadow:none}
.c-surface[data-surface='accent']{background:linear-gradient(135deg,rgba(83,109,243,.10),rgba(255,255,255,.72),rgba(154,120,239,.08));border-color:rgba(83,109,243,.18)}
.c-interactive{transition:transform var(--duration-base) var(--ease-standard),box-shadow var(--duration-base) var(--ease-standard),background var(--duration-fast) ease,border-color var(--duration-fast) ease}
.c-interactive:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)}
.c-stack{display:grid;gap:var(--stack-gap,var(--space-3))}
.c-inline{display:flex;align-items:center;gap:var(--inline-gap,var(--space-2))}
.c-card-title{color:var(--text-primary);letter-spacing:-.03em}
.c-meta{color:var(--text-tertiary);font-size:10px;font-weight:760;line-height:1.45}
.c-icon-button{display:inline-grid;place-items:center;flex:0 0 auto}
.c-section{border-top:1px solid var(--line);padding-top:var(--space-4);margin-top:var(--space-4)}

/* Consistent component treatment across originally separate feature additions */
:where(.panel,.profile,.lens,.category,.tool-choice,.queue-card,.detail-section,.ft-hub,.tag-review,.theme-panel,.thread-card,.shelf-item,.person-list-row,.observation-person,.previous-observation,.next-step,.summary-row)[data-component]{border-radius:var(--component-radius,var(--radius-card))}
:where(.panel,.profile,.lens,.category,.tool-choice,.queue-card,.detail-section,.ft-hub,.tag-review,.theme-panel,.thread-card,.shelf-item,.person-list-row)[data-component='surface']{isolation:isolate}
:where(.queue-card,.detail-section,.ft-hub,.tag-review,.theme-panel,.thread-card,.next-step,.summary-row)[data-component='context']{--component-radius:var(--r-md)}
:where(.btn,.filter,.more,.close,.log-more,.trait-options button,.tag-btn,.tag-manage,.date-presets button)[data-component='control']{font-family:var(--font-sans);transition:transform var(--duration-fast) var(--ease-standard),background var(--duration-fast) ease,color var(--duration-fast) ease,border-color var(--duration-fast) ease,box-shadow var(--duration-fast) ease}
:where(.btn,.filter,.more,.close,.log-more,.trait-options button,.tag-btn,.tag-manage,.date-presets button)[data-component='control']:active{transform:translateY(1px) scale(.985)}

/* Modern CSS safeguards */
:where(button,input,textarea,select){font-family:var(--font-sans)}
:where(.modal,.today-card,.profile,.lens,.category,.ft-hub,.queue-card,.detail-section,.theme-panel){scroll-margin-top:var(--space-6)}
@media (prefers-reduced-motion:reduce){:where(*,::before,::after){animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
@media (hover:none){.c-interactive:hover{transform:none;box-shadow:inherit}}

/* Intentional utility classes used by the component layer */
.u-visually-hidden{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.u-nowrap{white-space:nowrap}.u-truncate{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

<script>
const KEY='prospect_loop_relationship_lens_v1';const DRAFT_KEY='prospect_loop_relationship_lens_drafts_v1';
const DEFAULT_TAXONOMY={activity:['イラスト','DJ','イベント','地域店','教育','BtoB'],region:['和歌山','関西','オンライン'],format:['作品紹介','イベント告知','舞台裏','ノウハウ'],purpose:['応援','学ぶ','協業','商談','紹介'],warmth:['初見','気になる','接点あり','継続観察']};
let state={profiles:[],actions:[],threads:[],followThroughItems:[],taxonomy:structuredClone(DEFAULT_TAXONOMY),taxonomyMeta:{activity:{},region:{},format:{},purpose:{},warmth:{}},ui:{view:'today',filter:'all',weeklyLimit:3,peopleLayout:'cards'},meta:{lastBackupAt:'',lastBackupProfiles:0,schemaVersion:2}},drafts={};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));
const id=()=>`p_${Date.now()}_${Math.random().toString(36).slice(2,7)}`;
const iso=()=>new Date().toISOString().slice(0,10);
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const formatDate=d=>!d?'まだ見ていません':new Date(`${d}T00:00:00`).toLocaleDateString('ja-JP',{month:'numeric',day:'numeric'});
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.profiles)){state={...state,...x,taxonomy:{...structuredClone(DEFAULT_TAXONOMY),...(x.taxonomy||{})},ui:{view:'today',filter:'all',weeklyLimit:3,peopleLayout:'cards',...(x.ui||{})},meta:{lastBackupAt:'',lastBackupProfiles:0,...(x.meta||{})}}}}catch(e){}migrate();loadDrafts()}
function migrate(){
  state.ui={view:'today',filter:'all',weeklyLimit:3,peopleLayout:'cards',review:{activeWeekKey:'',dismissedWeekKey:'',inProgressCardIds:[],processedCardIds:[],weeklyCap:4},...(state.ui||{})};state.ui.review={activeWeekKey:'',dismissedWeekKey:'',inProgressCardIds:[],processedCardIds:[],weeklyCap:4,...(state.ui.review||{})};
  state.meta={lastBackupAt:'',lastBackupProfiles:0,schemaVersion:2,...(state.meta||{})};
  state.actions=Array.isArray(state.actions)?state.actions:[];
  state.threads=Array.isArray(state.threads)?state.threads:[];
  state.followThroughItems=Array.isArray(state.followThroughItems)?state.followThroughItems:[];
  state.taxonomy={...structuredClone(DEFAULT_TAXONOMY),...(state.taxonomy||{})};
  state.taxonomyMeta={activity:{},region:{},format:{},purpose:{},warmth:{},...(state.taxonomyMeta||{})};
  Object.entries(state.taxonomy).forEach(([type,tags])=>{state.taxonomyMeta[type]=state.taxonomyMeta[type]||{};(tags||[]).forEach(tag=>{state.taxonomyMeta[type][tag]={status:'formal',definition:'',aliases:[],createdAt:'',lastReviewedAt:'',keepReason:'',...(state.taxonomyMeta[type][tag]||{})}})});
  state.profiles=state.profiles.map(p=>({...p,
    traits:{activity:[],region:[],format:[],purpose:[],warmth:[],...(p.traits||{})},
    labels:p.labels||[],
    timeline:(p.timeline||[]).map(e=>({...e,id:e.id||id(),kind:e.kind||'observation',date:e.date||'',delta:e.delta||'',action:e.action||'',tags:e.tags||[]})),
    lastObserved:p.lastObserved||'',lastContact:p.lastContact||'',accountMemo:p.accountMemo||'',nextReview:p.nextReview||'',
    status:['active','paused','graduated'].includes(p.status)?p.status:'active',reviewAfter:p.reviewAfter||'',statusReason:p.statusReason||'',snoozedUntil:p.snoozedUntil||'',snoozeReason:p.snoozeReason||'',
    aliases:[...new Set((p.aliases||[]).filter(Boolean))],avatar:p.avatar||['purple','coral','mint','blue','amber'][Math.floor(Math.random()*5)],
    relationshipSummary:{overview:p.relationshipSummary?.overview||'',carePoints:p.relationshipSummary?.carePoints||'',watchSignals:p.relationshipSummary?.watchSignals||'',updatedAt:p.relationshipSummary?.updatedAt||''}
  }));
  state.actions=state.actions.filter(a=>a&&a.profileId&&state.profiles.some(p=>p.id===a.profileId)).map(a=>({
    id:a.id||`a_${Date.now()}_${Math.random().toString(36).slice(2,7)}`,
    profileId:a.profileId,threadId:a.threadId||'',type:a.type||'follow_up',title:a.title||'',note:a.note||'',status:['open','waiting','done','skipped','cancelled'].includes(a.status)?a.status:'open',
    priority:['low','normal','high'].includes(a.priority)?a.priority:'normal',dueDate:a.dueDate||'',reviewDate:a.reviewDate||a.dueDate||'',source:{kind:a.source?.kind||'manual',timelineId:a.source?.timelineId||''},
    completedAt:a.completedAt||'',completedNote:a.completedNote||'',skippedAt:a.skippedAt||'',skipReason:a.skipReason||'',createdAt:a.createdAt||new Date().toISOString(),updatedAt:a.updatedAt||new Date().toISOString()
  }));
  state.threads=state.threads.filter(t=>t&&t.title).map(t=>({
    id:t.id||`t_${Date.now()}_${Math.random().toString(36).slice(2,7)}`,
    title:String(t.title||'').trim(),purpose:t.purpose||'',status:['nurturing','active','waiting','done','skipped'].includes(t.status)?t.status:'nurturing',reviewDate:t.reviewDate||'',
    profileIds:[...new Set((t.profileIds||[]).filter(pid=>state.profiles.some(p=>p.id===pid)))],
    actionIds:[...new Set((t.actionIds||[]).filter(aid=>state.actions.some(a=>a.id===aid)))],notes:t.notes||'',createdAt:t.createdAt||new Date().toISOString(),updatedAt:t.updatedAt||new Date().toISOString()
  }));
  state.threads.forEach(t=>t.actionIds.forEach(aid=>{const a=state.actions.find(a=>a.id===aid);if(a)a.threadId=t.id}));
  state.followThroughItems=state.followThroughItems.filter(item=>item&&String(item.title||'').trim()).map(item=>{
    const kind=['inbox','event','commitment'].includes(item.kind)?item.kind:'inbox';
    const defaultStatus=kind==='event'?'planned':kind==='commitment'?'mentioned':'open';
    const allowed={inbox:['open','promoted','archived','discarded'],event:['planned','active','completed','missed','archived'],commitment:['mentioned','self_waiting','other_waiting','active','done','skipped']}[kind];
    const next=item.nextReviewAt||item.nextSurfaceAt||'';
    return {id:item.id||`ft_${Date.now()}_${Math.random().toString(36).slice(2,8)}`,kind,title:String(item.title||'').trim(),note:item.note||'',status:allowed.includes(item.status)?item.status:defaultStatus,
      profileIds:[...new Set((item.profileIds||[]).filter(pid=>state.profiles.some(p=>p.id===pid)))],threadId:state.threads.some(t=>t.id===item.threadId)?item.threadId:'',actionId:state.actions.some(a=>a.id===item.actionId)?item.actionId:'',
      eventDate:item.eventDate||'',contactByDate:item.contactByDate||'',followUpReviewDate:item.followUpReviewDate||'',nextReviewAt:next,nextSurfaceAt:item.nextSurfaceAt||next,
      lastSurfacedAt:item.lastSurfacedAt||'',lastSurfacedWeek:item.lastSurfacedWeek||'',lastSurfaceReason:item.lastSurfaceReason||'',surfaceCount:Number(item.surfaceCount)||0,deferCount:Number(item.deferCount)||0,snoozedUntil:item.snoozedUntil||'',
      source:{kind:item.source?.kind||'manual',sourceItemId:item.source?.sourceItemId||''},promotedTo:{type:item.promotedTo?.type||'',id:item.promotedTo?.id||''},createdAt:item.createdAt||new Date().toISOString(),updatedAt:item.updatedAt||new Date().toISOString(),resolvedAt:item.resolvedAt||''};
  });
  const validReviewIds=new Set([...(state.followThroughItems||[]).map(item=>item.id),...(state.actions||[]).map(action=>`action:${action.id}`)]);
  state.ui.review.inProgressCardIds=(state.ui.review.inProgressCardIds||[]).filter(itemId=>validReviewIds.has(itemId));
  state.ui.review.processedCardIds=(state.ui.review.processedCardIds||[]).filter(itemId=>validReviewIds.has(itemId));
}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function loadDrafts(){try{const value=JSON.parse(localStorage.getItem(DRAFT_KEY)||'{}');drafts=value&&typeof value==='object'?value:{}}catch(e){drafts={}}}
function saveDrafts(){localStorage.setItem(DRAFT_KEY,JSON.stringify(drafts))}
function dateMonthEnd(){const d=new Date();return new Date(d.getFullYear(),d.getMonth()+1,0).toISOString().slice(0,10)}
function datePresetButtons(target){return `<div class="date-presets" aria-label="次に見る日の候補"><button type="button" data-date-preset="${target}" data-preset-days="1">明日</button><button type="button" data-date-preset="${target}" data-preset-days="7">1週間後</button><button type="button" data-date-preset="${target}" data-preset-days="14">2週間後</button><button type="button" data-date-preset="${target}" data-preset-month-end="1">月末</button><button type="button" data-date-preset="${target}" data-preset-clear="1">指定なし</button></div>`}
function applyDatePreset(target,button){const input=$('#'+target);if(!input)return;input.value=button.dataset.presetClear!==undefined?'':button.dataset.presetMonthEnd!==undefined?dateMonthEnd():addDays(Number(button.dataset.presetDays)||0);input.dispatchEvent(new Event('input',{bubbles:true}));input.dispatchEvent(new Event('change',{bubbles:true}))}
function formSnapshot(form){return Object.fromEntries([...new FormData(form).entries()].filter(([key])=>key!=='id'))}
function wireDraft(formId,key){const form=$('#'+formId);if(!form)return;form.dataset.draftKey=key;const persist=()=>{const value=formSnapshot(form);if(Object.values(value).some(v=>String(v).trim())){drafts[key]=value;saveDrafts()}};form.addEventListener('input',persist);form.addEventListener('change',persist);if(drafts[key]){const offer=document.createElement('div');offer.className='draft-offer';offer.innerHTML=`<span>入力途中の下書きがあります</span><div><button type="button" data-restore-draft="${key}">戻す</button><button type="button" data-discard-draft="${key}">破棄</button></div>`;form.prepend(offer)}}
function restoreDraft(key){const form=$$('form').find(item=>item.dataset.draftKey===key),value=drafts[key];if(!form||!value)return;Object.entries(value).forEach(([name,item])=>{const field=form.elements[name];if(field)field.value=item});form.querySelector('.draft-offer')?.remove();toast('下書きを戻しました。')}
function discardDraft(key){delete drafts[key];saveDrafts();$$('form').find(item=>item.dataset.draftKey===key)?.querySelector('.draft-offer')?.remove();toast('下書きを破棄しました。')}
function clearDraft(key){if(!drafts[key])return;delete drafts[key];saveDrafts()}
function offerUndo(message,before){if(!before)return;window.latestUndo=before;const bar=$('#undoBar');bar.innerHTML=`<span>${esc(message)}</span><button type="button" data-undo-latest>元に戻す</button>`;bar.classList.add('show');clearTimeout(window.latestUndoTimer);window.latestUndoTimer=setTimeout(()=>{window.latestUndo=null;bar.classList.remove('show')},30000)}
function undoLatest(){if(!window.latestUndo)return;state=structuredClone(window.latestUndo);migrate();save();render();window.latestUndo=null;clearTimeout(window.latestUndoTimer);$('#undoBar').classList.remove('show');toast('直前の変更を元に戻しました。')}
function undo(){undoLatest()}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(window.t);window.t=setTimeout(()=>el.classList.remove('show'),3300)}
function username(value){let v=String(value||'').trim();const m=v.match(/(?:https?:\/\/)?(?:www\.)?instagram\.com\/(?:[^/]+\/)?([A-Za-z0-9._]+)/i);if(m)v=m[1];v=v.replace(/^@/,'').replace(/\?.*$/,'').replace(/\/.*$/,'');return /^[A-Za-z0-9._]{1,40}$/.test(v)&&!['p','reel','reels','stories','explore','accounts'].includes(v.toLowerCase())?v:''}
function urlFor(u){return `https://www.instagram.com/${u}/`}
function initials(p){return (p.label||p.username||'?').replace(/^@/,'').slice(0,2)}
function avatar(p,big=false){return `<div class="avatar ${esc(p.avatar||'purple')} ${big?'big':''}">${esc(initials(p))}</div>`}
function allTraits(p){return Object.entries(p.traits||{}).flatMap(([type,arr])=>(arr||[]).map(x=>({type,value:x}))).concat((p.labels||[]).map(x=>({type:'label',value:x}))) }
function traitHTML(p,max=5){return `<div class="trait-row">${allTraits(p).slice(0,max).map(t=>`<span class="chip ${t.type}">${esc(t.value)}</span>`).join('')||'<span class="chip">未分類</span>'}</div>`}
function viewMeta(v){return {today:['WORKSPACE / TODAY','<em>今日のループ</em>'],people:['WORKSPACE / PEOPLE','見失わない、<em>人物の棚</em>'],lenses:['WORKSPACE / LENSES','目的ごとに、<em>関係を整える</em>'],tags:['WORKSPACE / TAGS','特徴を、<em>再発見できる形に</em>']}[v]}
function switchView(v){state.ui.view=v;save();$$('.view').forEach(e=>e.classList.toggle('active',e.id===`${v}View`));$$('[data-view]').forEach(e=>e.classList.toggle('active',e.dataset.view===v));const m=viewMeta(v);$('#crumb').textContent=m[0];$('#title').innerHTML=m[1];render()}
function isActive(p){return (p.status||'active')==='active'}
function isSnoozed(p){return !!p.snoozedUntil&&p.snoozedUntil>iso()}
function weeklyLimit(){return Math.max(1,Math.min(7,Number(state.ui.weeklyLimit)||3))}
function dueProfiles(){return state.profiles.filter(p=>isActive(p)&&!isSnoozed(p)&&(!p.nextReview||p.nextReview<=addDays(7))).sort((a,b)=>(a.nextReview||'0000').localeCompare(b.nextReview||'0000'))}
function weeklyProfiles(){return dueProfiles().slice(0,weeklyLimit())}
function statusLabel(p){return ({active:'アクティブ',paused:'保留',graduated:'アーカイブ'})[p.status||'active']}
function actionTypeLabel(type){return ({observe:'観察する',react:'反応する',message:'連絡する',meet:'会う',follow_up:'フォローする',introduce:'紹介する',other:'次の一歩'})[type]||'次の一歩'}
function actionStatusLabel(status){return ({open:'次の一歩',waiting:'返答を待つ',done:'完了',skipped:'見送り',cancelled:'取り消し'})[status]||'次の一歩'}
function actionId(){return `a_${Date.now()}_${Math.random().toString(36).slice(2,8)}`}
function actionsForProfile(pid){return (state.actions||[]).filter(a=>a.profileId===pid)}
function activeAction(p){return actionsForProfile(p.id).find(a=>a.status==='open'||a.status==='waiting')||null}
function actionDate(a){return a.status==='waiting'?(a.reviewDate||a.dueDate):(a.dueDate||a.reviewDate)}
function actionIsOverdue(a){return a.status==='open'&&!!a.dueDate&&a.dueDate<iso()}
function actionCardHTML(a,p,{compact=false}={}){if(!a)return '';const waiting=a.status==='waiting';const date=actionDate(a);return `<div class="next-step ${waiting?'waiting':''}"><div class="next-label"><span>${actionStatusLabel(a.status)} · ${actionTypeLabel(a.type)}</span><span class="next-date">${actionIsOverdue(a)?'期限超過 · ':''}${waiting?'見直し ':''}${formatDate(date)}</span></div><b>${esc(a.title||'次の一歩を決めましょう')}</b>${compact?'':`<div class="action-quick">${a.status==='open'?`<button class="btn small primary" data-action-complete="${a.id}">完了</button><button class="btn small" data-action-open="${a.id}">Instagram ↗</button><button class="btn small" data-action-defer="${a.id}">明日へ</button><button class="btn small" data-action-skip="${a.id}">見送る</button>`:`<button class="btn small primary" data-action-reopen="${a.id}">行動に戻す</button><button class="btn small" data-action-waiting="${a.id}">見直し日</button>`}<button class="btn small" data-action-edit="${a.id}">変更</button><button class="btn small" data-action-skip="${a.id}">見送る</button></div>`}</div>`}
function profileCard(p){const action=activeAction(p);return `<article class="profile"><div class="profile-head">${avatar(p)}<button class="profile-open" data-detail="${p.id}"><strong>${esc(p.label||p.username)}</strong><small>@${esc(p.username)}</small></button></div>${traitHTML(p,4)}${action?actionCardHTML(action,p,{compact:true}):`<div class="next-step empty-step"><div class="next-label"><span>次の一歩</span></div><b>まだ決めていません</b><div class="action-quick"><button class="btn small" data-action-new="${p.id}">次の一歩を決める</button></div></div>`}<div class="reason"><label>アカウントメモ</label>${esc(p.accountMemo||p.reason||'メモを残すと、次に開く理由が明確になります。')}</div><div class="meta"><span>最終接点 ${formatDate(p.lastContact)}</span><span>次回 ${formatDate(p.nextReview)}</span></div><div class="card-actions"><button class="btn small" data-detail="${p.id}">詳細</button><button class="btn small" data-contact="${p.id}">接点を記録</button><button class="btn instagram small" data-open="${p.id}">Instagram ↗</button><button class="btn danger small" data-delete="${p.id}">削除</button></div></article>`}

function mergeProfiles(){const c=window.mergeContext;if(!c)return;const source=state.profiles.find(p=>p.id===c.sourceId),target=state.profiles.find(p=>p.id===c.targetId);if(!source||!target)return;window.mergeUndo={source:structuredClone(source),target:structuredClone(target),sourceIndex:state.profiles.findIndex(p=>p.id===source.id)};Object.keys(target.traits).forEach(type=>target.traits[type]=[...new Set([...(target.traits[type]||[]),...(source.traits?.[type]||[])])]);target.labels=[...new Set([...(target.labels||[]),...(source.labels||[])])];target.aliases=[...new Set([...(target.aliases||[]),target.username,...(source.aliases||[]),source.username].filter(a=>a&&a!==target.username))];target.timeline=[...(target.timeline||[]),...(source.timeline||[])].sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));if(source.accountMemo&&!target.accountMemo.includes(source.accountMemo))target.accountMemo=target.accountMemo?`${target.accountMemo}\n\n【統合元：${source.label||'@'+source.username}】\n${source.accountMemo}`:source.accountMemo;target.lastObserved=maxDate(target.lastObserved,source.lastObserved);target.lastContact=maxDate(target.lastContact,source.lastContact);target.nextReview=minDate(target.nextReview,source.nextReview);target.updatedAt=new Date().toISOString();target.timeline.unshift({id:id(),date:iso(),kind:'merge',delta:`${source.label||'@'+source.username} を統合`,action:'人物情報を統合',tags:[]});state.profiles=state.profiles.filter(p=>p.id!==source.id);save();closeModal();render();toast('人物を統合しました。30秒以内なら元に戻せます。');clearTimeout(window.mergeUndoTimer);window.mergeUndoTimer=setTimeout(()=>window.mergeUndo=null,30000)}

function showDataTools(){const h=backupHealth(),backupText=h.at?`${new Date(h.at).toLocaleDateString('ja-JP')}に保存済み`:'まだバックアップされていません',changeText=h.at?`以降に更新した人物：${h.changed}人`:`バックアップ前の人物：${h.changed}人`;modal(`<div class="modal-head"><div><h2>データの保存・復元</h2><p>データはこのブラウザに保存されています。必要なときにバックアップをファイルとして管理できます。</p></div><button class="close" data-close>×</button></div><div class="data-summary"><b>現在の保存内容：</b>${state.profiles.length}人の人物、特徴タグ、観察・接点記録、次の一歩 ${(state.actions||[]).length}件、関係テーマ ${(state.threads||[]).length}件、受信箱・約束・機会 ${(state.followThroughItems||[]).length}件<br><b>バックアップ：</b>${backupText} · ${changeText}</div><div class="tool-grid"><button class="tool-choice" data-backup-now><b>⇩</b><strong>バックアップを保存</strong><span>現在の全データをJSONファイルとして書き出します。</span></button><button class="tool-choice" data-restore-now><b>↥</b><strong>バックアップを復元</strong><span>保存済みJSONから人物・タグ・記録を戻します。</span></button><button class="tool-choice" data-import><b>⇩</b><strong>LinkageのJSONを読み込む</strong><span>既存の人物管理データを追加で取り込みます。</span></button><button class="tool-choice" data-merge-people><b>⇄</b><strong>人物を統合</strong><span>重複した人物と記録を、確認しながら1件にまとめます。</span></button><button class="tool-choice" data-shelf-manager><b>▣</b><strong>保留・アーカイブの棚</strong><span>通常の棚から外した人物を見直します。</span></button><button class="tool-choice" data-close><b>×</b><strong>閉じる</strong><span>データは引き続きこの端末に保存されます。</span></button></div>`)}
function showOcrModal(){modal(`<div class="modal-head"><div><h2>スクショから追加</h2><p>Instagramプロフィール上部だけから、表示名と@アカウント名の候補を読み取ります。</p></div><button class="close" data-close>×</button></div><div class="ocr-drop"><div class="ocr-symbol">⌁</div><strong>保存済みスクリーンショットを選択</strong><p>@アカウント名と表示名が写っているプロフィール上部を含めてください。カメラ撮影には対応せず、PNGまたはWebPのスクリーンショットだけを選びます。</p><label class="btn primary small" for="ocrFile">スクショを選ぶ</label><input id="ocrFile" type="file" accept=".png,.webp,image/png,image/webp"></div><div class="ocr-progress" id="ocrProgress"><div class="progress-line"><span id="ocrBar"></span></div><div class="progress-text" id="ocrText">プロフィール上部を準備しています…</div></div><div class="ocr-privacy"><strong>プライバシー：</strong>画像は保存・送信しません。端末内でプロフィール上部だけを一時的に解析し、候補確認後に破棄します。</div>`);$('#ocrFile').addEventListener('change',handleOcrFile)}
function cropInstagramProfileHeader(file){return new Promise((resolve,reject)=>{const image=new Image(),objectUrl=URL.createObjectURL(file);image.onload=()=>{try{const sourceWidth=image.naturalWidth,sourceHeight=image.naturalHeight,sourceY=Math.round(sourceHeight*.045),cropHeight=Math.max(120,Math.round(sourceHeight*.085)),scale=Math.min(2.2,Math.max(1.65,1600/sourceWidth)),canvas=document.createElement('canvas');canvas.width=Math.round(sourceWidth*scale);canvas.height=Math.round(cropHeight*scale);const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,sourceY,sourceWidth,cropHeight,0,0,canvas.width,canvas.height);const pixels=ctx.getImageData(0,0,canvas.width,canvas.height);for(let i=0;i<pixels.data.length;i+=4){const gray=pixels.data[i]*.299+pixels.data[i+1]*.587+pixels.data[i+2]*.114,value=gray<205?0:255;pixels.data[i]=value;pixels.data[i+1]=value;pixels.data[i+2]=value;pixels.data[i+3]=255}ctx.putImageData(pixels,0,0);URL.revokeObjectURL(objectUrl);resolve(canvas)}catch(error){URL.revokeObjectURL(objectUrl);reject(error)}};image.onerror=()=>{URL.revokeObjectURL(objectUrl);reject(new Error('画像を読み込めませんでした。'))};image.src=objectUrl})}
function extractOcrCandidates(data){const blocked=new Set(['follow','following','message','contact','editprofile','posts','followers','instagram','meta','投稿','フォロワー','フォロー中','メッセージ','フォローする','プロフィールを編集','戻る']),words=(data.words||[]).map(word=>({text:String(word.text||'').trim(),confidence:Number(word.confidence||0),y:Number(word.bbox?.y0||0)})).filter(word=>word.text),candidates=words.map(word=>{const candidate=username(word.text.replace(/^@/,''));if(!candidate||blocked.has(candidate.toLowerCase())||/^\d+$/.test(candidate))return null;const letters=(candidate.match(/[A-Za-z]/g)||[]).length,digits=(candidate.match(/\d/g)||[]).length;if(letters<2||digits>letters)return null;return{candidate,score:word.confidence+(candidate===candidate.toLowerCase()?8:0)+(/[._]/.test(candidate)?3:0)-word.y*.01,confidence:word.confidence}}).filter(Boolean).sort((a,b)=>b.score-a.score),best=candidates.find(item=>item.confidence>=58)||null,lines=(data.lines||[]).map(line=>String(line.text||'').trim()).filter(Boolean),label=lines.find(line=>{const compact=line.replace(/\s/g,'');return compact.length>=2&&compact.length<=40&&!/^\d+[.,\d]*$/.test(compact)&&compact.toLowerCase()!==(best?.candidate||'').toLowerCase()&&/[\u3040-\u30ff\u3400-\u9fff]/.test(compact)&&!/(投稿|フォロワー|フォロー中|メッセージ|フォローする)/.test(compact)})||'';return{username:best?.candidate||'',label}}
async function handleOcrFile(event){const file=event.target.files?.[0];if(!file)return;if(!['image/png','image/webp'].includes(file.type)){event.target.value='';return toast('PNGまたはWebPのスクリーンショットを選んでください。')}const progress=$('#ocrProgress');progress.classList.add('show');const bar=$('#ocrBar'),text=$('#ocrText'),update=m=>{const pct=Math.round((m.progress||0)*100);bar.style.width=`${pct}%`;text.textContent=m.status==='recognizing text'?`プロフィール上部を読み取っています… ${pct}%`:'プロフィール上部を準備しています…'};try{if(!window.Tesseract)throw new Error('OCRライブラリを読み込めませんでした。');const headerImage=await cropInstagramProfileHeader(file);text.textContent='アカウント名と表示名の候補を読み取っています…';const result=await Tesseract.recognize(headerImage,'eng+jpn',{logger:update}),candidate=extractOcrCandidates(result.data||{});if(!candidate.username){toast('アカウント名を確実に判定できませんでした。誤った候補は入れず、@アカウント名だけ手入力してください。');showProfileModal(null,{label:candidate.label})}else{showProfileModal(null,{username:candidate.username,label:candidate.label});toast('プロフィール上部だけから候補を読み取りました。内容を確認してから保存してください。')}}catch(error){console.warn(error);toast('OCRを実行できませんでした。URLまたは@アカウント名から追加できます。');showProfileModal()}finally{event.target.value=''}}

function showRestore(){modal(`<div class="modal-head"><div><h2>バックアップを復元</h2><p>Prospect Loop Relationship Lensのバックアップを選びます。現在のデータは確認後に置き換わります。</p></div><button class="close" data-close>×</button></div><div class="drop"><strong>バックアップJSONを選択</strong><p>この端末で作成したバックアップのみ対応します。ファイルは端末内で読み取り、サーバーへ送信しません。</p><label class="btn primary" for="restoreFile">バックアップを選ぶ</label><input id="restoreFile" type="file" accept="application/json,.json"></div>`);$('#restoreFile').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{const b=JSON.parse(await f.text());if(b.format!=='prospect-loop-relationship-lens'||!b.data?.profiles)throw Error();window.restorePack=b;modal(`<div class="modal-head"><div><h2>復元を確認</h2><p>作成日時：${esc(new Date(b.exportedAt).toLocaleString('ja-JP'))}<br>候補：${b.data.profiles.length}人<br>次の一歩：${(b.data.actions||[]).length}件<br>関係テーマ：${(b.data.threads||[]).length}件<br>受信箱・約束・機会：${(b.data.followThroughItems||[]).length}件</p></div><button class="close" data-close>×</button></div><div class="reason"><label>この内容で置き換えます</label>現在の人物・タグ・観察記録はバックアップの内容へ置き換わります。</div><div class="footer"><button class="btn" data-close>キャンセル</button><button class="btn primary" data-confirm-restore>復元する</button></div>`)}catch{toast('対応していないバックアップです。')}})}

function showImport(){modal(`<div class="modal-head"><div><h2>Linkageの人物JSONを取り込む</h2><p>名前、Instagramリンク、ラベル、人物メモ、最終接触日だけを取り込みます。既存の@アカウント名は重複追加しません。</p></div><button class="close" data-close>×</button></div><div class="drop"><strong>LinkageのJSONを選択</strong><p>既存アプリのエクスポートJSONまたはデータJSONに対応します。Instagramリンクがある人物だけを候補として追加します。</p><label class="btn primary" for="linkageFile">JSONを選ぶ</label><input id="linkageFile" type="file" accept="application/json,.json"></div>`);$('#linkageFile').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{const raw=JSON.parse(await f.text()), people=raw.people||raw.data?.people;if(!Array.isArray(people))throw Error();const rows=people.map(p=>{const link=(p.links||[]).find(l=>/instagram\.com/i.test(l.url||''));const u=username(link?.url);return u?{source:p,u}:null}).filter(Boolean);window.importRows=rows;modal(`<div class="modal-head"><div><h2>取り込みを確認</h2><p>Instagramリンクを持つ${rows.length}人を検出しました。名前・Instagram URL・ラベル・人物メモ・最終接点日だけを追加します。</p></div><button class="close" data-close>×</button></div><div class="reason"><label>取り込まない情報</label>性別、アイコン、汎用メモの記録本文、バンド・カレンダー情報は取り込みません。</div><div class="footer"><button class="btn" data-close>キャンセル</button><button class="btn primary" data-confirm-import>取り込む</button></div>`)}catch{toast('人物配列を含むLinkage JSONを選択してください。')}})}

function showTagMerge(type,tag){const targets=(state.taxonomy[type]||[]).filter(t=>t!==tag);if(!targets.length)return toast('統合先になる別のタグがありません。');modal(`<div class="modal-head"><div><h2>タグを統合</h2><p>「${esc(tag)}」を別のタグへまとめます。人物や観察記録は残ります。</p></div><button class="close" data-close>×</button></div><form id="tagMergeForm" onsubmit="event.preventDefault();mergeTaxonomyTag(this.type.value,this.from.value,this.to.value);return false;"><input type="hidden" name="type" value="${esc(type)}"><input type="hidden" name="from" value="${esc(tag)}"><div class="fields"><div class="field full"><label>統合先タグ</label><select name="to">${targets.map(t=>`<option value="${esc(t)}">${esc(t)}（${countTag(type,t)}人）</option>`).join('')}</select><span class="hint">「${esc(tag)}」が付いている${countTag(type,tag)}人へ、統合先タグを付与してから元タグを外します。</span></div></div><div class="footer"><button class="btn" type="button" data-close>キャンセル</button><button class="btn primary" type="submit">タグを統合</button></div></form>`)}

function saveActionCompletion(fd){const before=structuredClone(state),a=actionById(fd.get('actionId')),p=a&&state.profiles.find(x=>x.id===a.profileId);if(!a||!p)return;const date=fd.get('date')||iso(),note=fd.get('note').trim();a.status='done';a.completedAt=new Date().toISOString();a.completedNote=note;a.updatedAt=new Date().toISOString();timelineForAction(p,a,`${actionTypeLabel(a.type)}を完了`,note||a.title);if(fd.get('asContact')){p.lastContact=date;p.timeline.unshift({id:id(),date,kind:'contact',delta:`${actionTypeLabel(a.type)}で接点を記録`,action:note||a.title,tags:[]})}p.updatedAt=new Date().toISOString();try{if(sessionStorage.getItem('prospect-loop-return-action')===a.id)sessionStorage.removeItem('prospect-loop-return-action')}catch(e){}save();closeModal();render();toast('完了を保存しました。');offerUndo('次の一歩を完了しました。',before)}
function showActionWaiting(aid){const a=actionById(aid),p=a&&state.profiles.find(x=>x.id===a.profileId);if(!a||!p)return;modal(`<div class="modal-head"><div><h2>返答を待つ</h2><p>${esc(a.title)}を今すぐの行動から外し、見直し日に戻します。</p></div><button class="close" data-close>×</button></div><form id="actionWaitingForm" onsubmit="event.preventDefault();saveActionWaiting(new FormData(this));return false;"><input type="hidden" name="actionId" value="${a.id}"><div class="fields"><div class="field"><label>見直す日</label><input id="actionReviewDate" name="reviewDate" type="date" value="${esc(a.reviewDate||addDays(7))}" required>${datePresetButtons('actionReviewDate')}</div><div class="field full"><label>待機内容（任意）</label><textarea name="note" placeholder="例：DMの返答があるか確認する。">${esc(a.note||'')}</textarea></div></div><div class="footer"><button class="btn" type="button" data-detail="${p.id}">キャンセル</button><button class="btn primary" type="submit">待機にする</button></div></form>`)}

document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;let handled=true;if(t.dataset.detail!==undefined)showPersonDetail(t.dataset.detail);else if(t.dataset.summaryEdit!==undefined)showSummaryModal(t.dataset.summaryEdit);else if(t.dataset.actionNew!==undefined)showActionModal(t.dataset.actionNew);else if(t.dataset.actionEdit!==undefined){const a=actionById(t.dataset.actionEdit);if(a)showActionModal(a.profileId,a.id)}else if(t.dataset.actionComplete!==undefined)showActionCompletion(t.dataset.actionComplete);else if(t.dataset.actionWaiting!==undefined)showActionWaiting(t.dataset.actionWaiting);else if(t.dataset.actionDefer!==undefined)deferAction(t.dataset.actionDefer);else if(t.dataset.actionSkip!==undefined)showActionSkip(t.dataset.actionSkip);else if(t.dataset.actionReopen!==undefined)reopenAction(t.dataset.actionReopen);else if(t.dataset.actionOpen!==undefined)openActionInstagram(t.dataset.actionOpen);else if(t.dataset.actionReplace!==undefined)replacePendingAction();else handled=false;if(handled){e.preventDefault();e.stopImmediatePropagation()}});


/* Tag governance core */
function tagMeta(type,tag){state.taxonomyMeta=state.taxonomyMeta||{activity:{},region:{},format:{},purpose:{},warmth:{}};state.taxonomyMeta[type]=state.taxonomyMeta[type]||{};return state.taxonomyMeta[type][tag]||{status:'formal',definition:'',aliases:[],createdAt:'',lastReviewedAt:'',keepReason:''}}
function tagTypeName(type){return ({activity:'活動',region:'地域',format:'発信の型',purpose:'関係の目的',warmth:'温度感'})[type]||type}
function tagReviewItems(){const items=[];Object.entries(state.taxonomy||{}).forEach(([type,tags])=>(tags||[]).forEach(tag=>{const meta=tagMeta(type,tag),used=countTag(type,tag);if(meta.status==='candidate')items.push({kind:'candidate',type,tag,title:`候補タグ「${tag}」`,detail:`${used}人に付与 · 3人目で正式化を判断`});else if(!used)items.push({kind:'unused',type,tag,title:`未使用タグ「${tag}」`,detail:'付与した人物がいません。削除・統合・残す理由を確認します。'})}));state.profiles.filter(p=>isActive(p)&&((p.traits?.purpose||[]).length!==1||(p.traits?.warmth||[]).length!==1)).forEach(p=>items.push({kind:'profileTraits',profileId:p.id,title:`分類を整える：${p.label||p.username}`,detail:`目的 ${(p.traits?.purpose||[]).length||0}件 · 温度感 ${(p.traits?.warmth||[]).length||0}件` }));state.profiles.filter(p=>isActive(p)&&allTraits(p).filter(t=>t.type!=='label').length>=8).forEach(p=>items.push({kind:'tagHeavy',profileId:p.id,title:`タグが多い：${p.label||p.username}`,detail:'8個以上の特徴タグがあります。要点・メモへ戻す情報がないか確認します。'}));state.profiles.filter(p=>isActive(p)&&['接点あり','継続観察'].some(v=>(p.traits?.warmth||[]).includes(v))&&!Object.values(summaryFor(p)).some(v=>String(v||'').trim())).forEach(p=>items.push({kind:'summary',profileId:p.id,title:`関係要点が未記入：${p.label||p.username}`,detail:'タグにしない人物固有の文脈を短く残せます。'}));return items}
function renderTagReview(){const items=tagReviewItems().slice(0,5);if(!items.length)return `<section class="tag-review"><div class="tag-review-head"><div><div class="kicker">WEEKLY CLEANUP</div><h3>今週の整理はありません</h3></div><span class="chip region">整っています</span></div><p>候補タグ、未使用タグ、分類のゆれは見つかりませんでした。新しいタグを作る時だけ、4問ゲートで確認します。</p></section>`;const candidate=items.filter(x=>x.kind==='candidate').length,unused=items.filter(x=>x.kind==='unused').length;return `<section class="tag-review"><div class="tag-review-head"><div><div class="kicker">WEEKLY CLEANUP</div><h3>今週、5分だけ整える</h3></div><span class="chip purpose">${items.length}件</span></div><p>すべて直す必要はありません。1件だけでも、来週の検索が少し速くなります。</p><div class="review-chips">${candidate?`<span class="review-chip">候補 ${candidate}件</span>`:''}${unused?`<span class="review-chip warn">未使用 ${unused}件</span>`:''}</div><div class="review-list">${items.map((item,i)=>`<div class="review-item"><div class="review-item-copy"><b>${esc(item.title)}</b><span>${esc(item.detail)}</span></div><button class="btn small" data-tag-review="${i}">確認</button></div>`).join('')}</div></section>`}
function renderTags(){const review=renderTagReview();$('#tagCategories').innerHTML=review+`<section class="category" style="background:linear-gradient(135deg,rgba(90,121,244,.12),rgba(255,255,255,.70));border-color:rgba(91,121,244,.25)"><div class="category-head"><div><div class="kicker">TAG MANAGEMENT</div><h3>特徴タグを管理する</h3></div><span class="chip purpose">追加・編集・削除</span></div><p class="muted" style="margin:10px 0 0">タグは、後から同じ条件で人物を探すための索引です。個別の話題・感想・予定は、人物要点・観察・次の一歩へ分けます。</p></section>`+Object.entries(state.taxonomy).map(([type,tags])=>`<section class="category"><div class="category-head"><div><div class="kicker">${({activity:'ACTIVITY',region:'REGION',format:'CONTENT FORMAT',purpose:'RELATIONSHIP PURPOSE',warmth:'WARMTH'})[type]}</div><h3>${tagTypeName(type)}</h3></div><span class="muted">${tags.length} タグ</span></div><div class="tag-cloud">${tags.map(t=>{const meta=tagMeta(type,t);return `<span class="tag-item"><button class="tag-btn" data-show-tag-people="1" data-type="${type}" data-tag="${esc(t)}">${esc(t)}<span class="tag-count">${countTag(type,t)}</span>${meta.status==='candidate'?'<span class="tag-state">候補</span>':''}</button><button class="tag-manage" data-manage-tag="1" data-type="${type}" data-tag="${esc(t)}" aria-label="${esc(t)}を編集・削除">編集</button></span>`}).join('')}</div><div class="add-tag"><input id="new_${type}" placeholder="新しいタグ" /><button class="btn small" data-add-tag="${type}">追加</button></div></section>`).join('')}
function showTagCreateGate(type,value){const tag=String(value||'').trim();if(!tag)return toast('新しいタグを入力してください。');if((state.taxonomy[type]||[]).includes(tag))return toast('すでに存在するタグです。');const similar=(state.taxonomy[type]||[]).filter(t=>t.toLowerCase().includes(tag.toLowerCase())||tag.toLowerCase().includes(t.toLowerCase())).slice(0,3);modal(`<div class="modal-head"><div><h2>新しいタグを確認</h2><p>タグは、複数の人物を後から同じ条件で探すための言葉です。</p></div><button class="close" data-close>×</button></div>${similar.length?`<div class="tag-governance-note"><b>似た既存タグ：</b>${similar.map(esc).join('、')}<br>使い分けられない場合は、新規作成せず既存タグを使う方が探しやすくなります。</div>`:''}<form id="tagGateForm" onsubmit="event.preventDefault();saveCandidateTag(new FormData(this));return false;"><input type="hidden" name="type" value="${esc(type)}"><input type="hidden" name="tag" value="${esc(tag)}"><div class="fields"><div class="field full"><label>このタグの定義（任意）</label><input name="definition" maxlength="120" placeholder="例：DJまたは音楽活動を主な活動に持つ人"></div></div><div class="gate-checks"><label class="gate-check"><input type="checkbox" name="gate1"> <span>今後、少なくとも3人に付ける見込みがある。</span></label><label class="gate-check"><input type="checkbox" name="gate2"> <span>3か月後にも同じ意味で使う。</span></label><label class="gate-check"><input type="checkbox" name="gate3"> <span>既存タグとの違いを一文で説明できる。</span></label><label class="gate-check"><input type="checkbox" name="gate4"> <span>このタグで人物を一覧にする場面がある。</span></label></div><div class="footer"><button type="button" class="btn" data-close>戻る</button><button class="btn primary" type="submit">候補タグとして作成</button></div></form>`)}
function addTaxonomy(type){const inp=$(`#new_${type}`);showTagCreateGate(type,inp?.value||'')}
function saveCandidateTag(fd){const type=fd.get('type'),tag=String(fd.get('tag')||'').trim();if(!type||!tag)return;const gates=['gate1','gate2','gate3','gate4'].filter(k=>fd.get(k)).length;if(!(state.taxonomy[type]||[]))state.taxonomy[type]=[];if(state.taxonomy[type].includes(tag))return toast('すでに存在するタグです。');const before=structuredClone(state);state.taxonomy[type].push(tag);state.taxonomyMeta[type]=state.taxonomyMeta[type]||{};state.taxonomyMeta[type][tag]={status:'candidate',definition:fd.get('definition').trim(),aliases:[],createdAt:new Date().toISOString(),lastReviewedAt:'',keepReason:gates===4?'4問を確認済み':''};save();closeModal();render();toast(gates===4?`「${tag}」を候補タグとして追加しました。3人目で正式化を判断します。`:`「${tag}」を候補として追加しました。後から定義と使い方を見直せます。`);offerUndo('候補タグを追加しました。',before)}
function showTagReview(index){const item=tagReviewItems()[Number(index)];if(!item)return;if(item.kind==='profileTraits')return showProfileModal(item.profileId);if(item.kind==='tagHeavy')return showPersonDetail(item.profileId);if(item.kind==='summary')return showSummaryModal(item.profileId);const meta=tagMeta(item.type,item.tag),used=countTag(item.type,item.tag),candidate=item.kind==='candidate';modal(`<div class="modal-head"><div><h2>${candidate?'候補タグを見直す':'未使用タグを見直す'}</h2><p>${esc(item.tag)} · ${tagTypeName(item.type)} · ${used}人に付与</p></div><button class="close" data-close>×</button></div><div class="tag-definition"><b>定義</b><br>${esc(meta.definition||'まだ定義がありません。3人以上に同じ意味で使うかを確認してください。')}</div><p class="muted" style="margin:13px 0 0">${candidate?'3人目に付与された時、または使い分けが明確になった時に正式タグにします。':'利用予定がなければ削除します。残す場合は、検索で使う理由を一言残してください。'}</p><div class="footer spread">${candidate?`<button class="btn danger" data-tag-review-delete="1" data-type="${item.type}" data-tag="${esc(item.tag)}">削除</button><div style="display:flex;gap:8px"><button class="btn" data-close>あとで</button><button class="btn primary" data-tag-review-promote="1" data-type="${item.type}" data-tag="${esc(item.tag)}">正式タグにする</button></div>`:`<button class="btn danger" data-tag-review-delete="1" data-type="${item.type}" data-tag="${esc(item.tag)}">削除</button><div style="display:flex;gap:8px"><button class="btn" data-tag-review-keep="1" data-type="${item.type}" data-tag="${esc(item.tag)}">残す</button><button class="btn" data-close>閉じる</button></div>`}</div>`)}
function promoteTag(type,tag){const before=structuredClone(state),meta=tagMeta(type,tag);state.taxonomyMeta[type][tag]={...meta,status:'formal',lastReviewedAt:new Date().toISOString()};save();closeModal();render();toast(`「${tag}」を正式タグにしました。`);offerUndo('候補タグを正式化しました。',before)}
function keepTag(type,tag){const before=structuredClone(state),meta=tagMeta(type,tag);state.taxonomyMeta[type][tag]={...meta,keepReason:'レビューで維持',lastReviewedAt:new Date().toISOString()};save();closeModal();render();toast(`「${tag}」を維持します。`);offerUndo('未使用タグの維持を保存しました。',before)}
function renameTaxonomyTag(type,oldName,newName){const before=structuredClone(state);const next=String(newName||'').trim();if(!next)return toast('タグ名を入力してください。');if(next===oldName){closeModal();return}if(state.taxonomy[type].includes(next))return toast('同じ分類に同名のタグがあります。');const meta=tagMeta(type,oldName);state.taxonomy[type]=state.taxonomy[type].map(x=>x===oldName?next:x);state.profiles.forEach(p=>{const values=p.traits?.[type]||[];p.traits[type]=[...new Set(values.map(x=>x===oldName?next:x))]});state.taxonomyMeta[type][next]={...meta,aliases:[...new Set([...(meta.aliases||[]),oldName])],lastReviewedAt:new Date().toISOString()};delete state.taxonomyMeta[type][oldName];save();closeModal();render();toast(`「${oldName}」を「${next}」へ変更しました。`);offerUndo('タグ名の変更を保存しました。',before)}
function mergeTaxonomyTag(type,from,to){const before=structuredClone(state);if(!type||!from||!to||from===to)return;const fromMeta=tagMeta(type,from),toMeta=tagMeta(type,to);state.profiles.forEach(p=>{const values=p.traits?.[type]||[];if(values.includes(from))p.traits[type]=[...new Set(values.map(v=>v===from?to:v))]});state.taxonomy[type]=state.taxonomy[type].filter(v=>v!==from);state.taxonomyMeta[type][to]={...toMeta,aliases:[...new Set([...(toMeta.aliases||[]),from,...(fromMeta.aliases||[])])],lastReviewedAt:new Date().toISOString()};delete state.taxonomyMeta[type][from];save();closeModal();render();toast(`「${from}」を「${to}」へ統合しました。`);offerUndo('タグ統合を保存しました。',before)}
function deleteTaxonomyTag(type,tag){const before=structuredClone(state);state.taxonomy[type]=state.taxonomy[type].filter(x=>x!==tag);state.profiles.forEach(p=>{p.traits[type]=(p.traits?.[type]||[]).filter(x=>x!==tag)});if(state.taxonomyMeta?.[type])delete state.taxonomyMeta[type][tag];save();closeModal();render();toast(`「${tag}」を削除しました。`);offerUndo('タグを削除しました。',before)}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;let handled=true;if(t.dataset.tagReview!==undefined)showTagReview(t.dataset.tagReview);else if(t.dataset.tagReviewPromote!==undefined)promoteTag(t.dataset.type,t.dataset.tag);else if(t.dataset.tagReviewKeep!==undefined)keepTag(t.dataset.type,t.dataset.tag);else if(t.dataset.tagReviewDelete!==undefined)deleteTaxonomyTag(t.dataset.type,t.dataset.tag);else handled=false;if(handled){e.preventDefault();e.stopImmediatePropagation()}});


/* Relationship themes core */
function threadId(){return `t_${Date.now()}_${Math.random().toString(36).slice(2,8)}`}
function threadStatusLabel(status){return ({nurturing:'育てる',active:'進行中',waiting:'待機',done:'完了',skipped:'見送り'})[status]||'育てる'}
function threadStatusOptions(selected='nurturing'){return [['nurturing','育てる'],['active','進行中'],['waiting','待機'],['done','完了'],['skipped','見送り']].map(([v,label])=>`<option value="${v}" ${selected===v?'selected':''}>${label}</option>`).join('')}
function activeThreads(){return (state.threads||[]).filter(t=>!['done','skipped'].includes(t.status)).sort((a,b)=>String(a.reviewDate||'9999').localeCompare(String(b.reviewDate||'9999')))}
function threadById(tid){return (state.threads||[]).find(t=>t.id===tid)}
function threadsForProfile(pid){return (state.threads||[]).filter(t=>(t.profileIds||[]).includes(pid))}
function threadActions(t){return (state.actions||[]).filter(a=>a.threadId===t.id||(t.actionIds||[]).includes(a.id))}
function syncThreads(){state.threads=(state.threads||[]).map(t=>({...t,profileIds:[...new Set((t.profileIds||[]).filter(pid=>state.profiles.some(p=>p.id===pid)))],actionIds:[...new Set((state.actions||[]).filter(a=>a.threadId===t.id).map(a=>a.id).concat((t.actionIds||[]).filter(aid=>state.actions.some(a=>a.id===aid))))]}))}
function threadSummaryHTML(t,{compact=false}={}){const people=(t.profileIds||[]).length,actions=threadActions(t).filter(a=>a.status==='open'||a.status==='waiting').length;return `<div class="theme-row"><div class="theme-row-copy"><b>${esc(t.title)}</b><span>${esc(t.purpose||'目的はまだ設定されていません。')} · ${people}人 · 未完了 ${actions}件${t.reviewDate?' · 見直し '+formatDate(t.reviewDate):''}</span></div><span class="theme-status ${esc(t.status)}">${threadStatusLabel(t.status)}</span>${compact?'':`<button class="btn small" data-thread-detail="${t.id}">開く</button>`}</div>`}
function themePersonOptions(selected=[]){const set=new Set(selected);return state.profiles.filter(p=>isActive(p)).map(p=>`<label class="thread-check"><input type="checkbox" name="profileIds" value="${p.id}" ${set.has(p.id)?'checked':''}><span>${avatar(p)}<b>${esc(p.label||p.username)}</b><small>@${esc(p.username)}${activeAction(p)?' · '+esc(activeAction(p).title):''}</small></span></label>`).join('')||'<p class="muted">アクティブな人物がいません。</p>'}
function themeActionOptions(selected=[]){const set=new Set(selected);return state.actions.filter(a=>['open','waiting'].includes(a.status)).map(a=>{const p=state.profiles.find(x=>x.id===a.profileId);return `<label class="thread-check"><input type="checkbox" name="actionIds" value="${a.id}" ${set.has(a.id)?'checked':''}><span><b>${esc(a.title)}</b><small>${esc(p?.label||p?.username||'人物不明')} · ${actionStatusLabel(a.status)} · ${formatDate(actionDate(a))}</small></span></label>`}).join('')||'<p class="muted">未完了の次の一歩はありません。</p>'}
function showThreadModal(tid='',presetProfileId=''){const t=tid?threadById(tid):null;if(tid&&!t)return toast('関係テーマが見つかりません。');const x=t||{title:'',purpose:'',status:'nurturing',reviewDate:addDays(30),profileIds:presetProfileId?[presetProfileId]:[],actionIds:[],notes:''};modal(`<div class="modal-head"><div><h2>${t?'関係テーマを編集':'関係テーマを作る'}</h2><p>特定の企画・関心・機会を、複数の人物と次の一歩でまとめます。特徴タグではありません。</p></div><button class="close" data-close>×</button></div><form id="threadForm" onsubmit="event.preventDefault();saveThread(new FormData(this));return false;"><input type="hidden" name="threadId" value="${esc(t?.id||'')}"><div class="fields"><div class="field full"><label>テーマ名 *</label><input name="title" maxlength="80" required value="${esc(x.title)}" placeholder="例：和歌山の地域イベント"></div><div class="field"><label>状態</label><select name="status">${threadStatusOptions(x.status)}</select></div><div class="field"><label>見直し日</label><input id="threadReviewDate" name="reviewDate" type="date" value="${esc(x.reviewDate||'')}">${datePresetButtons('threadReviewDate')}</div><div class="field full"><label>このテーマの目的</label><textarea name="purpose" maxlength="180" placeholder="例：地域の作り手と、無理のない接点を育てる。">${esc(x.purpose||'')}</textarea></div><div class="field full"><label>関連する人物</label><div class="thread-picker">${themePersonOptions(x.profileIds||[])}</div></div><div class="field full"><label>関連する未完了アクション</label><div class="thread-picker">${themeActionOptions(x.actionIds||[])}</div><span class="hint">選んだアクションはこのテーマに紐付きます。人物も自動で関連付けられます。</span></div><div class="field full"><label>メモ（任意）</label><textarea name="notes" maxlength="600" placeholder="例：イベント前後の投稿で、自然に反応できる機会を探す。">${esc(x.notes||'')}</textarea></div></div><div class="footer spread">${t?`<button type="button" class="btn danger" data-thread-delete="${t.id}">削除</button>`:''}<div style="display:flex;gap:8px"><button type="button" class="btn" data-close>キャンセル</button><button class="btn primary" type="submit">${t?'変更を保存':'テーマを作成'}</button></div></div></form>`);wireDraft('threadForm',`thread:${t?.id||'new'}`)}
function saveThread(fd){const title=fd.get('title').trim();if(!title)return toast('テーマ名を入力してください。');const before=structuredClone(state),tid=fd.get('threadId')||threadId(),selectedProfiles=[...new Set(fd.getAll('profileIds'))],selectedActions=[...new Set(fd.getAll('actionIds'))];let t=threadById(tid);if(!t){t={id:tid,title:'',purpose:'',status:'nurturing',reviewDate:'',profileIds:[],actionIds:[],notes:'',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};state.threads.unshift(t)}const formerlyLinked=state.actions.filter(a=>a.threadId===tid);formerlyLinked.forEach(a=>{if(!selectedActions.includes(a.id))a.threadId=''});selectedActions.forEach(aid=>{const a=state.actions.find(x=>x.id===aid);if(a){(state.threads||[]).forEach(other=>{if(other.id!==tid)other.actionIds=(other.actionIds||[]).filter(id=>id!==aid)});a.threadId=tid;if(!selectedProfiles.includes(a.profileId))selectedProfiles.push(a.profileId)}});Object.assign(t,{title,purpose:fd.get('purpose').trim(),status:fd.get('status')||'nurturing',reviewDate:fd.get('reviewDate')||'',profileIds:selectedProfiles,actionIds:selectedActions,notes:fd.get('notes').trim(),updatedAt:new Date().toISOString()});syncThreads();save();clearDraft(`thread:${fd.get('threadId')||'new'}`);closeModal();render();toast(t.createdAt===t.updatedAt?'関係テーマを作成しました。':'関係テーマを保存しました。');offerUndo('関係テーマを保存しました。',before)}
function showThreadDetail(tid){const t=threadById(tid);if(!t)return;const people=(t.profileIds||[]).map(pid=>state.profiles.find(p=>p.id===pid)).filter(Boolean),actions=threadActions(t).slice().sort((a,b)=>String(actionDate(a)||'9999').localeCompare(String(actionDate(b)||'9999')));modal(`<div class="modal-head"><div><div class="kicker">RELATIONSHIP THEME</div><h2>${esc(t.title)}</h2><p>${esc(t.purpose||'このテーマの目的はまだ設定されていません。')}</p></div><button class="close" data-close>×</button></div><div class="theme-detail-meta"><span>${threadStatusLabel(t.status)}</span>${t.reviewDate?`<span>見直し ${formatDate(t.reviewDate)}</span>`:''}<span>人物 ${people.length}人</span><span>未完了 ${actions.filter(a=>['open','waiting'].includes(a.status)).length}件</span></div>${t.notes?`<div class="reason" style="margin-top:13px"><label>テーマメモ</label>${esc(t.notes)}</div>`:''}<section class="detail-section"><div class="detail-section-head"><h3>関わる人物</h3><button class="btn small" data-thread-edit="${t.id}">編集</button></div><div class="theme-people">${people.length?people.map(p=>{const a=activeAction(p);return `<div class="theme-person">${avatar(p)}<button class="profile-open theme-person-copy" data-detail="${p.id}"><b>${esc(p.label||p.username)}</b><span>@${esc(p.username)}</span>${a?`<div class="theme-action">${esc(actionStatusLabel(a.status))} · ${esc(a.title)}</div>`:''}</button><button class="btn small" data-detail="${p.id}">詳細</button></div>`}).join(''):'<p class="muted">人物はまだ紐付いていません。</p>'}</div></section><section class="detail-section"><div class="detail-section-head"><h3>関連アクション</h3><button class="btn small" data-thread-edit="${t.id}">整理</button></div>${actions.length?actions.map(a=>{const p=state.profiles.find(x=>x.id===a.profileId);return `<div class="history-item"><b>${esc(actionStatusLabel(a.status))} · ${esc(a.title)}</b><p>${esc(p?.label||p?.username||'人物不明')} · ${esc(formatDate(actionDate(a)))}</p><small>${esc(a.note||'')}</small></div>`}).join(''):'<p class="muted">関連アクションはまだありません。</p>'}</section><div class="footer spread"><button class="btn danger" data-thread-delete="${t.id}">削除</button><div style="display:flex;gap:8px"><button class="btn" data-thread-edit="${t.id}">編集</button><button class="btn" data-close>閉じる</button></div></div>`)}
function confirmDeleteThread(tid){const t=threadById(tid);if(!t)return;modal(`<div class="modal-head"><div><h2>関係テーマを削除しますか？</h2><p>「${esc(t.title)}」の人物・アクションとの関連付けを外します。</p></div><button class="close" data-close>×</button></div><div class="reason"><label>削除の影響</label>人物、観察・接点ログ、次の一歩そのものは削除されません。テーマとの紐付けだけが外れます。</div><div class="footer"><button class="btn" data-close>キャンセル</button><button class="btn danger" data-thread-delete-confirm="${t.id}">テーマを削除</button></div>`)}
function deleteThread(tid){const t=threadById(tid);if(!t)return;const before=structuredClone(state);state.actions.forEach(a=>{if(a.threadId===tid)a.threadId=''});state.threads=state.threads.filter(x=>x.id!==tid);save();closeModal();render();toast('関係テーマを削除しました。');offerUndo('関係テーマを削除しました。',before)}
function threadSectionForProfile(p){const themes=threadsForProfile(p.id);return `<section class="detail-section"><div class="detail-section-head"><h3>今の文脈</h3><button class="btn small" data-thread-new="${p.id}">テーマを作る</button></div>${themes.length?`<div class="theme-list">${themes.map(t=>threadSummaryHTML(t)).join('')}</div>`:'<p class="muted">企画・関心・機会のように、複数人や次の一歩を束ねたい時だけテーマを作れます。</p>'}</section>`}
function themeCardHTML(t){

/* Modern component architecture
   This compact layer is deliberately framework-free so the app remains a
   portable single HTML file. It provides a stable component vocabulary for
   future renderers while preserving all existing functions and data keys. */
const ProspectLoopUI=Object.freeze({
  components:Object.freeze({
    surface:(content,variant='default')=>`<section class="c-surface c-stack" data-component="surface" data-surface="${variant}">${content}</section>`,
    meta:(content)=>`<span class="c-meta">${content}</span>`,
    control:(content,attrs='')=>`<button class="btn" data-component="control" ${attrs}>${content}</button>`
  }),
  hydrate(root=document){
    const scope=root&&root.querySelectorAll?root:document;
    const mark=(selector,component,kind)=>scope.querySelectorAll(selector).forEach(node=>{node.dataset.component=component;if(kind)node.dataset.componentKind=kind});
    mark('.panel,.profile,.lens,.category,.tool-choice,.queue-card,.detail-section,.ft-hub,.tag-review,.theme-panel,.thread-card,.shelf-item,.person-list-row','surface');
    mark('.queue-card,.detail-section,.ft-hub,.tag-review,.theme-panel,.thread-card,.next-step,.summary-row','context');
    mark('.btn,.filter,.more,.close,.log-more,.trait-options button,.tag-btn,.tag-manage,.date-presets button','control');
    mark('.avatar,.mark,.ocr-symbol','icon');
    scope.querySelectorAll('.profile,.lens,.tool-choice,.queue-card,.person-list-row,.theme-card').forEach(node=>node.classList.add('c-interactive'));
    scope.querySelectorAll('.kicker,.crumb,.nav-label').forEach(node=>node.dataset.uiRole='eyebrow');
  }
});
window.ProspectLoopUI=ProspectLoopUI;

/* Render boundaries: CSS classes are applied after every state-driven redraw.
   Existing render functions remain the source of truth, avoiding any mutation
   of profiles, actions, themes, backup payloads, or localStorage keys. */
const renderModernComponentBase=render;
render=function(...args){const result=renderModernComponentBase.apply(this,args);ProspectLoopUI.hydrate(document);return result};
const modalModernComponentBase=modal;
modal=function(...args){const result=modalModernComponentBase.apply(this,args);ProspectLoopUI.hydrate($('#modal')||document);return result};

/* One named event boundary for future component actions. Existing data-* event
   handlers continue to run unchanged; this registry avoids adding new global
   handlers for component-level actions later. */
const ComponentActionRegistry=new Map();
window.ProspectLoopComponentActions=Object.freeze({
  register:(name,handler)=>ComponentActionRegistry.set(name,handler),
  remove:(name)=>ComponentActionRegistry.delete(name)
});
document.addEventListener('click',event=>{const target=event.target.closest('[data-ui-action]');if(!target)return;const handler=ComponentActionRegistry.get(target.dataset.uiAction);if(!handler)return;event.preventDefault();handler({event,target})});

function oneFocusWeekKey(){return typeof ftWeekKey==='function'?ftWeekKey():`${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}-${String(Math.ceil(new Date().getDate()/7)).padStart(2,'0')}`}
function oneFocusState(){
  state.ui=state.ui||{};

  const normal={weekKey:String(prior.weekKey||''),profileId:String(prior.profileId||''),completed:Boolean(prior.completed),openedAt:String(prior.openedAt||''),deferredAt:String(prior.deferredAt||'')};

function oneFocusCandidates(){
  const active=state.profiles.filter(profile=>isActive(profile)&&!isSnoozed(profile));
  const due=dueProfiles();
  const rest=active.filter(profile=>!due.some(candidate=>candidate.id===profile.id)).sort((a,b)=>{
    const aDate=a.lastObserved||a.lastContact||a.createdAt||'';

  if(focus.weekKey===week&&focus.profileId){
    const saved=allActive.find(profile=>profile.id===focus.profileId);
    if(saved)return saved;
  }

  profile.timeline.unshift({id:id(),date:iso(),kind:'snooze',delta:`${days}日間、また今度にする`,action:'今週一人だけ開くから見送り',tags:[]});
  focus.completed=true;focus.deferredAt=new Date().toISOString();save();render();toast('また今度にしました。');offerUndo('今週の一人を見送りました。',before);
}

function oneFocusMarkVisited(profileId){
  const profile=state.profiles.find(item=>item.id===profileId);if(!profile)return;
  const before=structuredClone(state),focus=oneFocusState(),now=new Date().toISOString();
  profile.lastVisitedAt=now;profile.nextReview=addDays(14);profile.updatedAt=now;
  focus.completed=true;focus.openedAt=focus.openedAt||now;focus.deferredAt='';
  oneFocusClearReturn();save();render();toast('見たことを残しました。しばらく、ここには出しません。');offerUndo('確認済みにしました。',before);
}

function oneFocusClearReturn(){try{sessionStorage.removeItem('prospect-loop-one-focus-return')}catch(error){}}
function renderOneFocusReturn(){
  document.querySelectorAll('#oneFocusReturn').forEach(node=>node.remove());
  let profileId='';try{profileId=sessionStorage.getItem('prospect-loop-one-focus-return')||''}catch(error){}
  const profile=state.profiles.find(item=>item.id===profileId);const home=document.querySelector('#todayView');
  if(profile&&home)home.querySelector('.today-card')?.insertAdjacentHTML('beforebegin',oneFocusReturnHTML(profile));
}
const renderOneFocusTodayBase=renderToday;
renderToday=function(){renderOneFocusTodayBase();document.querySelectorAll('.one-focus-home,.one-focus-quiet').forEach(node=>node.remove());const card=$('#todayCard');if(card)card.insertAdjacentHTML('afterbegin',oneFocusHomeHTML());renderOneFocusReturn();ProspectLoopUI?.hydrate(document)};

document.addEventListener('click',event=>{
  const target=event.target.closest('[data-one-focus-open],[data-one-focus-later],[data-one-focus-details],[data-one-focus-return-later],[data-one-focus-return-capture]');if(!target)return;

  if(target.dataset.oneFocusReturnCapture!==undefined){const profileId=target.dataset.oneFocusReturnCapture;oneFocusClearReturn();showQuickCaptureModal('',profileId);return}
});



/* Focused home revision */
function oneFocusSecondaryCount(){
  const focus=oneFocusProfile();
  return dueProfiles().filter(profile=>profile.id!==focus?.id).length + (state.actions||[]).filter(action=>action.status==='open'&&action.dueDate&&action.dueDate<=addDays(7)).length;
}
function oneFocusMoreHTML(){
  const count=oneFocusSecondaryCount();
  return `<div class="focus-home-more" id="oneFocusMore"><button type="button" data-one-focus-expand><span class="focus-home-more-copy"><b>他の候補と整理する</b><span>次の一歩、約束、他の観察候補は必要な時だけ開きます。</span></span><span class="focus-home-more-count">${count||'+'}</span></button></div>`;
}
function applyFocusedHomeLayers(){
  const today=$('#todayView'),card=$('#todayCard');if(!today||!card)return;
  today.classList.remove('focus-home-expanded');
  card.classList.add('focus-home-mode');
  document.querySelectorAll('.focus-home-secondary,.one-focus-secondary,#oneFocusMore').forEach(node=>node.classList.remove('focus-home-secondary','one-focus-secondary'));
  card.querySelectorAll(':scope > *').forEach(node=>{if(!node.matches('.one-focus-home,.one-focus-quiet,.focus-home-more'))node.classList.add('one-focus-secondary')});
  const column=card.parentElement;
  [...(column?.children||[])].forEach(node=>{if(node!==card&&node.id!=='oneFocusReturn')node.classList.add('focus-home-secondary')});
  const layout=card.closest('.grid');
  [...(layout?.children||[])].forEach(node=>{if(!node.contains(card))node.classList.add('focus-home-secondary')});
  const focusCard=card.querySelector('.one-focus-home,.one-focus-quiet');
  if(focusCard)focusCard.insertAdjacentHTML('afterend',oneFocusMoreHTML());
}
function toggleFocusedHomeLayers(){
  const today=$('#todayView');if(!today)return;
  const expanded=today.classList.toggle('focus-home-expanded');
  const trigger=$('[data-one-focus-expand]');
  if(trigger){trigger.querySelector('.focus-home-more-copy b').textContent=expanded?'今週の一人に戻る':'他の候補と整理する';trigger.querySelector('.focus-home-more-copy span').textContent=expanded?'最上段の一人だけへ戻ります。':'次の一歩、約束、他の観察候補は必要な時だけ開きます。'}
}
const renderFocusedHomeRevisionBase=renderToday;
renderToday=function(){renderFocusedHomeRevisionBase();applyFocusedHomeLayers();ProspectLoopUI?.hydrate(document)};

document.addEventListener('click',event=>{
  const target=event.target.closest('[data-one-focus-expand],[data-one-focus-return-visited]');if(!target)return;
  if(target.dataset.oneFocusExpand!==undefined){toggleFocusedHomeLayers();return}
  if(target.dataset.oneFocusReturnVisited!==undefined){oneFocusMarkVisited(target.dataset.oneFocusReturnVisited);return}
});

vate!==undefined){reactivateProfile(t.dataset.reactivate);return}if(t.dataset.skip!==undefined){showSkipModal(t.dataset.skip);return}if(t.dataset.backupNow!==undefined){exportBackup();return}if(t.dataset.restoreNow!==undefined){showRestore();return}if(t.dataset.open){openInstagram(t.dataset.open);return}if(t.dataset.showTagPeople){showTagPeople(t.dataset.type,t.dataset.tag);return}if(t.dataset.contact){showContactModal(t.dataset.contact);return}if(t.dataset.record){showRecordModal(t.dataset.record);return}if(t.dataset.manage){showProfileModal(t.dataset.manage);return}if(t.dataset.close!==undefined||t.id==='modalBackdrop'){closeModal();return}if(t.dataset.delete){confirmDelete(t.dataset.delete);return}if(t.dataset.confirmDelete){doDelete(t.dataset.confirmDelete);return}if(t.dataset.undo!==undefined){undo();return}if(t.dataset.confirmRestore!==undefined){restore();return}if(t.dataset.confirmImport!==undefined){importLinkage();return}if(t.dataset.confirmMerge!==undefined){mergeProfiles();return}if(t.dataset.undoMerge!==undefined){undoMerge();return}if(t.dataset.lens){const k=t.dataset.lens;state.ui.filter=k==='weekly'?'due':k==='collab'?'collab':k==='unobserved'?'unobserved':'all';switchView('people');return}if(t.dataset.filter){state.ui.filter=t.dataset.filter;save();renderPeople();return}if(t.dataset.peopleLayout){state.ui.peopleLayout=t.dataset.peopleLayout==='list'?'list':'cards';save();renderPeople();return}if(t.dataset.trait){const a=window.__traits[t.dataset.trait]||[],v=t.dataset.value;window.__traits[t.dataset.trait]=['purpose','warmth'].includes(t.dataset.trait)?(a.includes(v)?[]:[v]):(a.includes(v)?a.filter(x=>x!==v):[...a,v]);$$(`[data-trait=\"${t.dataset.trait}\"]`).forEach(b=>b.classList.toggle('on',(window.__traits[t.dataset.trait]||[]).includes(b.dataset.value)));return}if(t.dataset.addTag){addTaxonomy(t.dataset.addTag);return}if(t.dataset.batchEdit!==undefined){showBatchEdit();return}if(t.dataset.backTagList!==undefined){renderTagPeople();return}if(t.dataset.manageTag){showTagManage(t.dataset.type,t.dataset.tag);return}if(t.dataset.deleteTag){showDeleteTag(t.dataset.type,t.dataset.tag);return}if(t.dataset.confirmDeleteTag){deleteTaxonomyTag(t.dataset.type,t.dataset.tag);return}if(t.dataset.mergeTag){showTagMerge(t.dataset.type,t.dataset.tag);return}if(t.dataset.tagFilter){const [type,val]=t.dataset.tagFilter.split('|');state.ui.filter='all';switchView('people');setTimeout(()=>{$('#search').value=val;renderPeople()},0);return}});
document.addEventListener('submit',e=>{if(e.target.id==='profileForm'){e.preventDefault();saveProfile(new FormData(e.target))}if(e.target.id==='recordForm'){e.preventDefault();saveRecord(new FormData(e.target))}if(e.target.id==='weeklyForm'){e.preventDefault();saveWeeklySettings(new FormData(e.target))}if(e.target.id==='skipForm'){e.preventDefault();applySkip(new FormData(e.target))}});document.addEventListener('input',e=>{if(e.target.id==='search')renderPeople()});
