<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>紙シワ・よれ合成アプリ</title>
  <!-- Pixi.js (v7.4.2) CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.4.2/pixi.min.js"></script>
  <style>
    :root {
      --bg-color: #1a1a1a;
      --panel-bg: #2d2d2d;
      --accent-color: #007acc;
      --text-color: #ffffff;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .app-container {
      background-color: var(--panel-bg);
      border-radius: 8px;
      padding: 20px;
      max-width: 800px;
      width: 100%;
      box-sizing: border-box;
    }
    .canvas-wrapper {
      width: 100%;
      aspect-ratio: 4 / 3;
      background-color: #000;
      border-radius: 4px;
      overflow: hidden;
    }
    .controls-panel {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    label { font-size: 0.85rem; color: #ccc; }
    input[type="range"] { width: 100%; }
    .btn-group {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }
    button, .file-upload-btn {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover, .file-upload-btn:hover { background-color: #005999; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="canvas-wrapper" id="pixi-viewport"></div>

  <div class="controls-panel">
    <div class="control-group">
      <label for="scaleSlider">よれの強さ (Displacement): <span id="scaleVal">30</span></label>
      <input type="range" id="scaleSlider" min="0" max="100" value="30">
    </div>
    <div class="control-group">
      <label for="alphaSlider">シワの濃さ (Opacity): <span id="alphaVal">0.7</span></label>
      <input type="range" id="alphaSlider" min="0" max="1" step="0.05" value="0.7">
    </div>
  </div>

  <div class="btn-group">
    <label class="file-upload-btn">
      写真をえらぶ
      <input type="file" id="imageInput" accept="image/*">
    </label>
    <button id="downloadBtn">完成画像を保存</button>
  </div>
</div>

<script>
class CrumpleEffectApp {
  constructor(containerId) {
    this.container = document.getElementById(containerId);
    this.width = 800;
    this.height = 600;
    this.initPixi();
  }

  async initPixi() {
    // Pixi App初期化
    this.app = new PIXI.Application({
      width: this.width,
      height: this.height,
      backgroundColor: 0x111111,
      preserveDrawingBuffer: true,
      resolution: 1,
      autoDensity: true
    });

    this.container.appendChild(this.app.view);

    // インライン生成したシワ素材（Canvas経由で生成してCORS回避）
    this.wrinkleTexture = this.generateWrinkleTexture();
    
    // 初期表示用のダミーキャンバス生成
    const defaultPhotoTexture = this.generateDefaultPhotoTexture();
    
    this.setupSprites(defaultPhotoTexture);
    this.bindEvents();
  }

  // CORSエラー回避のため、内臓キャンバス処理でシワ模様をプログラム生成
  generateWrinkleTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = this.width;
    canvas.height = this.height;
    const ctx = canvas.getContext('2d');
    
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // 大幅なランダム折り目ラインを描画
    ctx.strokeStyle = '#ffffff';
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur = 10;
    
    for (let i = 0; i < 15; i++) {
      ctx.beginPath();
      ctx.lineWidth = Math.random() * 8 + 2;
      ctx.moveTo(Math.random() * canvas.width, Math.random() * canvas.height);
      ctx.lineTo(Math.random() * canvas.width, Math.random() * canvas.height);
      ctx.stroke();
    }
    return PIXI.Texture.from(canvas);
  }

  // 初回表示用サンプルテクスチャ
  generateDefaultPhotoTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = this.width;
    canvas.height = this.height;
    const ctx = canvas.getContext('2d');
    
    ctx.fillStyle = '#3498db';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ffffff';
    ctx.font = '30px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('「写真をえらぶ」から画像を選択してください', canvas.width / 2, canvas.height / 2);
    
    return PIXI.Texture.from(canvas);
  }

  setupSprites(photoTexture) {
    this.app.stage.removeChildren();

    // 1. 写真スプライト
    this.photoSprite = new PIXI.Sprite(photoTexture);
    this.photoSprite.width = this.width;
    this.photoSprite.height = this.height;

    // 2. ディスプレイスメント（歪み）用フィルター
    this.dispSprite = new PIXI.Sprite(this.wrinkleTexture);
    this.dispSprite.width = this.width;
    this.dispSprite.height = this.height;

    this.dispFilter = new PIXI.DisplacementFilter(this.dispSprite);
    
    const scaleVal = parseFloat(document.getElementById('scaleSlider').value);
    this.dispFilter.scale.x = scaleVal;
    this.dispFilter.scale.y = scaleVal;

    this.photoSprite.filters = [this.dispFilter];

    // 3. スクリーン合成（シワの乗せ込み）
    this.wrinkleSprite = new PIXI.Sprite(this.wrinkleTexture);
    this.wrinkleSprite.width = this.width;
    this.wrinkleSprite.height = this.height;
    this.wrinkleSprite.blendMode = PIXI.BLEND_MODES.SCREEN;
    this.wrinkleSprite.alpha = parseFloat(document.getElementById('alphaSlider').value);

    this.app.stage.addChild(this.photoSprite);
    this.app.stage.addChild(this.dispSprite);
    this.app.stage.addChild(this.wrinkleSprite);
  }

  bindEvents() {
    // スライダー操作イベント
    document.getElementById('scaleSlider').addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      this.dispFilter.scale.x = val;
      this.dispFilter.scale.y = val;
      document.getElementById('scaleVal').textContent = val;
    });

    document.getElementById('alphaSlider').addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      this.wrinkleSprite.alpha = val;
      document.getElementById('alphaVal').textContent = val;
    });

    // 画像アップロード処理
    document.getElementById('imageInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const texture = PIXI.Texture.from(img);
          this.setupSprites(texture);
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    // 画像保存処理（PixiJS v7非同期Extract対応）
    document.getElementById('downloadBtn').addEventListener('click', async () => {
      this.app.render();
      const base64Data = await this.app.renderer.extract.base64(this.app.stage);
      
      const link = document.createElement('a');
      link.download = 'crumpled-photo.png';
      link.href = base64Data;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });
  }
}

window.addEventListener('DOMContentLoaded', () => {
  new CrumpleEffectApp('pixi-viewport');
});
</script>

</body>
</html>
