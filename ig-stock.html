<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="投稿ストック帳">
<meta name="theme-color" content="#14161c">
<link rel="apple-touch-icon" href="ig-stock-icon.png">
<link rel="icon" type="image/png" href="ig-stock-icon.png">
<title>投稿ストック帳</title>
<style>
  :root {
    --bg:#14161c; --surface:#1c1f27; --surface2:#232733; --line:#2e323d;
    --text:#f2f0ea; --muted:#a9aeba;
    --amber:#e0a552; --amber-dim:#a87a37;
    --draft:#a9aeba; --ready:#e0a552; --posted:#6aa84f;
    --danger:#d9756b;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html { background:var(--bg); }
  body {
    font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh; font-size:15px; line-height:1.6;
  }
  input, select, textarea, button { font-family:inherit; font-size:16px; }
  ::-webkit-scrollbar { width:6px; height:6px; }
  ::-webkit-scrollbar-thumb { background:rgba(255,255,255,.15); border-radius:3px; }

  .header {
    background:var(--surface); border-bottom:1px solid var(--line);
    padding:14px 16px; padding-top:calc(env(safe-area-inset-top,0px) + 14px);
    position:sticky; top:0; z-index:100;
    display:flex; align-items:center; gap:10px;
  }
  .header-title { font-size:16px; font-weight:700; letter-spacing:1px; flex:1; }
  .tabs { display:flex; background:var(--surface); border-bottom:1px solid var(--line); position:sticky; z-index:99; }
  .tab {
    flex:1; padding:10px 4px; border:none; background:transparent; color:var(--muted);
    font-size:12px; cursor:pointer; border-bottom:2px solid transparent;
  }
  .tab.active { color:var(--amber); border-bottom-color:var(--amber); font-weight:700; }
  .main { padding:16px; padding-bottom:calc(40px + env(safe-area-inset-bottom,0px)); max-width:600px; margin:0 auto; }

  .search {
    width:100%; padding:10px 14px; border:1px solid var(--line); border-radius:10px;
    background:var(--surface); color:var(--text); outline:none; margin-bottom:10px;
  }
  .search:focus { border-color:var(--amber-dim); }
  .chips { display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:12px; }
  .chip {
    flex-shrink:0; padding:5px 13px; border-radius:16px; border:1px solid var(--line);
    background:var(--surface); color:var(--muted); font-size:12px; cursor:pointer; white-space:nowrap;
  }
  .chip.active { background:var(--amber); border-color:var(--amber); color:#14161c; font-weight:700; }

  .btn {
    background:var(--surface2); color:var(--text); border:1px solid var(--line);
    border-radius:9px; padding:10px 14px; font-size:14px; cursor:pointer;
  }
  .btn:active { opacity:.7; }
  .btn.primary { background:var(--amber); border-color:var(--amber); color:#14161c; font-weight:700; }
  .btn.danger { color:var(--danger); border-color:var(--danger); }
  .btn.wide { width:100%; }
  .btn.sm { padding:6px 10px; font-size:12px; }
  .row { display:flex; gap:8px; margin-bottom:10px; }

  .month-title { font-size:12px; color:var(--amber); font-weight:700; margin:18px 0 8px; letter-spacing:1px; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .card {
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    overflow:hidden; cursor:pointer; display:flex; flex-direction:column;
  }
  .card:active { opacity:.75; }
  .card-thumb { width:100%; aspect-ratio:4/5; object-fit:cover; display:block; background:var(--surface2); }
  .card-noimg {
    width:100%; aspect-ratio:4/5; display:flex; align-items:center; justify-content:center;
    background:var(--surface2); color:var(--line); font-size:30px;
  }
  .card-body { padding:8px 9px 10px; }
  .card-title { font-size:12px; font-weight:600; line-height:1.4; margin-bottom:4px; word-break:break-all; }
  .card-meta { font-size:10px; color:var(--muted); display:flex; align-items:center; gap:5px; }
  .dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .days-left { font-size:11px; font-weight:700; color:var(--danger); margin-top:3px; }
  .card-meta .no-link { color:var(--amber-dim); }

  /* 投稿後にやり残していることを、開いた時に必ず目に入る位置で知らせる */
  .notice {
    display:block; width:100%; text-align:left; margin-bottom:10px;
    padding:10px 14px; border-radius:10px; cursor:pointer; font-size:13px; font-weight:700;
    background:var(--surface); border:1px solid var(--amber-dim); color:var(--amber);
  }
  .notice.active { background:var(--amber); border-color:var(--amber); color:#14161c; }

  .empty { text-align:center; padding:50px 20px; color:var(--muted); }
  .empty-icon { font-size:42px; margin-bottom:10px; }
  .empty-text { font-size:13px; line-height:1.9; }

  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:200; display:flex; align-items:flex-end; justify-content:center; }
  .sheet {
    background:var(--bg); border-radius:18px 18px 0 0; width:100%; max-width:600px;
    max-height:92vh; overflow-y:auto; padding:0 16px calc(40px + env(safe-area-inset-bottom,0px));
    border-top:1px solid var(--line);
  }
  .sheet-handle { width:36px; height:4px; background:var(--line); border-radius:2px; margin:12px auto 14px; }
  .sheet-title-row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
  .sheet-title { font-size:15px; font-weight:700; }
  .sheet-close {
    flex-shrink:0; width:36px; height:36px; border-radius:50%; border:1px solid var(--line);
    background:var(--surface2); color:var(--muted); font-size:20px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center; margin-left:auto;
  }
  .sec { font-size:11px; color:var(--amber); font-weight:700; margin:18px 0 7px; letter-spacing:1px; }

  .field { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:9px; background:var(--surface); color:var(--text); outline:none; margin-bottom:10px; }
  .field:focus { border-color:var(--amber-dim); }
  textarea.field { resize:vertical; line-height:1.7; }
  label.lbl { display:block; font-size:11px; color:var(--muted); margin-bottom:4px; }

  .tag-pill { display:inline-block; font-size:11px; padding:3px 9px; border-radius:10px; background:var(--surface2); color:var(--muted); border:1px solid var(--line); margin:0 5px 5px 0; }

  .prompt-row {
    display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line);
    border-radius:10px; padding:10px 12px; margin-bottom:8px; cursor:pointer;
  }
  .prompt-row:active { opacity:.75; }
  .prompt-row.open { border-radius:10px 10px 0 0; border-bottom:none; margin-bottom:0; }
  .prompt-fav { background:none; border:none; font-size:19px; line-height:1; cursor:pointer; padding:0; color:var(--muted); }
  .prompt-fav.active { color:var(--amber); }
  .prompt-name { flex:1; font-size:14px; font-weight:600; }
  .prompt-caret { color:var(--muted); font-size:11px; }
  .prompt-body {
    background:var(--surface); border:1px solid var(--line); border-top:none;
    border-radius:0 0 10px 10px; padding:10px 12px 12px; margin-bottom:8px;
  }
  .chip.fav { border-color:var(--amber); color:var(--amber); }
  .warn { color:var(--danger); font-size:12px; font-weight:700; }
  .ok { color:var(--muted); font-size:12px; }

  .thumb-strip { display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; }
  .thumb-strip img { height:150px; border-radius:8px; flex-shrink:0; }
  .thumb-item { position:relative; flex-shrink:0; }
  .thumb-del {
    position:absolute; top:4px; right:4px; background:rgba(0,0,0,.7); color:#fff;
    border:none; border-radius:50%; width:22px; height:22px; font-size:13px; cursor:pointer; line-height:1;
  }
  .thumb-move {
    position:absolute; bottom:4px; background:rgba(0,0,0,.7); color:#fff;
    border:none; border-radius:50%; width:24px; height:24px; font-size:12px; cursor:pointer; line-height:1;
  }
  .thumb-move.prev { left:4px; }
  .thumb-move.next { right:4px; }
  .thumb-move:disabled { opacity:.25; cursor:default; }
  .thumb-no {
    position:absolute; top:4px; left:4px; background:rgba(0,0,0,.7); color:#fff;
    border-radius:9px; padding:1px 7px; font-size:10px; font-weight:700;
  }

  /* 編集シートは縦に長いので、保存/やめるは常に手元に置く */
  .sheet-actions {
    position:sticky; bottom:0; display:flex; gap:8px; margin:22px -16px 0;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
    background:var(--bg); border-top:1px solid var(--line);
  }
  .sheet-actions .btn { flex:1; }

  .link-row { display:flex; align-items:center; gap:8px; margin-bottom:7px; }
  .link-row a { color:var(--text); text-decoration:none; flex:1; font-size:13px; word-break:break-all; }
  .link-row a:active { color:var(--amber); }

  /* 列が増えて狭い画面では溢れるため、表だけ横スクロールさせる */
  .tbl-wrap { overflow-x:auto; margin-bottom:14px; }
  .tbl-wrap table.tbl { margin-bottom:0; min-width:330px; }
  .tbl-wrap table.tbl th, .tbl-wrap table.tbl td { padding:7px 4px; white-space:nowrap; }
  table.tbl { width:100%; border-collapse:collapse; font-size:12px; margin-bottom:14px; }
  table.tbl th, table.tbl td { border-bottom:1px solid var(--line); padding:7px 5px; text-align:left; }
  table.tbl th { color:var(--muted); font-weight:500; font-size:11px; }
  table.tbl td.num { text-align:right; font-variant-numeric:tabular-nums; }

  .toast {
    position:fixed; left:50%; transform:translateX(-50%); bottom:calc(24px + env(safe-area-inset-bottom,0px));
    background:var(--surface2); color:var(--text); border:1px solid var(--line);
    padding:10px 18px; border-radius:20px; font-size:13px; z-index:400; box-shadow:0 4px 18px rgba(0,0,0,.5);
  }
  .toast.err { border-color:var(--danger); color:var(--danger); }
  .ver { position:fixed; right:6px; bottom:4px; font-size:9px; color:var(--line); z-index:1; }
</style>
</head>
<body>

<div id="root"></div>
<div class="ver">ver <span id="app-ver"></span></div>

<script>
// ===== 基本設定 =====
const APP_NAME = '投稿ストック帳';
const APP_KEY  = 'igstock_v1';
const VER_FILE = 'ig-stock-ver.txt';

// ===== AUTO UPDATE =====
// auto-version.yml が push 時に APP_VERSION と VER_FILE を自動で書き換える。
// 手動でこの数字を変更しないこと。
const APP_VERSION = 17;
(function checkUpdate() {
  fetch(VER_FILE + '?t=' + Date.now(), { cache: 'no-store' })
    .then(function(r) { return r.ok ? r.text() : null; })
    .then(function(t) {
      var n = parseInt(t);
      if (n && n > APP_VERSION && sessionStorage.getItem(APP_KEY + '_vreload') !== String(n)) {
        sessionStorage.setItem(APP_KEY + '_vreload', String(n));
        location.replace(location.pathname + '?v=' + n);
      }
    })
    .catch(function() {});
})();
document.getElementById('app-ver').textContent = APP_VERSION;

// ===== サムネの粗さ =====
// 「どの写真か判別できれば十分」という方針。原本は外部サービス側にありリンクで開く。
// 粗すぎた場合はこの2つを戻す。
const THUMB_MAX_PX = 320;
const THUMB_QUALITY = 0.6;

// ===== localStorage =====
const lsGet = (k, def) => { try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch { return def; } };
const lsSet = (k, v) => localStorage.setItem(k, JSON.stringify(v));

// ===== IndexedDB =====
// thumbs: 値は JPEG Blob
const DB_NAME = 'igstock_db', DB_VER = 1;
let _db = null;
function openDb() {
  if (_db) return Promise.resolve(_db);
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('thumbs')) db.createObjectStore('thumbs');
    };
    req.onsuccess = () => { _db = req.result; resolve(_db); };
    req.onerror = () => reject(req.error);
  });
}
function reqAsPromise(store, mode, fn) {
  return openDb().then(db => new Promise((resolve, reject) => {
    const t = db.transaction(store, mode);
    const req = fn(t.objectStore(store));
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  }));
}
function newKey() {
  return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}
async function saveThumb(blob) {
  const key = newKey();
  await reqAsPromise('thumbs', 'readwrite', s => s.put(blob, key));
  return key;
}
function getThumb(key) { return reqAsPromise('thumbs', 'readonly', s => s.get(key)); }
function deleteThumb(key) { return reqAsPromise('thumbs', 'readwrite', s => s.delete(key)); }
function putThumbWithKey(key, blob) { return reqAsPromise('thumbs', 'readwrite', s => s.put(blob, key)); }
function listThumbKeys() { return reqAsPromise('thumbs', 'readonly', s => s.getAllKeys()); }
// 投稿から参照されていないサムネを消す。削除の取りこぼしや復元時の残骸はここで回収する
async function sweepThumbs(referencedKeys) {
  const keep = new Set(referencedKeys || []);
  const all = await listThumbKeys();
  const orphans = all.filter(k => !keep.has(k));
  for (const k of orphans) { try { await deleteThumb(k); } catch (e) {} }
  return orphans.length;
}

// ===== サムネ生成 =====
async function makeThumb(fileOrBlob) {
  const bmp = await createImageBitmap(fileOrBlob);
  const s = Math.min(1, THUMB_MAX_PX / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(bmp.width * s));
  c.height = Math.max(1, Math.round(bmp.height * s));
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  bmp.close();
  const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', THUMB_QUALITY));
  if (!blob) throw new Error('サムネの生成に失敗しました');
  return await saveThumb(blob);
}

// ===== Blob ⇔ dataURI（バックアップ用）=====
function blobToDataUri(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(r.error);
    r.readAsDataURL(blob);
  });
}
async function dataUriToBlob(dataUri) { const res = await fetch(dataUri); return res.blob(); }

// ===== 小物 =====
function uid() { return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8); }
function today() { return new Date().toISOString().slice(0, 10); }
// 投稿予定日までの残り日数の表示。投稿済みや日付未定では出さない
function daysLeftText(post) {
  if (!post.scheduledAt || post.status === 'posted') return null;
  const now = new Date(); now.setHours(0, 0, 0, 0);
  const target = new Date(post.scheduledAt + 'T00:00:00');
  const diff = Math.round((target - now) / 86400000);
  if (diff > 0) return 'あと' + diff + '日';
  if (diff === 0) return '今日';
  return (-diff) + '日超過';
}

// 投稿直後はリーチが伸びきらないので、数日おいてから入力を促す
const INSIGHT_WAIT_DAYS = 3;
// 投稿済みなのに数値が1つも入っていない投稿。分析はここが埋まらないと育たない。
// 投稿予定日の督促(daysLeftText)は status:posted で止まるため、代わりにこちらが引き継ぐ。
function needsInsight(post) {
  if (post.status !== 'posted' || !post.postedAt) return false;
  const ins = post.insight || {};
  if (ins.reach != null || ins.saves != null || ins.likes != null) return false;
  const now = new Date(); now.setHours(0, 0, 0, 0);
  const posted = new Date(post.postedAt + 'T00:00:00');
  if (isNaN(posted)) return false;
  return Math.round((now - posted) / 86400000) >= INSIGHT_WAIT_DAYS;
}
// サムネはあるのに原本リンクが無い投稿。320pxのサムネからは投稿し直せないため、
// この状態は「あとで使い回せない記録」を意味する
function missingLink(post) {
  return (post.thumbKeys || []).length > 0 && !(post.links || []).length;
}

function linkIcon(url) {
  if (!url) return '🔗';
  const u = url.toLowerCase();
  if (u.indexOf('amazon.co.jp/photos') >= 0 || u.indexOf('amazon.com/photos') >= 0 || u.indexOf('clouddrive') >= 0) return '📦';
  if (u.indexOf('photos.google.com') >= 0) return '🖼';
  if (u.indexOf('icloud.com') >= 0) return '☁️';
  if (u.indexOf('dropbox.com') >= 0) return '📁';
  if (u.indexOf('instagram.com') >= 0) return '📮';
  return '🔗';
}
function linkLabel(lk) {
  if (lk.label) return lk.label;
  try { return new URL(lk.url).hostname.replace(/^www\./, '').split('.')[0]; }
  catch (e) { return lk.url; }
}
// 入力はスペース/改行/カンマ/読点区切りを許容し、先頭の # は落として保持する
function parseTags(str) {
  const tags = (str || '').split(/[\s,、]+/).map(t => t.replace(/^#+/, '').trim()).filter(Boolean);
  return [...new Set(tags)];
}

// ===== 場所・タグの予測 =====
// カタカナをひらがなに正規化（「しぶや」で「シブヤ」もヒットさせる。kakeibo.html と同じ手法）
function toHiragana(s) {
  return s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
}
// hist は { 値: 使用回数 } の履歴。query が空なら使用頻度順の全体を返す
function matchHistory(query, hist, limit) {
  const q = toHiragana((query || '').trim().toLowerCase());
  const names = Object.keys(hist || {});
  const filtered = q ? names.filter(n => toHiragana(n.toLowerCase()).includes(q)) : names.slice();
  return filtered.sort((a, b) => (hist[b] || 0) - (hist[a] || 0)).slice(0, limit || 8);
}
function bumpHistory(hist, value) {
  const v = (value || '').trim();
  if (!v) return hist;
  return Object.assign({}, hist, { [v]: (hist[v] || 0) + 1 });
}
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

const STATUS = {
  draft:  { label:'下書き',   color:'var(--draft)'  },
  ready:  { label:'準備完了', color:'var(--ready)'  },
  posted: { label:'投稿済',   color:'var(--posted)' },
};
const TAG_LIMIT = 30;
// Instagram のキャプション上限と、フィードで「…続きを読む」に折り返される位置
const CAPTION_LIMIT = 2200;
const CAPTION_FOLD = 125;
// これを超えたらバックアップの取り直しを促す
const BACKUP_WARN_DAYS = 14;

// 最後の書き出しからの経過日数。未実施なら null
function daysSince(iso) {
  if (!iso) return null;
  const t = new Date(iso);
  if (isNaN(t)) return null;
  t.setHours(0, 0, 0, 0);
  const now = new Date(); now.setHours(0, 0, 0, 0);
  return Math.max(0, Math.round((now - t) / 86400000));
}

function newPost(over) {
  return Object.assign({
    id: uid(), title: '', caption: '', tagSetIds: [], extraTags: '', genre: '',
    scheduledAt: '', status: 'draft', thumbKeys: [], links: [],
    postedAt: '', insight: { reach: null, saves: null, likes: null },
    shootDate: '', place: '', memo: '',
    createdAt: Date.now(), updatedAt: Date.now(),
  }, over || {});
}

function tagsOf(post, tagSets) {
  const out = [];
  (post.tagSetIds || []).forEach(id => {
    const set = tagSets.find(s => s.id === id);
    if (set) set.tags.forEach(t => out.push(t));
  });
  parseTags(post.extraTags).forEach(t => out.push(t));
  return [...new Set(out)];
}
function tagsTextOf(post, tagSets) {
  return tagsOf(post, tagSets).map(t => '#' + t).join(' ');
}
function copyTextOf(post, tagSets) {
  const tags = tagsTextOf(post, tagSets);
  return (post.caption || '').trim() + (tags ? '\n\n' + tags : '');
}

/* サムネの objectURL を一元管理する。不要になった分と、アンマウント時に必ず revoke する。 */
function useThumbUrls(keys) {
  const [urls, setUrls] = useState({});
  const mapRef = useRef({});
  const keyStr = (keys || []).join(',');

  useEffect(() => {
    let alive = true;
    const want = new Set((keys || []).filter(Boolean));
    Object.keys(mapRef.current).forEach(k => {
      if (!want.has(k)) { URL.revokeObjectURL(mapRef.current[k]); delete mapRef.current[k]; }
    });
    const missing = [...want].filter(k => !mapRef.current[k]);
    if (!missing.length) { setUrls({ ...mapRef.current }); return () => { alive = false; }; }
    Promise.all(missing.map(k => getThumb(k).then(b => ({ k, b })).catch(() => ({ k, b: null }))))
      .then(res => {
        if (!alive) return;
        res.forEach(({ k, b }) => { if (b) mapRef.current[k] = URL.createObjectURL(b); });
        setUrls({ ...mapRef.current });
      });
    return () => { alive = false; };
  }, [keyStr]);

  useEffect(() => () => {
    Object.values(mapRef.current).forEach(u => URL.revokeObjectURL(u));
    mapRef.current = {};
  }, []);

  return urls;
}

function Sheet({ title, onClose, children }) {
  return (
    <div className="overlay" onClick={e => { if (e.target.classList.contains('overlay')) onClose(); }}>
      <div className="sheet">

          <button type="button" className="sheet-close" onClick={onClose} aria-label="閉じる">×</button>
        </div>
        {children}
      </div>
    </div>
  );
}

}

/* ===== 詳細 ===== */
function DetailSheet({ post, tagSets, urls, onClose, onEdit, onDelete, onChange, toast }) {
  const tags = tagsOf(post, tagSets);
  const over = tags.length > TAG_LIMIT;

  const copy = (text, label) => {
    if (!text) { toast('コピーする内容がありません', true); return; }
    if (!navigator.clipboard || !navigator.clipboard.writeText) { toast('このブラウザはコピーに対応していません', true); return; }
    navigator.clipboard.writeText(text)
      .then(() => toast(label + 'をコピーしました'))
      .catch(() => toast('コピーに失敗しました', true));
  };
  const setStatus = st => {
    const patch = { status: st, updatedAt: Date.now() };
    if (st === 'posted' && !post.postedAt) patch.postedAt = today();
    onChange(Object.assign({}, post, patch));
  };
  const setInsight = (k, v) => {
    const n = v === '' ? null : Number(v);
    onChange(Object.assign({}, post, { insight: Object.assign({}, post.insight, { [k]: isNaN(n) ? null : n }), updatedAt: Date.now() }));
  };

  return (
    <Sheet title={post.title || '（無題）'} onClose={onClose}>
      <button className="btn primary wide" onClick={() => copy(copyTextOf(post, tagSets), 'キャプションとタグ')}>
        📋 キャプション＋タグをコピー
      </button>
      {/* タグを1つ目のコメントに分ける運用のために、本文とタグを別々にも取れるようにする */}
      <div className="row" style={{ marginTop:8, marginBottom:0 }}>
        <button className="btn sm" style={{ flex:1 }}
                onClick={() => copy((post.caption || '').trim(), '本文')}>本文だけ</button>
        <button className="btn sm" style={{ flex:1 }}
                onClick={() => copy(tagsTextOf(post, tagSets), 'タグ')}>タグだけ</button>
      </div>

      {post.thumbKeys.length > 0 && (
        <div className="thumb-strip" style={{ marginTop:14 }}>
          {post.thumbKeys.map(k => urls[k] ? <img key={k} src={urls[k]} alt="" /> : null)}
        </div>
      )}

      <div className="sec">キャプション</div>
      <div style={{ whiteSpace:'pre-wrap', fontSize:14 }}>{post.caption || <span style={{ color:'var(--muted)' }}>（未入力）</span>}</div>

      <div className="sec">タグ {tags.length} 個</div>
      {over
        ? <div className="warn">上限30個を{tags.length - TAG_LIMIT}個超えています</div>
        : <div className="ok">上限30個まで</div>}
      <div style={{ marginTop:7 }}>
        {tags.length ? tags.map(t => <span key={t} className="tag-pill">#{t}</span>)
                     : <span style={{ color:'var(--muted)', fontSize:13 }}>（なし）</span>}
      </div>

      <div className="sec">原本リンク</div>
      {post.links.length
        ? post.links.map((lk, i) => (
            <div className="link-row" key={i}>
              <span>{linkIcon(lk.url)}</span>
              <a href={lk.url} target="_blank" rel="noopener noreferrer">{linkLabel(lk)}</a>
            </div>
          ))
        : <div style={{ color:'var(--muted)', fontSize:13 }}>（未登録）編集から Amazon Photos などのURLを追加できます</div>}

      <div className="sec">予定・記録</div>
      <table className="tbl">
        <tbody>
          <tr><th>投稿予定日</th><td>{post.scheduledAt || '未定'}</td></tr>
          <tr><th>撮影日</th><td>{post.shootDate || '—'}</td></tr>
          <tr><th>場所</th><td>{post.place || '—'}</td></tr>
          {post.postedAt && <tr><th>投稿日</th><td>{post.postedAt}</td></tr>}
        </tbody>
      </table>
      {post.memo && <div style={{ whiteSpace:'pre-wrap', fontSize:13, color:'var(--muted)' }}>{post.memo}</div>}

      <div className="row">

/* ===== 編集 ===== */
function EditSheet({ post, tagSets, onClose, onSave, toast, isNew, placeHistory, tagHistory, genres }) {
  const [d, setD] = useState(() => JSON.parse(JSON.stringify(post)));
  const [busy, setBusy] = useState(false);
  // 新規作成中の投稿はまだ保存されていないため、その初期サムネも「やめる」時に消す対象にする
  const original = useRef(isNew ? [] : post.thumbKeys.slice());
  const urls = useThumbUrls(d.thumbKeys);
  const set = (k, v) => setD(p => Object.assign({}, p, { [k]: v }));

  const tags = tagsOf(d, tagSets);
  const over = tags.length > TAG_LIMIT;

  const addFiles = async ev => {
    const files = [...ev.target.files];
    ev.target.value = '';
    if (!files.length) return;
    setBusy(true);
    try {
      const keys = [];
      for (const f of files) keys.push(await makeThumb(f));
      setD(p => Object.assign({}, p, { thumbKeys: p.thumbKeys.concat(keys) }));
    } catch (e) { toast('画像を読み込めませんでした', true); }
    setBusy(false);
  };
  const removeThumb = k => setD(p => Object.assign({}, p, { thumbKeys: p.thumbKeys.filter(x => x !== k) }));
  // 並び順はカルーセルの表示順で、先頭が一覧カードの絵になる
  const moveThumb = (i, dir) => setD(p => {
    const ks = p.thumbKeys.slice();
    const j = i + dir;
    if (j < 0 || j >= ks.length) return p;
    const t = ks[i]; ks[i] = ks[j]; ks[j] = t;
    return Object.assign({}, p, { thumbKeys: ks });
  });

  const addLink = () => setD(p => Object.assign({}, p, { links: p.links.concat([{ label:'', url:'' }]) }));
  const setLink = (i, k, v) => setD(p => Object.assign({}, p, { links: p.links.map((l, j) => j === i ? Object.assign({}, l, { [k]: v }) : l) }));
  const delLink = i => setD(p => Object.assign({}, p, { links: p.links.filter((_, j) => j !== i) }));
  const pasteLink = async i => {
    if (!navigator.clipboard || !navigator.clipboard.readText) { toast('この環境では貼り付けに対応していません。手入力してください', true); return; }
    try { const t = await navigator.clipboard.readText(); if (t) setLink(i, 'url', t.trim()); }
    catch (e) { toast('読み取れませんでした。手入力してください', true); }
  };

  const toggleSet = id => setD(p => Object.assign({}, p, {
    tagSetIds: p.tagSetIds.includes(id) ? p.tagSetIds.filter(x => x !== id) : p.tagSetIds.concat([id])
  }));

  // 場所の予測。過去に使った場所から、入力中の文字列(ひらがな正規化)に部分一致するものを頻度順で出す
  const placeCandidates = matchHistory(d.place, placeHistory).filter(n => n !== d.place);

  // タグの予測。textarea の末尾の未確定トークンをもとに絞り込み、選ぶと末尾のトークンを確定タグに置き換える
  const lastTagToken = (d.extraTags.match(/[^\s,、]*$/) || [''])[0];
  const tagCandidates = matchHistory(lastTagToken, tagHistory).filter(t => t !== lastTagToken);
  const pickTag = t => setD(p => {
    const cur = p.extraTags || '';
    const head = cur.slice(0, cur.length - lastTagToken.length);
    return Object.assign({}, p, { extraTags: head + t + ' ' });
  });

  const save = async () => {
    // 編集中に外したサムネはここで初めて実体を消す（途中でやめた時に消えないように）
    const removed = original.current.filter(k => !d.thumbKeys.includes(k));
    for (const k of removed) { try { await deleteThumb(k); } catch (e) {} }
    onSave(Object.assign({}, d, { links: d.links.filter(l => l.url.trim()), updatedAt: Date.now() }));
  };
  // 背景タップでも cancel が呼ばれるため、書きかけを黙って捨てないよう変更の有無を見る
  const dirty = JSON.stringify(d) !== JSON.stringify(post);
  const cancel = async () => {
    if (dirty && !confirm('編集内容を破棄しますか？')) return;
    // 追加したが保存しなかったサムネは孤児になるので消す
    const added = d.thumbKeys.filter(k => !original.current.includes(k));
    for (const k of added) { try { await deleteThumb(k); } catch (e) {} }
    onClose();
  };

  return (
    <Sheet title="編集" onClose={cancel}>
      <label className="lbl">タイトル</label>
      <input className="field" value={d.title} onChange={e => set('title', e.target.value)} placeholder="例: 8/12 ライブ" />

      <div className="sec">サムネ{d.thumbKeys.length > 1 && <span style={{ color:'var(--muted)', fontWeight:400 }}>（左が1枚目）</span>}</div>
      <div className="thumb-strip" style={{ marginBottom:10 }}>
        {d.thumbKeys.map((k, i) => (
          <div className="thumb-item" key={k}>
            {urls[k] && <img src={urls[k]} alt="" />}
            {d.thumbKeys.length > 1 && <span className="thumb-no">{i + 1}</span>}
            <button className="thumb-del" onClick={() => removeThumb(k)}>×</button>
            {d.thumbKeys.length > 1 && (
              <button className="thumb-move prev" disabled={i === 0}
                      onClick={() => moveThumb(i, -1)} aria-label="前へ">◀</button>
            )}
            {d.thumbKeys.length > 1 && (
              <button className="thumb-move next" disabled={i === d.thumbKeys.length - 1}
                      onClick={() => moveThumb(i, 1)} aria-label="後へ">▶</button>
            )}
          </div>
        ))}
      </div>
      <label className="btn wide" style={{ display:'block', textAlign:'center', marginBottom:16 }}>
        {busy ? '読み込み中…' : '＋ 画像を追加'}
        <input type="file" accept="image/*" multiple style={{ display:'none' }} onChange={addFiles} />
      </label>

      <label className="lbl">キャプション</label>
      <textarea className="field" rows="6" value={d.caption} onChange={e => set('caption', e.target.value)} placeholder="本文"
                style={{ marginBottom:4 }} />
      {/* Instagram は本文2,200字まで。フィードでは125字で「…続きを読む」に折り返される */}
      <div style={{ marginBottom:10 }}>
        {d.caption.length > CAPTION_LIMIT
          ? <span className="warn">{d.caption.length} / {CAPTION_LIMIT} 字 — 上限を超えています</span>
          : <span className="ok">{d.caption.length} / {CAPTION_LIMIT} 字</span>}
        {d.caption.length > CAPTION_FOLD && (
          <div style={{ fontSize:11, color:'var(--muted)', marginTop:4, lineHeight:1.6 }}>
            冒頭{CAPTION_FOLD}字（フィードで見える範囲）: {d.caption.slice(0, CAPTION_FOLD)}…
          </div>
        )}
      </div>

      <div className="row">
        <div style={{ flex:1 }}>
          <label className="lbl">投稿予定日</label>
          <input className="field" type="date" value={d.scheduledAt} onChange={e => set('scheduledAt', e.target.value)} />
        </div>
        <div style={{ flex:1 }}>
          <label className="lbl">撮影日</label>
          <input className="field" type="date" value={d.shootDate} onChange={e => set('shootDate', e.target.value)} />
        </div>
      </div>

      <div className="sec">ジャンル</div>
      {genres.length
        ? <div className="chips" style={{ flexWrap:'wrap', overflowX:'visible', marginBottom:10 }}>
            {genres.map(g => (
              <span key={g} className={'chip' + (d.genre === g ? ' active' : '')}
                    onClick={() => set('genre', d.genre === g ? '' : g)}>{g}</span>
            ))}
          </div>
        : <div style={{ color:'var(--muted)', fontSize:13, marginBottom:10 }}>投稿一覧の「＋」からジャンルを作れます</div>}

      <label className="lbl">場所</label>
      <input className="field" value={d.place} onChange={e => set('place', e.target.value)} />
      {placeCandidates.length > 0 && (
        <div className="chips" style={{ flexWrap:'wrap', overflowX:'visible', marginTop:-4, marginBottom:10 }}>
          {placeCandidates.map(n => <span key={n} className="chip" onClick={() => set('place', n)}>{n}</span>)}
        </div>
      )}

      <label className="lbl">メモ</label>
      <textarea className="field" rows="2" value={d.memo} onChange={e => set('memo', e.target.value)} />

      <div className="sec">タグセット</div>
      {tagSets.length
        ? <div className="chips" style={{ flexWrap:'wrap', overflowX:'visible' }}>
            {tagSets.map(s => (
              <span key={s.id} className={'chip' + (d.tagSetIds.includes(s.id) ? ' active' : '')}
                    onClick={() => toggleSet(s.id)}>{s.name}（{s.tags.length}）</span>
            ))}
          </div>
        : <div style={{ color:'var(--muted)', fontSize:13, marginBottom:8 }}>タグセットタブで先に作れます</div>}

      <label className="lbl">この投稿だけの追加タグ</label>
      <textarea className="field" rows="2" value={d.extraTags} onChange={e => set('extraTags', e.target.value)}
                placeholder="スペース・改行区切り（# はあってもなくても可）" />
      {tagCandidates.length > 0 && (
        <div className="chips" style={{ flexWrap:'wrap', overflowX:'visible', marginTop:-4, marginBottom:10 }}>
          {tagCandidates.map(t => <span key={t} className="chip" onClick={() => pickTag(t)}>#{t}</span>)}
        </div>
      )}
      <div style={{ marginBottom:10 }}>
        {over ? <span className="warn">合計 {tags.length} 個 — 上限30個を超えています</span>
              : <span className="ok">合計 {tags.length} 個</span>}
      </div>

      <div className="sec">原本リンク</div>
      {d.links.map((lk, i) => (
        <div key={i} style={{ marginBottom:10, paddingBottom:10, borderBottom:'1px solid var(--line)' }}>
          <input className="field" value={lk.label} onChange={e => setLink(i, 'label', e.target.value)} placeholder="ラベル（省略可）" />
          <input className="field" value={lk.url} onChange={e => setLink(i, 'url', e.target.value)} placeholder="https://..." />
          <div className="row" style={{ marginBottom:0 }}>
            <button className="btn sm" onClick={() => pasteLink(i)}>📋 クリップボードから貼る</button>
            <button className="btn sm danger" onClick={() => delLink(i)}>削除</button>
          </div>
        </div>
      ))}
      <button className="btn wide" onClick={addLink}>＋ リンクを追加</button>

      <div className="sheet-actions">
        <button className="btn" onClick={cancel}>やめる</button>
        <button className="btn primary" onClick={save}>保存</button>
      </div>
    </Sheet>
  );
}

/* ===== 投稿タブ ===== */
function PostsTab({ posts, tagSets, urls, onOpen, onNew, onPickPhotos, picking, genres, onAddGenre, onDeleteGenre }) {
  const [q, setQ] = useState('');
  const [filter, setFilter] = useState('all');
  const [genreFilter, setGenreFilter] = useState('all');
  const [insightOnly, setInsightOnly] = useState(false);

  useEffect(() => {
    if (genreFilter !== 'all' && !genres.includes(genreFilter)) setGenreFilter('all');
  }, [genres, genreFilter]);

  const waiting = useMemo(() => posts.filter(needsInsight).length, [posts]);
  // 入力し終えて0件になったら絞り込みも自動で解除する
  useEffect(() => { if (!waiting) setInsightOnly(false); }, [waiting]);

  const filtered = useMemo(() => {
    const lq = q.trim().toLowerCase();
    return posts.filter(p => {
      if (insightOnly && !needsInsight(p)) return false;
      if (filter !== 'all' && p.status !== filter) return false;
      if (genreFilter !== 'all' && p.genre !== genreFilter) return false;
      if (!lq) return true;
      const hay = [p.title, p.caption, p.place, tagsOf(p, tagSets).join(' ')].join(' ').toLowerCase();
      return hay.indexOf(lq) >= 0;
    });
  }, [posts, tagSets, q, filter, genreFilter, insightOnly]);

  const groups = useMemo(() => {
    const map = new Map();
    filtered.forEach(p => {
      const m = p.scheduledAt ? p.scheduledAt.slice(0, 7) : '';
      if (!map.has(m)) map.set(m, []);
      map.get(m).push(p);
    });
    const keys = [...map.keys()].filter(Boolean).sort();
    if (map.has('')) keys.push('');
    // 月の中は投稿予定日が近い順(昇順)に並べる
    return keys.map(k => [k, map.get(k).slice().sort((a, b) => (a.scheduledAt || '').localeCompare(b.scheduledAt || ''))]);
  }, [filtered]);

  return (
    <div>
      {waiting > 0 && (
        <button className={'notice' + (insightOnly ? ' active' : '')}
                onClick={() => {
                  const next = !insightOnly;
                  setInsightOnly(next);
                  // 入力待ちは投稿済みに限られるので、ステータス絞り込みが残っていると空振りする
                  if (next) setFilter('all');
                }}>
          📊 数値の入力待ち {waiting}件{insightOnly ? '（表示中・タップで解除）' : ''}
        </button>
      )}
      <input className="search" value={q} onChange={e => setQ(e.target.value)} placeholder="タイトル・本文・タグを検索…" />
      <div className="chips">
        <span className={'chip' + (filter === 'all' ? ' active' : '')} onClick={() => setFilter('all')}>すべて</span>
        {Object.keys(STATUS).map(st => (
          <span key={st} className={'chip' + (filter === st ? ' active' : '')} onClick={() => setFilter(st)}>{STATUS[st].label}</span>
        ))}
      </div>
      <div className="chips">
        <span className={'chip' + (genreFilter === 'all' ? ' active' : '')} onClick={() => setGenreFilter('all')}>すべてのジャンル</span>
        {genres.map(g => (
          <span key={g} className={'chip' + (genreFilter === g ? ' active' : '')} onClick={() => setGenreFilter(genreFilter === g ? 'all' : g)}>
            {g}
            {genreFilter === g && (
              <span onClick={e => { e.stopPropagation(); onDeleteGenre(g); }} style={{ marginLeft:6 }}>×</span>
            )}
          </span>
        ))}
        <span className="chip" onClick={onAddGenre}>＋</span>
      </div>
      {/* 写真を先に選ぶ導線。編集シートを開いて最下部までスクロールする手間を飛ばす */}
      <label className="btn primary wide" style={{ display:'block', textAlign:'center', marginBottom:8 }}>
        {picking ? '読み込み中…' : '📷 写真から作成'}
        <input type="file" accept="image/*" multiple style={{ display:'none' }} onChange={onPickPhotos} />
      </label>
      <button className="btn wide" onClick={onNew}>＋ 空の投稿を作る</button>

      {!filtered.length && (
        <Empty icon="🗒" text={posts.length ? '条件に合う投稿がありません' : 'まだ投稿がありません。\n「📷 写真から作成」で写真を選ぶと早いです。'} />
      )}

      {groups.map(([month, list]) => (
        <div key={month || 'none'}>
          <div className="month-title">{month ? month.replace('-', '年') + '月' : '日付未定'}</div>
          <div className="grid">
            {list.map(p => (
              <div className="card" key={p.id} onClick={() => onOpen(p)}>
                {p.thumbKeys[0] && urls[p.thumbKeys[0]]
                  ? <img className="card-thumb" src={urls[p.thumbKeys[0]]} alt="" />
                  : <div className="card-noimg">🖼</div>}
                <div className="card-body">
                  <div className="card-title">{p.title || '（無題）'}</div>
                  <div className="card-meta">
                    <span className="dot" style={{ background: STATUS[p.status].color }}></span>
                    <span>{p.scheduledAt || '日付未定'}</span>
                    <span>#{tagsOf(p, tagSets).length}</span>
                    {missingLink(p) && <span className="no-link" title="原本リンク未登録">🔗なし</span>}
                  </div>
                  {daysLeftText(p) && <div className="days-left">{daysLeftText(p)}</div>}
                </div>
              </div>
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}

/* ===== タグセットタブ ===== */
function TagSetsTab({ tagSets, posts, onChange }) {
  const [editing, setEditing] = useState(null);

  const usageRate = set => {
    const recent = posts.slice().sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).slice(0, 10);
    if (!recent.length) return null;
    const used = recent.filter(p => (p.tagSetIds || []).includes(set.id)).length;
    return Math.round(used / recent.length * 100);
  };
  const save = () => {
    const tags = parseTags(editing.tagsText);
    const name = editing.name.trim() || '無題のセット';
    const next = tagSets.some(s => s.id === editing.id)
      ? tagSets.map(s => s.id === editing.id ? { id: s.id, name, tags } : s)
      : tagSets.concat([{ id: editing.id, name, tags }]);
    onChange(next);
    setEditing(null);
  };
  const del = id => {
    if (!confirm('このタグセットを削除しますか？')) return;
    onChange(tagSets.filter(s => s.id !== id));
    setEditing(null);
  };

  return (
    <div>
      <button className="btn primary wide" onClick={() => setEditing({ id: uid(), name: '', tagsText: '' })}>＋ セットを追加</button>

      {!tagSets.length && <Empty icon="🏷" text={'タグセットがまだありません。\n「ライブ用」「アー写用」などを作ると使い回せます。'} />}

      {tagSets.map(s => {
        const rate = usageRate(s);
        return (
          <div key={s.id} style={{ background:'var(--surface)', border:'1px solid var(--line)', borderRadius:12, padding:12, marginTop:12 }}>
            <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:8 }}>
              <div style={{ flex:1, fontWeight:700, fontSize:14 }}>{s.name}</div>
              <button className="btn sm" onClick={() => setEditing({ id: s.id, name: s.name, tagsText: s.tags.join(' ') })}>編集</button>
            </div>
            <div style={{ fontSize:11, color:'var(--muted)', marginBottom:7 }}>
              {s.tags.length} 個{rate != null && ' ・ 直近10投稿での使用率 ' + rate + '%'}
            </div>
            <div>{s.tags.map(t => <span key={t} className="tag-pill">#{t}</span>)}</div>
          </div>
        );
      })}

      {editing && (
        <Sheet title="タグセット" onClose={() => setEditing(null)}>
          <label className="lbl">セット名</label>
          <input className="field" value={editing.name} onChange={e => setEditing(Object.assign({}, editing, { name: e.target.value }))} placeholder="例: ライブ用" />
          <label className="lbl">タグ</label>
          <textarea className="field" rows="6" value={editing.tagsText}
                    onChange={e => setEditing(Object.assign({}, editing, { tagsText: e.target.value }))}
                    placeholder="スペース・改行区切り（# はあってもなくても可）" />
          <div className="ok" style={{ marginBottom:12 }}>{parseTags(editing.tagsText).length} 個</div>
          <div className="row">
            <button className="btn danger" style={{ flex:1 }} onClick={() => del(editing.id)}>削除</button>
            <button className="btn primary" style={{ flex:1 }} onClick={save}>保存</button>
          </div>
        </Sheet>
      )}
    </div>
  );
}

/* ===== プロンプトタブ ===== */
// AIにキャプションを書かせる時などに使う定型プロンプトを名前付きで保存する。
// 投稿には紐付けない(独立した保管庫)。使う時はコピーしてAIチャット等に貼る想定。
function PromptsTab({ prompts, onChange, toast }) {
  const [editing, setEditing] = useState(null);
  const [expandedId, setExpandedId] = useState(null);

  const save = () => {
    const name = editing.name.trim() || '無題のプロンプト';
    const body = editing.body;
    const next = prompts.some(p => p.id === editing.id)
      // 既存分は favorite を保ったまま name/body だけ更新する
      ? prompts.map(p => p.id === editing.id ? Object.assign({}, p, { name, body }) : p)
      : prompts.concat([{ id: editing.id, name, body, favorite: false }]);
    onChange(next);
    setEditing(null);
  };
  const del = id => {
    if (!confirm('このプロンプトを削除しますか？')) return;
    onChange(prompts.filter(p => p.id !== id));
    setEditing(null);
  };
  const copy = body => {
    if (!navigator.clipboard || !navigator.clipboard.writeText) { toast('このブラウザはコピーに対応していません', true); return; }
    navigator.clipboard.writeText(body)
      .then(() => toast('プロンプトをコピーしました'))
      .catch(() => toast('コピーに失敗しました', true));
  };
  const toggleFavorite = id => onChange(prompts.map(p => p.id === id ? Object.assign({}, p, { favorite: !p.favorite }) : p));

  const favorites = prompts.filter(p => p.favorite);

  return (
    <div>
      <button className="btn primary wide" onClick={() => setEditing({ id: uid(), name: '', body: '' })}>＋ プロンプトを追加</button>

      {!prompts.length && <Empty icon="💬" text={'保存したプロンプトがまだありません。\nAIにキャプションを書かせる時の指示文を保存しておけます。'} />}

      {favorites.length > 0 && (
        <div style={{ marginTop:16 }}>
          <div className="sec">★ お気に入り（タップでコピー）</div>
          <div className="chips" style={{ flexWrap:'wrap', overflowX:'visible' }}>
            {favorites.map(p => (
              <span key={p.id} className="chip fav" onClick={() => copy(p.body)}>★ {p.name}</span>
            ))}
          </div>
        </div>
      )}

      {prompts.length > 0 && (
        <div style={{ marginTop:16 }}>
          <div className="sec">プロンプト一覧（{prompts.length}件）</div>
          {prompts.map(p => {
            const open = expandedId === p.id;
            return (
              <div key={p.id}>
                <div className={'prompt-row' + (open ? ' open' : '')} onClick={() => setExpandedId(open ? null : p.id)}>
                  <button className={'prompt-fav' + (p.favorite ? ' active' : '')}
                          onClick={e => { e.stopPropagation(); toggleFavorite(p.id); }}
                          aria-label="お気に入り">{p.favorite ? '★' : '☆'}</button>
                  <div className="prompt-name">{p.name}</div>
                  <span className="prompt-caret">{open ? '▲' : '▼'}</span>
                  <button className="btn sm" onClick={e => { e.stopPropagation(); setEditing({ id: p.id, name: p.name, body: p.body }); }}>編集</button>
                  <button className="btn sm danger" onClick={e => { e.stopPropagation(); del(p.id); }}>削除</button>
                </div>
                {open && (
                  <div className="prompt-body">
                    <button className="btn wide" style={{ marginBottom:10 }} onClick={() => copy(p.body)}>🗒️ コピー</button>
                    <div style={{ whiteSpace:'pre-wrap', fontSize:13, color:'var(--muted)', marginBottom:10 }}>{p.body}</div>
                    <div className="row" style={{ marginBottom:0 }}>
                      <button className="btn" style={{ flex:1 }} onClick={() => copy(p.body)}>📋 コピー</button>
                      <button className="btn" style={{ flex:1 }} onClick={() => setExpandedId(null)}>▲ 折りたたむ</button>
                    </div>
                  </div>

        <Sheet title="プロンプト" onClose={() => setEditing(null)}>
          <label className="lbl">名前</label>
          <input className="field" value={editing.name} onChange={e => setEditing(Object.assign({}, editing, { name: e.target.value }))} placeholder="例: ライブ写真用キャプション" />
          <label className="lbl">プロンプト本文</label>
          <textarea className="field" rows="10" value={editing.body}
                    onChange={e => setEditing(Object.assign({}, editing, { body: e.target.value }))}
                    placeholder="AIに渡す指示文をそのまま書きます" />
          <div className="row">
            <button className="btn danger" style={{ flex:1 }} onClick={() => del(editing.id)}>削除</button>
            <button className="btn primary" style={{ flex:1 }} onClick={save}>保存</button>
          </div>
        </Sheet>
      )}

  );
}

/* ===== 分析タブ ===== */
function AnalyticsTab({ posts, tagSets, genres }) {
  const done = posts.filter(p => p.status === 'posted' && p.insight
    && (p.insight.reach != null || p.insight.saves != null || p.insight.likes != null));
  if (!done.length) return <Empty icon="📊" text={'投稿済のデータがまだありません。\n投稿後にリーチ・保存・いいねを入れると集計します。'} />;

  const avg = list => {
    const m = a => a.length ? Math.round(a.reduce((x, y) => x + y, 0) / a.length) : null;
    const pick = k => list.filter(p => p.insight[k] != null).map(p => p.insight[k]);
    // 保存率は投稿ごとに出してから平均する。合計比だと大きくバズった1件に引きずられる
    const rates = list.filter(p => p.insight.reach && p.insight.saves != null)
                      .map(p => p.insight.saves / p.insight.reach * 100);
    const rate = rates.length ? Math.round(rates.reduce((x, y) => x + y, 0) / rates.length * 10) / 10 : null;
    return { n: list.length, reach: m(pick('reach')), saves: m(pick('saves')), likes: m(pick('likes')), rate };
  };
  const show = v => v == null ? '—' : v.toLocaleString();
  const showRate = v => v == null ? '—' : v + '%';
  const WD = ['日','月','火','水','木','金','土'];

  const byWeekday = WD.map((w, i) => {
    const list = done.filter(p => {
      const d = p.postedAt || p.scheduledAt;
      if (!d) return false;
      const dt = new Date(d + 'T00:00:00');
      return !isNaN(dt) && dt.getDay() === i;
    });
    return [w, avg(list)];
  });

  const bySet = tagSets.map(s => [s.name, avg(done.filter(p => (p.tagSetIds || []).includes(s.id)))]);

  // ジャンル別は件数0の行を出さない。未設定の投稿がある時だけ最後に「未設定」を足す
  const byGenre = (genres || [])
    .map(g => [g, avg(done.filter(p => p.genre === g))])
    .filter(([, a]) => a.n > 0);
  const noGenre = avg(done.filter(p => !p.genre));
  if (noGenre.n > 0) byGenre.push(['未設定', noGenre]);

  const table = (head, rows) => (
    <div className="tbl-wrap">
      <table className="tbl">
        <thead><tr>
          <th>{head}</th>
          <th style={{ textAlign:'right' }}>件数</th>
          <th style={{ textAlign:'right' }}>リーチ</th>
          <th style={{ textAlign:'right' }}>保存</th>
          <th style={{ textAlign:'right' }}>保存率</th>
          <th style={{ textAlign:'right' }}>いいね</th>
        </tr></thead>
        <tbody>
          {rows.map(([label, a]) => (
            <tr key={label}>
              <td>{label}</td>
              <td className="num">{a.n || '—'}</td>
              <td className="num">{show(a.reach)}</td>
              <td className="num">{show(a.saves)}</td>
              <td className="num">{showRate(a.rate)}</td>
              <td className="num">{show(a.likes)}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );

  return (
    <div>
      <div className="sec">曜日別</div>
      {table('曜日', byWeekday)}
      <div className="sec">ジャンル別</div>
      {byGenre.length ? table('ジャンル', byGenre) : <div style={{ color:'var(--muted)', fontSize:13 }}>ジャンル付きの投稿済データがありません</div>}
      <div className="sec">タグセット別</div>
      {bySet.length ? table('セット', bySet) : <div style={{ color:'var(--muted)', fontSize:13 }}>タグセットがありません</div>}
      <div style={{ fontSize:11, color:'var(--muted)', marginTop:6 }}>
        対象: 投稿済かつ数値を入れた {done.length} 件。保存率は「保存 ÷ リーチ」を投稿ごとに出した平均。
      </div>
    </div>
  );
}

/* ===== ストレージ =====
   サムネの取りこぼし(削除失敗・生成直後の異常終了・復元時の残骸)は表に出ないまま溜まる。
   今どれだけ使っているかと、参照されていない分の件数をここでだけ確認できるようにする。 */
function StorageBox({ posts, toast }) {
  const [info, setInfo] = useState(null);
  const [busy, setBusy] = useState(false);

  const refresh = useCallback(async () => {
    try {
      const keys = await listThumbKeys();
      const used = new Set(posts.flatMap(p => p.thumbKeys || []));
      let usage = null;
      if (navigator.storage && navigator.storage.estimate) {
        try { usage = (await navigator.storage.estimate()).usage; } catch (e) {}
      }
      setInfo({ total: keys.length, orphans: keys.filter(k => !used.has(k)).length, usage });
    } catch (e) { setInfo(null); }
  }, [posts]);

  useEffect(() => { refresh(); }, [refresh]);

  const sweep = async () => {
    if (!confirm('どの投稿からも参照されていないサムネを削除します。よろしいですか？')) return;
    setBusy(true);
    try {
      const n = await sweepThumbs(posts.flatMap(p => p.thumbKeys || []));
      toast(n ? n + '件の孤児サムネを削除しました' : '削除するものはありませんでした');
      await refresh();
    } catch (e) { toast('削除に失敗しました', true); }
    setBusy(false);
  };

  if (!info) return null;
  const mb = info.usage == null ? null : Math.round(info.usage / 1048576 * 10) / 10;

  return (
    <div>
      <div className="sec" style={{ marginTop:22 }}>ストレージ</div>
      <div style={{ fontSize:12, color:'var(--muted)' }}>
        サムネ {info.total} 件{mb != null && <span>／使用量 約 {mb} MB</span>}
      </div>
      {info.orphans > 0 && (
        <button className="btn wide" style={{ marginTop:8 }} onClick={sweep} disabled={busy}>
          {busy ? '削除中…' : '🧹 孤児サムネを削除（' + info.orphans + '件）'}
        </button>
      )}
    </div>
  );
}

/* ===== 本体 ===== */
function App() {
  const init = lsGet(APP_KEY, {});
  const [posts, setPosts] = useState(() => init.posts || []);
  const [tagSets, setTagSets] = useState(() => init.tagSets || []);
  // 場所・タグの入力履歴。投稿を削除しても候補は残したいので posts とは別に保持する
  const [placeHistory, setPlaceHistory] = useState(() => init.placeHistory || {});
  const [tagHistory, setTagHistory] = useState(() => init.tagHistory || {});
  const [prompts, setPrompts] = useState(() => init.prompts || []);
  const [genres, setGenres] = useState(() => init.genres || []);
  // 最後に書き出した時刻。取れていないことに気づく手段がこれしかないので必ず永続化する
  const [lastBackupAt, setLastBackupAt] = useState(() => init.lastBackupAt || '');
  const [tab, setTab] = useState('posts');
  const [detailId, setDetailId] = useState(null);
  const [editing, setEditing] = useState(null);
  const [msg, setMsg] = useState(null);
  const [picking, setPicking] = useState(false);
  const [picked, setPicked] = useState(null); // 複数選択時に分けかたを聞くための一時保持

  useEffect(() => {
    lsSet(APP_KEY, { posts, tagSets, placeHistory, tagHistory, prompts, genres, lastBackupAt });
  }, [posts, tagSets, placeHistory, tagHistory, prompts, genres, lastBackupAt]);

  const toast = useCallback((text, isErr) => {
    setMsg({ text, isErr: !!isErr });
    setTimeout(() => setMsg(null), 2600);
  }, []);

  const detail = posts.find(p => p.id === detailId) || null;
  const backupAge = daysSince(lastBackupAt);

  // グリッドは各投稿の1枚目、詳細を開いている間はその投稿の全枚数を読む
  const thumbKeys = useMemo(() => {
    const ks = posts.map(p => p.thumbKeys[0]).filter(Boolean);
    if (detail) detail.thumbKeys.forEach(k => { if (!ks.includes(k)) ks.push(k); });
    return ks;
  }, [posts, detail]);
  const urls = useThumbUrls(thumbKeys);

  const upsert = post => {
    setPosts(prev => prev.some(p => p.id === post.id)
      ? prev.map(p => p.id === post.id ? post : p)
      : prev.concat([post]));
    // 保存のたびに使った場所・タグをカウントし、次回の入力予測に使う
    setPlaceHistory(prev => bumpHistory(prev, post.place));
    setTagHistory(prev => parseTags(post.extraTags).reduce((h, t) => bumpHistory(h, t), prev));
  };

  // ジャンルは投稿一覧のフィルタから直接追加・削除する。1投稿につき1つの単一選択
  const addGenre = () => {
    const name = (prompt('ジャンル名を入力してください（例: ライブ、アー写）') || '').trim();
    if (!name) return;
    if (genres.includes(name)) { toast('同じ名前のジャンルがあります', true); return; }
    setGenres(prev => prev.concat([name]));
  };
  const delGenre = name => {
    if (!confirm('「' + name + '」を削除しますか？')) return;
    setGenres(prev => prev.filter(g => g !== name));
  };

  const removePost = async post => {
    if (!confirm('この投稿を削除しますか？')) return;
    for (const k of post.thumbKeys) { try { await deleteThumb(k); } catch (e) {} }
    setPosts(prev => prev.filter(p => p.id !== post.id));
    setDetailId(null);
    toast('削除しました');
  };

  // ===== 写真から作成 =====
  // 1枚なら即その場で投稿を作って編集へ。複数なら分けかたを聞いてから作る。
  const baseName = f => (f.name || '').replace(/\.[^.]+$/, '');
  const pickPhotos = async ev => {
    const files = [...ev.target.files];
    ev.target.value = '';
    if (!files.length) return;
    setPicking(true);
    try {
      const made = [];
      for (const f of files) made.push({ key: await makeThumb(f), name: baseName(f) });
      if (made.length === 1) {
        const post = newPost({ title: made[0].name, thumbKeys: [made[0].key] });
        setEditing(post);
      } else {
        setPicked(made);
      }
    } catch (e) { toast('画像を読み込めませんでした', true); }
    setPicking(false);
  };
  const commitPicked = mode => {
    if (!picked) return;
    if (mode === 'one') {
      setPosts(prev => prev.concat([newPost({ title: picked[0].name, thumbKeys: picked.map(m => m.key) })]));
      toast('1件の投稿にしました');
    } else {
      setPosts(prev => prev.concat(picked.map(m => newPost({ title: m.name, thumbKeys: [m.key] }))));
      toast(picked.length + '件の投稿にしました');
    }
    setPicked(null);
  };
  const cancelPicked = async () => {
    // 作ったサムネを孤児にしないよう、取りやめたら実体も消す
    for (const m of picked || []) { try { await deleteThumb(m.key); } catch (e) {} }
    setPicked(null);
  };

  // ===== バックアップ =====
  const saveFile = (a, href) => { a.click(); URL.revokeObjectURL(href); };
  // 共有シートが使えるならそちらを優先する。ダウンロードだとファイルアプリに落ちて
  // 手で移す必要があり、その手間が「書き出さない」の主因になるため。
  // 戻り値は「実際に保存されたか」。キャンセルされた時は false を返す。
  const dl = async (obj, suffix) => {
    const name = APP_NAME + suffix + '_' + today() + '.json';
    const blob = new Blob([JSON.stringify(obj)], { type: 'application/json' });
    const file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: name });
        return true;
      } catch (e) {
        // ユーザーが共有シートを閉じた場合は保存されていないので、ダウンロードもしない
        if (e && e.name === 'AbortError') return false;
        // await をまたいだことで操作許可が切れた場合などはダウンロードに落とす
      }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    saveFile(a, a.href);
    return true;
  };
  const stampBackup = ok => { if (ok) setLastBackupAt(new Date().toISOString()); };
  const exportFull = async () => {
    try {
      const thumbs = {};
      const keys = [...new Set(posts.flatMap(p => p.thumbKeys))];
      for (const k of keys) {
        const b = await getThumb(k);
        if (b) thumbs[k] = await blobToDataUri(b);
      }
      const ok = await dl({ version: 1, exportedAt: new Date().toISOString(), posts, tagSets, placeHistory, tagHistory, prompts, genres, thumbs }, '');
      stampBackup(ok);
      if (ok) toast('サムネ込みで書き出しました');
    } catch (e) { toast('書き出しに失敗しました', true); }
  };
  const exportText = async () => {
    try {
      const ok = await dl({ version: 1, exportedAt: new Date().toISOString(), posts, tagSets, placeHistory, tagHistory, prompts, genres }, '_テキストのみ');
      stampBackup(ok);
      if (ok) toast('テキストのみで書き出しました');
    } catch (e) { toast('書き出しに失敗しました', true); }
  };
  const importData = ev => {
    const file = ev.target.files[0];
    ev.target.value = '';
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data.posts) { toast('このファイルは復元用の形式ではありません', true); return; }
        // 何件が何件で潰れるかを見せる。古いバックアップの誤選択はここでしか止められない
        const msg = '現在の ' + posts.length + ' 件を、取り込んだ ' + data.posts.length + ' 件で置き換えます。\n'
                  + (data.exportedAt ? '書き出し日: ' + data.exportedAt.slice(0, 10) + '\n' : '')
                  + '元に戻せません。よろしいですか？';
        if (!confirm(msg)) return;
        if (data.thumbs) {
          for (const k of Object.keys(data.thumbs)) {
            await putThumbWithKey(k, await dataUriToBlob(data.thumbs[k]));
          }
        }
        // 全消しではなく sweep にする。テキストのみバックアップを同じ端末に戻した場合、
        // キーは一致したままなので画像は生き残るのが正しい。無条件クリアだとそれを壊す。
        await sweepThumbs(data.posts.flatMap(p => p.thumbKeys || []));
        lsSet(APP_KEY, {
          posts: data.posts, tagSets: data.tagSets || [],
          placeHistory: data.placeHistory || {}, tagHistory: data.tagHistory || {},
          prompts: data.prompts || [], genres: data.genres || [],
          // このファイルが現に存在する以上、そこがこのデータのバックアップ地点になる
          lastBackupAt: data.exportedAt || '',
        });
        location.reload();
      } catch (e) { toast('読み込みに失敗しました: ' + e.message, true); }
    };
    reader.readAsText(file);
  };

  return (
    <div>
      <div className="header">
        <div className="header-title">投稿ストック帳</div>
      </div>
      <div className="tabs">
        {[['posts','投稿'],['tags','タグセット'],['prompts','プロンプト'],['stats','分析']].map(([k, label]) => (
          <button key={k} className={'tab' + (tab === k ? ' active' : '')} onClick={() => setTab(k)}>{label}</button>
        ))}
      </div>

      <div className="main">
        {tab === 'posts' && (
          <PostsTab posts={posts} tagSets={tagSets} urls={urls}
                    onOpen={p => setDetailId(p.id)}
                    onNew={() => setEditing(newPost())}
                    onPickPhotos={pickPhotos} picking={picking}
                    genres={genres} onAddGenre={addGenre} onDeleteGenre={delGenre} />
        )}
        {tab === 'tags' && <TagSetsTab tagSets={tagSets} posts={posts} onChange={setTagSets} />}
        {tab === 'prompts' && <PromptsTab prompts={prompts} onChange={setPrompts} toast={toast} />}
        {tab === 'stats' && <AnalyticsTab posts={posts} tagSets={tagSets} genres={genres} />}

        <div className="sec" style={{ marginTop:28 }}>バックアップ</div>
        <div style={{ marginBottom:10 }}>
          {backupAge == null
            ? <span className="warn">まだ書き出していません</span>
            : backupAge > BACKUP_WARN_DAYS
              ? <span className="warn">最後の書き出しから {backupAge} 日 — 取り直してください</span>
              : <span className="ok">最後の書き出し: {lastBackupAt.slice(0, 10)}（{backupAge === 0 ? '今日' : backupAge + '日前'}）</span>}
        </div>
        <div className="row"><button className="btn" style={{ flex:1 }} onClick={exportFull}>📤 サムネ込み</button>
          <button className="btn" style={{ flex:1 }} onClick={exportText}>📄 テキストのみ</button></div>
        <label className="btn wide" style={{ display:'block', textAlign:'center' }}>
          📥 復元
          <input type="file" accept=".json" style={{ display:'none' }} onChange={importData} />
        </label>
        <div style={{ fontSize:11, color:'var(--muted)', marginTop:8 }}>
          書き出したJSONは非公開リポジトリ care-data-backup に置いてください。
        </div>

        <StorageBox posts={posts} toast={toast} />
      </div>

      {picked && (
        <Sheet title={'📷 ' + picked.length + '枚を取り込む'} onClose={cancelPicked}>
          <div style={{ fontSize:12, color:'var(--muted)', marginBottom:14 }}>
            まとめて1投稿にするか、1枚ずつ別の投稿にするかを選びます。
          </div>
          <button className="btn primary wide" style={{ marginBottom:8 }} onClick={() => commitPicked('one')}>
            まとめて1投稿にする
          </button>
          <button className="btn wide" style={{ marginBottom:8 }} onClick={() => commitPicked('each')}>
            1枚ずつ別の投稿にする（{picked.length}件）
          </button>
          <button className="btn danger wide" onClick={cancelPicked}>やめる</button>
        </Sheet>
      )}

      {detail && !editing && (
        <DetailSheet post={detail} tagSets={tagSets} urls={urls}
                     onClose={() => setDetailId(null)}
                     onEdit={() => setEditing(detail)}
                     onDelete={() => removePost(detail)}
                     onChange={upsert} toast={toast} />
      )}

      {editing && (
        <EditSheet post={editing} tagSets={tagSets} toast={toast}
                   isNew={!posts.some(p => p.id === editing.id)}
                   placeHistory={placeHistory} tagHistory={tagHistory}
                   genres={genres}
                   onClose={() => setEditing(null)}
                   onSave={p => { upsert(p); setEditing(null); setDetailId(p.id); toast('保存しました'); }} />
      )}

      {msg && <div className={'toast' + (msg.isErr ? ' err' : '')}>{msg.text}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
