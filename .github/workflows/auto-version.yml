name: Auto Version Stamp

on:
  push:
    branches: [main]
    paths:
      - '**.html'

permissions:
  contents: write

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stamp version
        run: |
          # push されたコミット範囲で変更された全 HTML ファイルを取得
          CHANGED_HTML=$(git diff --name-only '${{ github.event.before }}' '${{ github.sha }}' 2>/dev/null | grep '\.html$' || true)

          # 差分が取得できない場合（初回等）はリポジトリ内の全 HTML を対象にする
          if [ -z "$CHANGED_HTML" ]; then
            CHANGED_HTML=$(ls *.html 2>/dev/null || true)
          fi

          TS_VER=$(date +%Y%m%d-%H%M%S)

          for FILE in $CHANGED_HTML; do
            [ -f "$FILE" ] || continue

            # 1. 数値型バージョン (例: const APP_VERSION = 10 や const HYOKA_VERSION = 5) のインクリメント
            if grep -qE 'const [A-Z_]+_VERSION = [0-9]+' "$FILE"; then
              VAR_NAME=$(grep -oE 'const [A-Z_]+_VERSION' "$FILE" | head -n 1)
              CUR=$(grep -oE "${VAR_NAME} = [0-9]+" "$FILE" | grep -oE '[0-9]+')
              VER=$((CUR + 1))
              sed -i "s/${VAR_NAME} = [0-9]*/${VAR_NAME} = $VER/" "$FILE"
              
              # ver.txt の自動生成・更新 (kakeibo は ver.txt、その他は {ファイル名}-ver.txt)
              BASENAME=$(basename "$FILE" .html)
              if [ "$BASENAME" = "kakeibo" ]; then
                echo "$VER" > ver.txt
              else
                echo "$VER" > "${BASENAME}-ver.txt"
              fi
            fi

            # 2. タイムスタンプ型バージョン (例: const APP_VERSION = '...';) の更新
            if grep -qE "const APP_VERSION = '[^']*';" "$FILE"; then
              sed -i "s/const APP_VERSION = '[^']*';/const APP_VERSION = '$TS_VER';/" "$FILE"
            fi
          done

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: auto-stamp version [skip ci]"
          git push
