<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#eef5ff" />
  <title>Prospect Loop — Mist Glass</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --ink: #18233b;
      --ink-soft: #59677f;
      --ink-faint: #8794aa;
      --line: rgba(120, 144, 184, .18);
      --glass: rgba(255, 255, 255, .76);
      --glass-strong: rgba(255, 255, 255, .90);
      --glass-muted: rgba(247, 250, 255, .62);
      --blue: #5b7cff;
      --blue-dark: #465ed9;
      --lavender: #9a86ff;
      --coral: #ff8b89;
      --mint: #5ebfa6;
      --amber: #ebad55;
      --shadow: 0 18px 48px rgba(83, 101, 144, .13);
      --shadow-soft: 0 8px 22px rgba(83, 101, 144, .08);
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: #edf4ff; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      background:
        radial-gradient(circle at 10% 4%, rgba(160, 202, 255, .72) 0, rgba(160, 202, 255, 0) 28rem),
        radial-gradient(circle at 93% 11%, rgba(222, 190, 255, .58) 0, rgba(222, 190, 255, 0) 28rem),
        radial-gradient(circle at 67% 93%, rgba(255, 203, 190, .48) 0, rgba(255, 203, 190, 0) 31rem),
        linear-gradient(145deg, #f8fbff 0%, #eef4ff 48%, #fbf8ff 100%);
      overflow-x: hidden;
    }

    body::before, body::after {
      content: "";
      position: fixed;
      z-index: -1;
      border-radius: 999px;
      filter: blur(3px);
      opacity: .72;
      pointer-events: none;
    }
    body::before { width: 330px; height: 330px; left: -135px; bottom: 2%; background: rgba(148, 213, 206, .28); }
    body::after { width: 260px; height: 260px; right: -95px; top: 42%; background: rgba(163, 151, 255, .18); }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid rgba(91,124,255,.25); outline-offset: 2px; }

    .app-shell { width: min(1440px, calc(100% - 36px)); margin: 18px auto; min-height: calc(100vh - 36px); display: flex; gap: 20px; }
    .glass {
      background: var(--glass);
      backdrop-filter: blur(20px) saturate(135%);
      -webkit-backdrop-filter: blur(20px) saturate(135%);
      border: 1px solid rgba(255,255,255,.74);
      box-shadow: var(--shadow);
    }

    .sidebar { width: 245px; flex: 0 0 245px; border-radius: var(--radius-xl); padding: 22px 14px; display: flex; flex-direction: column; min-height: calc(100vh - 36px); }
    .brand { display: flex; align-items: center; gap: 11px; padding: 6px 9px 27px; }
    .brand-mark { width: 36px; height: 36px; border-radius: 13px; background: linear-gradient(135deg, #6d8dff, #9678ee 58%, #fa9995); position: relative; box-shadow: 0 8px 18px rgba(99, 113, 230, .25); }
    .brand-mark::before { content: ""; position: absolute; inset: 8px; border: 2px solid rgba(255,255,255,.92); border-radius: 8px 11px 8px 11px; transform: rotate(-14deg); }
    .brand-name { font-weight: 800; letter-spacing: -.04em; font-size: 18px; }
    .brand-sub { font-size: 10px; color: var(--ink-faint); letter-spacing: .13em; font-weight: 800; text-transform: uppercase; margin-top: 2px; }

    .nav-label { color: var(--ink-faint); font-weight: 800; font-size: 10px; letter-spacing: .12em; padding: 0 12px 8px; text-transform: uppercase; }
    .nav { display: grid; gap: 5px; }
    .nav-item { border: 0; background: transparent; color: var(--ink-soft); border-radius: 13px; display: flex; align-items: center; gap: 12px; padding: 11px 12px; text-align: left; font-weight: 700; font-size: 14px; transition: .18s ease; }
    .nav-item:hover { background: rgba(255,255,255,.54); color: var(--ink); transform: translateX(2px); }
    .nav-item.active { background: rgba(255,255,255,.82); box-shadow: 0 5px 17px rgba(91,116,171,.09); color: var(--blue-dark); }
    .nav-icon { width: 18px; height: 18px; display: grid; place-items: center; font-size: 17px; line-height: 1; }
    .nav-count { margin-left: auto; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; display: grid; place-items: center; background: rgba(91,124,255,.12); color: var(--blue-dark); font-size: 11px; }
    .sidebar-spacer { flex: 1; }
    .privacy-mini { border-radius: 16px; padding: 12px; background: rgba(255,255,255,.49); border: 1px solid rgba(255,255,255,.65); color: var(--ink-soft); font-size: 11px; line-height: 1.55; }
    .privacy-mini strong { color: var(--ink); display: block; font-size: 12px; margin-bottom: 3px; }
    .user-mini { display: flex; align-items: center; gap: 10px; margin-top: 14px; padding: 8px; }

    .avatar { flex: 0 0 auto; width: 41px; height: 41px; border-radius: 15px; display: grid; place-items: center; color: white; font-weight: 800; font-size: 13px; box-shadow: inset 0 1px rgba(255,255,255,.45), 0 6px 12px rgba(85,104,149,.12); }
    .avatar.purple { background: linear-gradient(135deg,#9a8eff,#6e7ef0); }
    .avatar.coral { background: linear-gradient(135deg,#ffac9a,#f47494); }
    .avatar.mint { background: linear-gradient(135deg,#6bd4c1,#4b9bc1); }
    .avatar.blue { background: linear-gradient(135deg,#78b7ff,#6682e6); }
    .avatar.amber { background: linear-gradient(135deg,#facd79,#e88f61); }

    .user-mini .name { font-weight: 800; font-size: 13px; }
    .user-mini .role { font-size: 11px; color: var(--ink-faint); margin-top: 2px; }

    main { min-width: 0; flex: 1; padding: 20px 8px 36px 2px; }
    .topbar { min-height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 0 9px 22px; }
    .breadcrumb { color: var(--ink-faint); font-size: 12px; font-weight: 700; margin-bottom: 5px; }
    .title { margin: 0; letter-spacing: -.055em; font-size: clamp(25px, 3vw, 35px); line-height: 1.1; }
    .title em { font-style: normal; color: var(--blue-dark); }
    .top-actions { display: flex; gap: 9px; align-items: center; }
    .btn { border: 0; border-radius: 13px; padding: 11px 14px; font-weight: 800; font-size: 13px; transition: .18s ease; display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
    .btn:hover { transform: translateY(-1px); }
    .btn.secondary { color: var(--ink-soft); background: rgba(255,255,255,.54); border: 1px solid rgba(255,255,255,.76); }
    .btn.secondary:hover { background: rgba(255,255,255,.9); color: var(--ink); }
    .btn.primary { color: white; background: linear-gradient(135deg, var(--blue), var(--lavender) 62%, #d080cf); box-shadow: 0 9px 19px rgba(101,111,220,.26); }
    .btn.primary:hover { box-shadow: 0 12px 24px rgba(101,111,220,.34); }
    .btn.instagram { color: white; background: linear-gradient(135deg, #ff9a85, #cf6cbd 48%, #7369df); box-shadow: 0 9px 20px rgba(184,101,181,.24); }
    .btn.small { padding: 8px 10px; font-size: 12px; border-radius: 11px; }
    .btn.icon-only { width: 38px; height: 38px; padding: 0; font-size: 16px; }

    .view { display: none; animation: fade .26s ease both; }
    .view.active { display: block; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.53fr) minmax(260px, .77fr); gap: 18px; }
    .panel { border-radius: var(--radius-xl); padding: 22px; }
    .panel-title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .panel-title { font-size: 15px; margin: 0; letter-spacing: -.025em; }
    .panel-kicker { color: var(--ink-faint); font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }

    .hero-observation { min-height: 332px; position: relative; overflow: hidden; background: linear-gradient(135deg, rgba(255,255,255,.86), rgba(242,247,255,.7)); }
    .hero-observation::after { content: ""; position: absolute; width: 220px; height: 220px; right: -70px; bottom: -115px; border-radius: 50%; background: radial-gradient(circle, rgba(160,136,255,.24), transparent 67%); }
    .observation-main { position: relative; z-index: 1; display: flex; gap: 19px; align-items: flex-start; }
    .observation-avatar { width: 76px; height: 76px; border-radius: 26px; font-size: 23px; }
    .status-line { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
    .status-pill { border-radius: 999px; padding: 5px 9px; font-size: 10px; font-weight: 900; letter-spacing: .035em; }
    .status-pill.watch { background: rgba(91,124,255,.13); color: #4e66cd; }
    .status-pill.warm { background: rgba(255,157,142,.15); color: #ca6b65; }
    .mini-date { font-size: 11px; color: var(--ink-faint); font-weight: 700; }
    .person-name { margin: 0; letter-spacing: -.04em; font-size: 23px; }
    .handle { color: var(--ink-faint); margin: 3px 0 0; font-size: 13px; font-weight: 700; }
    .reason-box { position: relative; z-index: 1; margin: 22px 0 15px; background: rgba(255,255,255,.64); border: 1px solid rgba(255,255,255,.78); border-radius: 17px; padding: 13px 15px; }
    .reason-label { font-size: 10px; color: var(--ink-faint); font-weight: 900; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 6px; }
    .reason-text { font-size: 14px; font-weight: 750; line-height: 1.55; }
    .previous-note { position: relative; z-index: 1; color: var(--ink-soft); font-size: 12px; line-height: 1.6; padding: 0 2px; }
    .previous-note strong { color: var(--ink); }
    .hero-footer { position: relative; z-index: 1; margin-top: 18px; display: flex; align-items: center; gap: 10px; }
    .person-progress { margin-left: auto; display: flex; gap: 5px; }
    .person-progress span { width: 6px; height: 6px; border-radius: 50%; background: rgba(116,135,172,.2); }
    .person-progress span.active { width: 18px; border-radius: 9px; background: var(--blue); }

    .summary-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .metric-card { border-radius: 18px; padding: 16px; min-height: 113px; background: rgba(255,255,255,.64); border: 1px solid rgba(255,255,255,.72); box-shadow: var(--shadow-soft); }
    .metric-card:nth-child(2) { background: rgba(248,244,255,.64); }
    .metric-card:nth-child(3) { background: rgba(244,255,253,.65); }
    .metric-card:nth-child(4) { background: rgba(255,249,240,.65); }
    .metric-label { color: var(--ink-faint); font-size: 11px; font-weight: 800; }
    .metric-value { font-size: 29px; font-weight: 850; letter-spacing: -.055em; margin-top: 5px; }
    .metric-sub { color: var(--ink-soft); font-size: 11px; margin-top: 3px; }

    .queue-panel { margin-top: 18px; }
    .queue-list { display: grid; gap: 9px; }
    .queue-item { display: flex; align-items: center; gap: 12px; padding: 10px; border: 1px solid rgba(255,255,255,.69); border-radius: 16px; background: rgba(255,255,255,.49); transition: .18s ease; }
    .queue-item:hover { background: rgba(255,255,255,.81); transform: translateX(2px); }
    .queue-item .avatar { width: 35px; height: 35px; border-radius: 12px; font-size: 11px; }
    .queue-person { min-width: 0; flex: 1; }
    .queue-person strong { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .queue-person small { display: block; color: var(--ink-faint); font-size: 11px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tiny-open { width: 32px; height: 32px; border-radius: 11px; border: 0; background: rgba(91,124,255,.1); color: var(--blue-dark); font-weight: 900; font-size: 14px; }
    .tiny-open:hover { background: rgba(91,124,255,.19); }

    .side-stack { display: grid; gap: 18px; }
    .focus-card { min-height: 201px; position: relative; overflow: hidden; background: linear-gradient(150deg, rgba(114,136,245,.91), rgba(143,119,225,.86)); color: white; }
    .focus-card::before { content: ""; width: 185px; height: 185px; position: absolute; border-radius: 50%; right: -85px; top: -82px; border: 1px solid rgba(255,255,255,.31); box-shadow: 0 0 0 23px rgba(255,255,255,.06), 0 0 0 47px rgba(255,255,255,.04); }
    .focus-card .panel-kicker { color: rgba(255,255,255,.66); }
    .focus-number { font-size: 43px; font-weight: 850; letter-spacing: -.07em; margin: 16px 0 2px; }
    .focus-card p { margin: 0; font-size: 12px; line-height: 1.55; color: rgba(255,255,255,.86); max-width: 225px; }
    .focus-footer { position: absolute; left: 22px; bottom: 18px; display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; }
    .dot { width: 7px; height: 7px; background: #c9ffe8; border-radius: 50%; box-shadow: 0 0 0 5px rgba(201,255,232,.15); }

    .quick-panel { padding-bottom: 15px; }
    .quick-list { display: grid; gap: 7px; }
    .quick-button { width: 100%; border: 0; background: transparent; border-radius: 13px; padding: 10px 9px; display: flex; gap: 10px; align-items: center; text-align: left; color: var(--ink-soft); font-weight: 750; font-size: 12px; }
    .quick-button:hover { background: rgba(255,255,255,.63); color: var(--ink); }
    .quick-symbol { width: 27px; height: 27px; border-radius: 9px; display: grid; place-items: center; background: rgba(91,124,255,.1); color: var(--blue-dark); font-size: 14px; }

    .list-toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 18px; }
    .search-wrap { flex: 1; min-width: 180px; position: relative; }
    .search-wrap span { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--ink-faint); }
    .search-wrap input { width: 100%; border: 1px solid rgba(255,255,255,.82); border-radius: 13px; padding: 11px 12px 11px 35px; background: rgba(255,255,255,.57); color: var(--ink); font-size: 13px; }
    .filter-chip { border: 1px solid rgba(255,255,255,.75); padding: 9px 11px; border-radius: 12px; background: rgba(255,255,255,.48); color: var(--ink-soft); font-size: 12px; font-weight: 800; }
    .filter-chip.active { background: rgba(91,124,255,.12); color: var(--blue-dark); border-color: rgba(91,124,255,.13); }

    .profiles-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
    .profile-card { border-radius: 20px; padding: 16px; min-height: 226px; display: flex; flex-direction: column; background: rgba(255,255,255,.61); border: 1px solid rgba(255,255,255,.78); box-shadow: var(--shadow-soft); transition: .2s ease; }
    .profile-card:hover { transform: translateY(-3px); background: rgba(255,255,255,.83); box-shadow: var(--shadow); }
    .card-head { display: flex; gap: 10px; align-items: center; }
    .card-head .avatar { width: 40px; height: 40px; border-radius: 14px; font-size: 12px; }
    .card-head strong { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-head small { display: block; font-size: 11px; color: var(--ink-faint); font-weight: 700; margin-top: 2px; }
    .card-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 14px; }
    .tag { border-radius: 999px; background: rgba(100,130,204,.09); color: #61709a; padding: 4px 7px; font-size: 10px; font-weight: 800; }
    .tag.coral { background: rgba(255,139,137,.13); color: #c67471; }
    .tag.mint { background: rgba(94,191,166,.13); color: #43927d; }
    .card-note { color: var(--ink-soft); margin: 13px 0 9px; font-size: 12px; line-height: 1.55; flex: 1; }
    .card-next { display: flex; align-items: center; justify-content: space-between; gap: 6px; color: var(--ink-faint); font-size: 10px; font-weight: 800; border-top: 1px solid rgba(128,148,189,.12); padding-top: 10px; }
    .card-actions { display: flex; gap: 6px; margin-top: 11px; }
    .card-actions .btn { flex: 1; }

    .lists-layout { display: grid; grid-template-columns: minmax(220px,.55fr) minmax(0,1.45fr); gap: 18px; }
    .list-menu { padding: 12px; border-radius: var(--radius-xl); align-self: start; }
    .list-row { width: 100%; border: 0; background: transparent; display: flex; align-items: center; gap: 10px; padding: 11px; text-align: left; border-radius: 13px; color: var(--ink-soft); font-size: 13px; font-weight: 800; }
    .list-row:hover, .list-row.active { background: rgba(255,255,255,.73); color: var(--ink); }
    .list-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--blue); }
    .list-row small { margin-left: auto; color: var(--ink-faint); }
    .list-content { min-height: 450px; }

    .empty { text-align: center; padding: 52px 18px; color: var(--ink-soft); }
    .empty-icon { font-size: 30px; margin-bottom: 10px; }
    .empty h3 { margin: 0; color: var(--ink); letter-spacing: -.03em; }
    .empty p { font-size: 13px; line-height: 1.6; }

    .modal-backdrop { position: fixed; z-index: 20; inset: 0; padding: 18px; display: none; align-items: center; justify-content: center; background: rgba(24,34,57,.25); backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px); }
    .modal-backdrop.show { display: flex; animation: fade .18s ease both; }
    .modal { width: min(560px, 100%); max-height: min(760px, calc(100vh - 36px)); overflow: auto; border-radius: 26px; padding: 23px; background: rgba(252,254,255,.9); border: 1px solid rgba(255,255,255,.87); box-shadow: 0 28px 90px rgba(32,45,76,.25); }
    .modal-header { display: flex; justify-content: space-between; gap: 15px; align-items: flex-start; margin-bottom: 18px; }
    .modal-header h2 { margin: 0; font-size: 20px; letter-spacing: -.04em; }
    .modal-header p { margin: 5px 0 0; font-size: 12px; color: var(--ink-soft); line-height: 1.55; }
    .close-modal { border: 0; border-radius: 11px; background: rgba(95,116,165,.08); color: var(--ink-soft); width: 34px; height: 34px; font-size: 18px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
    .field { display: grid; gap: 6px; }
    .field.full { grid-column: 1/-1; }
    .field label { font-size: 11px; font-weight: 850; color: var(--ink-soft); }
    .field input, .field select, .field textarea { width: 100%; background: rgba(242,247,255,.68); border: 1px solid rgba(112,137,190,.14); color: var(--ink); border-radius: 12px; padding: 11px 12px; font-size: 13px; }
    .field textarea { min-height: 82px; resize: vertical; line-height: 1.55; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 9px; margin-top: 20px; }
    .form-hint { font-size: 11px; color: var(--ink-faint); line-height: 1.55; margin: 3px 0 0; }

    .ocr-drop { border: 1.5px dashed rgba(91,124,255,.3); border-radius: 18px; padding: 23px 15px; background: rgba(237,244,255,.65); text-align: center; }
    .ocr-drop input { display: none; }
    .ocr-symbol { width: 47px; height: 47px; border-radius: 16px; margin: 0 auto 10px; display: grid; place-items: center; font-size: 22px; background: linear-gradient(135deg, rgba(102,138,255,.18), rgba(188,137,255,.15)); }
    .ocr-drop strong { display: block; font-size: 14px; }
    .ocr-drop p { margin: 6px auto 12px; color: var(--ink-soft); font-size: 11px; line-height: 1.55; max-width: 330px; }
    .ocr-progress { display: none; margin-top: 13px; }
    .ocr-progress.show { display: block; }
    .progress-line { height: 7px; border-radius: 9px; background: rgba(91,124,255,.1); overflow: hidden; }
    .progress-line span { display: block; width: 0%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--blue), var(--lavender)); transition: width .18s ease; }
    .progress-text { color: var(--ink-soft); font-size: 11px; margin-top: 6px; }
    .ocr-privacy { border-radius: 13px; padding: 10px 11px; margin-top: 14px; background: rgba(94,191,166,.08); color: #397967; font-size: 11px; line-height: 1.55; }

    .toast { position: fixed; z-index: 30; right: 22px; bottom: 22px; width: min(360px, calc(100% - 44px)); padding: 13px 15px; border-radius: 15px; background: rgba(31,43,70,.93); color: white; box-shadow: 0 18px 38px rgba(17,25,49,.25); font-size: 13px; font-weight: 700; line-height: 1.45; transform: translateY(20px); opacity: 0; pointer-events: none; transition: .25s ease; }
    .toast.show { transform: translateY(0); opacity: 1; }

    .bottom-nav { display: none; }

    @media (max-width: 1080px) {
      .profiles-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .dashboard-grid { grid-template-columns: 1fr; }
      .side-stack { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 760px) {
      body { padding-bottom: 79px; }
      .app-shell { width: 100%; margin: 0; display: block; min-height: 100vh; }
      .sidebar { display: none; }
      main { padding: 18px 15px 22px; }
      .topbar { padding: 0 2px 17px; align-items: flex-start; }
      .top-actions .secondary { display: none; }
      .title { font-size: 27px; }
      .top-actions .btn.primary { width: 39px; height: 39px; padding: 0; font-size: 0; border-radius: 14px; }
      .top-actions .btn.primary::after { content: "+"; font-size: 23px; font-weight: 500; }
      .panel { padding: 17px; border-radius: 23px; }
      .hero-observation { min-height: auto; }
      .observation-main { gap: 12px; }
      .observation-avatar { width: 60px; height: 60px; border-radius: 21px; font-size: 18px; }
      .person-name { font-size: 19px; }
      .side-stack { grid-template-columns: 1fr; }
      .summary-grid { grid-template-columns: repeat(4, 1fr); overflow-x: auto; padding-bottom: 3px; }
      .metric-card { min-width: 124px; }
      .profiles-grid { grid-template-columns: 1fr; }
      .lists-layout { grid-template-columns: 1fr; }
      .list-menu { display: flex; overflow-x: auto; gap: 4px; padding: 7px; }
      .list-row { min-width: max-content; padding: 9px; }
      .list-row small { display: none; }
      .bottom-nav { display: flex; position: fixed; z-index: 12; left: 12px; right: 12px; bottom: 12px; height: 61px; padding: 7px; border-radius: 21px; align-items: center; justify-content: space-around; background: rgba(251,253,255,.82); backdrop-filter: blur(19px); -webkit-backdrop-filter: blur(19px); border: 1px solid rgba(255,255,255,.84); box-shadow: 0 12px 32px rgba(67,87,133,.18); }
      .bottom-item { border: 0; background: transparent; color: var(--ink-faint); min-width: 65px; height: 48px; border-radius: 14px; display: grid; place-items: center; gap: 2px; font-size: 10px; font-weight: 800; }
      .bottom-item span { font-size: 17px; line-height: 1; }
      .bottom-item.active { color: var(--blue-dark); background: rgba(91,124,255,.1); }
      .bottom-add { width: 48px; height: 48px; margin-top: -20px; border: 0; border-radius: 17px; color: white; font-size: 27px; line-height: 1; background: linear-gradient(135deg,var(--blue),var(--lavender),#d181c8); box-shadow: 0 11px 24px rgba(99,106,216,.35); }
      .form-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar glass">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <div class="brand-name">Prospect Loop</div>
          <div class="brand-sub">quiet relationships</div>
        </div>
      </div>
      <div class="nav-label">ワークスペース</div>
      <nav class="nav">
        <button class="nav-item active" data-view="today"><span class="nav-icon">◌</span>今日の観察 <span class="nav-count" id="todayCount">0</span></button>
        <button class="nav-item" data-view="profiles"><span class="nav-icon">⌘</span>すべての候補</button>
        <button class="nav-item" data-view="lists"><span class="nav-icon">◇</span>テーマ・リスト</button>
      </nav>
      <div class="nav-label" style="margin-top:25px">ショートカット</div>
      <nav class="nav">
        <button class="nav-item" id="sidebarAdd"><span class="nav-icon">＋</span>候補を追加</button>
        <button class="nav-item" id="sidebarOcr"><span class="nav-icon">⌁</span>スクショから追加</button>
      </nav>
      <div class="sidebar-spacer"></div>
      <div class="privacy-mini">
        <strong>プライバシー優先</strong>
        プロフィールURLと、あなた自身の観察・行動だけをローカルに保存します。
      </div>
      <div class="user-mini">
        <div class="avatar purple">PL</div>
        <div><div class="name">あなたのワークスペース</div><div class="role">個人モード · ローカル保存</div></div>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <div>
          <div class="breadcrumb" id="breadcrumb">WORKSPACE / TODAY</div>
          <h1 class="title" id="pageTitle">今日、<em>理解を深める</em>人</h1>
        </div>
        <div class="top-actions">
          <button class="btn secondary" id="restoreBtn">↥ バックアップを復元</button>
          <button class="btn secondary" id="exportBtn">⇩ バックアップを保存</button>
          <button class="btn primary" id="addBtn">＋ 候補を追加</button>
        </div>
      </header>

      <section class="view active" id="view-today">
        <div class="dashboard-grid">
          <div>
            <section class="panel glass hero-observation" id="heroCard"></section>
            <section class="panel glass queue-panel">
              <div class="panel-title-row"><div><div class="panel-kicker">UP NEXT</div><h2 class="panel-title">このあと確認する候補</h2></div><button class="btn secondary small" data-view="profiles">すべて見る</button></div>
              <div class="queue-list" id="queueList"></div>
            </section>
          </div>
          <div class="side-stack">
            <section class="panel focus-card glass">
              <div class="panel-kicker">FOCUS THIS WEEK</div>
              <div class="focus-number" id="focusNumber">0</div>
              <p>今週のうちに、投稿を確認して次の一手を決める候補です。</p>
              <div class="focus-footer"><span class="dot"></span><span>人間主導の観察キュー</span></div>
            </section>
            <section class="panel glass quick-panel">
              <div class="panel-title-row" style="margin-bottom:8px"><div><div class="panel-kicker">QUICK ACTIONS</div><h2 class="panel-title">今すぐできること</h2></div></div>
              <div class="quick-list">
                <button class="quick-button" id="quickAdd"><span class="quick-symbol">＋</span><span>プロフィールを追加する</span></button>
                <button class="quick-button" id="quickOcr"><span class="quick-symbol">⌁</span><span>スクショをOCRして登録</span></button>
                <button class="quick-button" id="quickImport"><span class="quick-symbol">⇩</span><span>人物記録JSONを一度取り込む</span></button>
                <button class="quick-button" id="quickReview"><span class="quick-symbol">↺</span><span>滞留中の候補を確認</span></button>
              </div>
            </section>
            <section class="summary-grid" id="summaryGrid"></section>
          </div>
        </div>
      </section>

      <section class="view" id="view-profiles">
        <div class="list-toolbar">
          <div class="search-wrap"><span>⌕</span><input id="profileSearch" type="search" placeholder="名前、@アカウント名、メモを検索" autocomplete="off" /></div>
          <button class="filter-chip active" data-filter="all">すべて</button>
          <button class="filter-chip" data-filter="inbox">未整理</button>
          <button class="filter-chip" data-filter="watching">観察中</button>
          <button class="filter-chip" data-filter="warm">関係構築中</button>
        </div>
        <div class="profiles-grid" id="profilesGrid"></div>
      </section>

      <section class="view" id="view-lists">
        <div class="lists-layout">
          <aside class="list-menu glass" id="listMenu"></aside>
          <section class="panel glass list-content">
            <div class="panel-title-row"><div><div class="panel-kicker" id="listKicker">LIST</div><h2 class="panel-title" id="listTitle">すべての候補</h2></div><button class="btn secondary small" id="newListBtn">＋ リストを追加</button></div>
            <div class="profiles-grid" id="listProfilesGrid"></div>
          </section>
        </div>
      </section>
    </main>
  </div>

  <nav class="bottom-nav" aria-label="モバイルナビゲーション">
    <button class="bottom-item active" data-view="today"><span>◌</span>今日</button>
    <button class="bottom-item" data-view="profiles"><span>⌘</span>候補</button>
    <button class="bottom-add" id="bottomAdd" aria-label="候補を追加">＋</button>
    <button class="bottom-item" data-view="lists"><span>◇</span>リスト</button>
    <button class="bottom-item" id="bottomOcr"><span>⌁</span>OCR</button>
  </nav>

  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal" id="modalContent"></div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    // v2ではテスト用のv1ローカルデータを読み込まず、空の状態から始めます。
    const STORAGE_KEY = 'prospect-loop-mist-glass-v2';
    const today = new Date();
    const isoDate = (d) => new Date(d).toISOString().slice(0, 10);
    const addDays = (days) => { const d = new Date(); d.setDate(d.getDate() + days); return isoDate(d); };

    const palette = ['purple','coral','mint','blue','amber'];
    const defaultLists = [
      { id: 'inbox', name: '未整理インボックス', color: '#9a86ff', order: 0 },
      { id: 'prospects', name: '商談候補', color: '#5b7cff', order: 1 },
      { id: 'relationships', name: '関係構築', color: '#5ebfa6', order: 2 },
      { id: 'collab', name: '協業・紹介候補', color: '#ff8b89', order: 3 },
      { id: 'learning', name: '学習対象', color: '#ebad55', order: 4 }
    ];
    // 配布版は候補者データを持たず、空のワークスペースから始めます。
    const demoProfiles = [];

    const loadState = () => {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) { console.warn('Could not load local data', e); }
      return { profiles: demoProfiles, lists: defaultLists, activeList: 'all', lastFilter: 'all' };
    };
    let state = loadState();
    const saveState = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const $ = (s) => document.querySelector(s);
    const $$ = (s) => [...document.querySelectorAll(s)];
    const escapeHtml = (s = '') => String(s).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const initials = (label, username) => {
      const source = (label || username || '?').trim();
      if (/^[A-Za-z0-9_]+$/.test(source)) return source.slice(0,2).toUpperCase();
      return [...source].slice(0,2).join('');
    };
    const profileUrl = (username) => `https://www.instagram.com/${String(username || '').replace(/^@/, '').trim()}/`;
    const isDue = (p) => p.nextReview && p.nextReview <= isoDate(today) && p.status !== 'archived';
    const statusLabel = (status) => ({ inbox: '未整理', watching: '観察中', warm: '関係構築中', archived: 'アーカイブ' }[status] || status);
    const statusClass = (status) => status === 'warm' ? 'warm' : 'watch';
    const formatDate = (date) => {
      if (!date) return 'まだ見ていません';
      const diff = Math.ceil((new Date(date) - new Date()) / 86400000);
      if (diff === 0) return '今日';
      if (diff === 1) return '明日';
      if (diff === -1) return '昨日';
      return `${new Date(date).getMonth()+1}/${new Date(date).getDate()}`;
    };

    function renderAvatar(p, className = '') {
      return `<div class="avatar ${p.avatar || 'purple'} ${className}">${escapeHtml(initials(p.label, p.username))}</div>`;
    }
    function getVisibleProfiles() { return state.profiles.filter(p => p.status !== 'archived'); }
    function getTodayProfiles() { return getVisibleProfiles().filter(isDue).sort((a,b) => a.priority - b.priority || a.nextReview.localeCompare(b.nextReview)); }
    function openInstagram(id) {
      const p = state.profiles.find(x => x.id === id); if (!p) return;
      p.lastOpened = isoDate(new Date());
      p.observations = p.observations || [];
      p.observations.unshift({ type: 'opened', note: 'Instagramプロフィールを開いた', at: new Date().toISOString() });
      state.pendingReturn = { profileId: id, openedAt: new Date().toISOString(), prompted: false };
      saveState(); renderAll();
      // 別タブを作らず同一画面で開く。対応端末ではInstagramのユニバーサルリンクとしてアプリへ渡され、
      // 戻る／アプリ切替でこのHTMLへ戻りやすくなります。
      window.location.assign(profileUrl(p.username));
    }

    function showReturnPrompt() {
      const pending = state.pendingReturn;
      if (!pending || pending.prompted || $('#modalBackdrop').classList.contains('show')) return;
      const p = state.profiles.find(x => x.id === pending.profileId);
      if (!p) { state.pendingReturn = null; saveState(); return; }
      pending.prompted = true; saveState();
      modal(`
        <div class="modal-header"><div><h2 id="modalTitle">おかえりなさい</h2><p>${escapeHtml(p.label || p.username)}の投稿を確認できましたか？ いまの気づきを一行残すと、次の再訪が楽になります。</p></div><button class="close-modal" data-return-later>×</button></div>
        <div class="reason-box" style="margin:0 0 16px"><div class="reason-label">見に行った目的</div><div class="reason-text">${escapeHtml(p.reason || 'この候補を理解するため')}</div></div>
        <div class="modal-footer" style="justify-content:space-between"><button class="btn secondary" type="button" data-return-later>あとで記録</button><button class="btn primary" type="button" data-return-note="${p.id}">観察を記録する</button></div>`);
    }

    function resumeAfterExternalApp() {
      const pending = state.pendingReturn;
      if (!pending || pending.prompted) return;
      const elapsed = Date.now() - new Date(pending.openedAt).getTime();
      if (elapsed >= 1200 && elapsed < 86400000) setTimeout(showReturnPrompt, 350);
      if (elapsed >= 86400000) { state.pendingReturn = null; saveState(); }
    }
    function profileCard(p) {
      const tags = (p.tags || []).slice(0,3).map((t,i) => `<span class="tag ${i===1?'coral':i===2?'mint':''}">${escapeHtml(t)}</span>`).join('');
      return `<article class="profile-card" data-id="${p.id}">
        <div class="card-head">${renderAvatar(p)}<div style="min-width:0"><strong>${escapeHtml(p.label || p.username)}</strong><small>@${escapeHtml(p.username)}</small></div></div>
        <div class="card-tags">${tags || '<span class="tag">未整理</span>'}</div>
        <p class="card-note">${escapeHtml(p.reason || 'まだ「追う理由」は設定されていません。')}</p>
        <div class="card-next"><span>次に見る日</span><span>${formatDate(p.nextReview)}</span></div>
        <div class="card-actions"><button class="btn secondary small" data-action="note" data-id="${p.id}">記録する</button><button class="btn instagram small" data-action="open" data-id="${p.id}">Instagram ↗</button></div>
      </article>`;
    }

    function renderToday() {
      const due = getTodayProfiles();
      $('#todayCount').textContent = due.length;
      $('#focusNumber').textContent = due.length;
      const hero = due[0] || getVisibleProfiles()[0];
      if (!hero) {
        $('#heroCard').innerHTML = `<div class="empty"><div class="empty-icon">✦</div><h3>最初の候補を追加しましょう</h3><p>プロフィールURL、@アカウント名、またはスクリーンショットから始められます。</p><button class="btn primary" onclick="showAddModal()">＋ 候補を追加</button></div>`;
      } else {
        $('#heroCard').innerHTML = `
          <div class="panel-title-row"><div><div class="panel-kicker">TODAY'S OBSERVATION</div><h2 class="panel-title">今、Instagramで確認する理由</h2></div><span class="status-pill ${statusClass(hero.status)}">${statusLabel(hero.status)}</span></div>
          <div class="observation-main">${renderAvatar(hero,'observation-avatar')}<div style="min-width:0"><div class="status-line"><span class="mini-date">最終確認 ${hero.lastOpened ? formatDate(hero.lastOpened) : 'なし'}</span></div><h3 class="person-name">${escapeHtml(hero.label || hero.username)}</h3><p class="handle">@${escapeHtml(hero.username)}</p></div></div>
          <div class="reason-box"><div class="reason-label">なぜ今見る？</div><div class="reason-text">${escapeHtml(hero.reason || 'この候補を、あなたの目的に合わせて仕分けましょう。')}</div></div>
          <div class="previous-note"><strong>前回の気づき：</strong>${escapeHtml(hero.note || 'まだ観察メモはありません。投稿を確認して、自分の言葉で一行残しましょう。')}</div>
          <div class="hero-footer"><button class="btn instagram" data-action="open" data-id="${hero.id}">Instagramで開く ↗</button><button class="btn secondary" data-action="note" data-id="${hero.id}">見た後に記録</button><div class="person-progress"><span class="active"></span><span></span><span></span></div></div>`;
      }
      const queue = due.slice(1,5);
      $('#queueList').innerHTML = queue.length ? queue.map(p => `<div class="queue-item">${renderAvatar(p)}<div class="queue-person"><strong>${escapeHtml(p.label || p.username)}</strong><small>${escapeHtml(p.reason || '追う目的を設定しましょう')}</small></div><button class="tiny-open" data-action="open" data-id="${p.id}" aria-label="Instagramで開く">↗</button></div>`).join('') : `<div class="empty" style="padding:26px 12px"><div class="empty-icon">☼</div><h3 style="font-size:15px">今日の観察は完了です</h3><p style="margin:7px 0 0">新しい候補を追加するか、次の確認日を設定しましょう。</p></div>`;
      const visible = getVisibleProfiles();
      const warm = visible.filter(p => p.status === 'warm').length;
      const inbox = visible.filter(p => p.status === 'inbox').length;
      const actioned = visible.filter(p => (p.observations||[]).some(o => o.type === 'note')).length;
      $('#summaryGrid').innerHTML = `
        <div class="metric-card"><div class="metric-label">全候補</div><div class="metric-value">${visible.length}</div><div class="metric-sub">関係の棚にいる人</div></div>
        <div class="metric-card"><div class="metric-label">未整理</div><div class="metric-value">${inbox}</div><div class="metric-sub">あとで一問仕分け</div></div>
        <div class="metric-card"><div class="metric-label">関係構築中</div><div class="metric-value">${warm}</div><div class="metric-sub">次の接点を検討</div></div>
        <div class="metric-card"><div class="metric-label">観察の記録</div><div class="metric-value">${actioned}</div><div class="metric-sub">自分の判断を残した数</div></div>`;
    }

    function renderProfiles() {
      const term = ($('#profileSearch')?.value || '').trim().toLowerCase();
      const filter = state.lastFilter || 'all';
      let profiles = getVisibleProfiles();
      if (filter !== 'all') profiles = profiles.filter(p => p.status === filter);
      if (term) profiles = profiles.filter(p => [p.label,p.username,p.reason,p.note,(p.tags||[]).join(' ')].join(' ').toLowerCase().includes(term));
      $('#profilesGrid').innerHTML = profiles.length ? profiles.map(profileCard).join('') : `<div class="empty" style="grid-column:1/-1"><div class="empty-icon">⌕</div><h3>該当する候補はありません</h3><p>検索語やフィルターを変えるか、新しい候補を追加してください。</p></div>`;
      $$('.filter-chip').forEach(btn => btn.classList.toggle('active', btn.dataset.filter === filter));
    }

    function renderLists() {
      const all = [{id:'all',name:'すべての候補',color:'#5b7cff'}].concat(state.lists);
      $('#listMenu').innerHTML = all.map(list => {
        const count = list.id === 'all' ? getVisibleProfiles().length : getVisibleProfiles().filter(p => (p.lists||[]).includes(list.id)).length;
        return `<button class="list-row ${state.activeList===list.id?'active':''}" data-list="${list.id}"><span class="list-dot" style="background:${list.color}"></span><span>${escapeHtml(list.name)}</span><small>${count}</small></button>`;
      }).join('');
      const current = all.find(l => l.id === state.activeList) || all[0];
      const profiles = current.id === 'all' ? getVisibleProfiles() : getVisibleProfiles().filter(p => (p.lists||[]).includes(current.id));
      $('#listKicker').textContent = current.id === 'all' ? 'ALL PROSPECTS' : 'THEME LIST';
      $('#listTitle').textContent = current.name;
      $('#listProfilesGrid').innerHTML = profiles.length ? profiles.map(profileCard).join('') : `<div class="empty" style="grid-column:1/-1"><div class="empty-icon">◇</div><h3>このリストは空です</h3><p>候補を追加すると、ここからすぐにInstagramへ開けます。</p></div>`;
    }

    function renderAll() { renderToday(); renderProfiles(); renderLists(); }

    function switchView(name) {
      $$('.view').forEach(v => v.classList.toggle('active', v.id === `view-${name}`));
      $$('.nav-item[data-view], .bottom-item[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === name));
      const copy = {today:['WORKSPACE / TODAY','今日、<em>理解を深める</em>人'], profiles:['WORKSPACE / PROSPECTS','見失わない、<em>候補の棚</em>'], lists:['WORKSPACE / LISTS','目的ごとに、<em>関係を整える</em>']};
      $('#breadcrumb').textContent = copy[name][0]; $('#pageTitle').innerHTML = copy[name][1];
      if (name === 'profiles') setTimeout(() => $('#profileSearch')?.focus(), 80);
    }

    function modal(content) { $('#modalContent').innerHTML = content; $('#modalBackdrop').classList.add('show'); }
    function closeModal() { $('#modalBackdrop').classList.remove('show'); $('#modalContent').innerHTML = ''; }
    function toast(text) { const t = $('#toast'); t.textContent = text; t.classList.add('show'); clearTimeout(window.__toastTimer); window.__toastTimer = setTimeout(() => t.classList.remove('show'), 3600); }

    function listOptions(selected = 'inbox') { return state.lists.map(l => `<option value="${l.id}" ${l.id===selected?'selected':''}>${escapeHtml(l.name)}</option>`).join(''); }
    function showAddModal(preset = {}) {
      modal(`
        <div class="modal-header"><div><h2 id="modalTitle">候補を追加</h2><p>最初は、アカウント名だけで十分です。詳しい情報は後から整えられます。</p></div><button class="close-modal" data-close>×</button></div>
        <form id="addForm"><div class="form-grid">
          <div class="field full"><label for="addInput">InstagramプロフィールURL または @アカウント名 <span style="color:#d76d77">*</span></label><input id="addInput" name="input" value="${escapeHtml(preset.input || '')}" placeholder="https://instagram.com/example_brand または @example_brand" required /><p class="form-hint">URLを貼ると、@アカウント名を自動で取り出します。</p></div>
          <div class="field"><label for="addLabel">表示名・呼び名</label><input id="addLabel" name="label" value="${escapeHtml(preset.label || '')}" placeholder="例：株式会社サンプル" /></div>
          <div class="field"><label for="addList">最初のリスト</label><select id="addList" name="list">${listOptions(preset.list || 'inbox')}</select></div>
          <div class="field"><label for="addStatus">状態</label><select id="addStatus" name="status"><option value="inbox">未整理</option><option value="watching">観察中</option><option value="warm">関係構築中</option></select></div>
          <div class="field"><label for="addReview">次に見る日</label><input id="addReview" name="review" type="date" value="${preset.review || addDays(0)}" /></div>
          <div class="field full"><label for="addReason">今、追う理由（任意）</label><textarea id="addReason" name="reason" placeholder="例：展示会前に、最新の発信テーマを確認する">${escapeHtml(preset.reason || '')}</textarea></div>
        </div><div class="modal-footer"><button class="btn secondary" type="button" data-close>キャンセル</button><button class="btn primary" type="submit">この候補を保存</button></div></form>`);
      setTimeout(() => $('#addInput')?.focus(), 60);
    }

    function normalizeUsername(input) {
      let value = String(input || '').trim();
      if (!value) return '';
      const urlMatch = value.match(/(?:https?:\/\/)?(?:www\.)?instagram\.com\/(?:[^/]+\/)?([A-Za-z0-9._]+)/i);
      if (urlMatch) value = urlMatch[1];
      value = value.replace(/^@/, '').replace(/\?.*$/, '').replace(/\/.*$/, '').trim();
      if (!/^[A-Za-z0-9._]{1,40}$/.test(value)) return '';
      const invalid = ['p','reel','reels','stories','explore','accounts'];
      return invalid.includes(value.toLowerCase()) ? '' : value;
    }

    function addProfile(data) {
      const username = normalizeUsername(data.input || data.username);

    function cropInstagramProfileHeader(file) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        const objectUrl = URL.createObjectURL(file);
        image.onload = () => {
          try {
            const sourceWidth = image.naturalWidth;
            const sourceHeight = image.naturalHeight;
            // iPhone/Androidの縦長プロフィール画面では、上部4.5%〜13%にヘッダー名と表示名がある。
            // 投稿数・フォロワー数（その下）と、自己紹介文・投稿一覧（さらに下）は切り出さない。
            const sourceY = Math.round(sourceHeight * 0.045);
            const sourceHeightForCrop = Math.max(120, Math.round(sourceHeight * 0.085));
            const scale = Math.min(2.2, Math.max(1.65, 1600 / sourceWidth));
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(sourceWidth * scale);
            canvas.height = Math.round(sourceHeightForCrop * scale);
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(image, 0, sourceY, sourceWidth, sourceHeightForCrop, 0, 0, canvas.width, canvas.height);
            // 白背景の黒文字を強調し、写真や淡い境界線による誤読を減らす。
            const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < pixels.data.length; i += 4) {
              const gray = (pixels.data[i] * 0.299) + (pixels.data[i + 1] * 0.587) + (pixels.data[i + 2] * 0.114);
              const value = gray < 205 ? 0 : 255;
              pixels.data[i] = value; pixels.data[i + 1] = value; pixels.data[i + 2] = value; pixels.data[i + 3] = 255;
            }
            ctx.putImageData(pixels, 0, 0);
            URL.revokeObjectURL(objectUrl);
            resolve(canvas);
          } catch (error) {
            URL.revokeObjectURL(objectUrl); reject(error);
          }
        };
        image.onerror = () => { URL.revokeObjectURL(objectUrl); reject(new Error('画像を読み込めませんでした。')); };
        image.src = objectUrl;
      });
    }

    function extractOcrCandidates(data) {
      const blocked = new Set(['follow','following','message','contact','editprofile','posts','followers','instagram','meta','投稿','フォロワー','フォロー中','メッセージ','フォローする','プロフィールを編集','戻る']);
      const words = (data.words || []).map(word => ({
        text: String(word.text || '').trim(),
        confidence: Number(word.confidence || 0),
        y: Number(word.bbox?.y0 || 0)
      })).filter(word => word.text);
      const usernameCandidates = words.map(word => {
        const candidate = normalizeUsername(word.text.replace(/^@/, ''));
        if (!candidate || blocked.has(candidate.toLowerCase()) || /^\d+$/.test(candidate)) return null;
        // 数字だけ、または数字主体のUI断片を候補から除外する。
        const letters = (candidate.match(/[A-Za-z]/g) || []).length;
        const digits = (candidate.match(/\d/g) || []).length;
        if (letters < 2 || digits > letters) return null;
        const score = word.confidence + (candidate === candidate.toLowerCase() ? 8 : 0) + (/[._]/.test(candidate) ? 3 : 0) - (word.y * 0.01);
        return { candidate, score, confidence: word.confidence };
      }).filter(Boolean).sort((a,b) => b.score - a.score);
      const bestUsername = usernameCandidates.find(item => item.confidence >= 58) || null;
      const lines = (data.lines || []).map(line => String(line.text || '').trim()).filter(Boolean);
      const label = lines.find(line => {
        const compact = line.replace(/\s/g, '');
        if (compact.length < 2 || compact.length > 40 || /^\d+[.,\d]*$/.test(compact)) return false;
        if (compact.toLowerCase() === (bestUsername?.candidate || '').toLowerCase()) return false;
        return /[\u3040-\u30ff\u3400-\u9fff]/.test(compact) && !/(投稿|フォロワー|フォロー中|メッセージ|フォローする)/.test(compact);
      }) || '';
      return { username: bestUsername?.candidate || '', label };
    }

    async function handleOcrFile(event) {
      const file = event.target.files?.[0]; if (!file) return;
      const progress = $('#ocrProgress'); progress.classList.add('show');
      const bar = $('#ocrBar'), text = $('#ocrText');
      const update = (m) => { const pct = Math.round((m.progress || 0) * 100); bar.style.width = `${pct}%`; text.textContent = m.status === 'recognizing text' ? `プロフィール上部を読み取っています… ${pct}%` : 'プロフィール上部を準備しています…'; };
      try {
        if (!window.Tesseract) throw new Error('OCRライブラリを読み込めませんでした。');
        const headerImage = await cropInstagramProfileHeader(file);
        text.textContent = 'アカウント名と表示名の候補を読み取っています…';
        const result = await Tesseract.recognize(headerImage, 'eng+jpn', { logger: update });
        const candidate = extractOcrCandidates(result.data || {});
        if (!candidate.username) {
          toast('アカウント名を確実に判定できませんでした。誤った候補は入れず、@アカウント名だけ手入力してください。');
          showAddModal({ label: candidate.label, input: '' });
        } else {
          showAddModal({ input: `@${candidate.username}`, label: candidate.label });
          toast('プロフィール上部だけから候補を読み取りました。内容を確認してから保存してください。');
        }
      } catch (error) {
        console.warn(error); toast('OCRを実行できませんでした。URLまたは@アカウント名から追加できます。'); showAddModal();
      } finally {
        event.target.value = '';
      }
    }

    function getInstagramImportRows(data) {
      const people = Array.isArray(data?.people) ? data.people : (Array.isArray(data) ? data : []);
      const uniqueUsernames = new Set();
      return people.map(person => {
        const name = String(person?.name || '').trim();
        const instagram = (person?.links || []).find(link => typeof link?.url === 'string' && /(^|\.)instagram\.com\//i.test(link.url));
        const username = normalizeUsername(instagram?.url || '');
        if (!name || !username || uniqueUsernames.has(username.toLowerCase())) return null;
        uniqueUsernames.add(username.toLowerCase());
        return { sourceId: String(person?.id || ''), name, username, profileUrl: profileUrl(username) };
      }).filter(Boolean);
    }

    function importPersonMemoRows() {

    function exportBackup() {
      const exportedAt = new Date().toISOString();
      const backup = {
        format: 'prospect-loop-backup',
        version: 1,
        exportedAt,
        summary: {
          profileCount: Array.isArray(state.profiles) ? state.profiles.length : 0,
          listCount: Array.isArray(state.lists) ? state.lists.length : 0
        },
        data: JSON.parse(JSON.stringify(state))
      };
      const timestamp = exportedAt.replace(/[:.]/g, '-').replace('T', '_').slice(0, 19);
      const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `prospect-loop-backup_${timestamp}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      state.lastBackupAt = exportedAt;
      saveState();
      toast(`バックアップを保存しました（候補 ${backup.summary.profileCount}人）。`);
    }

    function validateBackup(backup) {
      if (!backup || backup.format !== 'prospect-loop-backup' || backup.version !== 1 || !backup.data || !Array.isArray(backup.data.profiles) || !Array.isArray(backup.data.lists)) {
        throw new Error('対応していないバックアップ形式です。');
      }
      return backup;
    }

    function restoredStateFrom(backup) {
      const data = backup.data;
      return {
        profiles: data.profiles,
        lists: data.lists,
        activeList: typeof data.activeList === 'string' ? data.activeList : 'all',
        lastFilter: typeof data.lastFilter === 'string' ? data.lastFilter : 'all',
        personMemoImport: data.personMemoImport || null,
        lastBackupAt: data.lastBackupAt || backup.exportedAt || null,
        lastRestoredAt: new Date().toISOString(),
        restoredFrom: backup.exportedAt || null
      };
    }

    async function handleRestoreFile(event) {
      const file = event.target.files?.[0]; if (!file) return;
      try {
        const backup = validateBackup(JSON.parse(await file.text()));
        const profileCount = backup.data.profiles.length;
        const listCount = backup.data.lists.length;
        const exportedLabel = backup.exportedAt ? new Date(backup.exportedAt).toLocaleString('ja-JP') : '日時不明';
        window.__pendingRestore = backup;
        modal(`
          <div class="modal-header"><div><h2 id="modalTitle">このバックアップを復元しますか？</h2><p>内容を確認してください。確定すると、現在のローカルデータをこのバックアップで置き換えます。</p></div><button class="close-modal" data-close>×</button></div>
          <div class="reason-box" style="margin:0"><div class="reason-label">バックアップの内容</div><div class="reason-text">作成日時：${escapeHtml(exportedLabel)}<br>候補：${profileCount}人<br>リスト：${listCount}件<br>形式：Prospect Loop Backup v${backup.version}</div></div>
          <div class="modal-footer"><button class="btn secondary" data-close>キャンセル</button><button class="btn primary" data-confirm-restore>この内容で復元する</button></div>`);
      } catch (error) {
        console.warn(error); toast('復元できませんでした。Prospect LoopのバックアップJSONを選んでください。');
      } finally {
        event.target.value = '';
      }
    }

      if (event.target.id === 'listForm') { event.preventDefault(); const name = new FormData(event.target).get('name').trim(); if (!name) return; const item = {id:`list_${Date.now()}`,name,color:['#9a86ff','#5b7cff','#5ebfa6','#ff8b89','#ebad55'][state.lists.length%5],order:state.lists.length}; state.lists.push(item); state.activeList=item.id; saveState(); closeModal(); renderLists(); toast(`「${name}」を作成しました。`); }
    });

    document.addEventListener('input', (event) => { if (event.target.id === 'profileSearch') renderProfiles(); });
    $('#modalBackdrop').addEventListener('click', (event) => { if (event.target.id === 'modalBackdrop') closeModal(); });
    document.addEventListener('keydown', (event) => { if (event.key === 'Escape') closeModal(); });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) resumeAfterExternalApp(); });
    window.addEventListener('focus', resumeAfterExternalApp);

    renderAll();
    setTimeout(resumeAfterExternalApp, 500);
    window.showAddModal = showAddModal;
  </script>
</body>
</html>
