<!DOCTYPE html>
<html lang="ja">
<head>
<!-- ============================================================
  にゃんこ宇宙財布（試作） NYAN ORBIT — step 1: UIの骨格
  - 保存先は本体と同じ saifu_v1（状態の形・記録/取り消しでのデータの変え方は saifu.html と同一。宇宙版が知らない項目も消さずに引き継ぐ）
  - 家計簿への書き出し（本体と同じJSON・書出済みの印）と締め日（期間の予算・締め日の注意）あり。実データはコミットしない（バックアップは care-data-backup）
  - 確認用URLパラメータ: ?day=25 締め日まわりの様子を確かめるため、今日の「日」を固定（本体と同じ）
  - ステージ(#stage)は step 2 で three.js に置き換え済み（末尾の module script）。記録演出は playRecord() が差し込み口（step 3）
============================================================ -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="宇宙財布">
<link rel="apple-touch-icon" href="saifu-icon.png">
<link rel="icon" type="image/png" href="saifu-favicon.png">
<title>にゃんこ宇宙財布（試作）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b1026;
    --bg2: #131a3a;
    --text: #e8f0ff;
    --text2: #8fa3c8;
    --cyan: #5ef0ff;
    --magenta: #ff6bd5;
    --gold: #ffd36b;
    --glass: rgba(255,255,255,.07);
    --glass-b: rgba(255,255,255,.16);
    --glow: 0 0 18px rgba(94,240,255,.14);
    --f-ui: "Zen Maru Gothic", -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    --f-dot: "DotGothic16", "Zen Maru Gothic", monospace;
    --e-back: cubic-bezier(.34,1.56,.64,1);
    --e-quart: cubic-bezier(.25,1,.5,1);
    --e-cubic: cubic-bezier(.33,1,.68,1);
    --e-sine: cubic-bezier(.61,1,.88,1);
    --e-iocubic: cubic-bezier(.65,0,.35,1);
    --e-iosine: cubic-bezier(.37,0,.63,1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body {
    font-family: var(--f-ui); color: var(--text); font-weight: 500;
    background: radial-gradient(120% 60% at 50% 0%, #1a2150 0%, var(--bg) 60%) fixed, var(--bg);
    min-height: 100vh; overflow-x: hidden;
    padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top));
    padding-bottom: calc(28px + env(safe-area-inset-bottom));
    padding-left: calc(16px + env(safe-area-inset-left)); padding-right: calc(16px + env(safe-area-inset-right));
  }
  #app { max-width: 480px; margin: 0 auto; }
  button, input { font-family: inherit; color: inherit; }
  button { cursor: pointer; }

  /* ===== ステージ（観測窓）===== */
  #stage { position: relative; height: 42vh; min-height: 240px; max-height: 380px; border-radius: 36px; overflow: hidden;
    background: radial-gradient(90% 80% at 50% 110%, #1c2a66 0%, #0a0f26 70%);
    border: 1px solid var(--glass-b); box-shadow: 0 0 0 4px rgba(94,240,255,.06), 0 0 34px rgba(94,240,255,.22), inset 0 0 40px rgba(0,0,0,.5); }
  #cv { display: none; width: 100%; height: 100%; }
  .starfield { position: absolute; inset: 0; pointer-events: none; }
  .starfield i { position: absolute; inset: 0; background-repeat: repeat; will-change: background-position; }
  /* 3層: タイルの幅ぶんだけ動かすと継ぎ目なく無限ループ。奥ほど遅く小さい */
  .starfield .s1 { background-size: 160px 160px; animation: drift1 120s linear infinite; opacity: .55;
    background-image: radial-gradient(1px 1px at 20px 30px, #fff, transparent), radial-gradient(1px 1px at 90px 120px, #cfe6ff, transparent),
      radial-gradient(1px 1px at 140px 60px, #fff, transparent), radial-gradient(1px 1px at 60px 90px, #aab8ff, transparent); }
  .starfield .s2 { background-size: 220px 220px; animation: drift2 70s linear infinite; opacity: .8;
    background-image: radial-gradient(1.5px 1.5px at 40px 50px, #fff, transparent), radial-gradient(1.5px 1.5px at 150px 140px, #bff7ff, transparent),
      radial-gradient(1.5px 1.5px at 190px 30px, #fff, transparent), radial-gradient(1.5px 1.5px at 100px 200px, #ffd0f2, transparent); }
  .starfield .s3 { background-size: 300px 300px; animation: drift3 38s linear infinite;
    background-image: radial-gradient(2.4px 2.4px at 70px 90px, #fff, transparent), radial-gradient(2.2px 2.2px at 230px 200px, var(--cyan), transparent),
      radial-gradient(2px 2px at 260px 40px, #fff, transparent); filter: drop-shadow(0 0 3px rgba(255,255,255,.8)); }
  @keyframes drift1 { to { background-position: -160px 0; } }
  @keyframes drift2 { to { background-position: -220px 0; } }
  @keyframes drift3 { to { background-position: -300px 0; } }
  #stage .fb { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 14px;
    font-size: 4.6rem; animation: float 5.5s var(--e-iosine) infinite alternate; filter: drop-shadow(0 0 16px rgba(94,240,255,.5)); }
  #stage .fb span:last-child { font-size: 3.4rem; opacity: .9; animation: float 7s var(--e-iosine) -2s infinite alternate-reverse; }
  @keyframes float { from { transform: translateY(-9px) rotate(-3deg); } to { transform: translateY(9px) rotate(3deg); } }
  #stage .tag { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-family: var(--f-dot); font-size: .7rem;
    letter-spacing: .3em; color: var(--cyan); opacity: .75; text-shadow: 0 0 8px var(--cyan); }

  /* ===== 全画面モード（body.full）と下の入力バー ===== */
  .fsb { position: absolute; z-index: 3; top: 8px; right: 8px; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--glass-b);
    background: rgba(8,12,34,.55); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); color: var(--cyan); font-size: 1.25rem; font-weight: 900; line-height: 1;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 0 12px rgba(94,240,255,.3); text-shadow: 0 0 8px rgba(94,240,255,.8); }
  #fs-exit { display: none; font-size: 1rem; }
  html.full, body.full { overflow: hidden; }
  body.full #stage { position: fixed; inset: 0; z-index: 40; width: 100%; height: 100vh; height: 100dvh; min-height: 0; max-height: none; border-radius: 0; border: 0; box-shadow: none; clip-path: none !important; }
  body.full #fs-btn { display: none; }
  /* 通常モードへ戻るボタン（窓の左上。全画面では出さない）と、設定の中のボタン */
  #stage .tomode { position: absolute; z-index: 3; top: 10px; left: 12px; padding: 5px 11px; border-radius: 999px; font: 700 .74rem/1 inherit; font-family: inherit; color: var(--text);
    background: rgba(8,12,32,.55); border: 1px solid var(--glass-b); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  body.full #stage .tomode, #stage.gfocus .tomode { display: none; }
  .set .sbtn { flex: 1; padding: 9px 10px; border-radius: 12px; font: 700 .85rem inherit; font-family: inherit; color: var(--text); background: rgba(255,255,255,.07); border: 1px solid var(--glass-b); }
  .set .ver { margin-top: 6px; text-align: right; font-size: .7rem; color: var(--text2); }
  body.full #fs-exit { display: flex; top: calc(10px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right)); }
  body.full #stage .tag { bottom: auto; top: calc(22px + env(safe-area-inset-top)); left: calc(14px + env(safe-area-inset-left)); right: auto; text-align: left; }
  /* ===== 衛星にフォーカスしたときの合計パネル（ステージ上部中央・ガラス）===== */
  .gpanel { position: absolute; z-index: 2; top: 8px; left: 50%; transform: translateX(-50%); width: min(240px, calc(100% - 128px));
    padding: 8px 8px 8px 14px; border-radius: 18px; border: 1px solid var(--glass-b);
    background: linear-gradient(160deg, rgba(255,255,255,.14), rgba(255,255,255,.05)), rgba(8,12,34,.5);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: var(--glow); }
  .gpanel[hidden] { display: none; }
  body.full .gpanel { top: calc(10px + env(safe-area-inset-top)); }
  .gpanel .gh { display: flex; align-items: center; gap: 8px; }
  .gpanel .gd { width: 10px; height: 10px; border-radius: 50%; flex: none; background: currentColor; box-shadow: 0 0 10px currentColor; }
  .gpanel .gn { flex: 1; min-width: 0; font-size: .95rem; font-weight: 900; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gpanel .gx { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--glass-b); background: rgba(8,12,34,.55);
    color: var(--cyan); font-size: 1rem; font-weight: 900; line-height: 1; display: flex; align-items: center; justify-content: center; }
  .gpanel .gs { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding-right: 6px; }
  .gpanel .gk { font-size: .7rem; font-weight: 700; color: var(--text2); letter-spacing: .06em; }
  .gpanel .gt { font-family: var(--f-dot); font-size: 1.3rem; color: var(--cyan); text-shadow: 0 0 8px rgba(94,240,255,.85), 0 0 18px rgba(94,240,255,.4); }
  .gpanel .gm { display: flex; justify-content: space-between; gap: 8px; padding-right: 6px; font-size: .72rem; font-weight: 700; color: var(--text2); }
  #stage.gfocus .tag { opacity: 0; }
  #fbar { display: none; position: fixed; z-index: 55; left: 0; right: 0; bottom: var(--kb, 0px);
    padding: 8px calc(10px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));
    background: linear-gradient(180deg, rgba(11,16,38,.55), rgba(11,16,38,.85)); border-top: 1px solid var(--glass-b);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); box-shadow: 0 -6px 24px rgba(0,0,0,.4); }
  body.full #fbar { display: block; }
  #fbar .r { display: flex; gap: 6px; align-items: center; }
  #fbar .r + .r { margin-top: 6px; }
  #fbar input { font-size: 16px; padding: 8px 10px; border-radius: 12px; min-width: 0; }
  #fb-amt { width: 6.2em; flex: none; font-family: var(--f-dot); }
  #fb-name { flex: 1; }
  #fb-go { flex: none; width: auto; margin: 0; padding: 10px 14px; font-size: .95rem; white-space: nowrap; box-shadow: 0 0 16px rgba(255,107,213,.45); }
  #fb-cats { flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding: 2px 0; }
  #fb-cats::-webkit-scrollbar { display: none; }
  #fb-cats button { flex: none; border: 1px solid var(--glass-b); background: rgba(255,255,255,.06); border-radius: 999px; padding: 9px 14px; font-size: .85rem; font-weight: 700; color: var(--text2); white-space: nowrap; }
  #fb-cats button.sel { color: #04101c; background: linear-gradient(135deg, var(--cyan), #9fb4ff); border-color: transparent; box-shadow: 0 0 12px rgba(94,240,255,.55); }
  #fb-pay { flex: none; }
  #fb-pay button { flex: none; padding: 9px 10px; font-size: .8rem; white-space: nowrap; }

  /* ===== マーキー帯 ===== */
  .marquee { margin: 12px 0 14px; overflow: hidden; border: 1px solid var(--glass-b); border-radius: 12px; background: var(--glass);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: var(--glow); }
  .marquee .track { display: flex; width: max-content; animation: marq 32s linear infinite; padding: 7px 0;
    font-family: var(--f-dot); font-size: .85rem; color: var(--cyan); text-shadow: 0 0 7px rgba(94,240,255,.7); white-space: nowrap; }
  .marquee .track span { padding-right: 3em; }
  @keyframes marq { to { transform: translateX(-50%); } }

  /* ===== ガラスのパネル ===== */
  .panel { position: relative; margin-bottom: 12px; padding: 12px 14px; border-radius: 20px; border: 1px solid var(--glass-b);
    background: linear-gradient(160deg, rgba(255,255,255,.1), rgba(255,255,255,.05));
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: var(--glow); }
  .panel h2 { font-size: .74rem; font-weight: 700; color: var(--text2); letter-spacing: .08em; margin-bottom: 6px; }

  /* LCD（走査線 + ホログラム）*/
  .lcd { position: relative; overflow: hidden; border-radius: 12px; padding: 8px 12px; background: rgba(4,8,24,.55);
    border: 1px solid rgba(94,240,255,.28); box-shadow: inset 0 0 14px rgba(94,240,255,.12);
    font-family: var(--f-dot); color: var(--cyan); text-shadow: 0 0 8px rgba(94,240,255,.85), 0 0 18px rgba(94,240,255,.4); }
  .lcd::after { content: ''; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 1px, transparent 1px 3px); mix-blend-mode: screen; }
  #total .lcd { display: flex; justify-content: flex-end; align-items: baseline; font-size: 2.6rem; padding: 10px 14px; animation: glitch 6s steps(1) infinite; }
  @keyframes glitch {
    0%, 96.5%, 100% { transform: none; text-shadow: 0 0 8px rgba(94,240,255,.85), 0 0 18px rgba(94,240,255,.4); }
    97% { transform: translateX(2px); text-shadow: -3px 0 rgba(255,107,213,.9), 3px 0 rgba(94,240,255,.9); }
    98% { transform: translateX(-2px); text-shadow: 3px 0 rgba(255,107,213,.9), -3px 0 rgba(94,240,255,.9); }
  }
  /* スタンドのときの給油量（今月の合計のLCDの下に小さく） */
  .lcd-sub { margin-top: 4px; text-align: right; font-family: var(--f-dot); font-size: .95rem; color: var(--cyan); text-shadow: 0 0 8px rgba(94,240,255,.7); }
  .lcd-sub[hidden] { display: none; }
  /* ドラム回転の数字 */
  .roll { display: inline-flex; font-family: var(--f-dot); line-height: 1.15em; }
  .roll .ch, .roll .dg { display: inline-block; height: 1.15em; }
  .roll .dg { width: .62em; overflow: hidden; text-align: center; }
  .roll .strip { display: flex; flex-direction: column; transition: transform .9s cubic-bezier(.2,.9,.25,1.12); }
  .roll .strip span { height: 1.15em; }
  .roll.still .strip { transition: none; }

  /* 予算 */
  .bbar { height: 8px; border-radius: 5px; background: rgba(255,255,255,.1); overflow: hidden; margin: 8px 0 5px; }
  .bbar i { display: block; height: 100%; width: 0; border-radius: 5px; background: linear-gradient(90deg, var(--cyan), #7aa7ff);
    box-shadow: 0 0 10px var(--cyan); transition: width .8s var(--e-cubic); }
  #bud .bm { display: flex; justify-content: space-between; align-items: baseline; }
  #bud .bm .n { font-family: var(--f-dot); font-size: 1.3rem; color: var(--gold); text-shadow: 0 0 8px rgba(255,211,107,.6); }
  #bud .bs { font-size: .72rem; color: var(--text2); display: flex; justify-content: space-between; }
  #bud.warn .bbar i { background: linear-gradient(90deg, var(--magenta), #ff9ae6); box-shadow: 0 0 12px var(--magenta); animation: pulse 1.1s var(--e-iosine) infinite alternate; }
  #bud.over .bbar i { background: #ff5c7a; box-shadow: 0 0 14px #ff5c7a; animation: pulse .7s var(--e-iosine) infinite alternate; }
  #bud.over .bm .n { color: #ff8da1; text-shadow: 0 0 8px rgba(255,92,122,.7); }
  @keyframes pulse { from { opacity: .55; } to { opacity: 1; } }

  /* 入力 */
  .fld { display: block; margin-bottom: 10px; }
  .fld > span { display: block; font-size: .72rem; color: var(--text2); font-weight: 700; margin: 0 2px 4px; }
  input[type=text], input[type=number], input[type=date] { width: 100%; font-size: 1rem; padding: 10px 12px; border-radius: 12px; outline: none;
    background: rgba(4,8,24,.5); border: 1px solid var(--glass-b); color: var(--text); color-scheme: dark; }
  input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(94,240,255,.18), 0 0 14px rgba(94,240,255,.25); }
  .amt-row { display: flex; gap: 8px; align-items: stretch; }
  .amt-row input { flex: 1; min-width: 0; font-family: var(--f-dot); font-size: 1.25rem; }
  #amt-lcd { min-width: 6.4em; display: flex; align-items: center; justify-content: flex-end; font-size: 1.15rem; will-change: filter, opacity; }
  #cats { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 6px; }
  #cats button { position: relative; border: 1px solid var(--glass-b); background: rgba(255,255,255,.06); border-radius: 999px; padding: 7px 14px; font-size: .88rem; font-weight: 700; color: var(--text2); }
  #cats button.sel { color: #04101c; background: linear-gradient(135deg, var(--cyan), #9fb4ff); border-color: transparent; box-shadow: 0 0 14px rgba(94,240,255,.55); }
  #cats .gb { position: absolute; top: -10px; right: -8px; font-size: .6rem; line-height: 1.5; padding: 0 6px; border-radius: 999px; font-weight: 900;
    background: var(--magenta); color: #2a0820; box-shadow: 0 0 10px rgba(255,107,213,.8); pointer-events: none; }
  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; padding: 9px; border-radius: 12px; border: 1px solid var(--glass-b); background: rgba(255,255,255,.05); color: var(--text2); font-weight: 700; font-size: .9rem; }
  .seg button.sel { color: var(--gold); border-color: var(--gold); background: rgba(255,211,107,.12); box-shadow: 0 0 12px rgba(255,211,107,.3); }
  .go { width: 100%; margin-top: 4px; padding: 14px; border: 0; border-radius: 16px; font-size: 1.1rem; font-weight: 900; letter-spacing: .04em;
    color: #1d0a18; background: linear-gradient(135deg, var(--magenta), #ffa0e6 55%, var(--gold)); box-shadow: 0 0 22px rgba(255,107,213,.5), 0 4px 0 rgba(0,0,0,.25); }
  .go:disabled { opacity: .6; }
  /* ハッシュタグ（家計簿と同じ tags）。選択中・候補・入力欄を1行に並べ、多いときは横スクロール。ジャンル（塗りのシアン）と見分けるため、小さく輪郭だけ */
  #tags { display: flex; align-items: center; gap: 8px; margin: 0 -4px; padding: 2px 4px 4px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  #tags::-webkit-scrollbar { display: none; }
  #tags button { flex: none; white-space: nowrap; padding: 4px 10px; border-radius: 999px; font-size: .78rem; font-weight: 700; background: rgba(94,240,255,.07); color: #a8f4ff;
    border: 1px solid rgba(94,240,255,.4); }
  #tags button.on { background: rgba(94,240,255,.28); color: #fff; border-color: var(--cyan); box-shadow: 0 0 10px rgba(94,240,255,.45); }
  #tags input { flex: none; width: 6em; padding: 4px 10px; border: 1px dashed rgba(94,240,255,.6); border-radius: 999px; font-size: 16px;
    background: rgba(4,8,24,.5); color: var(--cyan); font-family: inherit; outline: none; }
  #tags input:focus { border-style: solid; border-color: var(--cyan); }
  /* 右にはみ出しているときだけ右端をぼかす（横にスクロールできる合図） */
  #tags.more { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); }
  /* 修正中の表示（本体の #editbar を移植） */
  #editbar { display: none; align-items: center; gap: 8px; margin-bottom: 10px; padding: 8px 10px; border: 1px dashed var(--magenta); border-radius: 14px; font-size: .88rem; font-weight: 700;
    background: rgba(255,107,213,.1); box-shadow: 0 0 14px rgba(255,107,213,.2); }
  #editbar .msg { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.35; }
  #editbar .msg .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #editbar .msg .a { font-family: var(--f-dot); color: var(--gold); }
  #editbar button { flex: none; padding: 5px 12px; border-radius: 999px; font-size: .8rem; font-weight: 900; border: 1px solid var(--glass-b); background: rgba(255,255,255,.07); color: var(--text); }
  #editbar #edit-del { color: #ff8da1; border-color: rgba(255,92,122,.6); }
  @keyframes shake { 0%,100% { transform: none; } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .shake { animation: shake .35s !important; }

  /* 履歴 */
  .day { display: flex; justify-content: space-between; align-items: baseline; margin: 12px 0 4px; font-size: .78rem; }
  .day span:first-child { color: var(--magenta); font-weight: 900; text-shadow: 0 0 8px rgba(255,107,213,.6); }
  .day span:last-child { font-family: var(--f-dot); color: var(--text2); font-size: .9rem; }
  .ent { display: flex; align-items: center; gap: 8px; padding: 9px 2px; border-bottom: 1px dashed rgba(143,163,200,.3); }
  .ent .nm { flex: 1; min-width: 0; font-weight: 700; font-size: .92rem; overflow-wrap: anywhere; }
  .ent .meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }
  .ent .ct { font-size: .64rem; color: var(--cyan); border: 1px solid rgba(94,240,255,.4); border-radius: 8px; padding: 0 6px; font-weight: 700; }
  .ent .am { font-family: var(--f-dot); font-size: 1.1rem; color: var(--gold); text-shadow: 0 0 7px rgba(255,211,107,.5); display: inline-flex; flex: none; }
  .ent.hide { visibility: hidden; }

<script>
// ===== 基本設定 =====
const APP_KEY = 'saifu_v1';               // 本体と同じ localStorage のキー（状態の形は saifu.html と同一）
const SPACE_VERSION = 1;                 // auto-version.yml が push 時に自動で書き換える（手で変えない）。版番号ファイルは saifu-space-ver.txt
const UI_KEY  = 'saifu_space_ui';        // 宇宙版だけの小さな覚え書き（案内を出したか・予算の内訳を開いたか）。実データではない
const $ = id => document.getElementById(id);
const pad2 = n => String(n).padStart(2, '0');
const todayIso = () => { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };
const isoToMD = iso => { const p = iso.split('-'); return (+p[1]) + '/' + (+p[2]); };
const yen = n => '¥' + Math.round(n).toLocaleString('ja-JP');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const toHalf = s => String(s).replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
const newId = () => 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const APP_NAME = 'saifu';
const DEFAULT_CATS = [{ id: 1, name: '食費' }, { id: 2, name: '日用品' }, { id: 3, name: '交通費' }, { id: 4, name: 'その他' }, { id: 5, name: 'ガソリン' }];
const reduceMotion = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
const EASE = { back: 'cubic-bezier(.34,1.56,.64,1)', quart: 'cubic-bezier(.25,1,.5,1)', cubic: 'cubic-bezier(.33,1,.68,1)', sine: 'cubic-bezier(.61,1,.88,1)',
  iocubic: 'cubic-bezier(.65,0,.35,1)', iosine: 'cubic-bezier(.37,0,.63,1)' };

// ===== 保存・読込（本体 saifu.html の normalize / load / save / 集計関数を移植。宇宙版が保存しても本体と同じ形になる）=====
function normalize(s) {
  return {
    entries: Array.isArray(s.entries) ? s.entries : [],
    cats: Array.isArray(s.cats) && s.cats.length ? s.cats : DEFAULT_CATS.slice(),
    catsFrom: s.catsFrom || 'default',
    lastCat: s.lastCat,
    sound: s.sound !== false,
    // アニメはONなら端末の「視差効果を減らす」に関係なく動かす。旧形式（animFree なし）は今の動き方を引き継ぐ
    anim: s.animFree ? s.anim !== false : (s.anim !== false && (!reduceMotion.matches || s.animForce === true)),
    animFree: true,
    catStyle: s.catStyle === 'yellow' ? 'yellow' : 'hachi',   // 舞台の猫（ハチワレ / きいろ）
    stage: s.stage === 'car' ? 'car' : 'reg',   // 舞台（レジ / ガソリンスタンド）
    closeDay: Number.isInteger(s.closeDay) && s.closeDay >= 1 && s.closeDay <= 31 ? s.closeDay : 25,   // 締め日（31は末日）
    fuelPrice: Number.isInteger(s.fuelPrice) && s.fuelPrice >= 100 && s.fuelPrice <= 400 ? s.fuelPrice : 170,   // スタンドのガソリン単価（円/L）
    kmPerL: typeof s.kmPerL === 'number' && s.kmPerL >= 1 && s.kmPerL <= 50 ? Math.round(s.kmPerL * 10) / 10 : 15,   // スタンドの燃費（km/L）
    kbTags: s.kbTags && typeof s.kbTags === 'object' ? s.kbTags : {},   // 家計簿のバックアップから読んだタグの使用回数
    // よく使う記録の回数（記録は消せるので別に覚える）。初めてのときは残っている記録から作る
    freq: s.freq && typeof s.freq === 'object' ? s.freq : seedFreq(Array.isArray(s.entries) ? s.entries : []),
    // 月ごとの合計（書き出し済みの記録を消しても減らない）。初めてのときは残っている記録から作る
    monthTotals: s.monthTotals && typeof s.monthTotals === 'object' ? s.monthTotals : seedMonths(Array.isArray(s.entries) ? s.entries : []),
    // 月ごとの件数（明細の No. 用。合計と同じく、書き出して消した記録も数えたまま）。初めてのときは残っている記録から作る
    monthCounts: s.monthCounts && typeof s.monthCounts === 'object' ? s.monthCounts : seedCounts(Array.isArray(s.entries) ? s.entries : []),
    // 日ごとの合計と、日ごと×ジャンルの [合計, 件数]（予算の期間を締め日で区切って数えるため。記録を消しても減らない）
    dayTotals: s.dayTotals && typeof s.dayTotals === 'object' ? s.dayTotals : seedDays(Array.isArray(s.entries) ? s.entries : []).t,
    dayCats: s.dayCats && typeof s.dayCats === 'object' ? s.dayCats : seedDays(Array.isArray(s.entries) ? s.entries : []).c,
    budget: Number.isInteger(s.budget) && s.budget > 0 && s.budget <= 9999999 ? s.budget : 0,   // 締め日ごとの予算（0 はなし）
  };
}
function seedMonths(entries) {
  const m = {};
  for (const e of entries) if (e.iso) m[e.iso.slice(0, 7)] = (m[e.iso.slice(0, 7)] || 0) + (e.amount || 0);
  return m;
}
function seedCounts(entries) {
  const m = {};
  for (const e of entries) if (e.iso) m[e.iso.slice(0, 7)] = (m[e.iso.slice(0, 7)] || 0) + 1;
  return m;
}
function seedDays(entries) {
  const t = {}, c = {};
  for (const e of entries) if (e.iso) addDay(t, c, e.iso, e.amount || 0, e.catId);
  return { t, c };
}
function addDay(t, c, iso, amount, catId) {
  const v = (t[iso] || 0) + amount; if (Math.abs(v) < 0.5) delete t[iso]; else t[iso] = v;
  const day = c[iso] || (c[iso] = {}), k = String(catId), g = day[k] || [0, 0];
  g[0] += amount; g[1] += amount > 0 ? 1 : amount < 0 ? -1 : 0;
  if (g[1] <= 0 || Math.abs(g[0]) < 0.5) delete day[k]; else day[k] = g;
  if (!Object.keys(day).length) delete c[iso];
}
// 月・日・日×ジャンルの合計へ足し引きする（記録・取り消しのとき）。件数も一緒に（足すとき +1、引くとき -1）
function addMonth(iso, amount, catId) {
  addDay(state.dayTotals, state.dayCats, iso, amount, catId);

// ===== 効果音（Web Audio で合成。saifu.html の sfx から必要分を移植。音源ファイルは使わない）=====
const sfx = (() => {
  let ac = null;
  function ctx() {
    if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }

  }

    const o = a.createOscillator(), g = a.createGain();

    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.05);
  }
  function noise(at, dur, vol, freq, q) {
    const a = ctx(); if (!a) return;
    const t0 = a.currentTime + Math.max(0, at);
    const len = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q || 1; g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(a.destination); s.start(t0);
  }
  return {
    unlock: ctx,
    clink(at) { const f = 2300 + Math.random() * 700; tone(at, f, 0.18, 0.10); tone(at, f * 1.62, 0.09, 0.05); },
    swish(at) { noise(at, 0.12, 0.25, 2200, 0.8); },
    thunk(at) { noise(at, 0.09, 0.6, 320, 1.2); },
    chin(at) { tone(at, 1318.5, 1.4, 0.20); tone(at, 2637, 0.9, 0.07); tone(at, 3956, 0.5, 0.03); },
    beep(at) { tone(at, 2600, 0.08, 0.12); tone(at + 0.12, 2600, 0.08, 0.12); },
    cometS(at) { noise(at, 1.6, 0.05, 900, 0.6); tone(at + 0.1, 1760, 1.2, 0.015); },   // 出来事: 彗星（小さな風の音）
    ufoS(at) { [0, 0.12, 0.24].forEach((d, i) => tone(at + d, 700 + i * 180, 0.16, 0.03, 'triangle')); tone(at + 0.36, 1250, 0.45, 0.02); },   // 出来事: UFO（ぴぽぱ）
    printer(at, dur) {   // まとめレシートの印字音（saifu.html から移植）
      const a = ctx(); if (!a) return;
      const t0 = a.currentTime + Math.max(0, at), len = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (0.55 + 0.45 * Math.sign(Math.sin(i / a.sampleRate * 2 * Math.PI * 28)));

      g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(0.07, t0 + 0.04);
      g.gain.setValueAtTime(0.07, t0 + dur - 0.06); g.gain.linearRampToValueAtTime(0.0001, t0 + dur);
      s.connect(f); f.connect(g); g.connect(a.destination); s.start(t0);
    },
  };
})();

    m.scale.setScalar(baseSc); A.coin = m; A.coinOwn = true;
  };
  const finish = () => {
    if (A.ended) return; A.ended = true;
    try { if (A.unsub) A.unsub(); } catch (e) {}
    clearTimeout(A.wd); stageEl.removeEventListener('pointerdown', A.skipFn);
    try {
      ex.pos.set(0, 0, 0); ex.scale.set(1, 1, 1); rx.pos.set(0, 0, 0); rx.scale.set(1, 1, 1); rx.drawer = 0; rx.paper = 0;
      if (A.coin) ST.remove(A.coin);
      A.objs.forEach(x => { ST.remove(x.o); if (x.geo) x.geo.dispose(); if (x.mat) x.mat.dispose(); });
      if (A.dust) disposeDust(A.dust);
      if (A.dimmed) ST.setFlyDim(1);   // 暗くした飛ぶ金額の群れを戻す
      ST.setPlaying(false);
    } catch (e) { console.warn('[play] cleanup', e); }
    if (curAnim === A) curAnim = null;
    if (opts && opts.revealed && holdFly === entry.id) { holdFly = null; dirty = true; ensureLoop(); }   // 待たせていた飛ぶ金額を放す（演出が途中で終わったときも）
    try { done(); } catch (e) {}
  };
  A.skip = () => { document.querySelectorAll('.fly-coin').forEach(n => n.remove()); finish(); };   // タップで即終了（飛行中の硬貨も消す）
  A.skipFn = () => A.skip();

  const tick = () => {
    if (A.ended) return;
    const el = performance.now() - A.t0, F = A.flags;
    // 猫: 溜め（しゃがむ → 前へ伸びる, easeInOutBack）→ 放った後に戻る
    const u = c01(el / TL.ant), eb = EZ.inOutBack(u), back = el > TL.ant ? EZ.outCubic(seg(el, TL.ant, 500)) : 0, L = eb * (1 - back);
    const crouch = el < TL.ant ? Math.sin(c01(u / 0.45) * PI / 2) * (1 - EZ.inOutCubic(c01((u - 0.45) / 0.55))) : 0;
    ex.pos.set(-0.28 * L, 0.1 * L, 0.35 * L); ex.scale.set(1 + 0.08 * crouch, 1 - 0.16 * crouch + 0.05 * L, 1 + 0.08 * crouch);
    const armK = el < TL.rel ? EZ.inOutBack(el / TL.rel) : 1 - EZ.outCubic(seg(el, TL.rel, 700));   // 腕: 振りかぶる → 放って戻る
    const arm = cat.arms[0]; arm.rotation.x = -0.1 - 2.3 * armK; arm.rotation.z = -0.6 * armK;
    if (!F.rel && el >= TL.rel) { F.rel = 1; releaseNow(); snd('swish'); }
    const m = A.coin;
    if (m && el >= TL.rel) {
      if (el < TL.snap0) {   // 弧を描いて飛ぶ（800ms, easeInOutSine）+ 無重力のスピンが減速して止まる（850ms, easeOutQuart）
        const fu = c01((el - TL.rel) / TL.fly), e = EZ.inOutSine(fu), sp = EZ.outQuart(c01((el - TL.rel) / TL.spin));
        m.position.set(H0.x + (H1.x - H0.x) * e, H0.y + (H1.y - H0.y) * e + 1.0 * Math.sin(PI * fu), H0.z + (H1.z - H0.z) * e + 0.3 * Math.sin(PI * fu));
        if (credit) m.rotation.set(-0.25, TAU * sp, 0); else m.rotation.set(TAU * 3 * sp + (m.geometry === BILL_GEO ? 0 : PI / 2 * sp), 0.6 * (1 - sp), 0);   // 最後は正面を向く（お札は縦板、硬貨は円盤を起こす）
      } else if (!credit) {   // マグネット吸着: 加速しながら投入口へ・縮む（620ms, easeInOutCubic）
        const su = c01((el - TL.snap0) / TL.snap), e = EZ.inOutCubic(su);
        m.position.lerpVectors(H1, S0, e); m.scale.setScalar(baseSc * (1 - 0.85 * EZ.inCubic(su))); m.visible = su < 1;
      } else {   // クレカ: 浮いたままレーザーで走査 → OKの輪が出たらカードが投入口へ沈む
        m.position.copy(H1); m.rotation.set(-0.25, 0, 0);
        if (el >= TL.imp) { const cu = c01((el - TL.imp) / 360); m.position.lerpVectors(H1, S0, EZ.inCubic(cu)); m.scale.setScalar(baseSc * (1 - 0.85 * cu)); m.visible = cu < 1; }
      }
    }
    if (credit && el >= TL.snap0 && el < TL.imp) {   // レーザーの走査線（加算の板）が上下に往復
      if (!A.laser) { const mt = new THREE.MeshBasicMaterial({ map: GLOW, color: '#8ffcff', transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false });
        A.laser = track(new THREE.Mesh(PLANE_GEO, mt), null, mt); A.laser.renderOrder = 8; A.laser.scale.set(0.34 * baseSc * 1.5, 0.22, 1); scene.add(A.laser); }
      const lu = c01((el - TL.snap0) / (TL.imp - TL.snap0)); A.laser.position.set(H1.x, H1.y + 0.105 * baseSc * Math.cos(lu * TAU), H1.z + 0.08); A.laser.material.opacity = Math.sin(lu * PI) * 1.2;
      A.laser.visible = true;
    } else if (A.laser && el >= TL.imp) A.laser.visible = false;
    if (credit && !F.beep && el >= TL.imp - 70) { F.beep = 1; snd('beep'); }
    if (credit && !F.ring && el >= TL.imp) {   // OK: 脈打つ輪（680ms, easeOutCubic）。2重にして少し遅らせる
      F.ring = 1;
      [['#5ef0ff', 0], ['#ff6bd5', 130]].forEach(r => {
        const mt = new THREE.MeshBasicMaterial({ color: r[0], transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
        const o = track(new THREE.Mesh(RING_GEO, mt), null, mt); o.position.set(H1.x, H1.y, H1.z + 0.1); o.visible = false; scene.add(o); A.rings.push({ o, mt, d: r[1] });
      });
    }
    A.rings.forEach(r => {
      const ru = c01((el - TL.imp - r.d) / TL.ring); r.o.visible = ru > 0 && ru < 1; const e = EZ.outCubic(ru);
      r.o.scale.setScalar(0.3 + 1.9 * e); r.mt.opacity = (1 - ru) * 0.9;
    });
    // レジが受ける（インパクトスクワッシュ 620ms, easeOutBack + シェイク）。クレカは軽く
    if (el >= TL.imp) {
      const iu = c01((el - TL.imp) / 620), eo = EZ.outBack(iu), amp = credit ? 0.4 : 1;
      rx.scale.set(1 + 0.1 * amp * (1 - eo), 1 - 0.18 * amp * (1 - eo), 1 + 0.1 * amp * (1 - eo));
      rx.pos.set(Math.sin(iu * 38) * 0.045 * amp * Math.pow(1 - iu, 2), -0.05 * amp * (1 - iu), 0);
      if (!F.thunk && !credit) { F.thunk = 1; snd('thunk'); }
    }
    // 引き出し: 硬貨（カードは沈む直前）が届く前に開き、受け止めたら閉じる。レシートの紙は少し伸びてから戻る
    { const o0 = credit ? TL.imp - 520 : TL.snap0 - 160, c0 = TL.imp + (credit ? 520 : 260);
      rx.drawer = EZ.inOutCubic(seg(el, o0, 420)) * (1 - EZ.inOutCubic(seg(el, c0, 440)));
      rx.paper = EZ.outCubic(seg(el, TL.imp + 80, 700)) * (1 - EZ.inOutCubic(seg(el, TL.imp + 1500, 800))); }
    if (!F.chin && el >= TL.chin) { F.chin = 1; snd('chin'); }
    if (!F.dust && el >= TL.g0) { F.dust = 1; try { A.dust = buildDust(yen(entry.amount), S0, 1.8, isCar() ? (entry.amount / fuelPrice()).toFixed(2) + 'L' : ''); } catch (e) { console.warn('[play] dust', e); } }
    if (A.dust) {
      stepDust(A.dust, el);
      const gEnd = TL.g0 + TL.gather;
      if (!F.tring && el >= gEnd) {   // 文字が出る瞬間: 脈打つ輪を1回（680ms, easeOutCubic）
        F.tring = 1; const geo = new THREE.RingGeometry(0.95, 1, 64), mt = new THREE.MeshBasicMaterial({ color: '#5ef0ff', transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false, side: THREE.DoubleSide });
        A.tring = track(new THREE.Mesh(geo, mt), geo, mt); A.tring.position.copy(A.dust.ctr); A.tring.position.z += 0.1; A.tring.renderOrder = 10; A.tring.visible = false; scene.add(A.tring);
      }
      if (A.tring) { const ru = seg(el, gEnd, TL.ring), e = EZ.outCubic(ru), r = A.dust.Wt * (0.1 + 0.55 * e); A.tring.visible = ru > 0 && ru < 1; A.tring.scale.set(r, r * 0.45, 1); A.tring.material.opacity = (1 - ru) * 0.9; }
      A.dimmed = 1; ST.setFlyDim(el < gEnd ? 1 : el < TL.b0 ? 1 - 0.6 * EZ.outCubic(seg(el, gEnd, 300)) : 0.4 + 0.6 * EZ.outCubic(seg(el, TL.b0, 400)));   // 見せている間、飛ぶ金額の群れを暗く（0.4）→ 散るとき戻す
    }
    if (!F.clk && el >= TL.b0) { F.clk = 1; snd('clink'); snd('clink', 0.14); snd('clink', 0.3); }
    if (!F.fly && el >= TL.b0) { F.fly = 1; flyDo(); }   // 光る硬貨がレジから履歴の新しい行へ（行が画面外なら画面下へ落ちていく）
    if (el >= TL.end) finish();
  };
  ST.setPlaying(true);
  A.unsub = ST.onFrame(() => { try { tick(); } catch (e) { console.warn('[play] tick', e); finish(); } });
  A.wd = setTimeout(A.skip, TL.end + 1500);   // フレームが進まない環境でも必ず終わらせる（演出の長さ + 1.5秒）
  stageEl.addEventListener('pointerdown', A.skipFn);
  curAnim = A;
}

// ---- 書き出したあとの猫の喜び: タップの驚き（take のジャンプ）+ ハートと星屑を少し（レシートを閉じたあとに外から呼ばれる）----
const heartTex = canvasTex(64, 64, (g, w, h) => {
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = '700 50px "Zen Maru Gothic", sans-serif';
  g.shadowColor = '#ff6bd5'; g.shadowBlur = 10; g.fillStyle = '#ff8fe0'; g.fillText('♥', w / 2, h / 2 + 3);
});
let cheerOff = null;
function cheer() {   // 動きオフ・演出中は何もしない（false を返す）
  if (!motionNow() || curAnim || playing || stopped || cv.style.display === 'none') return false;
  if (cheerOff) cheerOff();
  take = performance.now() / 1000;   // タップのときと同じ「びっくりジャンプ」
  const hp = new V3(); cat.head.getWorldPosition(hp);
  const items = [], t0 = performance.now();
  for (let i = 0; i < 6; i++) {   // ハート: 頭の上からふわっと昇って消える
    const m = new THREE.SpriteMaterial({ map: heartTex, transparent: true, depthWrite: false, depthTest: false, opacity: 0 });
    const sp = new THREE.Sprite(m); sp.renderOrder = 12; sp.visible = false; scene.add(sp);
    items.push({ sp, m, kind: 'h', d: i * 110, dur: 1500, x0: hp.x + rnd(-0.55, 0.55), y0: hp.y + 0.45 + rnd(0, 0.25), z0: hp.z + 0.7, rise: rnd(1.1, 1.7), sw: rnd(0.12, 0.28), ph: rnd(0, TAU), sc: rnd(0.42, 0.62) });
  }
  for (let i = 0; i < 10; i++) {   // 星屑: 頭のまわりから四方へ散って消える
    const sp = halo(i % 2 ? '#5ef0ff' : '#ffd36b', 0.3, 0); sp.renderOrder = 12; sp.visible = false; scene.add(sp);
    const a = rnd(0, TAU), v = rnd(0.9, 1.7);
    items.push({ sp, m: sp.material, kind: 's', d: rnd(0, 300), dur: 1100, x0: hp.x, y0: hp.y + 0.2, z0: hp.z + 0.8, vx: Math.cos(a) * v, vy: Math.sin(a) * v + 0.4, sc: rnd(0.25, 0.5) });
  }
  const end = () => {
    if (!cheerOff || cheerOff.tok !== tok) return; cheerOff = null; try { unsub(); } catch (e) {}
    for (const it of items) { scene.remove(it.sp); it.m.dispose(); }
    dirty = true;
  };
  const tok = {};
  const unsub = ST.onFrame(() => {
    const el = performance.now() - t0; let alive = false;
    for (const it of items) {
      const u = (el - it.d) / it.dur; if (u >= 1) { it.sp.visible = false; continue; } alive = true;
      if (u <= 0) continue;
      const e = EZ.outCubic(u), pop = Math.min(1, u * 5);
      if (it.kind === 'h') it.sp.position.set(it.x0 + Math.sin(u * 5 + it.ph) * it.sw, it.y0 + it.rise * e, it.z0);
      else it.sp.position.set(it.x0 + it.vx * e, it.y0 + it.vy * e, it.z0);
      it.sp.scale.setScalar(it.sc * (it.kind === 'h' ? EZ.outBack(pop) : 1 - 0.5 * u));
      it.m.opacity = Math.sin(Math.min(1, u * 1.15) * PI) * (it.kind === 'h' ? 1 : 0.9); it.sp.visible = true;
    }
    if (!alive) end();
  });
  cheerOff = Object.assign(() => end(), { tok });
  setTimeout(end, 3500);   // フレームが進まない環境でも片付ける
  dirty = true; ensureLoop(); return true;
}
ST.cheer = cheer;

// ---- 記録のあと（通常の窓）: 履歴に行を出して見せる → 1.5秒後に窓へなめらかに戻る → 窓が見えたら猫の演出（本体 saifu と同じ流れ。演出のあとは下へ戻さない）----
const RET_MS = 1500, SCROLL_UP_MS = 1200, SCROLL_DOWN_MS = 900;
let retTok = 0, retTimer = 0, retOff = null;
const stageVis = () => { const r = stageEl.getBoundingClientRect(); return (Math.min(r.bottom, innerHeight) - Math.max(r.top, 0)) / (r.height || 1); };
function cancelReturn() {   // 待ちの取り消し（次の記録・入力欄へのフォーカス・全画面・取り消し）。待たせていた飛ぶ金額も放す
  retTok++; clearTimeout(retTimer); retTimer = 0; if (retOff) { retOff(); retOff = null; }
  if (holdFly != null) { holdFly = null; dirty = true; ensureLoop(); }
}
window.cancelStageReturn = cancelReturn;   // 修正を始めるとき（classic script）から、窓へ戻る待ちを取り消す
function animScrollTo(y, ms, done) {   // 決まった時間でなめらかにスクロール（途中で自分でスクロール・タップしたらそこで止める）。done: 終わったとき（止めたときも）
  const y0 = window.scrollY, dy = Math.max(0, Math.min(y, document.documentElement.scrollHeight - innerHeight)) - y0;
  if (Math.abs(dy) < 2) { if (done) done(); return; }
  const t0 = performance.now(), evs = ['touchstart', 'wheel', 'pointerdown', 'keydown'];
  let stop = false; const onUser = () => { stop = true; };
  evs.forEach(t => window.addEventListener(t, onUser, { passive: true, once: true }));
  const step = now => {
    const u = Math.min(1, (now - t0) / ms), k = u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
    if (!stop) window.scrollTo(0, y0 + dy * k);
    if (u < 1 && !stop) requestAnimationFrame(step); else { evs.forEach(t => window.removeEventListener(t, onUser)); if (done) done(stop); }
  };
  requestAnimationFrame(step);
  setTimeout(() => { if (!stop && performance.now() - t0 > ms + 400) stop = true; }, ms + 500);   // rAF が止まる環境でも終わらせる
}
function armReturn() {   // 記録した直後から、入力欄へのフォーカスで待ちを取り消せるようにする（行へのスクロール中も含む）。返す tok が変わっていたら取り消し済み
  cancelReturn(); const tok = retTok;
  const onFocus = e => { if (e.target && e.target.matches && e.target.matches('input,textarea,select') && e.target.closest('#form, #fbar')) cancelReturn(); };
  document.addEventListener('focusin', onFocus, true); retOff = () => document.removeEventListener('focusin', onFocus, true);
  return tok;
}
function scheduleReturn(entry, play, tok) {   // 記録から1.5秒後に窓へ戻る。play: 窓が見えたら猫の演出を流す（動きオフは演出なしで即時に戻る）
  if (play) holdFly = entry.id;   // 演出の最後に、レジから群れへ加わる
  retTimer = setTimeout(() => {
    retTimer = 0;
    if (tok !== retTok) return;
    if (retOff) { retOff(); retOff = null; }
    if (isFull() || editId || !state.entries.some(e => e.id === entry.id)) { cancelReturn(); return; }   // 全画面へ入った・修正を始めた・取り消した
    if (!play) { try { window.scrollTo({ top: 0, behavior: 'instant' }); } catch (e) { window.scrollTo(0, 0); } return; }
    animScrollTo(0, SCROLL_UP_MS, () => {
      if (tok !== retTok) return;
      let n = 0;
      const wait = () => {
        if (tok !== retTok) return;
        let f = 0; try { f = stageVis(); } catch (e) {}
        if (f >= 0.9 || ++n > 16) {
          if (f >= 0.5 && !isFull() && !editId && !curAnim) { try { playStage(entry, () => {}, { revealed: true }); } catch (e) { console.warn('[play] return', e); cancelReturn(); } }
          else cancelReturn();
        } else setTimeout(wait, 50);
      };
      wait();
    });
  }, RET_MS);
}

window.playRecord = function (entry, done) {
  try { exitFocus(true); } catch (e) {}   // 記録の演出が始まるときは、先に寄った状態を解く
  if (curAnim) curAnim.skip();   // 連続で記録したときは前の演出を即終了
  let ok = false;
  try { ok = !!(window.stage && window.stage.getCat && cv.style.display !== 'none' && !stopped && !document.hidden && motionOn()); } catch (e) {}
  if (!isFull()) {
    // 通常の窓: 上へはスクロールしない。行が見えない位置なら行へスクロール → 既定（硬貨がボタンから行へ飛び、行が出る）→ 1.5秒後に窓へ戻って演出
    const row = [...document.querySelectorAll('#list .ent')].find(el => el.dataset.id === entry.id);
    const tok = armReturn(), fire = () => { playRecord(entry, done); if (tok === retTok) scheduleReturn(entry, ok, tok); };   // 行へのスクロール中に次の記録が来たら、前の記録の待ちは作らない
    let r = null; try { r = row && row.getBoundingClientRect(); } catch (e) {}
    const offs = !!r && (r.top < 70 || r.bottom > innerHeight - 90), ty = offs ? window.scrollY + r.top - innerHeight * 0.4 : 0;
    if (offs && ok) animScrollTo(ty, SCROLL_DOWN_MS, fire);
    else { if (offs) window.scrollTo(0, Math.max(0, ty)); fire(); }   // 動きオフは即時
    return;
  }
  cancelReturn();
  if (!ok) { playRecord(entry, done); return; }   // 既定: 硬貨が飛ぶだけ（動きオフなら即時）+ チーン
  try { playStage(entry, done); } catch (e) { console.warn('[play] fallback', e); try { if (curAnim) curAnim.skip(); ST.setPlaying(false); } catch (e2) {} playRecord(entry, done); }   // 全画面: これまでどおり
};
}
