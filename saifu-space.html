<!DOCTYPE html>
<html lang="ja">
<head>
<!-- ============================================================
  にゃんこ宇宙財布（試作） NYAN ORBIT — step 1: UIの骨格
  - 保存先は試作専用キー saifu_space_proto のみ。saifu_v1 は初回に読み取りコピーするだけ（書き込まない）
  - 書き出し機能なし。実データはコミットしない（バックアップは care-data-backup）
  - ステージ(#stage)は step 2 で three.js に置き換える。記録演出は playRecord() が差し込み口（step 3）
============================================================ -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="宇宙財布">
<link rel="apple-touch-icon" href="saifu-icon.png">
<link rel="icon" type="image/png" href="saifu-favicon.png">
<title>にゃんこ宇宙財布（試作）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b1026;
    --bg2: #131a3a;
    --text: #e8f0ff;
    --text2: #8fa3c8;
    --cyan: #5ef0ff;
    --magenta: #ff6bd5;
    --gold: #ffd36b;
    --glass: rgba(255,255,255,.07);
    --glass-b: rgba(255,255,255,.16);
    --glow: 0 0 18px rgba(94,240,255,.14);
    --f-ui: "Zen Maru Gothic", -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    --f-dot: "DotGothic16", "Zen Maru Gothic", monospace;
    --e-back: cubic-bezier(.34,1.56,.64,1);
    --e-quart: cubic-bezier(.25,1,.5,1);
    --e-cubic: cubic-bezier(.33,1,.68,1);
    --e-sine: cubic-bezier(.61,1,.88,1);
    --e-iocubic: cubic-bezier(.65,0,.35,1);
    --e-iosine: cubic-bezier(.37,0,.63,1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body {
    font-family: var(--f-ui); color: var(--text); font-weight: 500;
    background: radial-gradient(120% 60% at 50% 0%, #1a2150 0%, var(--bg) 60%) fixed, var(--bg);
    min-height: 100vh; overflow-x: hidden;
    padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top));
    padding-bottom: calc(28px + env(safe-area-inset-bottom));
    padding-left: calc(16px + env(safe-area-inset-left)); padding-right: calc(16px + env(safe-area-inset-right));
  }
  #app { max-width: 480px; margin: 0 auto; }
  button, input { font-family: inherit; color: inherit; }
  button { cursor: pointer; }

  /* ===== ステージ（観測窓）===== */
  #stage { position: relative; height: 42vh; min-height: 240px; max-height: 380px; border-radius: 36px; overflow: hidden;
    background: radial-gradient(90% 80% at 50% 110%, #1c2a66 0%, #0a0f26 70%);
    border: 1px solid var(--glass-b); box-shadow: 0 0 0 4px rgba(94,240,255,.06), 0 0 34px rgba(94,240,255,.22), inset 0 0 40px rgba(0,0,0,.5); }
  #cv { display: none; width: 100%; height: 100%; }
  .starfield { position: absolute; inset: 0; pointer-events: none; }
  .starfield i { position: absolute; inset: 0; background-repeat: repeat; will-change: background-position; }
  /* 3層: タイルの幅ぶんだけ動かすと継ぎ目なく無限ループ。奥ほど遅く小さい */
  .starfield .s1 { background-size: 160px 160px; animation: drift1 120s linear infinite; opacity: .55;
    background-image: radial-gradient(1px 1px at 20px 30px, #fff, transparent), radial-gradient(1px 1px at 90px 120px, #cfe6ff, transparent),
      radial-gradient(1px 1px at 140px 60px, #fff, transparent), radial-gradient(1px 1px at 60px 90px, #aab8ff, transparent); }
  .starfield .s2 { background-size: 220px 220px; animation: drift2 70s linear infinite; opacity: .8;
    background-image: radial-gradient(1.5px 1.5px at 40px 50px, #fff, transparent), radial-gradient(1.5px 1.5px at 150px 140px, #bff7ff, transparent),
      radial-gradient(1.5px 1.5px at 190px 30px, #fff, transparent), radial-gradient(1.5px 1.5px at 100px 200px, #ffd0f2, transparent); }
  .starfield .s3 { background-size: 300px 300px; animation: drift3 38s linear infinite;
    background-image: radial-gradient(2.4px 2.4px at 70px 90px, #fff, transparent), radial-gradient(2.2px 2.2px at 230px 200px, var(--cyan), transparent),
      radial-gradient(2px 2px at 260px 40px, #fff, transparent); filter: drop-shadow(0 0 3px rgba(255,255,255,.8)); }
  @keyframes drift1 { to { background-position: -160px 0; } }
  @keyframes drift2 { to { background-position: -220px 0; } }
  @keyframes drift3 { to { background-position: -300px 0; } }
  #stage .fb { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 14px;
    font-size: 4.6rem; animation: float 5.5s var(--e-iosine) infinite alternate; filter: drop-shadow(0 0 16px rgba(94,240,255,.5)); }
  #stage .fb span:last-child { font-size: 3.4rem; opacity: .9; animation: float 7s var(--e-iosine) -2s infinite alternate-reverse; }
  @keyframes float { from { transform: translateY(-9px) rotate(-3deg); } to { transform: translateY(9px) rotate(3deg); } }
  #stage .tag { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-family: var(--f-dot); font-size: .7rem;
    letter-spacing: .3em; color: var(--cyan); opacity: .75; text-shadow: 0 0 8px var(--cyan); }

  /* ===== マーキー帯 ===== */
  .marquee { margin: 12px 0 14px; overflow: hidden; border: 1px solid var(--glass-b); border-radius: 12px; background: var(--glass);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: var(--glow); }
  .marquee .track { display: flex; width: max-content; animation: marq 32s linear infinite; padding: 7px 0;
    font-family: var(--f-dot); font-size: .85rem; color: var(--cyan); text-shadow: 0 0 7px rgba(94,240,255,.7); white-space: nowrap; }
  .marquee .track span { padding-right: 3em; }
  @keyframes marq { to { transform: translateX(-50%); } }

  /* ===== ガラスのパネル ===== */
  .panel { position: relative; margin-bottom: 12px; padding: 12px 14px; border-radius: 20px; border: 1px solid var(--glass-b);
    background: linear-gradient(160deg, rgba(255,255,255,.1), rgba(255,255,255,.05));
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: var(--glow); }
  .panel h2 { font-size: .74rem; font-weight: 700; color: var(--text2); letter-spacing: .08em; margin-bottom: 6px; }

  /* LCD（走査線 + ホログラム）*/
  .lcd { position: relative; overflow: hidden; border-radius: 12px; padding: 8px 12px; background: rgba(4,8,24,.55);
    border: 1px solid rgba(94,240,255,.28); box-shadow: inset 0 0 14px rgba(94,240,255,.12);
    font-family: var(--f-dot); color: var(--cyan); text-shadow: 0 0 8px rgba(94,240,255,.85), 0 0 18px rgba(94,240,255,.4); }
  .lcd::after { content: ''; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 1px, transparent 1px 3px); mix-blend-mode: screen; }
  #total .lcd { display: flex; justify-content: flex-end; align-items: baseline; font-size: 2.6rem; padding: 10px 14px; animation: glitch 6s steps(1) infinite; }
  @keyframes glitch {
    0%, 96.5%, 100% { transform: none; text-shadow: 0 0 8px rgba(94,240,255,.85), 0 0 18px rgba(94,240,255,.4); }
    97% { transform: translateX(2px); text-shadow: -3px 0 rgba(255,107,213,.9), 3px 0 rgba(94,240,255,.9); }
    98% { transform: translateX(-2px); text-shadow: 3px 0 rgba(255,107,213,.9), -3px 0 rgba(94,240,255,.9); }
  }
  /* ドラム回転の数字 */
  .roll { display: inline-flex; font-family: var(--f-dot); line-height: 1.15em; }
  .roll .ch, .roll .dg { display: inline-block; height: 1.15em; }
  .roll .dg { width: .62em; overflow: hidden; text-align: center; }
  .roll .strip { display: flex; flex-direction: column; transition: transform .9s cubic-bezier(.2,.9,.25,1.12); }
  .roll .strip span { height: 1.15em; }
  .roll.still .strip { transition: none; }

  /* 予算 */
  .bbar { height: 8px; border-radius: 5px; background: rgba(255,255,255,.1); overflow: hidden; margin: 8px 0 5px; }
  .bbar i { display: block; height: 100%; width: 0; border-radius: 5px; background: linear-gradient(90deg, var(--cyan), #7aa7ff);
    box-shadow: 0 0 10px var(--cyan); transition: width .8s var(--e-cubic); }
  #bud .bm { display: flex; justify-content: space-between; align-items: baseline; }
  #bud .bm .n { font-family: var(--f-dot); font-size: 1.3rem; color: var(--gold); text-shadow: 0 0 8px rgba(255,211,107,.6); }
  #bud .bs { font-size: .72rem; color: var(--text2); display: flex; justify-content: space-between; }
  #bud.warn .bbar i { background: linear-gradient(90deg, var(--magenta), #ff9ae6); box-shadow: 0 0 12px var(--magenta); animation: pulse 1.1s var(--e-iosine) infinite alternate; }
  #bud.over .bbar i { background: #ff5c7a; box-shadow: 0 0 14px #ff5c7a; animation: pulse .7s var(--e-iosine) infinite alternate; }
  #bud.over .bm .n { color: #ff8da1; text-shadow: 0 0 8px rgba(255,92,122,.7); }
  @keyframes pulse { from { opacity: .55; } to { opacity: 1; } }

  /* 入力 */
  .fld { display: block; margin-bottom: 10px; }
  .fld > span { display: block; font-size: .72rem; color: var(--text2); font-weight: 700; margin: 0 2px 4px; }
  input[type=text], input[type=number], input[type=date] { width: 100%; font-size: 1rem; padding: 10px 12px; border-radius: 12px; outline: none;
    background: rgba(4,8,24,.5); border: 1px solid var(--glass-b); color: var(--text); color-scheme: dark; }
  input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(94,240,255,.18), 0 0 14px rgba(94,240,255,.25); }
  .amt-row { display: flex; gap: 8px; align-items: stretch; }
  .amt-row input { flex: 1; min-width: 0; font-family: var(--f-dot); font-size: 1.25rem; }
  #amt-lcd { min-width: 6.4em; display: flex; align-items: center; justify-content: flex-end; font-size: 1.15rem; will-change: filter, opacity; }
  #cats { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 6px; }
  #cats button { position: relative; border: 1px solid var(--glass-b); background: rgba(255,255,255,.06); border-radius: 999px; padding: 7px 14px; font-size: .88rem; font-weight: 700; color: var(--text2); }
  #cats button.sel { color: #04101c; background: linear-gradient(135deg, var(--cyan), #9fb4ff); border-color: transparent; box-shadow: 0 0 14px rgba(94,240,255,.55); }
  #cats .gb { position: absolute; top: -10px; right: -8px; font-size: .6rem; line-height: 1.5; padding: 0 6px; border-radius: 999px; font-weight: 900;
    background: var(--magenta); color: #2a0820; box-shadow: 0 0 10px rgba(255,107,213,.8); pointer-events: none; }
  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; padding: 9px; border-radius: 12px; border: 1px solid var(--glass-b); background: rgba(255,255,255,.05); color: var(--text2); font-weight: 700; font-size: .9rem; }
  .seg button.sel { color: var(--gold); border-color: var(--gold); background: rgba(255,211,107,.12); box-shadow: 0 0 12px rgba(255,211,107,.3); }
  .go { width: 100%; margin-top: 4px; padding: 14px; border: 0; border-radius: 16px; font-size: 1.1rem; font-weight: 900; letter-spacing: .04em;
    color: #1d0a18; background: linear-gradient(135deg, var(--magenta), #ffa0e6 55%, var(--gold)); box-shadow: 0 0 22px rgba(255,107,213,.5), 0 4px 0 rgba(0,0,0,.25); }
  .go:disabled { opacity: .6; }
  @keyframes shake { 0%,100% { transform: none; } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .shake { animation: shake .35s !important; }

  /* 履歴 */
  .day { display: flex; justify-content: space-between; align-items: baseline; margin: 12px 0 4px; font-size: .78rem; }
  .day span:first-child { color: var(--magenta); font-weight: 900; text-shadow: 0 0 8px rgba(255,107,213,.6); }
  .day span:last-child { font-family: var(--f-dot); color: var(--text2); font-size: .9rem; }
  .ent { display: flex; align-items: center; gap: 8px; padding: 9px 2px; border-bottom: 1px dashed rgba(143,163,200,.3); }
  .ent .nm { flex: 1; min-width: 0; font-weight: 700; font-size: .92rem; overflow-wrap: anywhere; }
  .ent .meta { display: flex; gap: 5px; margin-top: 2px; }
  .ent .ct { font-size: .64rem; color: var(--cyan); border: 1px solid rgba(94,240,255,.4); border-radius: 8px; padding: 0 6px; font-weight: 700; }
  .ent .am { font-family: var(--f-dot); font-size: 1.1rem; color: var(--gold); text-shadow: 0 0 7px rgba(255,211,107,.5); display: inline-flex; flex: none; }
  .ent.hide { visibility: hidden; }
  .empty { text-align: center; color: var(--text2); font-size: .85rem; padding: 14px 0; }

  /* 設定 */
  details.set { margin-top: 4px; }
  details.set summary { cursor: pointer; font-size: .85rem; color: var(--text2); font-weight: 700; padding: 4px 2px; }
  details.set .row { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: .88rem; }
  details.set .row input[type=number] { width: 9em; }
  details.set .row button { padding: 8px 12px; border-radius: 10px; border: 1px solid #ff8da1; background: rgba(255,92,122,.1); color: #ff8da1; font-weight: 700; }

  /* 飛ぶ硬貨 */
  .fly-coin { position: fixed; left: 0; top: 0; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; pointer-events: none; z-index: 60;
    background: radial-gradient(circle at 35% 30%, #fff6cf, var(--gold) 55%, #b98a1f); box-shadow: 0 0 14px 3px rgba(255,211,107,.8); }

  /* ダイナミックアイランド風トースト */
  #island { position: fixed; z-index: 70; top: calc(8px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: none;
    height: 30px; width: 96px; border-radius: 999px; overflow: hidden; background: #02040d; border: 1px solid rgba(94,240,255,.4);
    box-shadow: 0 0 20px rgba(94,240,255,.35), 0 8px 24px rgba(0,0,0,.5); align-items: center; justify-content: space-between; gap: 8px; padding: 0 8px 0 16px; white-space: nowrap; }
  #island .msg { font-size: .82rem; font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
  #island .msg b { color: var(--gold); font-family: var(--f-dot); font-weight: 400; }
  #island button { flex: none; border: 0; border-radius: 999px; padding: 6px 12px; font-size: .78rem; font-weight: 900; color: #04101c; background: var(--cyan); box-shadow: 0 0 10px rgba(94,240,255,.6); }

  /* 診断 */
  #diag { position: fixed; z-index: 90; left: 6px; bottom: calc(6px + env(safe-area-inset-bottom)); max-width: calc(100vw - 12px); padding: 6px 8px; border-radius: 8px;
    background: rgba(0,0,0,.78); color: #9cf27a; font: 10px/1.45 ui-monospace, Menlo, monospace; white-space: pre-wrap; pointer-events: none; }

  /* アニメ オフ / 動きを減らす: 常時の動きを止め、遷移は即時に */
  body.nomo *, body.nomo *::before, body.nomo *::after { animation: none !important; transition: none !important; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div class="starfield"><i class="s1"></i><i class="s2"></i><i class="s3"></i></div>
    <div class="fb" aria-hidden="true"><span>🐈‍⬛</span><span>🪐</span></div>
    <canvas id="cv"></canvas>
    <div class="tag">NYAN ORBIT</div>
  </div>

  <div class="marquee" aria-label="ステーション情報"><div class="track" id="marq"></div></div>

  <section class="panel rise" id="total">
    <h2>今月の合計</h2>
    <div class="lcd"><span id="sum-month"></span></div>
  </section>

  <section class="panel rise" id="bud">
    <div class="bm"><span id="bud-k" style="font-size:.78rem;color:var(--text2);font-weight:700"></span><span class="n" id="bud-n"></span></div>
    <div class="bbar"><i id="bud-bar"></i></div>
    <div class="bs"><span id="bud-s1"></span><span id="bud-s2"></span></div>
  </section>

  <form class="panel rise" id="form" autocomplete="off">
    <label class="fld"><span>品目</span><input type="text" id="name" placeholder="例: コーヒー" enterkeyhint="next"></label>
    <div class="fld"><span>金額</span>
      <div class="amt-row">
        <input type="number" id="amt" inputmode="numeric" min="1" max="9999999" step="1" placeholder="0">
        <div class="lcd" id="amt-lcd"><span id="amt-disp">¥0</span></div>
      </div>
    </div>
    <div class="fld"><span>ジャンル</span><div id="cats"></div></div>
    <div class="fld"><span>支払い</span>
      <div class="seg" id="pay"><button type="button" data-t="cash" class="sel">💴 現金</button><button type="button" data-t="credit">💳 クレカ</button></div>
    </div>
    <label class="fld"><span>日付</span><input type="date" id="date"></label>
    <button type="submit" class="go" id="go">🐱 レジに入れる</button>
  </form>

  <section class="panel rise" id="hist">
    <h2>履歴</h2>
    <div id="list"></div>
  </section>

  <section class="panel rise">
    <details class="set">
      <summary>⚙️ 設定（試作）</summary>
      <label class="row"><input type="checkbox" id="set-anim"> アニメ</label>
      <label class="row"><span>予算</span><input type="number" id="budget" inputmode="numeric" min="0" max="9999999" step="1" placeholder="なし"><span>円</span></label>
      <div class="row"><button type="button" id="reset">試作データをリセット</button></div>
    </details>
  </section>
</div>

<div id="island" role="status" aria-live="polite"><span class="msg"></span><button type="button" id="undo-btn">取り消す</button></div>
<div id="diag" style="display:none"></div>

<script>
// ===== 基本設定 =====
const APP_KEY    = 'saifu_space_proto';   // 書き込むのはこのキーだけ
const LEGACY_KEY = 'saifu_v1';            // 本体のキー。読み取り専用（setItem / removeItem は絶対に呼ばない）
const $ = id => document.getElementById(id);
const pad2 = n => String(n).padStart(2, '0');
const todayIso = () => { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };
const isoToMD = iso => { const p = iso.split('-'); return (+p[1]) + '/' + (+p[2]); };
const yen = n => '¥' + Math.round(n).toLocaleString('ja-JP');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const toHalf = s => String(s).replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
const newId = () => 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const DEFAULT_CATS = [{ id: 1, name: '食費' }, { id: 2, name: '日用品' }, { id: 3, name: '交通費' }, { id: 4, name: 'その他' }, { id: 5, name: 'ガソリン' }];
const reduceMotion = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
const EASE = { back: 'cubic-bezier(.34,1.56,.64,1)', quart: 'cubic-bezier(.25,1,.5,1)', cubic: 'cubic-bezier(.33,1,.68,1)', sine: 'cubic-bezier(.61,1,.88,1)',
  iocubic: 'cubic-bezier(.65,0,.35,1)', iosine: 'cubic-bezier(.37,0,.63,1)' };

// ===== 保存・読込 =====
let legacyExisted = false;   // 初回コピー元(saifu_v1)があったか（診断用）
function readLegacy() {   // 読み取り専用
  let raw = null;
  try { raw = localStorage.getItem(LEGACY_KEY); } catch (e) {}
  legacyExisted = raw != null;
  if (!raw) return {};
  try { const o = JSON.parse(raw); return o && typeof o === 'object' ? o : {}; } catch (e) { return {}; }
}
function normalize(s) {
  const entries = Array.isArray(s.entries) ? s.entries.filter(e => e && e.id && e.iso && e.amount > 0).map(e => Object.assign({}, e)) : [];
  const month = {};
  for (const e of entries) month[e.iso.slice(0, 7)] = (month[e.iso.slice(0, 7)] || 0) + e.amount;
  return {
    entries,
    cats: Array.isArray(s.cats) && s.cats.length ? s.cats.map(c => Object.assign({}, c)) : DEFAULT_CATS.slice(),
    lastCat: s.lastCat,
    anim: s.anim !== false,
    budget: Number.isInteger(s.budget) && s.budget > 0 && s.budget <= 9999999 ? s.budget : 0,
    monthTotals: s.monthTotals && typeof s.monthTotals === 'object' ? Object.assign({}, s.monthTotals) : month,
  };
}
function loadState() {
  let raw = null;
  try { raw = localStorage.getItem(APP_KEY); } catch (e) {}
  if (raw) { try { const o = JSON.parse(raw); if (o && typeof o === 'object') { readLegacy(); return normalize(o); } } catch (e) {} }
  const st = normalize(readLegacy());   // 初回: saifu_v1 から entries / cats / budget などをコピー
  st.anim = true;
  try { localStorage.setItem(APP_KEY, JSON.stringify(st)); } catch (e) {}
  return st;
}
let state = loadState();
function save() { try { localStorage.setItem(APP_KEY, JSON.stringify(state)); } catch (e) {} }
const motionOn = () => state.anim && !reduceMotion.matches;
const catName = id => { const c = state.cats.find(c => c.id === id); return c ? c.name : '(不明)'; };
function addMonth(iso, amount) { const k = iso.slice(0, 7); state.monthTotals[k] = Math.max(0, (state.monthTotals[k] || 0) + amount); }
function applyMotionClass() { document.body.classList.toggle('nomo', !motionOn()); }

// WAAPI の薄いラッパ（アニメオフ時は何もせず null）
function anim(el, kf, opt) { if (!el || !motionOn() || !el.animate) return null; return el.animate(kf, Object.assign({ fill: 'both' }, opt)); }

// ===== ドラム回転の数字（saifu.html rollNumber を移植）=====
const ROLL_STRIP = '<span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span>';
function rollNumber(el, text, animate, from) {
  const prev = from != null ? from : el._roll;
  if (from == null && prev === text && el.firstChild) return;
  if (prev == null) animate = false;
  el._roll = text;
  const n = text.length, old = String(prev || '').slice(-n).padStart(n, ' ');
  let html = '';
  for (let i = 0; i < n; i++) {
    const ch = text[i];
    if (ch >= '0' && ch <= '9') {
      const o = old[i] >= '0' && old[i] <= '9' ? +old[i] : 0;
      html += `<span class="dg"><span class="strip" data-to="${ch}" style="transform:translateY(${-o * 10}%)">${ROLL_STRIP}</span></span>`;
    } else html += `<span class="ch">${esc(ch)}</span>`;
  }
  el.classList.add('roll'); el.classList.toggle('still', !animate);
  el.setAttribute('aria-label', text);
  el.innerHTML = html;
  const strips = el.querySelectorAll('.strip');
  if (animate) void el.offsetWidth;
  strips.forEach((s, i) => {
    s.style.transitionDelay = animate ? ((strips.length - 1 - i) * 0.07) + 's' : '0s';
    s.style.transform = `translateY(${-s.dataset.to * 10}%)`;
  });
}

// ===== 入力 =====
const nameIn = $('name'), amtIn = $('amt'), dateIn = $('date');
let payType = 'cash', catTouched = false, guessCat = null, pendingReveal = null;
dateIn.value = todayIso();

function renderCats(animateId) {
  $('cats').innerHTML = state.cats.map(c => {
    const sel = c.id === state.lastCat, g = sel && c.id === guessCat;
    return `<button type="button" data-id="${esc(c.id)}" class="${sel ? 'sel' : ''}">${esc(c.name)}${g ? '<span class="gb">予想</span>' : ''}</button>`;
  }).join('');
  if (animateId == null) return;
  const b = $('cats').querySelector(`button[data-id="${CSS.escape(String(animateId.id))}"]`); if (!b) return;
  if (animateId.kind === 'pop') anim(b, [{ transform: 'scale(1)' }, { transform: 'scale(1.12)', offset: .5 }, { transform: 'scale(1)' }], { duration: 520, easing: EASE.back });
  if (animateId.kind === 'guess') {
    const gb = b.querySelector('.gb');   // マグネット吸着: ずれた所から吸い寄せられて止まる
    anim(gb, [{ transform: 'translate(-22px,-14px) scale(.6)', opacity: 0 }, { transform: 'translate(0,0) scale(1)', opacity: 1 }], { duration: 620, easing: EASE.iocubic });
  }
}
$('cats').addEventListener('click', e => {
  const b = e.target.closest('button[data-id]'); if (!b) return;
  const c = state.cats.find(c => String(c.id) === b.dataset.id); if (!c) return;
  catTouched = true; guessCat = null; state.lastCat = c.id; save(); renderCats({ id: c.id, kind: 'pop' });
});
// 品目から予想: 同じ品目の過去記録のジャンル（回数が多い方、同数なら新しい方）
const normName = v => toHalf(v).replace(/[Ａ-Ｚａ-ｚ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0)).trim().replace(/\s+/g, ' ').toLowerCase();
function guessCatFor(name) {
  const k = normName(name); if (!k) return null;
  const by = new Map();
  for (const e of state.entries) {
    if (normName(e.name) !== k || !state.cats.some(c => c.id === e.catId)) continue;
    const b = by.get(e.catId) || { n: 0, last: '' }; b.n++; if (e.id > b.last) b.last = e.id; by.set(e.catId, b);
  }
  let best = null, bb = null;
  for (const [id, b] of by) if (!bb || b.n > bb.n || (b.n === bb.n && b.last > bb.last)) { best = id; bb = b; }
  return best;
}
nameIn.addEventListener('input', () => {
  if (catTouched) return;
  const g = guessCatFor(nameIn.value);
  if (g == null) { if (guessCat != null) { guessCat = null; renderCats(); } return; }
  if (g !== state.lastCat || g !== guessCat) { state.lastCat = g; guessCat = g; renderCats({ id: g, kind: 'guess' }); }
});
function setPay(t) {
  payType = t === 'credit' ? 'credit' : 'cash';
  document.querySelectorAll('#pay button').forEach(b => b.classList.toggle('sel', b.dataset.t === payType));
}
$('pay').addEventListener('click', e => { const b = e.target.closest('button[data-t]'); if (b) setPay(b.dataset.t); });

// 金額: 打つたびにLCDへ反映、値が確定（blur / change）したときにブラー解像
const amtVal = () => parseInt(toHalf(amtIn.value).replace(/[^\d]/g, ''), 10) || 0;
function showAmt() { $('amt-disp').textContent = yen(amtVal()); }
function resolveAmt() {
  showAmt(); if (!amtVal()) return;
  anim($('amt-lcd'), [{ filter: 'blur(8px)', opacity: .3 }, { filter: 'blur(0)', opacity: 1 }], { duration: 820, easing: EASE.sine });
}
amtIn.addEventListener('input', showAmt);
amtIn.addEventListener('change', resolveAmt);
amtIn.addEventListener('blur', resolveAmt);

// ===== 集計・マーキー・予算 =====
const monthKey = () => todayIso().slice(0, 7);
function monthTotal(shownOnly) {
  const pend = shownOnly && pendingReveal ? state.entries.find(e => e.id === pendingReveal) : null;   // 演出待ちの記録は行が出たときに足す
  return (state.monthTotals[monthKey()] || 0) - (pend && pend.iso.slice(0, 7) === monthKey() ? pend.amount : 0);
}
function renderMarquee() {
  const t = todayIso(), day = state.entries.filter(e => e.iso === t).reduce((s, e) => s + e.amount, 0);
  const rest = state.budget ? yen(state.budget - (state.monthTotals[monthKey()] || 0)) : '未設定';
  const s = `NYAN ORBIT STATION ・ 今日の支出 ${yen(day)} ・ 今月 ${yen(state.monthTotals[monthKey()] || 0)} ・ 予算のこり ${rest} ・ `;
  const html = `<span>${esc(s)}</span>`.repeat(4);   // 半分が1周ぶん（2つで画面幅を超える長さに）
  if ($('marq')._h !== html) { $('marq').innerHTML = html; $('marq')._h = html; }
}
function renderBudget() {
  const tot = state.monthTotals[monthKey()] || 0, b = state.budget, card = $('bud');
  const rest = b - tot, rate = b ? tot / b : 0, m = new Date().getMonth() + 1;
  card.classList.toggle('warn', !!b && rate >= 0.8 && rate <= 1);
  card.classList.toggle('over', !!b && rate > 1);
  $('bud-k').textContent = b ? (rest >= 0 ? `${m}月の予算 残り` : `${m}月 予算オーバー`) : `${m}月の合計`;
  $('bud-n').textContent = yen(b ? Math.abs(rest) : tot);
  $('bud-bar').style.width = b ? Math.min(100, Math.round(rate * 100)) + '%' : '0%';
  $('bud-s1').textContent = b ? `使った ${yen(tot)} / ${yen(b)}` : '設定で予算を決められます';
  $('bud-s2').textContent = b ? Math.round(rate * 100) + '%' : '';
}
function renderSums() {
  rollNumber($('sum-month'), yen(monthTotal(true)), motionOn());
  renderBudget(); renderMarquee();
}

// ===== 履歴 =====
const WDAY = ['日', '月', '火', '水', '木', '金', '土'];
function renderList(first) {
  const list = state.entries.slice().sort((a, b) => a.iso < b.iso ? 1 : a.iso > b.iso ? -1 : (a.id < b.id ? 1 : -1)).slice(0, 100);
  if (!list.length) { $('list').innerHTML = '<div class="empty">まだ記録はありません</div>'; return; }
  let html = '', cur = null;
  for (const e of list) {
    if (e.iso !== cur) {
      cur = e.iso;
      const d = new Date(cur + 'T00:00:00'), tot = list.filter(x => x.iso === cur).reduce((s, x) => s + x.amount, 0);
      html += `<div class="day"><span>${isoToMD(cur)}（${WDAY[d.getDay()]}）</span><span>${esc(yen(tot))}</span></div>`;
    }
    html += `<div class="ent${e.id === pendingReveal ? ' hide' : ''}" data-id="${esc(e.id)}"><div class="nm"><div class="t">${esc(e.name)}</div>` +
      `<div class="meta"><span class="ct">${esc(catName(e.catId))}</span><span class="ct">${e.type === 'credit' ? 'CR' : '現金'}</span></div></div>` +
      `<span class="am">${esc(yen(e.amount))}</span></div>`;
  }
  $('list').innerHTML = html;
  if (first) {   // 起動時: 段差追従（先頭12行まで）
    [...$('list').querySelectorAll('.ent')].slice(0, 12).forEach((r, i) =>
      anim(r, [{ transform: 'translateY(14px)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 900, delay: 600 + i * 40, easing: EASE.cubic }));
  }
}
function renderAll() { renderCats(); renderSums(); renderList(); }

// ===== 記録 =====
// step 3 の差し込み口: playRecord(entry, done) — 演出が終わったら done() を呼ぶ。
// 既定は「ボタンから履歴の新しい行へ光る硬貨が弧を描いて飛ぶ」。step 3 で window.playRecord を差し替える
let playRecord = function (entry, done) {
  if (!motionOn()) { done(); return; }
  flyToEntry(entry.id, done) || done();
};
window.playRecord = null;   // 差し替え用: window.playRecord = (entry, done) => {...}

$('form').addEventListener('submit', e => {
  e.preventDefault();
  const amount = amtVal();
  if (!(amount > 0) || amount > 9999999) {
    amtIn.classList.remove('shake'); void amtIn.offsetWidth; amtIn.classList.add('shake'); amtIn.focus(); return;
  }
  const cid = state.lastCat != null && state.cats.some(c => c.id === state.lastCat) ? state.lastCat : state.cats[0].id;
  const iso = dateIn.value || todayIso();
  hideUndo();
  const entry = { id: newId(), iso, date: isoToMD(iso), name: nameIn.value.trim() || catName(cid), amount, catId: cid, type: payType, tags: [], exported: false };
  state.entries.push(entry); addMonth(iso, amount); save();   // 先に保存してから演出
  anim($('go'), [{ transform: 'scale(1,1)' }, { transform: 'scale(1.06,.86)', offset: .35 }, { transform: 'scale(.97,1.04)', offset: .7 }, { transform: 'scale(1,1)' }], { duration: 420, easing: EASE.back });
  nameIn.value = ''; amtIn.value = ''; showAmt(); amtIn.blur(); nameIn.blur(); setPay('cash'); catTouched = false; guessCat = null;
  pendingReveal = entry.id; renderAll();
  const done = () => revealEntry(entry.id);
  try { (typeof window.playRecord === 'function' ? window.playRecord : playRecord)(entry, done); } catch (err) { done(); }
  setTimeout(done, 3000);   // 演出が止まる環境でも必ず行を出す（二重呼びは revealEntry が無視）
});
function revealEntry(id) {
  if (pendingReveal !== id) return;
  pendingReveal = null; renderList(); renderSums();
  const row = [...document.querySelectorAll('#list .ent')].find(el => el.dataset.id === id);
  if (row) {   // 行マスクアップ
    anim(row, [{ clipPath: 'inset(100% 0 0 0)', transform: 'translateY(10px)' }, { clipPath: 'inset(0 0 0 0)', transform: 'none' }], { duration: 620, easing: EASE.cubic });
    const am = row.querySelector('.am'); if (am) rollNumber(am, am.textContent, motionOn(), '');
  }
  showUndo(id);
}
// 光る硬貨がボタンから履歴の行へ弧を描いて飛ぶ（800ms, easeInOutSine, 回転つき）
function flyToEntry(id, done) {
  const row = [...document.querySelectorAll('#list .ent')].find(el => el.dataset.id === id);
  if (!row || !row.animate) return false;
  const am = row.querySelector('.am'), s = $('go').getBoundingClientRect(), t = am.getBoundingClientRect();
  const x0 = s.left + s.width / 2, y0 = s.top + s.height / 2, ex = t.left + t.width / 2, ey = t.top + t.height / 2;
  const mx = (x0 + ex) / 2 + 40, my = Math.min(y0, ey) - 90;
  const el = document.createElement('span'); el.className = 'fly-coin'; document.body.appendChild(el);
  let fin = false;
  const finish = () => { if (fin) return; fin = true; el.remove(); done(); };
  const a = el.animate([
    { transform: `translate(${x0}px,${y0}px) scale(.6) rotate(0deg)`, opacity: 0 },
    { transform: `translate(${mx}px,${my}px) scale(1.25) rotate(260deg)`, opacity: 1, offset: .5 },
    { transform: `translate(${ex}px,${ey}px) scale(.55) rotate(520deg)`, opacity: .5 },
  ], { duration: 800, easing: EASE.iosine, fill: 'both' });
  a.onfinish = finish; setTimeout(finish, 1300);
  return true;
}

// ===== 取り消し（ダイナミックアイランド風トースト・約2.2秒）=====
let undoId = null, undoTimer = null, islandAnims = [];
function hideUndo() {
  clearTimeout(undoTimer); undoId = null; islandAnims.forEach(a => { try { a.cancel(); } catch (e) {} }); islandAnims = [];
  $('island').style.display = 'none';
}
function showUndo(id) {
  const ent = state.entries.find(x => x.id === id); if (!ent) return;
  hideUndo(); undoId = id;
  const isl = $('island'); isl.querySelector('.msg').innerHTML = `記録しました <b>${esc(yen(ent.amount))}</b>`;
  isl.style.display = 'flex';
  const full = Math.min(window.innerWidth - 24, 340);
  if (motionOn() && isl.animate) {   // 小さなカプセル → 広がる(420ms easeOutBack) → 保持 → 縮む(480ms easeInOutCubic)
    const kf = [
      { width: '96px', height: '30px', opacity: 1, offset: 0 },
      { width: full + 'px', height: '52px', opacity: 1, offset: .19, easing: EASE.iocubic },
      { width: full + 'px', height: '52px', opacity: 1, offset: .78 },
      { width: '96px', height: '30px', opacity: 1, offset: .97 },
      { width: '96px', height: '30px', opacity: 0, offset: 1 },
    ];
    kf[0].easing = EASE.back;
    islandAnims = [isl.animate(kf, { duration: 2200, fill: 'both' })];
    isl.querySelectorAll('.msg, button').forEach(c => islandAnims.push(c.animate(
      [{ opacity: 0, offset: 0 }, { opacity: 0, offset: .12 }, { opacity: 1, offset: .22 }, { opacity: 1, offset: .74 }, { opacity: 0, offset: .8 }, { opacity: 0, offset: 1 }], { duration: 2200, fill: 'both' })));
  } else { isl.style.width = full + 'px'; isl.style.height = '52px'; }
  undoTimer = setTimeout(hideUndo, 2200);
}
$('undo-btn').addEventListener('click', () => {
  const ent = state.entries.find(x => x.id === undoId); hideUndo(); if (!ent) return;
  addMonth(ent.iso, -ent.amount);
  state.entries = state.entries.filter(x => x.id !== ent.id);
  nameIn.value = ent.name; amtIn.value = String(ent.amount); dateIn.value = ent.iso; setPay(ent.type); showAmt();   // 消した記録をフォームに戻す
  state.lastCat = ent.catId; save(); renderAll();
});

// ===== 設定 =====
$('set-anim').checked = state.anim;
$('set-anim').addEventListener('change', e => { state.anim = e.target.checked; save(); applyMotionClass(); });
$('budget').value = state.budget ? String(state.budget) : '';
$('budget').addEventListener('change', e => {
  const v = Math.round(+e.target.value); state.budget = v > 0 && v <= 9999999 ? v : 0;
  e.target.value = state.budget ? String(state.budget) : ''; save(); renderBudget(); renderMarquee();
});
$('reset').addEventListener('click', () => {
  if (!confirm('試作データをリセットして、本体(saifu_v1)から読み取り直します。よろしいですか？')) return;
  try { localStorage.removeItem(APP_KEY); } catch (e) {}   // 消すのは試作キーだけ
  state = loadState(); pendingReveal = null; hideUndo(); catTouched = false; guessCat = null;
  $('set-anim').checked = state.anim; $('budget').value = state.budget ? String(state.budget) : '';
  applyMotionClass(); renderAll();
});

// ===== 起動演出 =====
function launch() {
  anim($('stage'), [{ clipPath: 'circle(0% at 50% 50%)' }, { clipPath: 'circle(75% at 50% 50%)' }], { duration: 760, easing: EASE.quart });   // アイリスオープン
  document.querySelectorAll('.rise').forEach((el, i) =>   // ソフトライズ（90ms 段差）
    anim(el, [{ transform: 'translateY(16px)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 900, delay: 300 + i * 90, easing: EASE.sine }));
}
state.lastCat = state.cats.some(c => c.id === state.lastCat) ? state.lastCat : state.cats[0].id;
applyMotionClass();
reduceMotion.addEventListener && reduceMotion.addEventListener('change', applyMotionClass);
renderAll(); showAmt(); renderList(true); launch();

// ===== 診断 (?diag=1) =====
if (new URLSearchParams(location.search).get('diag') === '1') {
  const d = $('diag'); d.style.display = 'block';
  let frames = 0, fps = 0, t0 = performance.now();
  const tick = now => { frames++; if (now - t0 >= 1000) { fps = Math.round(frames * 1000 / (now - t0)); frames = 0; t0 = now; } requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
  const upd = () => {
    d.textContent = `key: ${APP_KEY}\nentries: ${state.entries.length}\nsaifu_v1 existed: ${legacyExisted}\nreduced-motion: ${reduceMotion.matches}\n` +
      `anim setting: ${state.anim} (motionOn=${motionOn()})\nfps(rAF): ${fps}`;
  };
  upd(); setInterval(upd, 500);
}
</script>
</body>
</html>
